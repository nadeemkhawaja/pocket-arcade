<div id="app">
  <canvas id="screen" tabindex="0" aria-label="Iron Alley game screen. Player one: arrow keys move, Z punch, X kick, C jump, V special. Player two: W A S D move, F punch, G kick, H jump, T special. P pauses."></canvas>
  <div id="safeProbe" aria-hidden="true"></div>
  <div id="touch" aria-hidden="true">
    <div class="brand"><b>IRON</b> ALLEY<span>TIP: TURN YOUR PHONE SIDEWAYS FOR A WIDER VIEW</span></div>
    <div class="grille" aria-hidden="true"></div>
    <div id="dpad" class="tctl">
      <i class="arm h"></i><i class="arm v"></i>
      <i class="ar l"></i><i class="ar r"></i><i class="ar u"></i><i class="ar d"></i>
      <span id="dpadKnob"></span>
    </div>
    <div id="btns">
      <button class="tbtn tctl" type="button" data-k="special" id="bSpecial"><b>S</b><small>SPIN</small></button>
      <button class="tbtn tctl" type="button" data-k="jump" id="bDash"><b>J</b><small>JUMP</small></button>
      <button class="tbtn tctl" type="button" data-k="punch" id="bKnife"><b>P</b><small>PUNCH</small></button>
      <button class="tbtn tctl" type="button" data-k="kick" id="bJump"><b>K</b><small>KICK</small></button>
    </div>
    <button id="tPause" type="button" aria-label="Pause">II</button>
  </div>
  <noscript>Iron Alley needs JavaScript to run.</noscript>
</div>
