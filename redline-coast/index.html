<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Redline Coast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#06040c">
<meta name="description" content="Redline Coast: an original arcade road racer in sharp HD. Five stages from a sunset bay to an aurora ridge, drifting, nitro, near misses, rival duels and a clock that never stops.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Racing+Sans+One&display=swap">
<style>
/* One deliberate world: a dark arcade cabinet. The canvas is full-bleed; the touch pad
   sits inside safe-area gutters (portrait: handheld layout under the screen, landscape: overlay). */
:root {
  color-scheme: dark;
  --bg: #06040c;
  --body: #0d1018;
  --line: #232a3c;
  --ink: #e8edf5;
  --ink-dim: #6d7890;
  --knife: #ff3d5a;
  --knife-deep: #8f1d14;
  --jump: #e3b02a;
  --jump-deep: #8a6410;
  --spec: #2fa8c8;
  --spec-deep: #156078;
  --dash: #8a6aff;
  --dash-deep: #3e2a9a;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(10px, env(safe-area-inset-top, 0px));
  --gb: max(14px, env(safe-area-inset-bottom, 0px));
  --pix: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --game-bottom: 50vh;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--pix); font-size: 10px; line-height: 1.15;
  overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#safeProbe {
  position: absolute; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
noscript { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }

/* ---------- touch pad ---------- */
#touch {
  position: absolute; inset: 0; display: none; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: var(--gt) var(--gb);
  --dp: min(40vw, 30vh, 176px);
  --bk: min(19vw, 13.5vh, 80px);
  --bj: min(16vw, 11.5vh, 68px);
  --bs: min(14vw, 10vh, 58px);
}
body.touch-on #touch { display: block; }

.brand {
  display: none; position: absolute; left: var(--gl); right: var(--gr); top: calc(var(--game-bottom) + 18px);
  text-align: center; font-family: "Racing Sans One", "Barlow Condensed", Impact, sans-serif; font-size: 20px; letter-spacing: 4px; line-height: 1.15; color: #8a96b4;
}
body.portrait .brand { display: none; }
.brand b { color: #ff3d5a; font-weight: 400; }
.brand span { display: block; margin-top: 10px; font-family: var(--pix); font-size: 11px; font-weight: 500; letter-spacing: 1px; line-height: 1.15; color: #56607c; }
.grille {
  display: none; position: absolute; left: 50%; width: 180px; margin-left: -90px; height: 12px;
  top: calc(var(--game-bottom) + 74px);
  background: linear-gradient(90deg, transparent, rgba(232,57,42,0.6) 28%, rgba(232,57,42,0.6) 72%, transparent) center / 100% 1px no-repeat;
}
.grille::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -5px 0 0 -5px;
  transform: rotate(45deg); border: 1px solid rgba(255,120,100,0.85); background: #2a1014;
}
body.portrait .grille { display: none; }
@media (max-height: 700px) { .grille { display: none !important; } .brand span { display: none; } }

#dpad {
  position: absolute; left: var(--gl); bottom: calc(var(--gb) + 6px);
  width: var(--dp); height: var(--dp); border-radius: 50%; pointer-events: auto; touch-action: none;
  background: radial-gradient(circle at 50% 45%, rgba(40,48,70,0.55), rgba(14,17,26,0.7) 70%);
  border: 2px solid rgba(80,92,124,0.45);
}
body.portrait #dpad { bottom: calc(var(--gb) + 40px); }
#dpad .arm { position: absolute; background: #1b2030; border: 2px solid #313a52; border-radius: 6px; }
#dpad .arm.h { left: 12%; right: 12%; top: 38%; bottom: 38%; }
#dpad .arm.v { top: 12%; bottom: 12%; left: 38%; right: 38%; }
#dpad .ar { position: absolute; width: 0; height: 0; border: 7px solid transparent; opacity: 0.65; }
#dpad .ar.l { left: 16%; top: calc(50% - 7px); border-right-color: #9aa6c0; border-left-width: 0; }
#dpad .ar.r { right: 16%; top: calc(50% - 7px); border-left-color: #9aa6c0; border-right-width: 0; }
#dpad .ar.u { top: 16%; left: calc(50% - 7px); border-bottom-color: #9aa6c0; border-top-width: 0; }
#dpad .ar.d { bottom: 16%; left: calc(50% - 7px); border-top-color: #9aa6c0; border-bottom-width: 0; }
#dpad.left .ar.l, #dpad.right .ar.r, #dpad.up .ar.u, #dpad.down .ar.d { opacity: 1; filter: drop-shadow(0 0 4px #ffd27a); }
#dpadKnob {
  position: absolute; left: calc(50% - 15%); top: calc(50% - 15%); width: 30%; height: 30%; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #5a6684, #262d42); border: 2px solid #11141d; pointer-events: none;
  transition: transform 40ms linear;
}

/* arcade layout: KNIFE and JUMP on the bottom row, SPECIAL and DASH staggered above them */
#btns { position: absolute; right: var(--gr); bottom: calc(var(--gb) + 6px); width: calc(var(--bk) * 2 + 12px); height: calc(var(--bk) * 1.3 + var(--bj) + 12px); pointer-events: none; }
body.portrait #btns { bottom: calc(var(--gb) + 40px); }
.tbtn {
  position: absolute; border-radius: 50%; border: 0; padding: 0; margin: 0; pointer-events: auto; touch-action: none;
  display: grid; place-content: center; gap: 4px; text-align: center; color: #fff; font-family: var(--pix);
  box-shadow: inset 0 -5px 0 rgba(0,0,0,0.35), 0 4px 0 rgba(0,0,0,0.55);
  transition: transform 50ms linear, filter 50ms linear;
}
.tbtn b { font-size: 20px; font-weight: 700; text-shadow: 0 2px 0 rgba(0,0,0,0.45); }
.tbtn small { font-size: 10px; letter-spacing: 1px; font-weight: 600; opacity: 0.92; }
.tbtn.on { transform: translateY(3px) scale(0.96); filter: brightness(1.25); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.35), 0 1px 0 rgba(0,0,0,0.55); }
#dpad { display: none !important; }
#touch { --sk: min(20vw, 20vh, 100px); --bk: min(19vw, 18vh, 90px); }
body.portrait #tPause { top: calc(var(--gt) + 132px); }
#steer { position: absolute; left: var(--gl); bottom: calc(var(--gb) + 14px); width: calc(var(--sk) * 2 + 12px); height: var(--sk); pointer-events: none; }
.tbtn.sq { width: var(--sk); height: var(--sk); bottom: 0; border-radius: 24%; background: linear-gradient(180deg, rgba(60,70,100,0.9), rgba(20,24,38,0.9)); border: 2px solid rgba(160,176,214,0.55); }
.tbtn.sq b { font-size: calc(var(--sk) * 0.42); line-height: 1; }
#bLeft { left: 0; } #bRight { right: 0; }
#btns { height: var(--bk) !important; bottom: calc(var(--gb) + 14px) !important; }
#bBrake { width: var(--bk); height: var(--bk); left: 0; bottom: 0; background: radial-gradient(circle at 40% 32%, #ff7a8c, #ff3d5a 55%, #8f1430); }
#bNitro { width: var(--bk); height: var(--bk); right: 0; bottom: 0; background: radial-gradient(circle at 40% 32%, #a8ecff, #2fa8e8 55%, #124a8a); }
body.touch-on .tctl { opacity: 0.8; }
body.touch-on .tbtn.on { opacity: 1; }
body.touch-on:not(.driving) .tctl, body:not(.driving) #tPause { display: none; }

#tPause {
  position: absolute; pointer-events: auto; touch-action: none;
  width: 44px; height: 30px; border-radius: 15px; border: 2px solid #313a52; background: rgba(20,24,36,0.78);
  color: #c9d2e4; font-family: var(--pix); font-size: 13px; font-weight: 700; letter-spacing: 1px;
  right: var(--gr); top: var(--gt);
}


/* landscape: a handheld layout with the pad in side panels; slightly translucent in case it overlaps the screen edge */
body.touch-on:not(.portrait) #dpad, body.touch-on:not(.portrait) .tbtn { opacity: 0.82; }
body.touch-on:not(.portrait) .tbtn.on { opacity: 1; }
body.touch-on:not(.portrait) #tPause { opacity: 0.85; }
@media (max-height: 420px) {
  .tbtn small { display: none; }
}
.tbtn:focus-visible, #tPause:focus-visible { outline: 2px solid #ffd27a; outline-offset: 3px; }
#screen:focus-visible { outline: none; }
@media (prefers-reduced-motion: reduce) {
  .tbtn, #dpadKnob { transition: none; }
}
</style>

</head>
<body>
<div id="app">
  <canvas id="screen" tabindex="0" aria-label="Redline Coast game screen. Left and right arrows steer, Up or X accelerates, Down or Z brakes, Space fires nitro, P pauses."></canvas>
  <div id="safeProbe" aria-hidden="true"></div>
  <div id="touch" aria-hidden="true">
    <div id="dpad" class="tctl">
      <i class="arm h"></i><i class="arm v"></i>
      <i class="ar l"></i><i class="ar r"></i><i class="ar u"></i><i class="ar d"></i>
      <span id="dpadKnob"></span>
    </div>
    <div id="steer">
      <button class="tbtn tctl sq" type="button" data-k="left" id="bLeft" aria-label="Steer left"><b>&#9664;</b></button>
      <button class="tbtn tctl sq" type="button" data-k="right" id="bRight" aria-label="Steer right"><b>&#9654;</b></button>
    </div>
    <div id="btns">
      <button class="tbtn tctl" type="button" data-k="brake" id="bBrake"><b>B</b><small>BRAKE</small></button>
      <button class="tbtn tctl" type="button" data-k="nitro" id="bNitro"><b>N</b><small>NITRO</small></button>
    </div>
    <button id="tPause" type="button" aria-label="Pause">II</button>
  </div>
  <noscript>Redline Coast needs JavaScript to run.</noscript>
</div>

<script>
(function () {
/* ==========================================================================
   REDLINE COAST
   Core: screen constants, helpers, seeded random, settings, storage
   ========================================================================== */
'use strict';

const W = 384, H = 216;           // internal resolution (16:9); everything is drawn in these units
const STEP = 1 / 60;
const TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (p) => Math.random() < p;
const sgn = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const $ = (id) => document.getElementById(id);

function seeded(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
const coarse = window.matchMedia ? matchMedia('(pointer: coarse)').matches : isTouch;
const reducedMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)').matches : false;

const store = {
  get(k, d) {
    try { const v = localStorage.getItem('redlineCoast.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; }
  },
  set(k, v) { try { localStorage.setItem('redlineCoast.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } }
};

const settings = Object.assign(
  { music: 0.7, sfx: 0.85, fx: true, shake: !reducedMotion, level: 'sport', car: 'gt', autoGas: 'auto', touch: 'auto', muted: false },
  store.get('settings', {})
);
function saveSettings() { store.set('settings', settings); }

const DEFAULT_SCORES = [
  { n: 'RED', s: 600000, st: 5 }, { n: 'LIN', s: 450000, st: 4 }, { n: 'CST', s: 300000, st: 3 },
  { n: 'ACE', s: 180000, st: 2 }, { n: 'ZIP', s: 90000, st: 1 }
];
function loadScores() {
  const s = store.get('scores', null);
  if (!Array.isArray(s) || s.length !== 5) return DEFAULT_SCORES.map((e) => Object.assign({}, e));
  return s;
}

const DBG = {};               // profiling switches used by the tests
const QUALITY = { level: 0, res: [1, 0.8, 0.64] };

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

function hexRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixHex(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  const c = A.map((v, i) => Math.round(lerp(v, B[i], t)));
  return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
}

/* ==========================================================================
   Vector drawing helpers. Everything is drawn in world units (384 x 216);
   the screen transform scales it to the device, so shapes stay crisp at any size.
   ========================================================================== */

function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function disc(g, cx, cy, r, c) { if (r <= 0) return; g.fillStyle = c; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill(); }
function ring(g, cx, cy, r, t, c) { g.strokeStyle = c; g.lineWidth = t; g.beginPath(); g.arc(cx, cy, Math.max(0.05, r - t / 2), 0, TAU); g.stroke(); }
function tri(g, cx, top, w, h, c) { g.fillStyle = c; g.beginPath(); g.moveTo(cx, top); g.lineTo(cx + w / 2, top + h); g.lineTo(cx - w / 2, top + h); g.closePath(); g.fill(); }
function stampLine(g, x0, y0, x1, y1, w, col) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function ellipse(g, cx, cy, rx, ry, rot, c) { g.fillStyle = c; g.beginPath(); g.ellipse(cx, cy, Math.max(0.01, rx), Math.max(0.01, ry), rot || 0, 0, TAU); g.fill(); }
function polyPath(g, pts) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); }
function poly(g, pts, c) { g.fillStyle = c; polyPath(g, pts); g.fill(); }
function roundRectPath(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function rrect(g, x, y, w, h, r, c) { g.fillStyle = c; roundRectPath(g, x, y, w, h, r); g.fill(); }
function lgrad(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); for (const [t, c] of stops) gr.addColorStop(t, c); return gr; }
function rgrad(g, x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); for (const [t, c] of stops) gr.addColorStop(t, c); return gr; }
function rgba(hex, a) { const [r, gg, b] = hexRgb(hex); return 'rgba(' + r + ',' + gg + ',' + b + ',' + a + ')'; }
function shade(hex, t) { return t < 0 ? mixHex(hex, '#000000', -t) : mixHex(hex, '#ffffff', t); }

/** A tapered capsule from A to B (radii ra at A, rb at B). */
function capsulePath(g, ax, ay, bx, by, ra, rb) {
  const ang = Math.atan2(by - ay, bx - ax);
  g.beginPath();
  g.arc(ax, ay, Math.max(0.01, ra), ang + Math.PI / 2, ang + Math.PI * 1.5);
  g.arc(bx, by, Math.max(0.01, rb), ang - Math.PI / 2, ang + Math.PI / 2);
  g.closePath();
}

/** A waving, tapered ribbon (sashes, hair, plumes, banners). Returns the tip. */
function ribbonPath(g, x0, y0, ang, len, w0, w1, wave, phase, segs) {
  const n = segs || 8, L = [], R = [];
  let x = x0, y = y0, a = ang;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const w = lerp(w0, w1, t) / 2;
    const nx = -Math.sin(a), ny = Math.cos(a);
    L.push(x + nx * w, y + ny * w); R.push(x - nx * w, y - ny * w);
    a = ang + Math.sin(phase + t * 3.2) * wave * (0.25 + t);
    x += Math.cos(a) * len / n; y += Math.sin(a) * len / n;
  }
  g.beginPath();
  g.moveTo(L[0], L[1]);
  for (let i = 2; i < L.length; i += 2) g.lineTo(L[i], L[i + 1]);
  for (let i = R.length - 2; i >= 0; i -= 2) g.lineTo(R[i], R[i + 1]);
  g.closePath();
  return [x, y];
}

/* ---- cached soft sprites: glows and ground shadows ------------------------------ */
const GLOW_CACHE = {};
function glowSprite(col) {
  let c = GLOW_CACHE[col];
  if (c) return c;
  c = makeCanvas(128, 128);
  const g = c.getContext('2d');
  g.fillStyle = rgrad(g, 64, 64, 0, 64, [[0, rgba(col, 0.6)], [0.35, rgba(col, 0.22)], [0.7, rgba(col, 0.06)], [1, rgba(col, 0)]]);
  g.fillRect(0, 0, 128, 128);
  GLOW_CACHE[col] = c;
  return c;
}
/** Additive soft light centred on x, y with radius r. */
function drawGlow(g, x, y, r, col, a) {
  if (!settings.fx && r > 12) a = (a === undefined ? 1 : a) * 0.6;
  const op = g.globalCompositeOperation, ga = g.globalAlpha;
  g.globalCompositeOperation = 'lighter';
  if (a !== undefined) g.globalAlpha = ga * a;
  g.drawImage(glowSprite(col), x - r, y - r, r * 2, r * 2);
  g.globalCompositeOperation = op; g.globalAlpha = ga;
}
let SOFT_DOT = null;
function softDot() {
  if (SOFT_DOT) return SOFT_DOT;
  const c = makeCanvas(64, 64), g = c.getContext('2d');
  g.fillStyle = rgrad(g, 32, 32, 0, 32, [[0, 'rgba(255,255,255,1)'], [0.5, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
  g.fillRect(0, 0, 64, 64);
  SOFT_DOT = c;
  return c;
}
let SHADOW_SPR = null;
function shadowSprite() {
  if (SHADOW_SPR) return SHADOW_SPR;
  const c = makeCanvas(96, 32), g = c.getContext('2d');
  g.save(); g.scale(1, 1 / 3);
  g.fillStyle = rgrad(g, 48, 48, 0, 48, [[0, 'rgba(0,0,0,0.55)'], [0.55, 'rgba(0,0,0,0.3)'], [1, 'rgba(0,0,0,0)']]);
  g.fillRect(0, 0, 96, 96);
  g.restore();
  SHADOW_SPR = c;
  return c;
}

/** Offscreen canvas for pre-rendered art at the current render scale (world units in, crisp pixels out). */
let RS = 2;
function artCanvas(w, h) {
  const c = makeCanvas(Math.ceil(w * RS), Math.ceil(h * RS));
  const g = c.getContext('2d');
  g.scale(RS, RS);
  c.rs = RS; c.uw = w; c.uh = h;
  return [c, g];
}
/** Draw part of a pre-rendered art canvas; source and destination in world units. */
function blitArt(g, c, sx, sy, sw, sh, dx, dy, dw, dh) {
  const r = c.rs;
  g.drawImage(c, sx * r, sy * r, sw * r, sh * r, dx, dy, dw === undefined ? sw : dw, dh === undefined ? sh : dh);
}

/* ==========================================================================
   Type: Barlow Condensed for the interface and Racing Sans One, a slanted racing face,
   for titles. Sizes are in world units, so text stays sharp at any resolution.
   ========================================================================== */

const FONT_UI = '"Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif';
const FONT_DISPLAY = '"Racing Sans One", "Barlow Condensed", Impact, "Arial Narrow", sans-serif';
const MEASURE = makeCanvas(4, 4).getContext('2d');

function fontSpec(scale, opts) {
  const s = 8.4 * (scale || 1);
  if (opts && opts.display) return '400 ' + s + 'px ' + FONT_DISPLAY;
  return (opts && opts.weight || 600) + ' ' + s + 'px ' + FONT_UI;
}

function textWidth(str, scale, opts) {
  MEASURE.font = fontSpec(scale, opts);
  return MEASURE.measureText(opts && opts.raw ? String(str) : String(str).toUpperCase()).width;
}

/** Draw text with its top at y. opts: { scale, align, shadow, display, weight, raw, stroke, strokeW } */
function drawText(g, str, x, y, color, opts) {
  str = String(str);
  if (!(opts && opts.raw)) str = str.toUpperCase();
  const s = (opts && opts.scale) || 1;
  g.font = fontSpec(s, opts);
  g.textBaseline = 'top';
  g.textAlign = (opts && opts.align) || 'left';
  if (opts && opts.stroke) { g.lineJoin = 'round'; g.lineWidth = opts.strokeW || 1.6 * s; g.strokeStyle = opts.stroke; g.strokeText(str, x, y); }
  const shadow = opts && opts.shadow;
  if (shadow) { g.fillStyle = shadow; g.fillText(str, x + 0.5 * s, y + 0.6 * s); }
  g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;

/** Ask the browser for the web fonts early; text uses fallbacks until they arrive. */

/* ==========================================================================

  coast: { bpm: 118, root: 41, mode: 'maj', prog: [0, 4, 5, 3, 0, 4, 1, 4], drums: 'four', bass: 'octave', arp: 'updown', lead: 23, cut: 2100, loop: true },
  mesa: { bpm: 124, root: 38, mode: 'dor', prog: [0, 6, 3, 4, 0, 6, 2, 4], drums: 'break', bass: 'gallop', arp: 'up', lead: 37, cut: 1900, loop: true },
  pine: { bpm: 112, root: 43, mode: 'maj', prog: [0, 5, 3, 4, 2, 5, 3, 4], drums: 'four', bass: 'pulse', arp: 'wide', lead: 51, cut: 2300, loop: true },
  neon: { bpm: 128, root: 40, mode: 'min', prog: [0, 0, 5, 6, 0, 3, 5, 4], drums: 'four', bass: 'octave', arp: 'updown', lead: 67, cut: 1700, loop: true },
  aurora: { bpm: 134, root: 42, mode: 'min', prog: [0, 5, 2, 6, 3, 5, 6, 4], drums: 'break', bass: 'gallop', arp: 'wide', lead: 83, cut: 2400, loop: true },

  over: { bpm: 84, root: 45, mode: 'min', prog: [0, 5, 3, 0], drums: 'none', bass: 'pulse', arp: 'none', lead: 9, cut: 1200, loop: false, bars: 4 },
  ending: { bpm: 104, root: 48, mode: 'maj', prog: [0, 4, 5, 3, 0, 4, 3, 4], drums: 'half', bass: 'octave', arp: 'updown', lead: 97, cut: 2400, loop: true }

const DRUMS = {
  four: { k: 'x...x...x...x...', s: '....x.......x...', h: '..x...x...x...x.', o: '..............x.' },
  half: { k: 'x.........x.....', s: '........x.......', h: 'x.x.x.x.x.x.x.x.', o: '................' },
  break: { k: 'x.....x...x.....', s: '....x.......x..x', h: 'x.xxx.xxx.xxx.xx', o: '................' },

      case 'splash': N(t, 0.4, 0.3, 'bandpass', 2600, 0.6, null, { sweep: 700, a: 0.02 }); break;

      case 'warn': T(t, 740, 0.09, 'square', 0.12, null, { cut: 2000 }); break;

/* ---- far scenery: wide strips that slide sideways as the road turns ----------------- */
function horizonArt(theme, layer) {
  const key = 'hz|' + theme.id + layer;
  let c = ART_CACHE[key];
  if (c) return c;
  const w = 512, h = 96, px = 2;
  c = makeCanvas(w * px, h * px);
  const g = c.getContext('2d'); g.scale(px, px);
  const rnd = seeded(theme.seed + layer * 97), col = theme.far[layer];
  const ridge = (base, amp, n, jag) => {
    g.beginPath(); g.moveTo(0, h);
    const pts = []; for (let i = 0; i <= n; i++) pts.push(base - amp * (0.3 + 0.7 * rnd()) * (jag ? 1 : 0.8));
    pts[n] = pts[0];
    for (let i = 0; i <= n; i++) { const x = (i / n) * w; if (jag) g.lineTo(x, pts[i]); else { const px0 = ((i - 0.5) / n) * w; g.quadraticCurveTo(px0, pts[i] - amp * 0.2, x, pts[i]); } }
    g.lineTo(w, h); g.closePath();
  };
  if (theme.id === 'neon' || (theme.id === 'coast' && layer === 0 && false)) {
    // skyline
    g.fillStyle = col; let x = 0;
    const lit = [];
    while (x < w) { const bw = 8 + Math.floor(rnd() * 16), bh = (layer ? 16 : 28) + rnd() * (layer ? 30 : 56); g.fillRect(x, h - bh, bw - 1, bh); if (rnd() < 0.3) g.fillRect(x + bw / 2 - 0.5, h - bh - 8, 1, 8); lit.push([x, bw, bh]); x += bw; }
    for (const [bx, bw, bh] of lit) for (let yy = h - bh + 3; yy < h - 3; yy += 4) for (let xx = bx + 1.5; xx < bx + bw - 2.5; xx += 3) if (rnd() < (layer ? 0.3 : 0.42)) rect(g, xx, yy, 1.4, 1.8, rnd() < 0.5 ? theme.lit[0] : theme.lit[1]);
  } else {
    g.fillStyle = lgrad(g, 0, h - 70, 0, h, [[0, col], [1, theme.far[layer + 2] || col]]);
    ridge(h - (layer ? 14 : 30), layer ? 26 : 44, layer ? 18 : 11, theme.jag); g.fill();
    if (theme.snow && !layer) { g.save(); g.clip(); g.fillStyle = rgba('#ffffff', 0.75); for (let i = 0; i < 40; i++) { const x0 = rnd() * w, y0 = h - 78 + rnd() * 26; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + 8, y0 + 9); g.lineTo(x0 - 3, y0 + 14); g.fill(); } g.fillRect(0, 0, w, h - 62); g.restore(); }
    if (theme.id === 'mesa' && !layer) { g.fillStyle = col; for (let i = 0; i < 5; i++) { const x0 = rnd() * (w - 60) + 10, bw = 26 + rnd() * 30, bh = 30 + rnd() * 26; g.fillRect(x0, h - 26 - bh, bw, bh + 26); g.fillRect(x0 - 5, h - 30, bw + 10, 30); } }
  }
  ART_CACHE[key] = c; c.uw = w; c.uh = h;
  return c;
}

function cloudArt(theme) {
  return art('cloud|' + theme.id, 512, 70, 2, (g) => {
    g.translate(-256, -70);
    const rnd = seeded(theme.seed + 5);
    for (let i = 0; i < 9; i++) {
      const x = rnd() * 512, y = 8 + rnd() * 44, s = 0.6 + rnd() * 1.1;
      for (const dx of [-512, 0, 512]) for (let k = 0; k < 6; k++) {

      }
    }
  });
}

const ease = (a, b, t) => a + (b - a) * (-Math.cos(t * Math.PI) / 2 + 0.5);

/** Build the segment list for one stage. */
function buildTrack(si, diff) {
  const st = STAGES[si], th = THEMES[st.theme], segs = [], rnd = seeded(1000 + si * 77);
  let y = 0, check = 0, tunLeft = 0;
  const push = (curve, yy) => {
    const n = segs.length;
    segs.push({ i: n, curve, y1: y, y2: yy, sprites: [], cars: [], c: Math.floor(n / 3) % 2, clip: 0, tun: tunLeft-- > 0 });
    y = yy;
  };
  const piece = (n, curve, hill) => {
    const a = Math.round(n * 0.3), h = n - a * 2, y0 = y, dy = hill * SEG, tot = n;
    for (let i = 0; i < a; i++) push(ease(0, curve, i / a), ease(y0, y0 + dy, (segs.length - startN + 1) / tot));
    for (let i = 0; i < h; i++) push(curve, ease(y0, y0 + dy, (segs.length - startN + 1) / tot));
    for (let i = 0; i < a; i++) push(ease(curve, 0, i / a), ease(y0, y0 + dy, (segs.length - startN + 1) / tot));
  };
  let startN = 0;
  for (const row of st.road) {
    if (row === 'check') { check = segs.length; continue; }
    if (row[0] === 'tunnel') { tunLeft = row[1]; continue; }
    startN = segs.length; piece(row[0], row[1], row[2]);
  }
  const goal = segs.length - 70;
  startN = segs.length; piece(260, 0, 0);            // run-out after the line
  const T = { si, st, th, segs, n: segs.length, len: segs.length * SEG, check, goal, start: 14, cars: [], snowFrom: st.id === 'pine' ? check - 200 : 1e9 };
  decorate(T, rnd);
  layHazards(T, rnd, diff);
  layTraffic(T, rnd, diff);
  return T;
}

function addSprite(T, i, name, off, ww, extra) {
  if (i < 0 || i >= T.n) return null;
  const s = Object.assign({ name, off, ww }, extra || {});
  T.segs[i].sprites.push(s);
  return s;
}

/** Scenery along the verges. Anything close to the road is solid if you leave the tarmac. */
function decorate(T, rnd) {
  const id = T.st.id, n = T.n;

  // warning chevrons on the outside of every hard bend, starting just before it tightens

/** Hazards and pickups in the lanes. Never two solid things side by side, so there is always a way through. */
function layHazards(T, rnd, diff) {
  const id = T.st.id, n = T.goal - 40;
  const lane = () => Math.floor(rnd() * 3);
  let i = 110;
  while (i < n) {
    const r = rnd(), l = lane();
    if (Math.abs(i - T.check) < 30) { i += 30; continue; }
    if (r < 0.2) { for (let k = 0; k < 5; k++) addSprite(T, i + k * 5, 'coin', LANE_X[l], 300, { pick: 'coin' }); }
    else if (r < 0.3) addSprite(T, i, 'nitro', LANE_X[l], 420, { pick: 'nitro' });
    else if (r < 0.37) addSprite(T, i, 'clock', LANE_X[l], 420, { pick: 'clock' });
    else if (r < 0.45) addSprite(T, i, 'boost', LANE_X[l], 1300, { hit: 'boost', hw: 0.2, flat: true });
    else if (r < 0.51 && !T.segs[i].tun) { addSprite(T, i, 'ramp', LANE_X[l], 1150, { hit: 'ramp', hw: 0.2 }); for (let k = 1; k < 5; k++) addSprite(T, i + 6 + k * 5, 'coin', LANE_X[l], 300, { pick: 'coin', high: true }); }
    else if (r < 0.68) {
      if (id === 'coast') { const l2 = l === 1 ? 0 : l; for (let k = 0; k < 6; k++) addSprite(T, i + k * 4, 'cone', LANE_X[l2] + (l2 === 0 ? 0.3 : -0.3) * (k / 5), 330, { hit: 'cone' }); }
      else if (id === 'mesa') addSprite(T, i, 'boulder', LANE_X[l] * 1.1, 900, { hit: 'solid', hw: 0.15 });
      else if (id === 'pine') addSprite(T, i, 'ice', LANE_X[l], 1700, { hit: 'ice', hw: 0.36, flat: true });
      else if (id === 'neon') addSprite(T, i, rnd() < 0.5 ? 'puddle' : 'oil', LANE_X[l], 1500, { hit: rnd() < 0.5 ? 'puddle' : 'oil', hw: 0.3, flat: true });
      else addSprite(T, i, rnd() < 0.5 ? 'ice' : 'oil', LANE_X[l], 1600, { hit: rnd() < 0.5 ? 'ice' : 'oil', hw: 0.32, flat: true });
    } else if (r < 0.76 && id !== 'coast') {
      // roadworks: one lane closed by a barrier with cones leading in
      const l2 = l === 1 ? 2 : l;
      for (let k = 0; k < 4; k++) addSprite(T, i + k * 5, 'cone', LANE_X[l2], 300, { hit: 'cone' });
      addSprite(T, i + 22, 'barrier', LANE_X[l2], 1250, { hit: 'solid', hw: 0.27 });
    }
    i += Math.round((46 + rnd() * 50) / (0.8 + 0.2 * diff.traffic));
  }
  // fix up hazard kinds that were picked with a second roll
  for (const s of T.segs) for (const sp of s.sprites) if (sp.hit && sp.flat) sp.hit = sp.name;
  // where the police join in
  T.cops = { mesa: [0.3], neon: [0.22, 0.66], aurora: [0.45] }[id] || [];
  T.cops = T.cops.map((f) => Math.round(T.start + (T.goal - T.start) * f));
}

const TRAFFIC_COLS = ['#e8e4d8', '#3a8ad8', '#d8a020', '#3aa860', '#c84a4a', '#8a8e9a', '#e87a2a', '#6a4ac8'];
function layTraffic(T, rnd, diff) {
  const count = Math.round(T.st.traffic * diff.traffic), span = T.goal - 160;
  for (let k = 0; k < count; k++) {
    const r = rnd(), style = r < 0.4 ? 'sedan' : r < 0.62 ? 'coupe' : r < 0.86 ? 'van' : 'truck';
    const lane = Math.floor(rnd() * 3);
    T.cars.push({
      z: (130 + (k + rnd() * 0.8) * (span / count)) * SEG, off: LANE_X[lane], lane, style, col: TRAFFIC_COLS[Math.floor(rnd() * TRAFFIC_COLS.length)],
      speed: MAX_SPEED * (style === 'truck' ? 0.34 + rnd() * 0.08 : 0.4 + rnd() * 0.2), hw: style === 'truck' ? 0.155 : style === 'van' ? 0.135 : 0.13,
      passed: false, bump: 0, wob: rnd() * TAU
    });
  }
  T.cars.sort((a, b) => a.z - b.z);
}

function segAt(T, z) { return T.segs[clamp(Math.floor(z / SEG), 0, T.n - 1)]; }
function roadY(T, z) { const s = segAt(T, z), t = (z % SEG) / SEG; return s.y1 + (s.y2 - s.y1) * clamp(t, 0, 1); }

/* ==========================================================================
   Driving: the car, drifting, nitro, traffic, the rival, hazards and pickups.
   ========================================================================== */

const CAR_HW = 0.13;              // half the car's width, in road half-widths

function newPlayer(carId) {
  const c = CARS[carId] || CARS.gt;
  return {
    car: c, x: 0, speed: 0, steer: 0, lean: 0, nitro: 0.34, nitroOn: false, nitroT: 0,
    drift: 0, driftDir: 0, driftT: 0, boostT: 0, spin: 0, spinDir: 0, slick: 0, safe: 0, bumpT: 0,
    slip: 0, slipOn: false, brake: false, gas: false, off: false, skid: 0, crashT: 0, air: 0, airT: 1
  };
}

function topSpeed(p) { return MAX_SPEED * p.car.top * (p.nitroOn ? 1.27 : p.boostT > 0 ? 1.12 : p.slipOn ? 1.08 : 1); }

/** One step of the player's car. I: held buttons. */
function updatePlayer(dt, I) {
  const g = game, p = g.p, T = g.T, car = p.car;
  const pz = g.pos + PLAYER_Z, seg = segAt(T, pz), sp = p.speed / MAX_SPEED;
  const locked = g.count > 0 || g.finished || g.timeUp;
  const auto = autoGasOn();
  let steerIn = 0;
  if (!locked || g.finished) steerIn = input.axis && !g.auto ? input.axis : (I.left ? -1 : 0) + (I.right ? 1 : 0);
  if (g.finished) steerIn = clamp(-p.x * 2 - seg.curve * 0.1, -1, 1);
  let gas = !locked && (I.gas || I.up || (auto && !I.brake && !I.down));
  let brake = !locked && (I.brake || I.down);
  if (g.finished) { gas = false; brake = p.speed > MAX_SPEED * 0.25; }
  p.gas = gas; p.brake = brake || g.finished;

  // spin-out on oil: no steering until it ends
  if (p.spin > 0) { p.spin -= dt; steerIn = 0; p.x += p.spinDir * dt * 0.55 * sp; gas = false; }
  if (p.air > 0) { p.air -= dt; steerIn *= 0.35; if (p.air <= 0) { g.shake = Math.max(g.shake, 4); chip.sfx('bump'); spawnDust(0, T.th); spawnSmoke(); } }
  p.steer = approach(p.steer, steerIn, dt * (steerIn ? 5.5 : 8));
  p.lean = approach(p.lean, p.steer * (p.drift ? 2 : 1.25), dt * 9);

  // nitro
  const wantN = !locked && I.nitro && p.nitro > 0.02 && p.spin <= 0;
  if (wantN && !p.nitroOn && p.nitro > 0.1) { p.nitroOn = true; chip.sfx('nitro'); g.punch = 0.05; }
  if (p.nitroOn) {
    p.nitro -= dt / 3.4; p.nitroT += dt; g.stats.nitroT += dt;
    if (!wantN || p.nitro <= 0) { p.nitroOn = false; p.nitro = Math.max(0, p.nitro); chip.sfx('blow'); }
  }

  // drift: tap the brake while turning at speed, then hold the turn
  if (!p.drift && brake && Math.abs(p.steer) > 0.5 && sp > 0.55 && p.spin <= 0 && !p.off) { p.drift = 1; p.driftDir = sgn(p.steer); p.driftT = 0; p.driftEase = 0; chip.sfx('pass'); }
  if (p.drift) {
    p.driftT += dt;
    // easing the wheel for a moment keeps the slide alive; turning the other way ends it
    p.driftEase = sgn(steerIn) === p.driftDir ? 0 : (p.driftEase || 0) + dt;
    const holding = sgn(steerIn) !== -p.driftDir && p.driftEase < 0.35 && sp > 0.4 && !p.off && p.spin <= 0;
    if (!holding) {
      if (p.driftT > 0.7) { p.boostT = Math.min(1.6, 0.5 + p.driftT * 0.45); chip.sfx('drift'); popText('DRIFT BOOST', '#7fe9ff'); addScore(Math.round(p.driftT * 400) * mult()); g.stats.drifts++; if (p.driftT >= 3) award('sideways'); }
      p.drift = 0;
    } else { p.nitro = Math.min(1, p.nitro + dt * 0.11); g.stats.driftT += dt; if (g.t % 0.2 < dt) addScore(20 * mult()); }
  }
  if (p.boostT > 0) p.boostT -= dt;

  // speed
  const top = topSpeed(p);
  const grip = car.grip * (p.slick > 0 ? 0.4 : 1);
  if (p.slick > 0) p.slick -= dt;
  let acc = 0;
  if (gas) acc = (MAX_SPEED / 4.4) * car.acc * (p.nitroOn ? 2.4 : p.boostT > 0 ? 1.8 : 1) * (1 - 0.55 * Math.min(1, p.speed / top) ** 2);
  if (brake && !p.drift) acc = -MAX_SPEED / 1.5;
  else if (brake) acc = -MAX_SPEED / 14;
  else if (!gas) acc = -MAX_SPEED / 6.5;
  if (p.drift) acc -= MAX_SPEED / 30;
  p.speed += acc * dt;
  if (p.speed > top) p.speed = approach(p.speed, top, (MAX_SPEED / 2.2) * dt);
  // off the road: sand, grass and snow drag the car down
  p.off = Math.abs(p.x) > 1.02 && p.air <= 0;
  if (p.off) { const lim = MAX_SPEED * 0.38; if (p.speed > lim) p.speed = approach(p.speed, lim, (MAX_SPEED / 0.9) * dt); if (g.chain) breakChain(); }
  p.speed = clamp(p.speed, 0, MAX_SPEED * 1.4);

  // steering and the pull of the corner
  const k = Math.min(1, sp * 1.6);
  const turn = 2.35 * grip * (p.drift ? 1.35 : 1) * (0.4 + 0.6 * k);
  p.x += p.steer * turn * dt * (sp > 0.02 ? 1 : 0);
  const pull = seg.curve * sp * sp * 0.6 * (p.drift ? 0.8 : 1) * (p.slick > 0 ? 1.35 : 1) / Math.sqrt(car.grip);
  p.x -= pull * dt;
  p.x = clamp(p.x, -2.6, 2.6);
  // tyres complain when the corner asks for more than the steering gives
  const load = Math.abs(seg.curve) * sp * sp * 0.6 / (2.35 * grip);
  p.skid = approach(p.skid, p.drift ? 1 : p.spin > 0 ? 1 : clamp((load - 0.72) * 3, 0, 1) * (Math.abs(p.steer) > 0.3 ? 1 : 0.3), dt * 6);

  if (p.safe > 0) p.safe -= dt;
  if (p.bumpT > 0) p.bumpT -= dt;
  if (p.crashT > 0) p.crashT -= dt;

  // move along the road, testing everything we pass
  const z0 = pz, z1 = pz + p.speed * dt;
  g.pos += p.speed * dt;
  g.dist += p.speed * dt;
  if (!locked) addScore((p.speed * dt) / 240 * (p.nitroOn ? 2 : 1));
  roadsideHits(z0, z1);
  if (p.speed / MAX_SPEED >= 1.25 && p.nitroOn) award('redline');
  g.stats.top = Math.max(g.stats.top, p.speed);
  // dust, smoke and sparks
  if (p.off && sp > 0.15 && g.fxT <= 0) { spawnDust(p.x, T.th); g.fxT = 0.03; }
  if ((p.drift || p.skid > 0.6) && g.fxT <= 0) { spawnSmoke(); g.fxT = 0.03; }
  g.fxT -= dt;
}

function autoGasOn() {
  const m = settings.autoGas || 'auto';
  if (input.usingTouch) return true;          // touch screens have no gas pedal: the car always pulls
  if (m === 'on') return true;
  if (m === 'off') return false;
  return input.usingTouch || (isTouch && coarse && !input.usingPad);
}

/** Things on and beside the road between z0 and z1. */
function roadsideHits(z0, z1) {
  const g = game, p = g.p, T = g.T;
  const a = Math.floor(z0 / SEG), b = Math.floor(z1 / SEG);
  for (let i = a + 1; i <= b && i < T.n; i++) {
    const seg = T.segs[i];
    if (i === T.check && !g.checked) passCheckpoint();
    if (i === T.goal && !g.finished) finishStage();
    for (const s of seg.sprites) {
      if (s.gone || s.over) continue;
      const dx = Math.abs(p.x - s.off);
      if (s.pick) { if (dx < CAR_HW + 0.14 && (!!s.high === p.air > 0 || s.pick !== 'coin')) { s.gone = true; collect(s.pick); } continue; }
      if (p.air > 0) continue;
      if (s.hit) {
        if (dx > CAR_HW + (s.hw || 0.07)) continue;
        if (s.hit === 'ramp') { p.air = p.airT = 0.5 + 0.5 * Math.min(1.2, p.speed / MAX_SPEED); p.drift = 0; g.stats.jumps = (g.stats.jumps || 0) + 1; chip.sfx('nitro'); popText('BIG AIR!', '#ffd27a'); addScore(2000 * mult()); g.punch = 0.04; }
        else if (s.hit === 'boost') { if (p.boostT < 1) { p.boostT = 1.3; p.speed = Math.max(p.speed, MAX_SPEED * 0.9); chip.sfx('drift'); popText('BOOST', '#7fe9ff'); g.punch = 0.03; } }
        else if (s.hit === 'cone') { s.gone = true; p.speed *= 0.9; chip.sfx('cone'); spawnDebris(s.off, '#ff6a2a', 5); breakChain(); g.shake = Math.max(g.shake, 2); g.stats.hits++; }
        else if (s.hit === 'oil') { if (p.spin <= 0 && p.safe <= 0) { p.spin = 0.9; p.spinDir = p.steer ? sgn(p.steer) : (Math.random() < 0.5 ? -1 : 1); p.drift = 0; chip.sfx('oil'); popText('OIL!', '#c08aff'); breakChain(); g.stats.hits++; } }
        else if (s.hit === 'ice') { p.slick = 1.3; if (!s.said) { s.said = true; chip.sfx('slip'); popText('ICE!', '#bfeaff'); } }
        else if (s.hit === 'puddle') { p.slick = 0.6; p.speed *= 0.93; if (!s.said) { s.said = true; chip.sfx('splash'); spawnSplash(); } }
        else if (s.hit === 'solid') { if (p.safe <= 0) { s.gone = s.name === 'barrier'; if (s.gone) spawnDebris(s.off, '#f2f0e6', 8); crash(0.3, p.x < s.off ? -1 : 1); } }
        continue;
      }
      if (s.solid && p.off && p.air <= 0 && dx < s.solid + CAR_HW * 0.8 && p.safe <= 0) crash(0.12, s.off > 0 ? -1 : 1);
    }
  }
}

/** A hard hit: lose most of the speed and get shoved aside. keep is the share of speed kept. */
function crash(keep, dir) {
  const g = game, p = g.p;
  p.speed = Math.min(p.speed, MAX_SPEED * keep + p.speed * 0.1);
  p.x += dir * 0.12; p.safe = 1; p.crashT = 0.5; p.drift = 0; p.nitroOn = false;
  g.shake = 9; g.flash = 0.25; chip.sfx('crash'); spawnSparks(12); breakChain(); g.stats.crashes++; g.stageCrash++;
  popText('CRASH', '#ff5a5a');
  if (navigator.vibrate && settings.shake) { try { navigator.vibrate(60); } catch (e) { /* ignore */ } }
}

function collect(kind) {
  const g = game, p = g.p;
  if (kind === 'coin') { g.coins++; g.stats.coins++; addScore(300 * mult()); chip.sfx('coin'); }
  else if (kind === 'nitro') { p.nitro = Math.min(1, p.nitro + 0.5); chip.sfx('pickup'); popText('NITRO', '#7fe9ff'); addScore(500); }
  else if (kind === 'clock') { g.time += 3; g.timeFlash = 1; chip.sfx('time'); popText('+3 SECONDS', '#ffd27a'); addScore(500); }
  spawnSparkle();
}

/* ---- traffic --------------------------------------------------------------------- */
function updateTraffic(dt) {
  const g = game, p = g.p, T = g.T, pz = g.pos + PLAYER_Z;
  let slip = false;
  for (const seg of g.carSegs) seg.cars.length = 0;
  g.carSegs.length = 0;
  for (const c of T.cars) {
    const dz = c.z - pz;
    c.z += c.speed * dt;
    if (dz < -3000 || dz > DRAW_N * SEG + 2000) continue;
    c.wob += dt;
    if (c.bump > 0) { c.bump -= dt; c.off += c.bumpDir * dt * 0.6; c.off = clamp(c.off, -0.85, 0.85); }
    const seg = segAt(T, c.z);
    seg.cars.push(c); g.carSegs.push(seg);
    if (g.finished) continue;
    const dx = p.x - c.off, adx = Math.abs(dx), w = CAR_HW + c.hw;
    // contact
    if (dz > -260 && dz < 300 && adx < w && p.safe <= 0 && p.air <= 0) {
      if (p.speed > c.speed) {
        const hard = p.speed - c.speed > MAX_SPEED * 0.3;
        p.speed = c.speed * (hard ? 0.72 : 0.92); c.speed *= 1.06; c.bump = 0.4; c.bumpDir = -sgn(dx) || 1;
        p.x += sgn(dx || 1) * 0.07; p.safe = 0.55; p.bumpT = 0.3; p.drift = 0; p.nitroOn = false;
        g.shake = hard ? 7 : 4; if (hard) g.flash = 0.18;
        chip.sfx(hard ? 'crash' : 'bump'); spawnSparks(hard ? 10 : 5); breakChain(); g.stats.hits++; g.stageCrash++;
        if (hard) popText('CRASH', '#ff5a5a');
        if (navigator.vibrate && settings.shake) { try { navigator.vibrate(30); } catch (e) { /* ignore */ } }
      } else { p.x += sgn(dx || 1) * 0.05; }
    }
    // overtakes and near misses
    if (!c.passed && dz < -120) {
      c.passed = true;
      if (p.speed > c.speed) {
        g.stats.passes++; g.passes++; if (g.stats.passes >= 120) award('shark');
        if (adx < w + 0.13 && p.bumpT <= 0) { nearMiss(); }
        else { addScore(150 * mult()); chip.sfx('pass'); }
      }
    } else if (c.passed && dz > 200) c.passed = false;
    // slipstream: tucked in close behind
    if (dz > 300 && dz < 1900 && adx < 0.15 && p.speed > MAX_SPEED * 0.5) slip = true;
  }
  p.slip = approach(p.slip, slip ? 1 : 0, dt * (slip ? 1.4 : 3));
  const was = p.slipOn;
  p.slipOn = p.slip > 0.6;
  if (p.slipOn) { p.nitro = Math.min(1, p.nitro + dt * 0.1); if (!was) { chip.sfx('slip'); popText('SLIPSTREAM', '#bfeaff'); } }
}

function nearMiss() {
  const g = game, p = g.p;
  g.chain = Math.min(99, g.chain + 1); g.chainT = 5; g.stats.near++; g.stats.bestChain = Math.max(g.stats.bestChain, g.chain);
  p.nitro = Math.min(1, p.nitro + 0.1);
  addScore(500 * mult());
  chip.sfx('near'); popText(g.chain > 1 ? 'NEAR MISS  X' + g.chain : 'NEAR MISS', '#ffd27a');
  g.punch = Math.max(g.punch, 0.025);
  if (g.chain >= 10) award('needle');
}
function mult() { return 1 + Math.min(8, game.chain); }
function breakChain() { if (game.chain > 2) popText('CHAIN LOST', '#9aa6b8'); game.chain = 0; game.chainT = 0; }

/* ---- the race: a named rival leading a pack of six ---------------------------------------- */
const PACK_COLS = ['#f2a020', '#2fb86a', '#e8e4d8', '#c83ad0', '#3ac8d8', '#d84a2a'];
const PLACE = ['1ST', '2ND', '3RD', '4TH', '5TH', '6TH', '7TH', '8TH'];
const PLACE_BONUS = [30000, 18000, 12000, 8000, 5000, 3000, 1500, 0];
function newRacers(T, diff) {
  const r = T.st.rival, lead = r.pace * diff.rival, out = [];
  // the grid: you start last, the rival starts on pole
  for (let k = 0; k < 7; k++) {
    const isLead = k === 0, row = 6 - k;
    out.push({
      racer: true, lead: isLead, name: isLead ? r.name : '', style: isLead ? r.car : ['coupe', 'sedan', 'gt'][k % 3], col: isLead ? r.col : PACK_COLS[k - 1],
      z: (T.start - 5 + row * 4) * SEG, off: row % 2 ? -0.45 : 0.45, speed: 0, pace: lead - k * 0.024 - (isLead ? 0 : 0.01), hw: 0.13, lean: 0,
      ahead: true, done: false, tgt: row % 2 ? -0.45 : 0.45, think: k * 0.04
    });
  }
  return out;
}
function racePlace() {
  const g = game, pz = g.pos + PLAYER_Z;
  let n = 1;
  for (const r of g.racers) if (r.done || r.z > pz) n++;
  return n;
}
function updateRacers(dt) {
  const g = game;
  for (const r of g.racers) updateRacer(r, dt);
  if (g.finished || g.count > 0 || g.demo) return;
  const pl = racePlace();
  if (pl !== g.place) {
    if (g.playT > 1.5) {
      if (pl < g.place) { popText(pl === 1 ? 'YOU LEAD THE RACE!' : PLACE[pl - 1] + ' PLACE', '#7dffa0'); chip.sfx(pl === 1 ? 'win' : 'pass'); addScore(1500); }
      else { popText('DOWN TO ' + PLACE[pl - 1], '#ff8a8a'); chip.sfx('rival'); }
      g.placeFlash = 1;
    }
    g.place = pl;
  }
}
function updateRacer(r, dt) {
  const g = game, T = g.T, p = g.p;
  const pz = g.pos + PLAYER_Z, seg = segAt(T, r.z), gap = (r.z - pz) / SEG;
  if (g.count > 0 || dt === 0) { seg.cars.push(r); g.carSegs.push(seg); return; }
  // pace: a touch slower through hard corners; the rival also stretches or eases so the duel stays close
  let want = MAX_SPEED * r.pace * (1 - Math.min(0.14, Math.abs(seg.curve) * 0.02));
  if (r.lead) { if (gap > 110) want *= 0.9; else if (gap > 50) want *= 0.96; else if (gap < -160) want *= 1.07; else if (gap < -50) want *= 1.035; }
  else if (gap < -120) want *= 1.03;
  if (r.done) want = MAX_SPEED * 0.3;
  r.speed = approach(r.speed, want, (MAX_SPEED / 4) * dt);
  r.z += r.speed * dt;
  // pick a clear lane
  r.think -= dt;
  if (r.think <= 0) {
    r.think = 0.25;
    let best = r.tgt, bestScore = -1e9;
    for (const lx of LANE_X) {
      let sc = -Math.abs(lx - r.off) * 0.6 - Math.abs(lx + seg.curve * 0.08) * 0.3;
      for (const c of T.cars) { const dz = c.z - r.z; if (dz > -200 && dz < 2600 && Math.abs(c.off - lx) < 0.4) sc -= 3 - dz / 1300; }
      for (const o of g.racers) { if (o === r) continue; const dz = o.z - r.z; if (dz > -200 && dz < 1500 && Math.abs(o.off - lx) < 0.35) sc -= 2; }
      for (let i = 1; i < 12; i++) { const s2 = T.segs[Math.min(T.n - 1, seg.i + i)]; for (const sp of s2.sprites) if (sp.hit && sp.hit !== 'cone' && Math.abs(sp.off - lx) < 0.4) sc -= 2; }
      if (sc > bestScore) { bestScore = sc; best = lx; }
    }
    r.tgt = best;
  }
  const d = clamp(r.tgt - r.off, -1, 1);
  r.off += d * dt * 1.4; r.lean = approach(r.lean, clamp(d * 3 + seg.curve * 0.25, -2, 2), dt * 6);
  if (!r.done && r.z >= T.goal * SEG) { r.done = true; if (r.lead && !g.finished) { g.rivalWon = true; if (!g.demo) popText(r.name + ' TAKES THE WIN', '#ff8a8a'); } }
  // contact with the player: a shove, never a wreck
  const dz = r.z - pz, dx = p.x - r.off;
  if (!g.finished && dz > -260 && dz < 300 && Math.abs(dx) < CAR_HW + r.hw && p.safe <= 0) {
    if (p.speed > r.speed) p.speed = r.speed * 0.95; p.x += sgn(dx || 1) * 0.08; p.safe = 0.4; p.bumpT = 0.3;
    g.shake = 4; chip.sfx('bump'); spawnSparks(5);
  }
  seg.cars.push(r); g.carSegs.push(seg);
}

/* ---- the police ---------------------------------------------------------------------------- */
function startChase() {
  const g = game;
  g.cop = { cop: true, style: 'sedan', col: '#f2f4f8', z: g.pos + PLAYER_Z - 2600, off: 0, speed: g.p.speed, hw: 0.13, lean: 0, t: 14, hits: 0, wail: 0, back: 0 };
  g.banner = { s: 'POLICE!', sub: 'OUTRUN THEM OR DODGE THE RAM', t: 0 };
  chip.sfx('rival');
}
function updateCop(dt) {
  const g = game, c = g.cop, p = g.p, T = g.T;
  if (!c) {
    if (!g.demo && !g.finished && T.cops.length && (g.pos + PLAYER_Z) / SEG > T.cops[0]) { T.cops.shift(); startChase(); }
    return;
  }
  const pz = g.pos + PLAYER_Z, dz = c.z - pz;
  c.t -= dt; c.wail -= dt;
  if (c.wail <= 0 && c.t > 0) { c.wail = 0.42; c.hi = !c.hi; chip.sfx(c.hi ? 'sirenHi' : 'sirenLo', { vol: clamp(1 - Math.abs(dz) / 4000, 0.25, 1) }); }
  if (g.finished || g.timeUp) c.t = Math.min(c.t, 0);
  const over = c.t <= 0;
  // faster than you unless you are on nitro; it drops back after a ram or if it overshoots
  let want = over ? MAX_SPEED * 0.4 : c.back > 0 ? p.speed * 0.9 : dz > 300 ? p.speed * 0.9 : Math.min(MAX_SPEED * 1.17, Math.max(MAX_SPEED * 0.55, p.speed * 1.1));
  if (c.back > 0) c.back -= dt;
  c.speed = approach(c.speed, want, MAX_SPEED * 0.6 * dt);
  c.z += c.speed * dt;
  const d = clamp(p.x - c.off, -1, 1);
  if (!over) c.off = clamp(c.off + d * dt * 0.95, -0.9, 0.9);
  c.lean = approach(c.lean, clamp(d * 3, -2, 2), dt * 6);
  if (!over && dz > -300 && dz < 260 && Math.abs(p.x - c.off) < CAR_HW + c.hw + 0.02 && p.air <= 0 && c.back <= 0) {
    c.hits++; c.back = 1.3; p.speed *= 0.84; p.x = clamp(p.x + (p.x >= c.off ? 0.12 : -0.12), -1.4, 1.4); p.drift = 0; p.nitroOn = false;
    g.shake = 8; g.flash = 0.15; chip.sfx('crash'); spawnSparks(10); breakChain(); popText('RAMMED!', '#ff5a5a');
  }
  if (!over && dz < -3400) c.t = 0;                      // left for dust
  if (over && !c.paid && !g.finished && !g.timeUp) {
    c.paid = true; g.stats.escapes = (g.stats.escapes || 0) + 1;
    const bonus = c.hits === 0 ? 15000 : 5000;
    addScore(bonus); chip.sfx('win'); popText(c.hits === 0 ? 'CLEAN GETAWAY  +' + Math.round(bonus * g.diff.score) : 'ESCAPED  +' + Math.round(bonus * g.diff.score), '#7dffa0');
    if (c.hits === 0) award('ghost');
  }
  if (over && (dz < -2500 || c.t < -5)) { g.cop = null; return; }
  const seg = segAt(T, c.z);
  seg.cars.push(c); g.carSegs.push(seg);
}

/* ---- small effects: screen-space particles around the car ---------------------------- */
function fxAdd(o) { if (game.fx.length < 140) game.fx.push(o); }
function spawnDust(x, th) {
  const col = th.id === 'coast' ? (x < 0 ? '#f0d090' : '#5ab85a') : th.id === 'mesa' ? '#e8b878' : th.id === 'neon' ? '#4a4460' : '#f4f9ff';
  for (const sx of [-1, 1]) fxAdd({ k: 'puff', x: sx * 22 + rand(-4, 4), y: -2, vx: sx * rand(10, 40), vy: rand(-30, -8), t: 0, life: rand(0.35, 0.6), r: rand(4, 8), col, a: 0.6 });
}
function spawnSmoke() { for (const sx of [-1, 1]) fxAdd({ k: 'puff', x: sx * 23, y: -2, vx: sx * rand(4, 20) - game.p.steer * 30, vy: rand(-22, -6), t: 0, life: rand(0.35, 0.6), r: rand(3, 6), col: '#e8ecf4', a: 0.3 }); }
function spawnSparks(n) { for (let i = 0; i < n; i++) fxAdd({ k: 'spark', x: rand(-26, 26), y: rand(-20, -4), vx: rand(-120, 120), vy: rand(-160, -30), t: 0, life: rand(0.25, 0.55), col: i % 2 ? '#ffd27a' : '#ffffff' }); }
function spawnDebris(off, col, n) { for (let i = 0; i < n; i++) fxAdd({ k: 'bit', x: (off - game.p.x) * 180 + rand(-8, 8), y: rand(-14, -2), vx: rand(-90, 90), vy: rand(-170, -60), t: 0, life: rand(0.5, 0.9), col, r: rand(1.5, 3.2), rot: rand(0, 6) }); }
function spawnSparkle() { for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU; fxAdd({ k: 'spark', x: 0, y: -16, vx: Math.cos(a) * 70, vy: Math.sin(a) * 70 - 20, t: 0, life: 0.4, col: '#fff2c0', g: 0 }); } }
function spawnSplash() { for (let i = 0; i < 12; i++) fxAdd({ k: 'spark', x: rand(-28, 28), y: -2, vx: rand(-60, 60), vy: rand(-150, -50), t: 0, life: rand(0.3, 0.6), col: '#c8a0ff' }); }
function updateFx(dt) {
  const fx = game.fx;
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t += dt;
    if (f.t >= f.life) { fx.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.k !== 'puff' && f.g !== 0) f.vy += 420 * dt;
  }
  for (let i = game.pops.length - 1; i >= 0; i--) { const q = game.pops[i]; q.t += dt; if (q.t > 1.5) game.pops.splice(i, 1); }
}
function popText(s, col) {
  const pops = game.pops;
  if (pops.length && pops[pops.length - 1].s === s && pops[pops.length - 1].t < 0.3) return;
  pops.push({ s, col, t: 0 });
  if (pops.length > 3) pops.shift();
}

/* ---- the bot: drives the attract mode and the automated tests ------------------------ */
function botInput() {
  const g = game, p = g.p, T = g.T, pz = g.pos + PLAYER_Z, seg = segAt(T, pz);
  const I = { left: false, right: false, up: false, down: false, gas: true, brake: false, nitro: false };
  // look ahead for the sharpest corner coming and for the clearest lane
  let curve = 0;
  for (let i = 0; i < 26; i++) { const s = T.segs[Math.min(T.n - 1, seg.i + i)]; if (Math.abs(s.curve) > Math.abs(curve)) curve = s.curve; }
  let best = 0, bestScore = -1e9;
  for (const lx of [-0.66, -0.33, 0, 0.33, 0.66]) {
    let sc = -Math.abs(lx - p.x) * 0.5 - Math.abs(lx + clamp(curve, -4, 4) * 0.1) * 0.5;
    for (const c of T.cars) { const dz = c.z - pz; if (dz > -100 && dz < 3400 && p.speed > c.speed && Math.abs(c.off - lx) < 0.36) sc -= 4 - dz / 1200; }
    for (const r of g.racers) { const dz = r.z - pz; if (dz > -100 && dz < 2000 && p.speed > r.speed && Math.abs(r.off - lx) < 0.36) sc -= 3; }
    for (let i = 0; i < 16; i++) {
      const s2 = T.segs[Math.min(T.n - 1, seg.i + i)];
      for (const sp of s2.sprites) { if (sp.gone) continue; const d = Math.abs(sp.off - lx); if (sp.hit && d < 0.4) sc -= sp.hit === 'cone' ? 1 : 3; if (sp.pick && d < 0.2) sc += 0.6; }
    }
    if (sc > bestScore) { bestScore = sc; best = lx; }
  }
  const sp = p.speed / MAX_SPEED;
  const err = best - p.x + seg.curve * sp * sp * 0.045;
  if (err < -0.05) I.left = true; else if (err > 0.05) I.right = true;
  if (Math.abs(seg.curve) >= 5.5 && sp > 0.9) I.gas = false;
  if (Math.abs(p.x) > 0.95 && sp > 0.6) I.gas = false;
  if (p.nitro > 0.5 && Math.abs(curve) < 3 && sp > 0.7) I.nitro = true;
  if (p.nitroOn && Math.abs(curve) < 4) I.nitro = true;
  return I;
}

/* ==========================================================================
   Game flow: states, the clock, scoring, medals and the results screens.
   ========================================================================== */

const MEDALS = [
  { id: 'breeze', name: 'SEA BREEZE', how: 'REACH THE GOAL AT SUNSET BAY' },
  { id: 'giant', name: 'GIANT KILLER', how: 'WIN A STAGE: FINISH IN 1ST PLACE' },

/* ---- touch pad ----------------------------------------------------------------- */
const touchPointers = new Map();

    if (!touchPointers.has(ev.pointerId)) return;

    recomputeTouch(false);
  };

    if (!touchPointers.has(ev.pointerId)) return;

/* ---- gamepad --------------------------------------------------------------------- */
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];

/* ---- per frame merge ----------------------------------------------------------------- */
/** Sample every device once per animation frame; edges accumulate until a game step consumes them. */

function drawRoadThings(g, count, hy, vh) {
  const gm = game, T2 = gm.T, th = T2.th, p = gm.p, half = W / 2;
  for (let n = count - 1; n > 0; n--) {
    const P = PJ[n], seg = P.seg;
    if (!seg) continue;

    if (seg.tun) drawTunnel(g, P, seg, th, vh, !T2.segs[seg.i - 1] || !T2.segs[seg.i - 1].tun);
    for (const s of seg.sprites) {
      if (s.gone) continue;
      const c = spriteCanvas(s.name), w = s.ww * P.s1 * half, X = P.X1 + P.s1 * s.off * ROAD_W * half;
      if (s.flat) { if (P.vis) { const h = w * (c.uh / c.uw); g.globalAlpha = fade; g.drawImage(c, X - w / 2, P.Y1 - h * 0.75, w, h); g.globalAlpha = 1; } continue; }
      if (s.pick) { const bob = Math.sin(gm.t * 5 + seg.i) * w * 0.06; drawBillboard(g, c, X, P.Y1 - w * (s.high ? 1.5 : 0.25) + bob, w, P.clip, false, fade); continue; }
      drawBillboard(g, c, X, P.Y1, w, s.over ? vh : P.clip, s.flip, fade < 1 ? fade : undefined);
    }
    for (const car of seg.cars) {
      const t = (car.z % SEG) / SEG, sc = P.s1 + (P.s2 - P.s1) * t;

      const lean = isRacer || car.cop ? clamp(Math.round(car.lean + rel * 1.2), -2, 2) : clamp(Math.round(rel * 1.6 + seg.curve * 0.12), -1, 1);
      const c = carArt(car.style, car.col, lean, th.night ? 'n' : '', car.cop ? '#16181e' : isRacer ? (isRival ? '#ffffff' : '#14161c') : null);
      const w = (CAR_STYLES[car.style].bw + 30) * 7.0 * sc * half;

      drawBillboard(g, c, X, Y + w * 0.02, w, P.clip, false, fade < 1 ? fade : undefined);
      if (car.cop && Y < P.clip) { const fl = Math.floor(gm.t * 8) % 2; rect(g, X - w * 0.2, Y - w * 0.5, w * 0.4, w * 0.045, '#22242c'); drawGlow(g, X - w * 0.12, Y - w * 0.5, w * 0.34, fl ? '#ff2a2a' : '#2a5aff', 0.95); drawGlow(g, X + w * 0.12, Y - w * 0.5, w * 0.34, fl ? '#2a5aff' : '#ff2a2a', 0.95); }
      if (isRival && n > 6 && Y < P.clip) {

        g.globalAlpha = fade; T(g, car.name, X, ty, '#ff8a8a', { align: 'center', weight: 700, scale: 0.8 }); poly(g, [X - 2.4, ty + 8, X + 2.4, ty + 8, X, ty + 11], '#ff5a5a'); g.globalAlpha = 1;
      }
    }
  }
}

/* ---- the player's car --------------------------------------------------------------- */
function drawPlayer(g, hy) {

  g.save();
  g.translate(x, y + bounce);

function drawFx(g, hy) {
  const gm = game, x0 = W / 2, y0 = hy + YS + 1;

    else if (f.k === 'spark') { g.globalAlpha = 1 - t; stampLine(g, x0 + f.x, y0 + f.y, x0 + f.x - f.vx * 0.03, y0 + f.y - f.vy * 0.03, 1.1, f.col); }

const PUFFS = {};

  c = makeCanvas(48, 48);
  const g = c.getContext('2d');
  g.fillStyle = rgrad(g, 24, 24, 0, 24, [[0, rgba(col, 0.9)], [0.5, rgba(col, 0.5)], [1, rgba(col, 0)]]); g.fillRect(0, 0, 48, 48);

}

/** Streaks that sell the speed: nitro, drift boost and slipstream. */
function drawSpeedLines(g, hy, vh) {

/** Rain over the harbour, snow on the pass and the ridge. Drawn over the scene, under the HUD. */
function drawWeather(g, vh) {
  const gm = game, th = gm.T.th, sp = gm.p.speed / MAX_SPEED;

  if (th.id === 'neon') {

/** The whole race picture, drawn to the full height of the screen area (taller on an upright phone). */
function drawRace(g) {
  const gm = game, vh = viewH(), p = gm.p, th = gm.T.th;
  // on an upright phone the picture is zoomed onto the road and the camera looks down more steeply,
  // so the car is large and the tarmac fills the lower half of the screen
  const tall = view.zoom > 1.15;
  const zf = tall ? clamp(vh / 440, 1, 2.2) : 1, ih = vh / zf;
  // the car sits clear of the thumb buttons, with road still showing beneath it
  const foot = tall ? 78 : 18;
  YS = tall ? Math.round(ih * 0.4) : 100;
  const hy = Math.round(ih - YS - foot);
  RV.zf = zf; RV.hy = hy; RV.ih = ih; RV.carY = (hy + YS) * zf; RV.hyS = hy * zf;
  const sp = p.speed / MAX_SPEED;
  gm.fov = approach(gm.fov || 0, p.nitroOn ? 1 : p.boostT > 0 ? 0.5 : 0, 0.05);
  g.save();
  g.beginPath(); g.rect(0, 0, W, vh); g.clip();
  g.translate(W / 2, 0); g.scale(zf, zf); g.translate(-W / 2, 0);
  // camera: shake, a slight roll into corners, and a punch on big moments
  let sx = 0, sy = 0;
  const rattle = sp > 0.97 ? (sp - 0.97) * 6 : 0;
  if (settings.shake && gm.state !== 'pause') { const k = Math.max(gm.shake > 0.3 ? gm.shake : 0, rattle); sx = rand(-1, 1) * k * 0.5; sy = rand(-1, 1) * k * 0.4; }
  const roll = settings.shake ? -p.steer * 0.018 * Math.min(1, sp * 1.4) - (p.drift ? p.driftDir * 0.016 : 0) : 0;
  const z = 1 + (settings.shake ? gm.punch : 0) + Math.abs(roll) * 2.4;
  g.translate(W / 2 + sx, hy + YS + sy); g.rotate(roll); g.scale(z, z); g.translate(-W / 2, -(hy + YS));
  drawSky(g, th, hy, ih);
  const n = drawRoad(g, hy, ih + 8);
  if (settings.fx) { g.fillStyle = lgrad(g, 0, hy - 14, 0, hy + 22, [[0, rgba(th.fog, 0)], [0.4, rgba(th.fog, th.night ? 0.3 : 0.55)], [1, rgba(th.fog, 0)]]); g.fillRect(0, hy - 14, W, 36); }
  drawRoadThings(g, n, hy, ih + 8);
  drawPlayer(g, hy);
  drawFx(g, hy);
  drawSpeedLines(g, hy, ih);
  g.restore();
  drawWeather(g, vh);
  // lens: darker corners at night, a warm wash at sunset
  if (settings.fx) {
    g.fillStyle = rgrad(g, W / 2, vh * 0.55, vh * 0.35, Math.max(W, vh) * 0.75, [[0, 'rgba(0,0,0,0)'], [1, th.night ? 'rgba(0,0,10,0.6)' : 'rgba(20,0,30,0.32)']]);
    g.fillRect(0, 0, W, vh);
  }
  if (gm.flash > 0) rect(g, 0, 0, W, vh, 'rgba(255,255,255,' + Math.min(0.6, gm.flash * 2).toFixed(3) + ')');
}

  initInput();
  layout();
  window.addEventListener('resize', layout);
  guardViewport();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (game.state === 'play' && !game.demo) openPause();
      chip.engine(null);
      if (chip.ctx) chip.ctx.suspend().catch(() => {});
    } else {
      lastT = 0;
      if (chip.ctx) chip.ctx.resume().catch(() => {});
    }
  });
  window.addEventListener('blur', () => { if (game.state === 'play' && !game.demo) openPause(); });
  loadFonts();
  // art that contains lettering is redrawn once the web fonts have arrived
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in ART_CACHE) if (/^(n\||board|gantry|s\|(block|nitro|coin))/.test(k)) delete ART_CACHE[k]; }).catch(() => {});
  try { $('screen').focus({ preventScroll: true }); } catch (e) { /* focus is best effort */ }
  setState('boot');
  requestAnimationFrame(frame);
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
    try { window.claude.hot.snapshot(hotSnapshot); } catch (e) { /* viewer without hot updates */ }
  }

  // hooks for automated testing
  const blank = () => Object.assign({}, NO_PRESS);
  window.__redline = {
    game, input, chip, settings, STAGES, THEMES, DIFFS, CARS, MEDALS, PROG, SONGS, ART_CACHE, DBG, QUALITY, view, MAX_SPEED, SEG, PLAYER_Z,
    setManual(v) { manual = v; },
    step(n, held, pressed, quiet) {
      const H0 = Object.assign(blank(), held || {});
      for (let i = 0; i < n; i++) {
        const P = i === 0 ? Object.assign(blank(), pressed || {}) : NO_PRESS;
        input.tap = i === 0 && pressed && pressed.tap ? pressed.tap : null;
        updateGame(STEP, H0, P);
      }
      if (!quiet) renderFrame();
    },
    render: renderFrame, newGame, startStage, setState, layout, beginPlay, updateGame, botInput, award, buildTrack, segAt, crash, collect, nearMiss, finishStage, passCheckpoint, nextStage, toTitle, qualifies, kmh
  };
}

/** State worth keeping if the page is updated while someone is mid-run. */
function hotSnapshot() {
  const live = ['intro', 'play', 'pause', 'clear', 'continue'].includes(game.state) && !game.demo;
  if (!live) return {};
  return { run: { stage: game.stage, score: game.stageScore || 0, credits: game.credits, level: game.diff.id } };
}

function resumeRun(r) {
  if (r.level && DIFFS[r.level]) settings.level = r.level;
  newGame(false);
  game.score = r.score || 0; game.credits = r.credits == null ? 3 : r.credits;
  startStage(clamp(r.stage | 0, 0, STAGES.length - 1), 0);
}

function start(data) {
  boot();
  if (data && data.run) { try { resumeRun(data.run); } catch (e) { setState('boot'); } }
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});

})();
</script>
