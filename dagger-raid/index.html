  updateSpecial(h, dt, I);

  const wasAir = !h.ground;
  if (actorPhys(h, dt) && wasAir) { chip.sfx('land'); dust(h.x, h.y, 3); h.flipT = -1; }
  if (h.ground && h.vx) {
    const d = Math.abs(h.vx) * dt;
    h.runT += d; h.stepD += d;
    if (h.stepD > 15 && !h.act) { h.stepD = 0; chip.sfx('step', { surf: game.st.id }); if (game.st.id !== 'citadel') dust(h.x - h.face * 3, h.y, 1); }
  }
}

/** A plunging stab lands: a shock ring that knocks down anyone standing right there. */
function diveLand(h) {
  h.act = { type: 'recover', t: 0, dur: 0.14, hits: [] };
  h.vx = 0;
  chip.sfx('thud'); addShake(2.5); dust(h.x, h.y, 7);
  game.fx.push({ k: 'ring', x: h.x, y: h.y - 1, t: 0, life: 0.3, r0: 4, r1: 22, col: '#fff2c8', flat: true, w: 1.6 });
  for (const e of game.foes) {
    if (e.st === 'dead' || e.gone || foeGhost(e)) continue;
    if (Math.abs(e.y - h.y) < 6 && Math.abs(e.x - h.x) < 17) killFoe(e, 'dive', sgn(e.x - h.x) || h.face, 1);
  }
}

/* ---- special weapons ----------------------------------------------------------- */
function updateSpecial(h, dt, I) {
  // the flamethrower sprays for as long as the button is held
  if (h.wpn === 'flame') {
    const can = I.special && h.ammo > 0 && h.ground && !h.climb && h.hurtT <= 0 && (!h.act || h.act.type === 'flame');
    if (can) {
      if (!h.act) { h.act = { type: 'flame', t: 0, dur: 99, emit: 0 }; h.crouch = false; }
      const a = h.act;
      a.emit -= dt;
      while (a.emit <= 0 && h.ammo > 0) {
        a.emit += 0.05; h.ammo--;
        const f = h.face;
        game.shots.push({ k: 'flame', x: h.x + f * 17, y: h.y - 15.5 + rand(-1, 1), vx: f * rand(150, 200) + h.vx * 0.5, vy: rand(-16, 12), t: 0, life: rand(0.3, 0.4), mine: true, hits: [] });
      }
      h.flameSnd -= dt;
      if (h.flameSnd <= 0) { h.flameSnd = 0.16; chip.sfx('flameJet'); }
      h.flameT = 0.1;
      game.stageStats.specials += dt;
      if (h.ammo <= 0) { h.wpn = null; h.ammo = 0; h.act = null; pop(h.x, h.y - 42, 'TANK EMPTY', '#ffb060'); }
    } else if (h.act && h.act.type === 'flame') h.act = null;
    if (h.sbuf > 0 && !can) { h.sbuf = 0; if (!h.ground) chip.sfx('tick'); }
    return;
  }
  if (h.sbuf <= 0 || h.hurtT > 0) return;
  if (!h.wpn || h.ammo <= 0) { if (!h.act) { h.sbuf = 0; chip.sfx('tick'); } return; }
  if (h.wpn === 'star') {
    // shuriken are quick: thrown on the move, in the air or from a crouch
    if (h.act && h.act.type !== 'toss') return;
    if (h.act && h.act.t < 0.13) return;
    h.sbuf = 0;
    h.act = { type: 'toss', t: 0, dur: 0.2, fired: false, fireAt: 0.05, low: h.crouch };
    return;
  }
  if (h.act || h.climb) return;
  h.sbuf = 0;
  const rocket = h.wpn === 'rocket';
  h.act = { type: rocket ? 'rocket' : 'throw', t: 0, dur: rocket ? 0.32 : 0.26, fired: false, fireAt: rocket ? 0.05 : 0.09 };
  h.crouch = false;
}

function fireSpecial(h) {
  const f = h.face;
  if (h.wpn === 'tri') {
    for (const a of [-14, -4, 6]) {
      const r = (a * Math.PI) / 180;
      game.shots.push({ k: 'tknife', x: h.x + f * 8, y: h.y - 18, vx: Math.cos(r) * 290 * f, vy: Math.sin(r) * 290, t: 0, mine: true });
    }
    chip.sfx('throw');
  } else if (h.wpn === 'gren') {
    game.shots.push({ k: 'hgren', x: h.x + f * 6, y: h.y - 24, vx: f * 150 + h.vx * 0.3, vy: -200, t: 0, mine: true });
    chip.sfx('throw');
  } else if (h.wpn === 'rocket') {
    game.shots.push({ k: 'rocket', x: h.x + f * 14, y: h.y - 19, vx: f * 120, vy: 0, t: 0, mine: true, f, smoke: 0 });
    chip.sfx('rocket');
    puff(h.x - f * 10, h.y - 19, 5, '#d8d8d8');
  } else if (h.wpn === 'star') {
    const low = h.act && h.act.low;
    game.shots.push({ k: 'star', x: h.x + f * 9, y: h.y - (low ? 9 : 19), vx: f * 340, vy: 0, t: 0, mine: true, pierce: 1, hits: [] });
    chip.sfx('star');
  } else return;
  h.ammo--;
  game.stageStats.specials++;
  if (h.ammo <= 0) { h.wpn = null; h.ammo = 0; }
}

/* ---- taking damage ---------------------------------------------------------------- */
function hurtHero(h, dirX, src) {
  if (h.dead || h.inv > 0 || game.state !== 'play' || game.cheat) return false;
  if (heroDodging(h)) { dodgeCredit(h); return false; }
  if (game.invincible) {
    // the shield soaks everything: a spark, a ring and no harm done
    h.shieldT = 0.34; h.inv = 0.3;
    chip.sfx('shield');
    game.fx.push({ k: 'ring', x: h.x, y: h.y - 15, t: 0, life: 0.3, r0: 9, r1: 20, col: '#7fe6ff', w: 1.4 });
    game.stageStats.blocked++;
    return false;
  }
  game.lastCause = src || '?';
  game.stageStats.hits++;
  if (h.hp > 1) {
    h.hp--;
    h.inv = 1.5; h.hurtT = 0.32; h.flash = 0.15; h.act = null; h.roll = null; h.flipT = -1; h.combo = 0;
    if (!h.climb) { h.vx = (dirX || -h.face) * 70; h.vy = -120; h.ground = false; h.jumpCut = true; }
    chip.sfx('hurt'); chip.voice('pain'); addShake(4);
    sparks(h.x, h.y - 16, 4, '#ff8a7a');
    return true;
  }
  h.hp = 0;
  killHero(h, dirX);
  return true;
}

function killHero(h, dirX) {
  h.dead = true; h.deadT = 0; h.act = null; h.climb = null; h.crouch = false; h.roll = null; h.flipT = -1;
  h.vy = -150; h.vx = (dirX || -h.face) * 50; h.ground = false; h.flash = 0.2;
  chip.sfx('die'); chip.voice('down'); chip.stopMusic(true); addShake(6);
  onHeroDown();
}

/** Called after the screen clamp: pushing into a boundary in mid air counts as a wall. */
function heroWallContact(h, xBefore, dt) {
  if (h.ground || h.dead || h.climb) { h.wallSide = 0; h.wallT = 0; return; }
  if (Math.abs(h.x - xBefore) > 0.01) { h.wallSide = sgn(xBefore - h.x); h.wallT = 0.14; }
  else { h.wallT -= dt; if (h.wallT <= 0) h.wallSide = 0; }
}

/* ---- drawing the hero -------------------------------------------------------------- */
function heroAnim(h) {
  if (h.pose) return h.pose;
  if (h.dead) return ['dead', Math.min(2, h.deadT / 0.13)];
  if (h.hurtT > 0) return ['hurt', 0];
  if (h.roll) return [h.roll.tuck ? 'roll' : 'airDash', 0];
  const a = h.act;
  if (a) {
    const M = MELEE[a.type];
    if (M) {
      if (a.type === 'dive') return ['dive', 0];
      const f = a.t < M.a0 ? a.t / M.a0 : a.t < M.a1 ? 1 : 1 + (a.t - M.a1) / Math.max(0.01, M.dur - M.a1);
      if (a.type === 'jstab') return ['jumpStab', Math.min(1, a.t / M.a0)];
      return [M.anim, f];
    }
    if (a.type === 'throw') return ['throw', a.t < 0.09 ? 0 : 1];
    if (a.type === 'toss') return [h.ground && !a.low ? 'toss' : a.low ? 'crouchStab' : 'jumpStab', a.t < 0.05 ? 0 : 1];
    if (a.type === 'rocket') return ['rocket', 0];
    if (a.type === 'flame') return ['flame', 0];
    if (a.type === 'recover') return ['crouch', 0];
  }
  if (h.climb) return ['climb', h.climbT / 0.12];
  if (!h.ground) {
    if (h.sliding) return ['wall', 0];
    if (h.flipT >= 0) return ['flip', 0];
    return [h.vy < 0 ? 'jumpUp' : 'jumpDown', 0];
  }
  if (h.crouch) return ['crouch', 0];
  if (Math.abs(h.vx) > 8) return ['run', h.runT / 6];
  return ['idle', game.t * 1.7];
}

/** Whole-body rotation for somersaults and rolls. */
function heroSpin(h) {
  if (h.dead) return 0;
  if (h.roll && h.roll.tuck) return h.roll.dir * (h.roll.t / h.roll.dur) * TAU;
  if (!h.ground && h.flipT >= 0 && !h.act) return h.face * (h.flipT / 0.42) * TAU;
  return 0;
}
function spinDraw(g, x, y, rot, fn) {
  if (!rot) { fn(); return; }
  g.save(); g.translate(x, y - 10); g.rotate(rot); g.translate(-x, -(y - 10)); fn(); g.restore();
}

function drawHero(g, h, cx) {
  if (game.hideHero) return;
  const [anim, fr] = heroAnim(h);
  const x = h.x - cx, rot = heroSpin(h);
  SPRITE_SWAP = h.blade === 'katana' ? { knife: 'katana' } : null;
  // afterimages while dashing, flipping or lunging
  const fast = !!h.roll || (!h.ground && h.flipT >= 0) || (h.act && (h.act.type === 'dive' || (h.act.type === 'thrust' && h.act.lunge)));
  if (fast && !h.dead && (!h.ghosts.length || game.t - h.ghosts[h.ghosts.length - 1].t > 0.03)) h.ghosts.push({ x: h.x, y: h.y, anim, fr, face: h.face, rot, t: game.t });
  h.ghosts = h.ghosts.filter((p) => game.t - p.t < 0.17);
  if (QUALITY.level < 2) for (const p of h.ghosts) {
    const a = 0.42 * (1 - (game.t - p.t) / 0.17);
    spinDraw(g, p.x - cx, p.y, p.rot, () => drawSprite(g, 'hero', p.anim, p.fr, p.face, p.x - cx, p.y, '#6ad0ff', a));
  }
  const blinkOut = !h.dead && h.inv > 0 && !game.invincible && Math.floor(h.inv * 20) % 2 === 0;
  if (!blinkOut) spinDraw(g, x, h.y, rot, () => drawSprite(g, 'hero', anim, fr, h.face, x, h.y, h.flash > 0 ? '#ff5a4a' : false));
  SPRITE_SWAP = null;
  if (h.counterT > 0 && !h.dead) {
    // the counter window: a pale edge on the blade hand
    const a = Math.min(1, h.counterT * 2) * (0.6 + 0.4 * Math.sin(game.t * 30));
    drawGlow(g, x + h.face * 6, h.y - 15, 9, '#9fe8ff', a);
  }
  if (game.invincible && !h.dead) {
    const p = h.shieldT > 0 ? 1 : 0.32 + 0.1 * Math.sin(game.t * 5);
    g.save(); g.globalAlpha = p;
    g.strokeStyle = '#8fe9ff'; g.lineWidth = h.shieldT > 0 ? 1.3 : 0.6;
    g.beginPath(); g.ellipse(x, h.y - 14, 11, 16.5, 0, 0, TAU); g.stroke();
    g.restore();
    if (h.shieldT > 0) drawGlow(g, x, h.y - 14, 22, '#7fe6ff', h.shieldT * 2);
  }
  if (h.flameT > 0) drawGlow(g, x + h.face * 20, h.y - 15, 13, '#ffb040', 0.8);
}

/* ==========================================================================
   Entities, part two: the enemy roster, including the ninjas
   ========================================================================== */

const ETYPES = {
  grunt: { hp: 1, spd: [50, 62], pts: 100, melee: 'jab', gun: true, gunP: 0.35 },
  striker: { hp: 1, spd: [86, 98], pts: 150, melee: 'kick' },
  officer: { hp: 1, spd: [36, 44], pts: 300, gun: true, gunP: 0.9, pistol: true },
  grenadier: { hp: 1, spd: [42, 50], pts: 200, melee: 'jab', lob: true },
  sniper: { hp: 1, spd: [0, 0], pts: 300, fixed: true },
  gunner: { hp: 1, spd: [44, 52], pts: 300, melee: 'jab', mg: true },
  guard: { hp: 2, spd: [46, 54], pts: 300, melee: 'jab', gun: true, gunP: 0.5 },
  para: { hp: 1, spd: [50, 58], pts: 250, melee: 'jab', gun: true, gunP: 0.25 },
  dog: { hp: 1, spd: [118, 134], pts: 200, dog: true },
  ninja: { hp: 2, spd: [92, 106], pts: 500, ninja: true }
};

let foeSeq = 0;
function spawnFoe(kind, x, y, face, opt) {
  const T = ETYPES[kind];
  const e = {
    id: ++foeSeq, kind, T, x, y, vx: 0, vy: 0, face: face || -1, ground: true, climb: null, dropY: null,
    st: T.fixed ? 'snipe' : 'run', t: 0, hp: T.hp + (game.loop > 1 && kind === 'guard' ? 1 : 0), flash: 0,
    sp: rand(T.spd[0], T.spd[1]) * game.diff.speed, cd: rand(0.35, 1.0), runner: !!(opt && opt.runner),
    drop: opt && opt.drop, gone: false, deadT: 0, dist: Math.random() * 40, fired: false, shotN: 0, aiming: false, aimT: 0,
    evade: 0, flipCD: 0, burn: 0
  };
  if (T.ninja) { e.runner = false; e.cd = rand(0.5, 0.9); if (!e.drop && chance(0.25)) e.drop = 'star'; }
  if (opt && opt.para) { e.st = 'para'; e.ground = false; }
  else if (!supportAt(x, y)) { e.ground = false; e.st = 'fall'; }
  game.foes.push(e);
  return e;
}

function setSt(e, st) { e.st = st; e.t = 0; e.fired = false; e.shotN = 0; }

/** Ninjas cannot be touched while vanished or in the first beat of a back flip. */
function foeGhost(e) {
  if (!e.T.ninja) return false;
  return e.evade > 0 || (e.st === 'vanish' && e.t > 0.1) || (e.st === 'appear' && e.t < 0.12);
}

function foeBox(e) {
  if (e.kind === 'dog') return box(e.x - 9, e.y - 11, e.x + 9, e.y - 1);
  if (e.st === 'kneel' || e.st === 'snipe') return box(e.x - 6, e.y - 18, e.x + 6, e.y);
  return box(e.x - 5, e.y - 27, e.x + 5, e.y - 1);
}

function foeAttackBox(e) {
  if (e.st === 'dead' || e.st === 'para') return null;
  const f = e.face, w = tw(0.22);
  if (e.st === 'jab' && e.t >= w && e.t < w + 0.12) return f > 0 ? box(e.x + 6, e.y - 19, e.x + 20, e.y - 11) : box(e.x - 20, e.y - 19, e.x - 6, e.y - 11);
  if (e.st === 'kick' && !e.ground && e.t > 0.08) return f > 0 ? box(e.x + 1, e.y - 16, e.x + 12, e.y - 5) : box(e.x - 12, e.y - 16, e.x - 1, e.y - 5);
  if (e.st === 'slash' && e.t >= w && e.t < w + 0.13) return f > 0 ? box(e.x + 3, e.y - 30, e.x + 29, e.y - 6) : box(e.x - 29, e.y - 30, e.x - 3, e.y - 6);
  if (e.kind === 'dog') return box(e.x - 7, e.y - 10, e.x + 7, e.y - 2);
  return null;
}

function ladderUp(e, tx) {
  const d = e.y >= GROUND_Y - 0.5 ? null : deckAt(e.x, e.y);
  let best = null, bs = 1e9;
  for (const L of game.st.ladders) {
    if (Math.abs(L.lo - e.y) > 1) continue;
    if (d && (L.x < d.x0 || L.x > d.x1)) continue;
    if (Math.abs(L.x - e.x) > 280) continue;
    const s = Math.abs(L.x - e.x) + 0.6 * Math.abs(L.x - tx);
    if (s < bs) { bs = s; best = L; }
  }
  return best;
}

function dropDown(e) { e.dropY = e.y; e.ground = false; e.vy = -70; setSt(e, 'fall'); }
function foeBullet(x, y, vx, vy, extra) {
  const k = game.diff.bullet;
  game.shots.push(Object.assign({ k: 'bullet', x, y, vx: vx * k, vy: vy * k, t: 0, foe: true }, extra || {}));
  muzzle(x, y);
}

/* ---- ninja brain -------------------------------------------------------------------- */
function ninjaLeap(e, h) {
  const ty = h.ground ? h.y : GROUND_Y;
  let tx = clamp(h.x + rand(-26, 26), game.camX + 14, game.camX + W - 14);
  if (ty < e.y) {
    const d = game.st.decks.find((k) => Math.abs(k.y - ty) < 1 && tx > k.x0 - 30 && tx < k.x1 + 30);
    if (!d) { e.cd = 0.5; return false; }
    tx = clamp(tx, d.x0 + 8, d.x1 - 8);
    const height = e.y - ty + 16;
    e.vy = -Math.sqrt(2 * GRAV * height);
    e.vx = (tx - e.x) / (-e.vy / GRAV + Math.sqrt((2 * 16) / GRAV));
  } else {
    e.dropY = e.y; e.vy = -150; e.vx = (tx - e.x) / 0.85;
  }
  e.vx = clamp(e.vx, -230, 230);
  e.ground = false; e.face = sgn(e.vx) || e.face;
  setSt(e, 'leap');
  chip.sfx('whoosh');
  return true;
}

function ninjaRun(e, h, alive, same, adx, toward, vis) {
  if (!alive) { e.vx = e.face * e.sp; return; }
  e.face = toward;
  if (!same) {
    if (e.ground && !h.climb && e.cd <= 0 && vis && (h.ground || h.y > e.y) && ninjaLeap(e, h)) return;
    e.vx = adx > 26 ? toward * e.sp : 0;
    return;
  }
  // back flip away from the blade as it starts
  const a = h.act;
  if (e.ground && a && MELEE[a.type] && a.t < 0.07 && adx < 42 && h.face === -toward && e.flipCD <= 0) {
    e.flipCD = 1.5;
    if (chance(0.6)) {
      setSt(e, 'flip'); e.vy = -190; e.vx = -toward * 125; e.ground = false; e.evade = 0.2;
      chip.sfx('whoosh');
      return;
    }
  }
  if (e.ground && e.cd <= 0 && vis) {
    if (adx < 31) { setSt(e, 'slash'); e.vx = 0; return; }
    if (adx > 62 && adx < 200) {
      if (chance(0.5)) setSt(e, 'nthrow');
      else { setSt(e, 'vanish'); smokeBomb(e.x, e.y - 14); chip.sfx('poof'); }
      e.vx = 0;
      return;
    }
  }
  e.vx = adx > 24 ? toward * e.sp : 0;
}

function smokeBomb(x, y) {
  for (let i = 0; i < 9; i++) game.fx.push({ k: 'smoke', x: x + rand(-6, 6), y: y + rand(-12, 10), vx: rand(-22, 22), vy: rand(-26, -4), t: 0, life: rand(0.4, 0.75), col: '#3a4258', r: rand(3, 5.5) });
}

/** Ninja states. Returns true when it handled the state. */
function ninjaState(e, dt, h, alive, toward) {
  const w = tw(0.22);
  switch (e.st) {
    case 'slash':
      e.vx = e.t >= w && e.t < w + 0.13 ? e.face * 115 : 0;
      if (e.t >= w && !e.fired) { e.fired = true; chip.sfx('katana'); game.fx.push({ k: 'slash', x: e.x + e.face * 3, y: e.y - 17, face: e.face, r: 27, a0: -1.9, a1: 1.0, col: '#ff9a9a', t: 0, life: 0.16 }); }
      if (e.t >= w + 0.42) {
        if (e.ground && chance(0.65)) {
          // spring back out of reach, then come again with a star or from the smoke
          const away = -e.face;
          setSt(e, 'flip'); e.vy = -185; e.vx = away * 135; e.ground = false; e.evade = 0.12; e.cd = 0.3;
          chip.sfx('whoosh');
        } else { setSt(e, 'run'); e.cd = rand(0.7, 1.2); }
      }
      return true;
    case 'nthrow': {
      e.vx = 0; if (alive) e.face = toward;
      const at = tw(0.3);
      if (!e.fired && e.t >= at) {
        e.fired = true;
        game.shots.push({ k: 'star', x: e.x + e.face * 9, y: e.y - 19, vx: e.face * 205 * game.diff.bullet, vy: 0, t: 0, foe: true });
        chip.sfx('star');
      }
      if (e.t >= at + 0.3) { setSt(e, 'run'); e.cd = rand(1.3, 2.1); }
      return true;
    }
    case 'vanish':
      e.vx = 0;
      if (e.t >= 0.3) {
        // step out of the smoke behind the hero
        const y = alive && h.ground ? h.y : e.y;
        let side = alive ? -h.face : 1;
        let tx = h.x + side * 42;
        if (tx < game.camX + 14 || tx > game.camX + W - 14 || !supportAt(tx, y)) { side = -side; tx = h.x + side * 42; }
        tx = clamp(tx, game.camX + 14, game.camX + W - 14);
        if (supportAt(tx, y)) { e.x = tx; e.y = y; e.ground = true; e.vy = 0; }
        e.face = sgn(h.x - e.x) || e.face;
        setSt(e, 'appear');
        smokeBomb(e.x, e.y - 14); chip.sfx('poof');
      }
      return true;
    case 'appear':
      e.vx = 0; if (alive) e.face = toward;
      if (e.t >= tw(0.34)) { setSt(e, 'slash'); }
      return true;
    case 'flip': case 'leap':
      e.evade = Math.max(0, e.evade - dt);
      if (e.ground && e.t > 0.1) { setSt(e, 'run'); e.cd = Math.max(e.cd, 0.25); dust(e.x, e.y, 3); }
      return true;
    default: return false;
  }
}

/* ---- update -------------------------------------------------------------------------- */
function updateFoe(e, dt) {
  const h = game.hero, T = e.T;
  e.t += dt; e.flash = Math.max(0, e.flash - dt); e.cd -= dt;
  e.flipCD = Math.max(0, e.flipCD - dt);
  if (e.st === 'dead') {
    e.deadT += dt;
    e.vx = approach(e.vx, 0, (e.ground ? 260 : 30) * dt);
    actorPhys(e, dt);
    if (e.burn > 0 && e.deadT < 0.7 && chance(0.5)) game.fx.push({ k: 'smoke', x: e.x + rand(-4, 4), y: e.y - rand(2, 16), vx: rand(-8, 8), vy: rand(-30, -12), t: 0, life: 0.4, col: chance(0.5) ? '#ff9a30' : '#4a4444', r: rand(1.5, 3) });
    if (e.deadT > 1.35) e.gone = true;
    return;
  }
  if (e.st === 'para') {
    const y0 = e.y;
    e.y += 34 * dt; e.x += Math.sin(e.t * 2.2 + e.id) * 14 * dt;
    const ly = landY(e.x, y0, e.y, null);
    if (ly !== null) { e.y = ly; e.ground = true; setSt(e, 'run'); e.cd = 0.4; dust(e.x, e.y, 3); }
    if (e.x < game.camX - 70 || e.x > game.camX + W + 110) e.gone = true;
    return;
  }
  const alive = !h.dead && game.state === 'play';
  const dx = h.x - e.x, adx = Math.abs(dx), toward = dx >= 0 ? 1 : -1;
  const same = alive && !h.climb && Math.abs(h.y - e.y) < 14;
  const vis = e.x > game.camX + 8 && e.x < game.camX + W - 8;

  if (!(T.ninja && ninjaState(e, dt, h, alive, toward))) switch (e.st) {
    case 'run': {
      if (T.ninja) { ninjaRun(e, h, alive, same, adx, toward, vis); break; }
      if (T.dog) {
        if (!e.runner && alive && e.ground) e.face = toward;
        e.vx = e.ground ? e.face * e.sp : e.vx;
        if (e.ground && same && e.face === toward && adx < 46 && e.cd <= 0) {
          e.vy = -130; e.ground = false; e.vx = e.face * 150; e.cd = 1.3; chip.sfx('bark');
        }
        break;
      }
      let move = e.face, stop = false;
      if (!e.runner && alive) {
        let tx = h.x;
        if (!same) {
          if (h.y > e.y + 14 && e.y < GROUND_Y - 1) {
            if (adx < 30 + (e.id % 4) * 14 && e.ground) { dropDown(e); break; }
          } else if (h.y < e.y - 14 && e.ground && !h.climb) {
            const L = ladderUp(e, h.x);
            if (L) {
              tx = L.x;
              if (Math.abs(e.x - L.x) < 2.5) { e.climb = L; e.x = L.x; e.ground = false; e.vx = 0; setSt(e, 'climb'); break; }
            } else if (adx < 26) stop = true;
          }
        }
        const d = tx - e.x;
        if (Math.abs(d) > 2) move = d > 0 ? 1 : -1; else stop = true;
        if (same && adx < 13) stop = true;
      } else if (alive && same && e.face === toward && adx < 13) stop = true;
      e.face = move;
      e.vx = stop ? 0 : move * e.sp;
      if (alive && same && e.face === toward && e.cd <= 0 && vis && e.ground) {
        if (T.melee === 'jab' && adx < 25) { setSt(e, 'jab'); chip.sfx('throw'); }
        else if (T.melee === 'kick' && adx > 34 && adx < 72) { setSt(e, 'kick'); e.vy = -160; e.vx = e.face * 135; e.ground = false; }
        else if (T.mg && adx > 50 && adx < 230) setSt(e, 'kneel');
        else if (T.lob && adx > 48 && adx < 170) setSt(e, 'throw');
        else if (T.gun && adx > 56 && adx < 210) { if (Math.random() < T.gunP) setSt(e, 'aim'); else e.cd = rand(0.7, 1.4); }
      }
      break;
    }
    case 'jab':
      e.vx = 0;
      if (e.t >= tw(0.22) + 0.34) { setSt(e, 'run'); e.cd = rand(0.45, 0.9); }
      break;
    case 'aim':
      e.vx = 0;
      if (!e.fired && e.t >= tw(0.45)) {
        e.fired = true;
        foeBullet(e.x + e.face * (T.pistol ? 12 : 15), e.y - 21, e.face * 150, 0);
        chip.sfx('shot');
      }
      if (e.t >= tw(0.45) + 0.35) { setSt(e, 'run'); e.cd = rand(1.4, 2.6); }
      break;
    case 'throw':
      e.vx = 0;
      if (!e.fired && e.t >= tw(0.38)) {
        e.fired = true;
        const tx = h.x + rand(-10, 10) + h.vx * 0.4;
        const ty = h.ground || h.climb ? h.y : (landY(h.x, h.y, GROUND_Y, null) || GROUND_Y);
        lob('egren', e.x + e.face * 4, e.y - 26, tx, ty, 0.95 * Math.sqrt(game.diff.tele), true);
        chip.sfx('throw');
      }
      if (e.t >= tw(0.38) + 0.37) { setSt(e, 'run'); e.cd = rand(2.2, 3.2); }
      break;
    case 'kneel':
      e.vx = 0;
      if (alive) e.face = toward;
      if (e.shotN < 3 && e.t >= tw(0.5) + e.shotN * 0.14) {
        e.shotN++;
        foeBullet(e.x + e.face * 15, e.y - 11, e.face * 170, 0);
        chip.sfx('shot');
      }
      if (e.t >= tw(0.5) + 1.0) { setSt(e, 'run'); e.cd = rand(2.4, 3.4); }
      break;
    case 'snipe': {
      e.vx = 0;
      if (alive && !e.aiming) e.face = toward;
      if (!e.aiming && e.cd <= 0 && vis && alive && adx < 270) { e.aiming = true; e.aimT = 0; }
      if (e.aiming) {
        e.aimT += dt;
        if (e.aimT < tw(0.55)) { e.ax = h.x; e.ay = h.y - (h.crouch || (h.roll && h.roll.tuck) ? 7 : 15); }
        if (e.aimT >= tw(0.82)) {
          e.aiming = false; e.cd = rand(2.0, 2.9);
          const mx = e.x + e.face * 15, my = e.y - 12;
          const a = Math.atan2(e.ay - my, e.ax - mx);
          foeBullet(mx, my, Math.cos(a) * 205, Math.sin(a) * 205, { aimed: true });
          chip.sfx('snipe');
        }
      }
      break;
    }
    case 'kick':
      if (e.ground && e.t > 0.1) { setSt(e, 'recover'); e.vx = 0; }
      break;
    case 'recover':
      e.vx = 0;
      if (e.t > 0.4) { setSt(e, 'run'); e.cd = rand(0.8, 1.4); }
      break;
    case 'climb':
      e.vx = 0;
      e.y -= 40 * dt;
      if (e.y <= e.climb.hi) { e.y = e.climb.hi; e.climb = null; e.ground = true; setSt(e, 'run'); e.cd = Math.max(e.cd, 0.25); }
      break;
    case 'hurt':
      e.vx = approach(e.vx, 0, 220 * dt);
      if (e.t > 0.32) {
        if (T.ninja && e.ground) { setSt(e, 'vanish'); smokeBomb(e.x, e.y - 14); chip.sfx('poof'); }
        else { setSt(e, 'run'); e.cd = rand(0.3, 0.6); }
      }
      break;
    default: break;
  }
  if (e.st !== 'climb' && !T.fixed) {
    const landed = actorPhys(e, dt);
    if (landed && e.st === 'fall') { setSt(e, 'run'); e.cd = Math.max(e.cd, 0.3); dust(e.x, e.y, 2); }
  }
  if (e.ground && e.vx) e.dist += Math.abs(e.vx) * dt;
  if (e.x < game.camX - 70 || e.x > game.camX + W + 110) e.gone = true;
}

/** Returns true when the foe was killed (false when armour soaked the hit). label marks a critical. */
function killFoe(e, how, dirX, dmg, label) {
  if (e.st === 'dead' || e.gone) return false;
  e.hp -= dmg || 1;
  const hy = e.y - (e.kind === 'dog' ? 6 : 18);
  if (label) {
    pop(e.x, e.y - 44, label, label === 'COUNTER!' ? '#9fe8ff' : '#ffd27a');
    game.fx.push({ k: 'star', x: e.x, y: hy, t: 0, life: 0.2, big: true, col: '#ffd27a' });
    chip.sfx('crit');
    game.stageStats.crits++;
    if (label === 'BACKSTAB!') countUp('backstab', 10, 'backstab');
    if (label === 'COUNTER!') award('counter');
  }
  if (how === 'flame') e.burn = 1;
  if (e.hp > 0) {
    e.flash = 0.14; setSt(e, 'hurt'); e.vx = (dirX || 1) * 80; e.climb = null; e.aiming = false; chip.sfx('clang');
    sparks(e.x, hy, 4, '#ffffff');
    return false;
  }
  setSt(e, 'dead'); e.deadT = 0; e.climb = null; e.aiming = false; e.evade = 0;
  e.ground = false; e.vy = e.kind === 'dog' ? -90 : -110; e.vx = (dirX || 1) * (how === 'thrust' ? 110 : 70); e.flash = 0.1;
  chip.sfx('down');
  if (e.kind !== 'dog' && chance(0.5)) chip.voice('grunt');
  sparks(e.x, hy, 5, '#fff2c0');
  if (how === 'knife' || how === 'katana' || how === 'dive') {
    // a quick spray along the cut
    for (let i = 0; i < 4; i++) game.fx.push({ k: 'p', x: e.x, y: hy, vx: (dirX || 1) * rand(40, 130), vy: rand(-90, -10), t: 0, life: rand(0.2, 0.4), col: '#ffe9c0', sz: 1, g: 0.5 });
  }
  addScore(e.T.pts * (label ? 2 : 1), e.x, e.y - 30, true);
  if (e.drop) { spawnItem(e.drop, e.x, e.y - 14); e.drop = null; }
  game.stageStats.kills++;
  award('first');
  if (e.T.ninja) countUp('ninja', 5, 'ninja');
  if (how === 'katana') countUp('katana', 20, 'sword');
  return true;
}

/* ---- drawing --------------------------------------------------------------------------- */
function foeAnim(e) {
  const t = e.t, w = tw(0.22);
  const three = (t0, t1, end) => (t < t0 ? t / t0 : t < t1 ? 1 : 1 + Math.min(1, (t - t1) / Math.max(0.01, end - t1)));
  switch (e.st) {
    case 'dead': return ['dead', Math.min(2, e.deadT / 0.12)];
    case 'para': return ['hang', 0];
    case 'jab': return ['jab', three(w, w + 0.12, w + 0.34)];
    case 'slash': return ['slash', three(w, w + 0.13, w + 0.42)];
    case 'nthrow': return ['throw', t < tw(0.3) ? 0 : 1];
    case 'vanish': case 'appear': return ['idle', 0];
    case 'flip': return ['flip', 0];
    case 'leap': return ['fall', 0];
    case 'aim': return [e.T.pistol ? 'pistol' : 'aim', 0];
    case 'throw': return ['throw', t < tw(0.38) ? 0 : 1];
    case 'kneel': return ['mg', 0];
    case 'snipe': return ['snipe', 0];
    case 'kick': return ['kick', Math.min(1, t / 0.08)];
    case 'recover': return ['idle', 0];
    case 'climb': return ['climb', t / 0.13];
    case 'fall': return ['fall', 0];
    case 'hurt': return ['fall', 0];
    default: return Math.abs(e.vx) > 4 ? ['run', e.dist / 6] : ['idle', game.t * 1.6 + e.id];
  }
}

/** A four point glint: the warning that an attack is about to land. */
function drawGlint(g, x, y, s, col) {
  drawGlow(g, x, y, s * 2.4, col, 0.8);
  g.fillStyle = '#ffffff';
  g.beginPath();
  g.moveTo(x - s, y); g.lineTo(x - s * 0.16, y - s * 0.16); g.lineTo(x, y - s); g.lineTo(x + s * 0.16, y - s * 0.16);
  g.lineTo(x + s, y); g.lineTo(x + s * 0.16, y + s * 0.16); g.lineTo(x, y + s); g.lineTo(x - s * 0.16, y + s * 0.16);
  g.closePath(); g.fill();
}

function drawFoe(g, e, cx) {
  const sx = e.x - cx, sy = e.y;
  if (sx < -50 || sx > W + 50) return;
  const fl = e.flash > 0;
  let alpha = 1;
  if (e.st === 'dead' && e.deadT > 0.85) alpha = clamp(1 - (e.deadT - 0.85) / 0.5, 0, 1);
  if (e.kind === 'dog') {
    drawDogV(g, sx, sy, e.face, e.dist / 5, !e.ground && e.st !== 'dead', e.st === 'dead', fl, alpha);
    return;
  }
  if (e.T.ninja) {
    if (e.st === 'vanish') alpha = clamp(1 - e.t / 0.16, 0, 1);
    else if (e.st === 'appear') alpha = clamp(e.t / 0.2, 0, 1);
    if (alpha <= 0.02) return;
  }
  if (e.st === 'para') drawChuteV(g, sx, sy, e.t);
  const [anim, fr] = foeAnim(e);
  const spin = e.st === 'flip' ? -e.face * Math.min(1, e.t / 0.5) * TAU : 0;
  const tint = e.burn > 0 && e.st === 'dead' ? '#3a2a22' : fl;
  spinDraw(g, sx, sy, spin, () => drawSprite(g, e.kind, anim, fr, e.face, sx, sy, tint, alpha));
  if (e.st === 'dead') return;
  if (e.drop && Math.floor(game.t * 3) % 2 === 0) drawGlint(g, sx - e.face * 2, sy - 38, 3, '#ffe27a');
  // warnings
  const w = tw(0.22);
  if (e.st === 'aim' && !e.fired && e.t > tw(0.45) - 0.2) drawGlint(g, sx + e.face * 15, sy - 21, 3.2, '#ff6a4a');
  else if (e.st === 'kneel' && e.shotN === 0 && e.t > tw(0.5) - 0.2) drawGlint(g, sx + e.face * 15, sy - 11, 3.2, '#ff6a4a');
  else if ((e.st === 'jab' || e.st === 'slash') && e.t < w && e.t > w - 0.16) drawGlint(g, sx + e.face * 8, sy - (e.st === 'slash' ? 27 : 17), 3, '#ffffff');
  else if (e.st === 'appear') drawGlint(g, sx + e.face * 2, sy - 23, 2.4, '#ff3a3a');
  else if (e.st === 'throw' && !e.fired) drawGlint(g, sx - e.face * 5, sy - 31, 2.2, '#ff6a4a');
  if (e.st === 'snipe' && e.aiming) {
    const mx = sx + e.face * 15, my = sy - 12, tx = e.ax - cx, ty = e.ay;
    const locked = e.aimT >= tw(0.55);
    if (!locked || Math.floor(game.t * 30) % 2) {
      g.strokeStyle = lgrad(g, mx, my, tx, ty, [[0, 'rgba(255,60,50,0.1)'], [1, locked ? 'rgba(255,60,50,0.95)' : 'rgba(255,130,100,0.7)']]);
      g.lineWidth = locked ? 0.9 : 0.5; g.beginPath(); g.moveTo(mx, my); g.lineTo(tx, ty); g.stroke();
      drawGlow(g, tx, ty, locked ? 6 : 4, '#ff3a2a', 0.9); disc(g, tx, ty, locked ? 1.3 : 0.9, '#ffffff');
    }
  }
}

/* ==========================================================================
   Entities, part three: projectiles, props, pickups, effects and hit tests
   ========================================================================== */

function lob(k, x, y, tx, ty, T, mark) {
  const vx = (tx - x) / T;
  const vy = (ty - y - 0.5 * GRAV * T * T) / T;
  game.shots.push({ k, x, y, vx, vy, t: 0, foe: true, mx: tx, my: ty, mark, spin: 0 });
}

function updateShots(dt) {
  const h = game.hero;
  const hb = heroHurt(h);
  for (const s of game.shots) {
    if (s.gone) continue;
    s.t += dt;
    const y0 = s.y;
    if (s.k === 'rocket') {
      s.vx = approach(s.vx, s.f * 390, 760 * dt);
      s.smoke -= dt;
      if (s.smoke <= 0) { s.smoke = 0.03; puff(s.x - s.f * 6, s.y + rand(-1, 1), 1, '#bdbdbd'); }
    }
    if (s.k === 'flame') { s.vx *= 1 - 2.2 * dt; s.vy -= 30 * dt; if (s.t > s.life) { s.gone = true; continue; } }
    const ballistic = s.k === 'hgren' || s.k === 'egren' || s.k === 'shell' || s.k === 'rock' || s.k === 'bomb';
    if (ballistic) s.vy += GRAV * (s.g || 1) * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.k === 'wave') { s.dist += Math.abs(s.vx * dt); if (s.dist > s.max) s.gone = true; }
    if (ballistic && s.vy > 0) {
      const ly = landY(s.x, y0, s.y, null);
      if (ly !== null && (!s.mark || ly >= GROUND_Y - 0.5 || Math.abs(ly - s.my) < 3)) { s.y = ly; detonate(s); continue; }
    }
    if (s.x < game.camX - 40 || s.x > game.camX + W + 40 || s.y > H + 20 || s.y < -80 || s.t > 5) { s.gone = true; continue; }

    if (s.foe) {
      if (h.dead) continue;
      const sb = shotBox(s);
      if (boxHit(sb, hb)) {
        if (heroDodging(h)) { dodgeCredit(h); continue; }
        if (ballistic) { s.hitHero = true; detonate(s); }
        else if (s.k === 'wave') hurtHero(h, sgn(s.vx), 'wave');
        else { s.gone = true; hurtHero(h, sgn(s.vx), s.k === 'star' ? 'star' : s.aimed ? 'bullet-aimed' : s.y < h.y - 16 ? 'bullet-high' : 'bullet-low'); sparks(s.x, s.y, 3, '#fff2a0'); }
      }
      continue;
    }
    // hero projectiles
    const sb = shotBox(s);
    const dirX = sgn(s.vx) || 1;
    let hit = false;
    for (const e of game.foes) {
      if (e.st === 'dead' || e.gone || foeGhost(e)) continue;
      if (!boxHit(sb, foeBox(e))) continue;
      if (s.k === 'flame') { if (!s.hits.includes(e.id)) { s.hits.push(e.id); killFoe(e, 'flame', dirX, 1); } continue; }
      if (s.k === 'star') {
        if (s.hits.includes(e.id)) continue;
        s.hits.push(e.id); killFoe(e, 'star', dirX, 1);
        if (s.pierce-- <= 0) { s.gone = true; hit = true; break; }
        continue;
      }
      if (s.k === 'tknife') { killFoe(e, 'tknife', dirX, 2); s.gone = true; hit = true; break; }
      if (s.k === 'bullet') { killFoe(e, 'reflect', dirX, 1); s.gone = true; hit = true; break; }
      detonate(s); hit = true; break;
    }
    if (hit || s.gone) continue;
    if (game.boss && !game.boss.dead) {
      if (s.k === 'flame') { if (!s.bossHit && game.boss.shotHit(s, sb)) s.bossHit = true; }
      else if (game.boss.shotHit(s, sb)) { if (s.k === 'tknife' || s.k === 'star' || s.k === 'bullet') s.gone = true; else detonate(s); continue; }
    }
    for (const p of game.props) {
      if (p.gone || !propSolid(p)) continue;
      if (!boxHit(sb, propBox(p))) continue;
      if (s.k === 'flame') { if (p.t === 'barrel' || p.t === 'crate') hitProp(p, 'knife'); continue; }
      if (s.k === 'tknife' || s.k === 'star' || s.k === 'bullet') { hitProp(p, 'knife'); s.gone = true; } else detonate(s);
      break;
    }
  }
  game.shots = game.shots.filter((s) => !s.gone);
}

function shotBox(s) {
  switch (s.k) {
    case 'bullet': return s.aimed ? box(s.x - 1.5, s.y - 1.5, s.x + 1.5, s.y + 1.5) : box(s.x - 2, s.y - 1, s.x + 2, s.y + 1);
    case 'tknife': return box(s.x - 3, s.y - 2, s.x + 3, s.y + 2);
    case 'star': return box(s.x - 3, s.y - 2.5, s.x + 3, s.y + 2.5);
    case 'rocket': return box(s.x - 4, s.y - 2, s.x + 4, s.y + 2);
    case 'wave': return box(s.x - 5, s.y - 9, s.x + 5, s.y);
    case 'rock': return box(s.x - 4, s.y - 4, s.x + 4, s.y + 4);
    case 'shell': return box(s.x - 3, s.y - 3, s.x + 3, s.y + 3);
    case 'flame': { const r = 3 + (s.t / s.life) * 6; return box(s.x - r, s.y - r, s.x + r, s.y + r); }
    default: return box(s.x - 2, s.y - 2, s.x + 2, s.y + 2);
  }
}

function detonate(s) {
  if (s.gone) return;
  s.gone = true;
  switch (s.k) {
    case 'hgren': explode(s.x, s.y - 3, 30, { foes: true, boss: 5, props: true }); break;
    case 'rocket': explode(s.x, s.y, 24, { foes: true, boss: 7, props: true }); break;
    case 'egren': explode(s.x, s.y - 3, 18, { hero: true, src: 'grenade' }); break;
    case 'shell': explode(s.x, s.y - 4, 24, { hero: true, src: 'shell' }); break;
    case 'bomb': explode(s.x, s.y - 4, 22, { hero: true, src: 'bomb' }); break;
    case 'rock':
      explode(s.x, s.y - 3, 15, { hero: true, small: true, src: 'rock' });
      for (let i = 0; i < 6; i++) game.fx.push({ k: 'p', x: s.x, y: s.y - 3, vx: rand(-90, 90), vy: rand(-160, -60), t: 0, life: 0.6, col: '#7a5a3a', sz: 2, g: 1, chunk: true });
      break;
    default: break;
  }
}

function explode(x, y, r, o) {
  game.fx.push({ k: 'boom', x, y, r, t: 0 });
  for (let i = 0; i < Math.round(r / 3); i++) {
    const a = rand(0, TAU), v = rand(30, 150);
    game.fx.push({ k: 'p', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, t: 0, life: rand(0.3, 0.7), col: pick(['#ffd34a', '#ff8a2a', '#ffffff', '#ffe9a0']), sz: pick([1, 1.6]), g: 0.6, glow: i % 3 === 0 });
  }
  chip.sfx('boom', { big: r > 28 });
  addShake(r > 28 ? 5 : o.small ? 2 : 3);
  game.boomLight = Math.max(game.boomLight || 0, r > 28 ? 0.22 : 0.12);
  if (o.foes) {
    let n = 0;
    for (const e of game.foes) if (e.st !== 'dead' && !foeGhost(e) && distBox(foeBox(e), x, y) < r && killFoe(e, 'boom', sgn(e.x - x) || 1, 3)) n++;
    if (n >= 3) award('demo');
  }
  if (o.boss && game.boss && !game.boss.dead) game.boss.blast(x, y, r, o.boss);
  if (o.props !== false) for (const p of game.props) if (!p.gone && propSolid(p) && distBox(propBox(p), x, y) < r) hitProp(p, 'boom');
  if (o.hero) {
    const h = game.hero;
    if (!h.dead && distBox(heroHurt(h), x, y) < r * 0.72) hurtHero(h, sgn(h.x - x) || 1, 'boom-' + (o.src || 'prop'));
  }
}

/* ---- props: crates, barrels, cages, mines --------------------------------------- */
function makeProp(p) {
  const o = Object.assign({}, p);
  o.y = p.t === 'mine' ? GROUND_Y : LV_Y[p.lv || 0];
  o.gone = false; o.fuse = -1; o.open = false; o.tm = 0;
  return o;
}
function propSolid(p) { return !p.gone && !(p.t === 'cage' && p.open) && !(p.t === 'crate' && p.broken); }
function propBox(p) {
  switch (p.t) {
    case 'crate': return box(p.x - 8, p.y - 14, p.x + 8, p.y);
    case 'barrel': return box(p.x - 6, p.y - 16, p.x + 6, p.y);
    case 'cage': return box(p.x - 12, p.y - 34, p.x + 12, p.y);
    case 'mine': return box(p.x - 4, p.y - 3, p.x + 4, p.y);
    default: return box(p.x, p.y, p.x, p.y);
  }
}
function hitProp(p, how) {
  if (!propSolid(p)) return;
  if (p.t === 'crate') {
    p.broken = true; p.t2 = 0;
    chip.sfx('crate');
    for (let i = 0; i < 10; i++) game.fx.push({ k: 'p', x: p.x + rand(-6, 6), y: p.y - 7, vx: rand(-90, 90), vy: rand(-180, -60), t: 0, life: 0.75, col: pick(['#9b6a36', '#c38c4f', '#7a5027']), sz: rand(1.6, 3), g: 1, chunk: true });
    dust(p.x, p.y - 2, 5);
    addScore(100, p.x, p.y - 20, false);
    if (p.item) spawnItem(p.item, p.x, p.y - 8);
  } else if (p.t === 'barrel') {
    if (how === 'boom') p.fuse = Math.min(p.fuse < 0 ? 0.12 : p.fuse, 0.12);
    else if (p.fuse < 0) { p.fuse = 0.6; chip.sfx('clang'); }
  } else if (p.t === 'cage') {
    if (how === 'boom') return;
    p.open = true; p.tm = 0;
    chip.sfx('free'); chip.sfx('clang');
    sparks(p.x + 9, p.y - 17, 6, '#ffe27a');
    game.caps.push({ x: p.x, y: p.y, st: 'salute', t: 0, face: game.hero.x < p.x ? -1 : 1, item: p.item, dist: 0 });
    game.stageStats.captives++;
    addScore(1000, p.x, p.y - 40, false);
  } else if (p.t === 'mine') {
    if (p.fuse < 0) p.fuse = how === 'boom' ? 0.08 : 0.16;
  }
}

function updateProps(dt) {
  const h = game.hero;
  for (const p of game.props) {
    if (p.gone) continue;
    p.tm += dt;
    if (p.t2 !== undefined) p.t2 += dt;
    if (p.fuse >= 0) {
      p.fuse -= dt;
      if (p.fuse <= 0) {
        p.gone = true;
        if (p.t === 'barrel') explode(p.x, p.y - 8, 34, { foes: true, hero: true, boss: 6, props: true });
        else explode(p.x, p.y - 2, 22, { foes: true, hero: true, props: true });
      }
    }
    if (p.t === 'mine' && p.fuse < 0 && !h.dead && h.ground && !heroDodging(h) && Math.abs(h.y - p.y) < 1 && Math.abs(h.x - p.x) < 7) { p.fuse = 0.18; chip.sfx('tick'); }
  }
  for (const c of game.caps) {
    c.t += dt;
    if (c.st === 'salute' && c.t > 0.9) {
      c.st = 'run'; c.t = 0;
      if (c.item) { spawnItem(c.item, c.x + c.face * 6, c.y - 16); c.item = null; }
      pop(c.x, c.y - 44, 'THANKS!', '#9fe8ff');
      chip.voice('thanks');
      c.face = c.x - game.camX > W / 2 ? 1 : -1;
    } else if (c.st === 'run') {
      c.x += c.face * 84 * dt; c.dist += 84 * dt;
      if (!onScreen(c.x, 30)) c.gone = true;
    }
  }
  game.caps = game.caps.filter((c) => !c.gone);
}

function drawProp(g, p, cx, front) {
  const x = p.x - cx, y = p.y;
  if (p.gone || x < -30 || x > W + 30) return;
  switch (p.t) {
    case 'crate': if (!front && !p.broken) drawCrateV(g, x, y); break;
    case 'barrel': if (!front) drawBarrelV(g, x, y, p.fuse >= 0 && Math.floor(p.fuse * 24) % 2 === 0); break;
    case 'cage':
      if (!front) { drawCageBackV(g, x, y); if (!p.open) drawSprite(g, 'captive', 'tied', game.t * 1.5 + p.x, -1, x, y - 2); }
      else drawCageFrontV(g, x, y, p.open);
      break;
    case 'mine': if (!front) drawMineV(g, x, y, p.fuse >= 0); break;
    default: break;
  }
}

function drawCaptive(g, c, cx) {
  if (c.st === 'salute') drawSprite(g, 'captive', 'salute', 0, c.face, c.x - cx, c.y);
  else drawSprite(g, 'captive', 'run', c.dist / 6, c.face, c.x - cx, c.y);
}

/* ---- pickups ------------------------------------------------------------------- */
function spawnItem(type, x, y) {
  game.items.push({ type, x, y, vx: rand(-25, 25), vy: -140, ground: false, t: 0, dropY: null, climb: null });
}
function updateItems(dt) {
  const h = game.hero;
  const hb = heroHurt(h);
  for (const it of game.items) {
    it.t += dt;
    if (!it.ground) { actorPhys(it, dt); if (it.ground) it.vx = 0; }
    if (it.t > 9) it.gone = true;
    if (!h.dead && it.t > 0.25 && boxHit(box(it.x - 7, it.y - 13, it.x + 7, it.y), box(hb.x0 - 3, hb.y0 - 3, hb.x1 + 3, hb.y1 + 3))) {
      it.gone = true;

}
function collect(it) {
  const h = game.hero, P = PICKUPS[it.type];

  if (AMMO_CAP[it.type]) {

    else { h.wpn = it.type; h.ammo = P.ammo; if (h.act && h.act.type === 'flame') h.act = null; }

  } else if (it.type === 'katana') {

    pop(h.x, h.y - 40, P.label, P.color);

  } else if (it.type === 'medal') {

  } else if (it.type === 'ration') {

  } else if (it.type === 'life') {
    game.lives = Math.min(9, game.lives + 1);

}
function drawItem(g, it, cx) {
  if (it.t > 6 && Math.floor(it.t * 10) % 2) return;

/* ---- effects --------------------------------------------------------------------- */
function puff(x, y, n, col) {

}
function dust(x, y, n) {
  for (let i = 0; i < n; i++) game.fx.push({ k: 'smoke', x: x + rand(-4, 4), y: y - 1, vx: rand(-22, 22), vy: rand(-12, -2), t: 0, life: 0.35, col: game.dustCol || '#d8c8a8', r: rand(1, 2) });
}
function sparks(x, y, n, col) {
  game.fx.push({ k: 'star', x, y, t: 0, life: 0.12, col });
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(50, 130);

  }

function muzzle(x, y) { game.fx.push({ k: 'flash', x, y, t: 0, life: 0.06 }); }
function pop(x, y, str, col) {
  for (const q of game.pops) if (q.t < 0.5 && Math.abs(q.x - x) < 40 && Math.abs(q.y - y) < 8) y = Math.min(y, q.y - 9);
  game.pops.push({ x, y, str, col: col || '#ffffff', t: 0 });
}
function addShake(a) { if (settings.shake) game.shake = Math.max(game.shake, a); }

function updateFx(dt) {
  for (const f of game.fx) {
    f.t += dt;
    if (f.k === 'p') { f.vy += GRAV * (f.g || 0) * dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.t > f.life) f.gone = true; }
    else if (f.k === 'smoke') { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.96; if (f.t > f.life) f.gone = true; }
    else if (f.k === 'boom') { if (f.t > 0.5) f.gone = true; }
    else if (f.t > (f.life || 0.5)) f.gone = true;
  }
  game.fx = game.fx.filter((f) => !f.gone);
  if (game.fx.length > 420) game.fx.splice(0, game.fx.length - 420);

  game.pops = game.pops.filter((p) => p.t < 1.1);
  game.boomLight = Math.max(0, (game.boomLight || 0) - dt);
}

function drawPops(g, cx) {
  for (const p of game.pops) {

    drawText(g, p.str, p.x - cx, p.y - (s - 1) * 4, p.col, { align: 'center', scale: s, weight: 700, stroke: 'rgba(8,8,14,0.85)', strokeW: 1.5 });
    g.globalAlpha = 1;
  }
}

/* ---- hit tests ---------------------------------------------------------------- */
function resolveHeroAttacks() {
  const h = game.hero;
  const kb = heroKnifeBox(h);
  if (!kb) return;
  const a = h.act, M = MELEE[a.type];
  const how = a.type === 'dive' ? 'dive' : a.kat ? 'katana' : a.type === 'thrust' ? 'thrust' : 'knife';
  let pogo = false;
  for (const e of game.foes) {
    if (e.st === 'dead' || e.gone || a.hits.includes(e.id) || foeGhost(e)) continue;
    if (!boxHit(kb, foeBox(e))) continue;
    a.hits.push(e.id);
    const back = e.kind !== 'dog' && e.st !== 'hurt' && e.face === (e.x >= h.x ? 1 : -1);
    const counter = h.counterT > 0;
    const label = counter ? 'COUNTER!' : back ? 'BACKSTAB!' : chance(0.1) ? 'CRITICAL!' : null;
    const dmg = (M.dmg + (a.kat ? 1 : 0)) * (label ? 2 : 1);
    const killed = killFoe(e, how === 'thrust' && a.kat ? 'katana' : how, h.face, dmg, label);
    game.hitStop = Math.max(game.hitStop || 0, killed ? (label ? 0.075 : 0.035) : 0.02);
    if (label) addShake(2.5);
    if (counter) { h.counterT = 0; game.slowT = Math.max(game.slowT, 0.28); }
    if (a.type === 'dive') pogo = true;
  }
  for (const p of game.props) {
    if (!propSolid(p) || p.t === 'mine' || a.hits.includes(p)) continue;
    if (boxHit(kb, propBox(p))) { a.hits.push(p); hitProp(p, 'knife'); }
  }
  for (const s of game.shots) {
    if (!s.foe || (s.k !== 'bullet' && s.k !== 'star') || s.gone) continue;
    if (!boxHit(kb, box(s.x - 3, s.y - 3, s.x + 3, s.y + 3))) continue;
    chip.sfx('tink'); sparks(s.x, s.y, 4, '#ffe27a');
    if (a.kat) {
      // the long blade sends it straight back
      s.foe = false; s.mine = true; s.aimed = false; s.vx = -s.vx * 1.5; s.vy = -s.vy * 1.5; s.t = 0; s.pierce = 0; s.hits = [];
      addScore(100, s.x, s.y - 10, false, true); pop(s.x, s.y - 12, 'REFLECT 100', '#bfe9ff');
    } else {
      s.gone = true;
      addScore(50, s.x, s.y - 10, false, true); pop(s.x, s.y - 12, 'PARRY 50', '#9fe8ff');
    }
    game.stageStats.parries++;
    countUp('parry', 10, 'parry');
  }
  const b = game.boss;
  if (b && !b.dead && !a.bossHit && b.st !== 'enter') {
    const counter = h.counterT > 0;
    const crit = counter || chance(0.1);
    const dmg = (M.dmg + (a.kat && a.type === 'thrust' ? 1 : 0)) * (crit ? 2 : 1);
    const hp0 = b.hp;
    if (b.knife(kb, dmg)) {
      a.bossHit = true;
      if (b.hp < hp0) {
        game.hitStop = Math.max(game.hitStop || 0, crit ? 0.07 : 0.03);
        if (crit) { pop((kb.x0 + kb.x1) / 2, kb.y0 - 8, counter ? 'COUNTER!' : 'CRITICAL!', counter ? '#9fe8ff' : '#ffd27a'); chip.sfx('crit'); game.stageStats.crits++; if (counter) { h.counterT = 0; award('counter'); } }
        if (b.dead) finisher(b, h);
        if (a.type === 'dive') pogo = true;
      }
    }
  }
  if (pogo) {
    // bounce off the target and stay airborne
    h.act = null; h.vy = -205; h.airJumps = 1; h.airDash = false; h.flipT = 0; h.jumpCut = true; h.ground = false;
    h.pogo++;
    chip.sfx('jump2');
    if (h.pogo >= 3) award('dive');
  }
}

/** The blow that drops a boss: slow motion, a cross of light and a bonus. */
function finisher(b, h) {
  game.slowT = Math.max(game.slowT, 1.3);
  const x = (b.kind === 'ironclad' ? b.x + 15 : b.x), y = b.kind === 'ironclad' ? b.y - 26 : b.kind === 'gunship' ? b.y : b.y - 24;
  for (const [a0, a1, f] of [[-2.2, 0.9, 1], [-2.2, 0.9, -1]]) game.fx.push({ k: 'slash', x, y, face: f, r: 34, a0, a1, col: '#ffffff', t: 0, life: 0.5 });
  game.fx.push({ k: 'ring', x, y, t: 0, life: 0.6, r0: 6, r1: 60, col: '#fff2c8', w: 2 });
  pop(h.x, h.y - 52, 'FINISHING BLOW +5000', '#ffd27a');
  addScore(5000, 0, 0, false, true);
  chip.sfx('finisher'); chip.voice('kiai');
  game.stageStats.finishers++;
}

function resolveFoeAttacks() {
  const h = game.hero;
  if (h.dead || h.inv > 0) return;
  const hb = heroHurt(h);
  const dodge = heroDodging(h);
  for (const e of game.foes) {
    const ab = foeAttackBox(e);
    if (!ab || !boxHit(ab, hb)) continue;
    if (dodge) { if (e.kind !== 'dog' || !e.ground) dodgeCredit(h); continue; }
    hurtHero(h, e.face, e.st + ':' + e.kind);
    return;
  }
  const b = game.boss;
  if (b && !b.dead && b.touches(hb)) {
    if (dodge) dodgeCredit(h);
    else hurtHero(h, sgn(h.x - b.x) || -1, 'boss-' + b.kind + ':' + b.st);
  }
}

/* ==========================================================================
   Bosses: MAULER, IRONCLAD, SKY HAMMER, GENERAL KROME
   Each boss exposes update, draw, knife, shotHit, blast, touches. The art is in 56_bossart.js.
   ========================================================================== */

const BOSS_NAMES = { mauler: 'MAULER', ironclad: 'IRONCLAD', gunship: 'SKY HAMMER', krome: 'GENERAL KROME' };
const BOSS_POINTS = { mauler: 10000, ironclad: 20000, gunship: 30000, krome: 50000 };

function makeBoss(kind) {
  const ax = game.camX;
  const b = { kind, name: BOSS_NAMES[kind], st: 'enter', t: 0, flash: 0, dead: false, deathT: 0, face: -1, ax, hitCD: 0, phase: 1 };
  const mul = (game.loop > 1 ? 1.3 : 1) * game.diff.bossHp;
  if (kind === 'mauler') Object.assign(b, { x: ax + W + 40, y: GROUND_Y, vx: 0, vy: 0, hp: Math.round(36 * mul) }, MAULER);
  if (kind === 'ironclad') Object.assign(b, { x: ax + W + 10, y: GROUND_Y, hp: Math.round(40 * mul), open: 0, turretA: -2.3, recoil: 0, wheel: 0, lid: 0, seq: 0 }, IRONCLAD);
  if (kind === 'gunship') Object.assign(b, { x: ax + W + 90, y: 62, vx: 0, vy: 0, hp: Math.round(40 * mul), rot: 0, seq: 0, tilt: 0 }, GUNSHIP);
  if (kind === 'krome') Object.assign(b, { x: ax + W + 24, y: GROUND_Y, vx: 0, vy: 0, ground: true, climb: null, dropY: null, hp: Math.round(44 * mul), combo: 0, calls: 0, recentHits: [] }, KROME);
  b.max = b.hp;
  return b;
}

function bossDamage(b, dmg, x, y, quiet) {
  if (b.dead || b.st === 'enter') return false;
  b.hp -= dmg; b.flash = 0.09; b.hurtAt = game.t;
  if (!quiet) { sparks(x, y, 4, '#ffffff'); chip.sfx('hit'); }
  addScore(10 * dmg, 0, 0, false, true);
  if (b.hp <= 0) { b.hp = 0; b.dead = true; b.deathT = 0; b.st = 'dying'; b.t = 0; onBossDown(b); }
  else if (b.phase === 1 && b.hp <= b.max / 2) { b.phase = 2; game.flashT = 0.1; addShake(4); if (b.onPhase) b.onPhase(); }
  return true;
}

/* generic helpers for the hit tests every boss shares */
function bossKnifeOn(b, kb, boxes, dmg) {
  for (const z of boxes) {
    if (!boxHit(kb, z.b)) continue;
    if (z.armor) { chip.sfx('clang'); sparks((Math.max(kb.x0, z.b.x0) + Math.min(kb.x1, z.b.x1)) / 2, (kb.y0 + kb.y1) / 2, 3, '#ffe27a'); return true; }
    bossDamage(b, (dmg || 1) * (z.mul || 1), (Math.max(kb.x0, z.b.x0) + Math.min(kb.x1, z.b.x1)) / 2, (kb.y0 + kb.y1) / 2);
    return true;
  }
  return false;
}
function bossShotOn(b, s, sb, boxes) {
  for (const z of boxes) {
    if (!boxHit(sb, z.b)) continue;
    if (s.k === 'flame') { if (!z.armor) bossDamage(b, 0.25 * (z.mul || 1), s.x, s.y, true); else continue; }
    else if (s.k === 'tknife' || s.k === 'star' || s.k === 'bullet') {
      if (z.armor) { chip.sfx('tink'); sparks(s.x, s.y, 2, '#ffe27a'); }
      else bossDamage(b, (s.k === 'tknife' ? 2 : 1) * (z.mul || 1), s.x, s.y);
    }
    return true;
  }
  return false;
}
function bossBlastOn(b, x, y, r, dmg, boxes) {
  let best = null;
  for (const z of boxes) { const d = distBox(z.b, x, y); if (d < r && (!best || d < best.d)) best = { d, z }; }
  if (!best) return;
  bossDamage(b, best.z.armor ? 1 : dmg * (best.z.mul || 1), x, y, true);
}

/* ---- MAULER: a giant with a club ------------------------------------------------ */
const MAULER = {
  boxes() {
    if (this.dead) return [];
    if (this.st === 'charge') return [{ b: box(this.x - 11, this.y - 34, this.x + 11, this.y) }];
    return [{ b: box(this.x - 12, this.y - 50, this.x + 12, this.y - 1) }];
  },
  knife(kb, dmg) { return bossKnifeOn(this, kb, this.boxes(), dmg); },
  shotHit(s, sb) { return bossShotOn(this, s, sb, this.boxes()); },
  blast(x, y, r, d) { bossBlastOn(this, x, y, r, d, this.boxes()); },
  touches(hb) {
    if (this.dead || this.st === 'stun' || this.st === 'enter') return false;
    if (this.st === 'smash' && this.t < 0.12) {
      const f = this.face, z = f > 0 ? box(this.x + 6, this.y - 36, this.x + 44, this.y) : box(this.x - 44, this.y - 36, this.x - 6, this.y);
      if (boxHit(z, hb)) return true;
    }
    const body = this.st === 'charge' ? box(this.x - 10, this.y - 30, this.x + 10, this.y) : box(this.x - 9, this.y - 46, this.x + 9, this.y);
    return boxHit(body, hb);
  },
  onPhase() { chip.sfx('roar'); pop(this.x, this.y - 64, 'RAAAGH!', '#ff8a6a'); },
  update(dt) {
    const h = game.hero;
    this.t += dt; this.flash = Math.max(0, this.flash - dt);
    const left = this.ax + 22, right = this.ax + W - 22;
    const dx = h.x - this.x, adx = Math.abs(dx), toward = dx >= 0 ? 1 : -1;
    const p2 = this.phase === 2;
    switch (this.st) {
      case 'enter':
        this.face = -1; this.vx = -40;
        if (this.x <= this.ax + W - 80) { this.vx = 0; this.st = 'roar'; this.t = 0; chip.sfx('roar'); addShake(5); }
        break;
      case 'roar':
        this.vx = 0;
        if (this.t > 1.0) { this.st = 'walk'; this.t = 0; }
        break;
      case 'walk':
        this.face = toward;
        this.vx = adx > 30 ? toward * (p2 ? 50 : 36) : 0;
        if (this.t > 0.5 && adx < 46) { this.st = 'raise'; this.t = 0; }
        else if (this.t > (p2 ? 1.2 : 1.8)) {
          const r = Math.random();
          if (p2 && r < 0.4 && adx > 70) { this.st = 'prep'; this.t = 0; chip.sfx('roar'); }
          else if (r < 0.75 && adx > 60) { this.st = 'throw'; this.t = 0; this.rocks = p2 ? 2 : 1; }
          else { this.st = 'raise'; this.t = 0; }
        }
        break;
      case 'raise':
        this.vx = 0;
        if (this.t > (p2 ? 0.42 : 0.55)) {
          this.st = 'smash'; this.t = 0;
          addShake(5); chip.sfx('boom'); dust(this.x + this.face * 26, GROUND_Y, 8);
          const ix = this.x + this.face * 26;
          for (const d of [-1, 1]) game.shots.push({ k: 'wave', x: ix + d * 8, y: GROUND_Y, vx: d * (p2 ? 175 : 150), vy: 0, t: 0, foe: true, dist: 0, max: 330 });
        }
        break;
      case 'smash':
        this.vx = 0;
        if (this.t > 0.65) { this.st = 'walk'; this.t = 0; }
        break;
      case 'throw':
        this.vx = 0; this.face = toward;
        if (this.t > 0.55 && this.rocks > 0) {
          this.rocks--; this.t = 0.3;
          lob('rock', this.x + this.face * 4, this.y - 58, h.x + (this.rocks ? rand(-50, 50) : 0), GROUND_Y, 0.85, true);
          chip.sfx('throw');
        } else if (this.t > 0.55 && this.rocks <= 0) { this.st = 'walk'; this.t = 0; }
        break;
      case 'prep':
        this.vx = 0; this.face = toward;
        if (Math.floor(this.t * 10) % 3 === 0) dust(this.x - this.face * 8, GROUND_Y, 1);
        if (this.t > 0.75) { this.st = 'charge'; this.t = 0; }
        break;
      case 'charge':
        this.vx = this.face * 168;
        if (Math.floor(this.t * 20) % 2 === 0) dust(this.x - this.face * 10, GROUND_Y, 1);
        if ((this.face > 0 && this.x >= right) || (this.face < 0 && this.x <= left)) {
          this.x = clamp(this.x, left, right); this.vx = 0; this.st = 'stun'; this.t = 0;
          addShake(7); chip.sfx('boom', { big: true }); dust(this.x + this.face * 12, GROUND_Y, 10);
        }
        break;
      case 'stun':
        this.vx = 0;
        if (this.t > 1.7) { this.st = 'walk'; this.t = 0; }
        break;
      case 'dying':
        this.vx = 0;
        break;
      default: break;
    }
    this.x += this.vx * dt;
    if (this.st !== 'charge' && this.st !== 'enter') this.x = clamp(this.x, left, right);
    if (this.vx) this.dist = (this.dist || 0) + Math.abs(this.vx) * dt;
  },
  draw(g, cx) { drawMauler(this, g, cx); }
};

/* ---- IRONCLAD: armoured cannon car that rolls out of the tunnel ---------------- */
const IRONCLAD = {
  front() { return this.x; },
  hatchBox() { return box(this.x + 4, this.y - 36, this.x + 26, this.y - 16); },
  boxes() {
    if (this.dead) return [];
    const z = [];
    z.push({ b: this.hatchBox(), armor: this.open < 0.7, mul: 1 });
    z.push({ b: box(this.x, this.y - 60, this.x + 190, this.y - 6), armor: true });
    return z;
  },
  knife(kb, dmg) { return bossKnifeOn(this, kb, this.boxes(), dmg); },
  shotHit(s, sb) { return bossShotOn(this, s, sb, this.boxes()); },
  blast(x, y, r, d) { bossBlastOn(this, x, y, r, d, this.boxes()); },
  touches() { return false; },
  onPhase() { chip.sfx('horn'); },
  update(dt) {
    const h = game.hero;
    this.t += dt; this.flash = Math.max(0, this.flash - dt);
    this.recoil = Math.max(0, this.recoil - dt * 4);
    const p2 = this.phase === 2;
    const stopX = this.ax + 196;
    const ta = Math.atan2(-60, Math.min(-30, h.x - (this.x + 96)));
    this.turretA = approach(this.turretA, clamp(ta, -2.9, -1.75), dt * 1.6);
    if (Math.floor(game.t * 8) % 4 === 0 && Math.random() < 0.3) puff(this.x + 176, this.y - 76, 1, this.hp < this.max / 2 ? '#4a4a4a' : '#9a9a9a');
    if (this.hp < this.max / 2 && Math.random() < 0.08) puff(this.x + rand(30, 170), this.y - rand(20, 56), 1, '#3a3a3a');
    switch (this.st) {
      case 'enter':
        if (this.t < 0.05) chip.sfx('horn');
        this.x = Math.max(stopX, this.x - 70 * dt);
        this.wheel += 70 * dt;
        if (this.x <= stopX) { this.st = 'idle'; this.t = 0; addShake(3); chip.sfx('clang'); }
        break;
      case 'idle':
        if (this.t > (p2 ? 0.5 : 0.9)) {
          const order = ['cannon', 'vent', 'mg', 'deploy', 'vent', 'cannon', 'mg', 'vent'];
          this.st = order[this.seq % order.length]; this.seq++; this.t = 0; this.n = 0;
          if (this.st === 'deploy' && game.foes.filter((e) => e.st !== 'dead').length > 3) this.st = 'mg';
        }
        break;
      case 'cannon': {
        const shots = p2 ? 3 : 2;
        if (this.n < shots && this.t > 0.5 + this.n * 0.8) {
          this.n++; this.recoil = 1;
          const bx = this.x + 96 + Math.cos(this.turretA) * 26, by = this.y - 66 + Math.sin(this.turretA) * 26;
          lob('shell', bx, by, h.x + (this.n === 2 ? rand(-36, 36) : 0) + h.vx * 0.5, GROUND_Y, 1.15, true);
          chip.sfx('boom'); puff(bx, by, 4, '#bdbdbd'); addShake(2);
        }
        if (this.t > 0.6 + shots * 0.8) { this.st = 'idle'; this.t = 0; }
        break;
      }
      case 'vent':
        this.open = this.t < 0.25 ? this.t / 0.25 : this.t > 2.3 ? Math.max(0, 1 - (this.t - 2.3) / 0.25) : 1;
        if (Math.random() < 0.3) puff(this.x + 15, this.y - 38, 1, '#e8eef2');
        if (this.t < 0.02) chip.sfx('flame');
        if (this.t > 2.55) { this.open = 0; this.st = 'idle'; this.t = 0; }
        break;
      case 'mg': {
        const n = p2 ? 4 : 3;
        if (this.t < 0.5 && Math.random() < 0.5) sparks(this.x - 4, this.y - 11, 1, '#ffd34a');
        if (this.t < 0.02) chip.sfx('clang');
        if (this.n < n && this.t > 0.55 + this.n * 0.12) {
          this.n++;
          game.shots.push({ k: 'bullet', x: this.x - 6, y: this.y - 11, vx: -175, vy: 0, t: 0, foe: true });
          muzzle(this.x - 6, this.y - 11); chip.sfx('shot');
        }
        if (this.t > 0.9 + n * 0.12) { this.st = 'idle'; this.t = 0; }
        break;
      }
      case 'deploy':
        this.lid = Math.min(1, this.t / 0.3);
        if (this.n < 2 && this.t > 0.45 + this.n * 0.5) {
          this.n++;
          const e = spawnFoe('grunt', this.x + 44, this.y - 64, -1, { drop: this.n === 2 && chance(0.5) ? pick(['gren', 'tri']) : null });
          e.vx = -105; e.vy = -170; e.ground = false; e.st = 'fall'; e.dropY = null;
        }
        if (this.t > 1.7) { this.lid = 0; this.st = 'idle'; this.t = 0; }
        break;
      case 'dying':
        this.open = 1;
        if (this.t < 2.4 && Math.random() < 0.18) explode(this.x + rand(10, 180), this.y - rand(10, 60), rand(14, 26), {});
        break;
      default: break;
    }
  },
  draw(g, cx) { drawIronclad(this, g, cx); }
};

/* ---- SKY HAMMER: a gunship over the refinery helipad ------------------------------- */
const GUNSHIP = {
  boxes() {
    if (this.dead) return [];
    return [{ b: box(this.x - 30, this.y - 12, this.x + 30, this.y + 14) }];
  },
  knife(kb, dmg) { return bossKnifeOn(this, kb, this.boxes(), dmg); },
  shotHit(s, sb) { return bossShotOn(this, s, sb, this.boxes()); },
  blast(x, y, r, d) { bossBlastOn(this, x, y, r, d, this.boxes()); },
  touches() { return false; },
  onPhase() { chip.sfx('alarm'); },
  update(dt) {
    const h = game.hero;
    this.t += dt; this.flash = Math.max(0, this.flash - dt);
    const p2 = this.phase === 2;
    const L = this.ax + 46, R = this.ax + W - 46;
    if (!this.dead && Math.random() < (this.hp < this.max / 2 ? 0.25 : 0.04)) puff(this.x + this.face * -20, this.y - 6, 1, '#4a4a4a');
    const fly = (tx, ty, sp) => {
      const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy);
      if (d < 2) { this.vx = 0; this.vy = 0; return true; }
      this.vx = (dx / d) * Math.min(sp, d * 4); this.vy = (dy / d) * Math.min(sp, d * 4);
      return false;
    };
    switch (this.st) {
      case 'enter':
        this.face = -1;
        if (fly(this.ax + W - 90, 62, 110)) { this.st = 'pick'; this.t = 0; }
        break;
      case 'pick': {
        this.vx = 0; this.vy = 0;
        if (this.t > (p2 ? 0.3 : 0.6)) {
          const order = ['strafe', 'hover', 'bomb', 'strafe', 'hover'];
          this.st = order[this.seq % order.length]; this.seq++; this.t = 0; this.n = 0;
          this.tx = this.x > this.ax + W / 2 ? L : R;
          this.side = this.x > this.ax + W / 2 ? 1 : -1;
        }
        break;
      }
      case 'strafe': {
        this.face = sgn(this.tx - this.x) || this.face;
        const done = fly(this.tx, 64, p2 ? 96 : 74);
        if (this.t > 0.6 && (this.t % (p2 ? 0.6 : 0.85)) < dt && !h.dead) {
          const mx = this.x + this.face * 30, my = this.y + 7;
          const a = Math.atan2(h.y - 14 - my, h.x - mx);
          game.shots.push({ k: 'bullet', x: mx, y: my, vx: Math.cos(a) * 165, vy: Math.sin(a) * 165, t: 0, foe: true, aimed: true });
          muzzle(mx, my); chip.sfx('shot');
        }
        if (done) { this.st = 'pick'; this.t = 0; }
        break;
      }
      case 'bomb': {
        this.face = sgn(this.tx - this.x) || this.face;
        const done = fly(this.tx, 50, p2 ? 100 : 82);
        if (this.t > 0.4 && (this.t % (p2 ? 0.34 : 0.46)) < dt) { game.shots.push({ k: 'bomb', x: this.x, y: this.y + 14, vx: this.vx * 0.3, vy: 20, t: 0, foe: true }); chip.sfx('throw'); }
        if (done) { this.st = 'pick'; this.t = 0; }
        break;
      }
      case 'hover': {
        const hx = this.side > 0 ? this.ax + W - 70 : this.ax + 70;
        if (this.n === 0) { this.face = -this.side; if (fly(hx, 124, 90)) { this.n = 1; this.t = 0; } }
        else {
          this.vx = 0; this.vy = Math.sin(this.t * 3) * 6;
          this.face = sgn(h.x - this.x) || this.face;
          if (this.n < 3 && this.t > 0.5 + (this.n - 1) * 0.7 && game.foes.filter((e) => e.st !== 'dead').length < 4) {
            this.n++;
            const e = spawnFoe(p2 && this.n === 3 ? 'striker' : 'grunt', this.x + rand(-6, 6), this.y + 16, this.face, { drop: this.n === 2 ? pick(['rocket', 'gren', 'rocket']) : null });
            e.st = 'fall'; e.ground = false; e.vy = 0; e.vx = 0;
          } else if (this.n < 3 && this.t > 0.5 + (this.n - 1) * 0.7) this.n++;
          if (this.t > 1.2 && (this.t % 1.1) < dt && !h.dead) {
            const mx = this.x + this.face * 30, my = this.y + 7;
            const a = Math.atan2(h.y - 14 - my, h.x - mx);
            game.shots.push({ k: 'bullet', x: mx, y: my, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, t: 0, foe: true, aimed: true });
            muzzle(mx, my); chip.sfx('shot');
          }
          if (this.t > (p2 ? 2.8 : 3.4)) { this.st = 'climb'; this.t = 0; }
        }
        break;
      }
      case 'climb':
        if (fly(this.x, 60, 80)) { this.st = 'pick'; this.t = 0; }
        break;
      case 'dying':
        if (!this.crashed) this.rot += dt * 7;
        this.vx = Math.cos(this.t * 2) * 40; this.vy = Math.min(140, (this.vy || 0) + 120 * dt);
        if (Math.random() < 0.3) puff(this.x, this.y, 2, '#3a3a3a');
        if (this.y > GROUND_Y - 14 && !this.crashed) {
          this.crashed = true; this.vy = 0; this.vx = 0;
          explode(this.x, this.y, 44, {}); explode(this.x - 20, this.y + 4, 30, {}); addShake(9); this.rot = 0.22;
        }
        if (this.crashed) { this.vx = 0; this.vy = 0; this.y = GROUND_Y - 14; }
        break;
      default: break;
    }
    this.tilt = approach(this.tilt, clamp(this.vx / 300, -0.25, 0.25), dt);
    this.x += (this.vx || 0) * dt; this.y += (this.vy || 0) * dt;
    if (!this.dead) this.x = clamp(this.x, this.ax - 120, this.ax + W + 120);
  },
  draw(g, cx) { drawGunship(this, g, cx); }
};

/* ---- GENERAL KROME: the final duel -------------------------------------------------- */
const KROME = {
  boxes() {
    if (this.dead) return [];
    if (this.st === 'dash') return [{ b: box(this.x - 7, this.y - 26, this.x + 7, this.y - 1) }];
    return [{ b: box(this.x - 6, this.y - 34, this.x + 6, this.y - 1) }];
  },
  knife(kb, dmg) {
    const r = bossKnifeOn(this, kb, this.boxes(), dmg);
    if (r && !this.dead) {
      this.recentHits = this.recentHits.filter((t) => game.t - t < 1.2);
      this.recentHits.push(game.t);
      if (this.recentHits.length >= 3 && this.ground && this.st !== 'evade') {
        this.recentHits = [];
        this.st = 'evade'; this.t = 0; this.vy = -230; this.vx = -sgn(game.hero.x - this.x) * 120; this.ground = false;
      }
    }
    return r;
  },
  shotHit(s, sb) { return bossShotOn(this, s, sb, this.boxes()); },
  blast(x, y, r, d) { bossBlastOn(this, x, y, r, d, this.boxes()); },
  touches(hb) {
    if (this.dead || this.st === 'enter') return false;
    const f = this.face;
    if (this.st === 'slash' && this.t >= 0.3 && this.t < 0.44) {
      const z = f > 0 ? box(this.x + 4, this.y - 38, this.x + 30, this.y - 6) : box(this.x - 30, this.y - 38, this.x - 4, this.y - 6);
      if (boxHit(z, hb)) return true;
    }
    if (this.st === 'dash' && this.t > 0.45) {
      const z = f > 0 ? box(this.x - 4, this.y - 24, this.x + 18, this.y - 4) : box(this.x - 18, this.y - 24, this.x + 4, this.y - 4);
      if (boxHit(z, hb)) return true;
    }
    return false;
  },
  onPhase() {
    pop(this.x, this.y - 48, 'GUARDS!', '#ff8a6a'); chip.sfx('alarm');
    spawnFoe('guard', this.ax + W + 10, GROUND_Y, -1, {});
    spawnFoe('guard', this.ax - 10, GROUND_Y, 1, {});
  },
  update(dt) {
    const h = game.hero;
    this.t += dt; this.flash = Math.max(0, this.flash - dt);
    const p2 = this.phase === 2;
    const dx = h.x - this.x, adx = Math.abs(dx), toward = dx >= 0 ? 1 : -1;
    const same = !h.climb && Math.abs(h.y - this.y) < 14;
    const sp = p2 ? 66 : 52;
    switch (this.st) {
      case 'enter':
        this.face = -1; this.vx = -60;
        if (this.x < this.ax + W - 70) { this.vx = 0; this.st = 'taunt'; this.t = 0; pop(this.x, this.y - 46, 'YOU END HERE.', '#ffd27a'); }
        break;
      case 'taunt':
        this.vx = 0;
        if (this.t > 1.2) { this.st = 'stalk'; this.t = 0; }
        break;
      case 'stalk': {
        this.face = toward;
        if (!same && this.ground && !h.climb && (h.ground || h.y > this.y)) {
          if (this.t > 0.5) { this.st = 'leap'; this.t = 0; this.leapTo(h); }
          else this.vx = 0;
          break;
        }
        this.vx = adx > 26 ? toward * sp : 0;
        if (!same) break;
        if (adx < 30 && this.t > 0.25) { this.st = 'slash'; this.t = 0; break; }
        if (this.t > (p2 ? 0.8 : 1.3)) {
          const r = Math.random();
          if (adx > 70 && r < 0.4) { this.st = 'dashPrep'; this.t = 0; }
          else if (r < 0.7) { this.st = 'shoot'; this.t = 0; this.n = 0; }
          else if (adx > 50) { this.st = 'grenade'; this.t = 0; this.n = 0; }
          else { this.st = 'slash'; this.t = 0; }
        }
        break;
      }
      case 'slash':
        this.vx = this.t > 0.28 && this.t < 0.42 ? this.face * 80 : 0;
        if (this.t > 0.3 && this.t < 0.32) chip.sfx('knife');
        if (this.t > 0.72) { this.st = 'stalk'; this.t = 0; }
        break;
      case 'dashPrep':
        this.vx = 0; this.face = toward;
        if (this.t > 0.45) { this.st = 'dash'; this.t = 0.45; this.dashFrom = this.x; chip.sfx('throw'); }
        break;
      case 'dash':
        this.vx = this.face * (p2 ? 240 : 205);
        if (Math.floor(this.t * 30) % 2) dust(this.x - this.face * 6, this.y, 1);
        if (Math.abs(this.x - this.dashFrom) > 190 || this.x < this.ax + 16 || this.x > this.ax + W - 16 || !supportAt(this.x + this.face * 6, this.y)) {
          this.vx = 0; this.st = p2 ? 'slash' : 'stalk'; this.t = 0; this.face = toward;
        }
        break;
      case 'shoot':
        this.vx = 0; this.face = toward;
        if (this.n < (p2 ? 4 : 3) && this.t > 0.35 + this.n * 0.32) {
          this.n++;
          const mx = this.x + this.face * 14, my = this.y - 24;
          game.shots.push({ k: 'bullet', x: mx, y: my, vx: this.face * 165, vy: 0, t: 0, foe: true });
          muzzle(mx, my); chip.sfx('shot');
        }
        if (this.t > 0.6 + (p2 ? 4 : 3) * 0.32) { this.st = 'stalk'; this.t = 0; }
        break;
      case 'grenade':
        this.vx = 0; this.face = toward;
        if (this.n < 2 && this.t > 0.35 + this.n * 0.45) {
          this.n++;
          const ty = h.ground || h.climb ? h.y : (landY(h.x, h.y, GROUND_Y, null) || GROUND_Y);
          lob('egren', this.x, this.y - 30, h.x + (this.n === 2 ? rand(-30, 30) : 0), ty, 0.9, true);
          chip.sfx('throw');
        }
        if (this.t > 1.3) { this.st = 'stalk'; this.t = 0; }
        break;
      case 'leap': case 'evade':
        if (this.ground && this.t > 0.1) { this.st = 'stalk'; this.t = 0; dust(this.x, this.y, 4); }
        break;
      case 'dying':
        this.vx = approach(this.vx || 0, 0, 200 * dt);
        break;
      default: break;
    }
    const wasAir = !this.ground;
    actorPhys(this, dt);
    if (wasAir && this.ground) addShake(2);
    this.x = clamp(this.x, this.ax + 10, this.ax + W - 10);
    if (this.vx && this.ground) this.dist = (this.dist || 0) + Math.abs(this.vx) * dt;
  },
  leapTo(h) {
    // jump onto the hero's level: up onto a deck, or down off one
    const ty = h.ground ? h.y : GROUND_Y;
    let tx = clamp(h.x + rand(-30, 30), this.ax + 20, this.ax + W - 20);
    if (ty < this.y) {
      const d = game.st.decks.find((k) => Math.abs(k.y - ty) < 1 && k.x1 > this.ax && k.x0 < this.ax + W);
      if (d) tx = clamp(tx, d.x0 + 10, d.x1 - 10);
      const height = this.y - ty + 18;
      this.vy = -Math.sqrt(2 * GRAV * height);
      const tUp = -this.vy / GRAV, tDown = Math.sqrt(2 * 18 / GRAV);
      this.vx = (tx - this.x) / (tUp + tDown);
    } else {
      this.dropY = this.y; this.vy = -160;
      const T = 0.9;
      this.vx = (tx - this.x) / T;
    }
    this.ground = false;
    this.face = sgn(this.vx) || this.face;
    chip.sfx('jump');
  },
  draw(g, cx) { drawKrome(this, g, cx); }
};

/* ==========================================================================
   Boss art: the brute, the armoured rail car, the gunship and the general
   ========================================================================== */

function drawMauler(b, g, cx) {
  let anim = 'idle', fr = game.t * 1.6;
  switch (b.st) {
    case 'enter': case 'walk': if (b.vx) { anim = 'run'; fr = (b.dist || 0) / 9; } break;
    case 'roar': case 'raise': case 'prep': anim = 'raise'; fr = 0; break;
    case 'smash': anim = 'smash'; fr = Math.min(1, b.t / 0.08); break;
    case 'throw': anim = 'throw'; fr = b.t < 0.5 ? 0 : 1; break;
    case 'charge': anim = 'charge'; fr = 0; break;
    case 'stun': anim = 'stun'; fr = b.t * 4; break;
    case 'dying': anim = 'dead'; fr = Math.min(2, b.deathT / 0.2); break;
    default: break;
  }
  const sx = b.x - cx;
  drawShadowV(g, cx, b.x, b.y, 16);
  if (b.st === 'charge') for (let i = 1; i <= 2; i++) drawSprite(g, 'brute', anim, fr, b.face, sx - b.face * 9 * i, b.y, '#ff6a4a', 0.3 / i);
  if (b.st === 'prep' || (b.st === 'raise' && b.phase === 2)) drawGlow(g, sx, b.y - 34, 36, '#ff4a2a', 0.35 + 0.25 * Math.sin(game.t * 24));
  drawSprite(g, 'brute', anim, fr, b.face, sx, b.y, b.flash > 0);
  if (b.st === 'throw' && b.t < 0.5) {

function drawKrome(b, g, cx) {
  let anim = 'idle', fr = game.t * 1.6;
  switch (b.st) {
    case 'enter': case 'stalk': if (b.vx) { anim = 'run'; fr = (b.dist || 0) / 7; } break;
    case 'slash': anim = 'slash'; fr = b.t < 0.3 ? b.t / 0.3 : b.t < 0.44 ? 1 : 1 + Math.min(1, (b.t - 0.44) / 0.28); break;
    case 'dashPrep': anim = 'idle'; fr = 0; break;
    case 'dash': anim = 'dash'; fr = 0; break;
    case 'shoot': anim = 'shoot'; fr = 0; break;
    case 'grenade': anim = 'throw'; fr = (b.t % 0.45) < 0.3 ? 0 : 1; break;
    case 'leap': case 'evade': anim = 'dash'; fr = 0; break;
    case 'dying': anim = b.deathT < 1.0 ? 'hurt' : 'dead'; fr = b.deathT < 1.0 ? 0 : Math.min(2, (b.deathT - 1) / 0.15); break;
    default: break;
  }
  const sx = b.x - cx;
  drawShadowV(g, cx, b.x, b.y, 10);
  if (b.st === 'dash' || b.st === 'evade' || b.st === 'leap') for (let i = 1; i <= 3; i++) drawSprite(g, 'general', anim, fr, b.face, sx - sgn(b.vx || b.face) * 8 * i, b.y, '#ff5a5a', 0.3 / i);
  drawSprite(g, 'general', anim, fr, b.face, sx, b.y, b.flash > 0);
  if (b.st === 'slash' && b.t >= 0.3 && b.t < 0.33 && !b.arcT) {
    game.fx.push({ k: 'slash', x: b.x + b.face * 4, y: b.y - 22, face: b.face, r: 30, a0: -1.9, a1: 1.0, col: '#ffd0a0', t: 0, life: 0.18 });
    b.arcT = 1;
  }
  if (b.st !== 'slash') b.arcT = 0;
  if (b.st === 'dashPrep') drawGlint(g, sx + b.face * 9, b.y - 30, 3 + b.t * 6, '#ffffff');
  if (b.st === 'slash' && b.t < 0.3 && b.t > 0.12) drawGlint(g, sx + b.face * 2, b.y - 40, 3.4, '#ffffff');
  if (b.st === 'shoot' && b.n === 0 && b.t > 0.15) drawGlint(g, sx + b.face * 14, b.y - 24, 3, '#ff6a4a');
}

  { id: 'dive', name: 'DEATH FROM ABOVE', desc: '3 DIVE STABS WITHOUT LANDING' },
  { id: 'ninja', name: 'NINJA HUNTER', desc: 'DEFEAT 5 NINJAS' },
  { id: 'sword', name: 'SWORD SAINT', desc: '20 TAKEDOWNS WITH THE KATANA' },
  { id: 'demo', name: 'DEMOLITION', desc: '3 ENEMIES IN ONE BLAST' },

  { id: 'clean', name: 'UNTOUCHABLE', desc: 'CLEAR A STAGE WITHOUT A SCRATCH' },
  { id: 'mauler', name: 'GIANT SLAYER', desc: 'BRING DOWN MAULER' },
  { id: 'ironclad', name: 'DERAILED', desc: 'WRECK THE IRONCLAD' },
  { id: 'gunship', name: 'GROUNDED', desc: 'SHOOT DOWN SKY HAMMER' },
  { id: 'krome', name: 'END OF THE LINE', desc: 'DEFEAT GENERAL KROME' },
  { id: 'elite', name: 'ELITE OPERATIVE', desc: 'FINISH THE MISSION ON ELITE' }
];

const PROG = Object.assign({ ach: {}, reached: 0, cleared: false, n: {} }, store.get('progress', {}));
function saveProg() { store.set('progress', PROG); }
/** Medals and counters only move in a real run: no demo, no invincible mode. */
function progLive() { return !game.demo && !game.invincible && !game.cheat; }

function award(id) {
  if (!progLive() || PROG.ach[id]) return;
  PROG.ach[id] = 1;
  saveProg();
  const m = MEDALS.find((k) => k.id === id);
  if (m) game.toasts.push({ title: 'MEDAL EARNED', name: m.name, t: 0 });
}
function countUp(key, goal, id) {
  if (!progLive() || PROG.ach[id]) return;
  PROG.n[key] = (PROG.n[key] || 0) + 1;
  if (PROG.n[key] >= goal) award(id);
  else if (PROG.n[key] % 3 === 0) saveProg();
}
function medalCount() { return MEDALS.filter((m) => PROG.ach[m.id]).length; }

function outfitOpen(k) {
  const need = HERO_OUTFITS[k].need;
  return !need || (need === 'stage3' && PROG.reached >= 2) || (need === 'clear' && PROG.cleared);
}
/** Record how far a real run has got; later stages can then be picked at deployment. */
function reachStage(i) {
  if (game.demo) return;
  if (i > PROG.reached) {
    const before = outfitOpen('raven');
    PROG.reached = Math.min(STAGES.length - 1, i);
    saveProg();
    game.toasts.push({ title: 'STAGE SELECT', name: 'STAGE ' + (i + 1) + ' UNLOCKED', t: 0 });
    if (!before && outfitOpen('raven')) game.toasts.push({ title: 'NEW OUTFIT', name: 'RAVEN', t: 0 });
  }
}
function missionCleared() {
  if (game.demo) return;
  if (!PROG.cleared) { PROG.cleared = true; saveProg(); game.toasts.push({ title: 'NEW OUTFIT', name: 'CRIMSON', t: 0 }); }
  if (game.diff.id === 'elite' && game.startStage === 0) award('elite');
}
