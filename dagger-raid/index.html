   ========================================================================== */

const game = {
  state: 'boot', t: 0, stateT: 0,
  st: STAGES[0], L: null, stageIdx: 0, camX: 0, lockCam: false,
  hero: null, foes: [], shots: [], fx: [], props: [], items: [], caps: [], pops: [], wx: [], sched: [], toasts: [],
  boss: null, bossSeq: null, time: 0, evIdx: 0, spawnT: 0,
  score: 0, hi: 0, lives: 2, nextExtend: 30000, continues: 0, loop: 1,
  chainN: 0, chainT: -9, shake: 0, flashT: 0, slowT: 0, hitStop: 0, boomLight: 0,
  diff: DIFFS[settings.level] || DIFFS.soldier, invincible: false, startStage: 0, stats: null, stageStats: null,
  demo: false, menu: 0, hits: [], scores: loadScores(), entry: null, idleT: 0
};
game.hi = game.scores[0].s;

function freshStats() {
  return { kills: 0, captives: 0, specials: 0, deaths: 0, hits: 0, items: 0, time: 0, crits: 0, parries: 0, dodges: 0, dashes: 0, walls: 0, flips: 0, blocked: 0, finishers: 0 };
}

function setState(s) {
  if (s !== game.state && s !== 'pause' && game.state !== 'pause') game.fadeT = 0.22;
  game.state = s; game.stateT = 0; game.menu = 0; game.hits = [];
}

/* ---- starting a run ---------------------------------------------------------- */
function newGame(demo) {
  game.demo = !!demo;
  chip.mute = game.demo;
  if (!DIFFS[settings.level]) settings.level = 'soldier';
  game.diff = demo ? DIFFS.soldier : DIFFS[settings.level];
  game.invincible = !demo && !!settings.invincible;
  if (!HERO_OUTFITS[settings.outfit] || !outfitOpen(settings.outfit)) settings.outfit = 'commando';
  CHARS.hero.pal = HERO_OUTFITS[demo ? 'commando' : settings.outfit].pal;
  game.score = 0; game.lives = game.diff.lives; game.nextExtend = 30000; game.continues = 0; game.loop = 1;
  game.stats = freshStats();
  game.carry = null; game.cheat = false;
  game.startStage = demo ? 0 : clamp(settings.stage | 0, 0, Math.min(PROG.reached, STAGES.length - 1));
  startStage(game.startStage);
}

function startStage(i) {
  game.stageIdx = i;
  game.st = STAGES[i];
  game.L = stageArt(game.st);
  game.camX = 0; game.lockCam = false;
  const keep = game.carry;
  game.hero = makeHero(48);
  if (keep) { const h = game.hero; h.wpn = keep.wpn; h.ammo = keep.ammo; h.hp = Math.min(game.diff.hp, keep.hp || game.diff.hp); h.blade = keep.blade || 'knife'; h.bladeN = keep.bladeN || 0; }
  game.foes = []; game.shots = []; game.fx = []; game.items = []; game.caps = []; game.pops = []; game.sched = [];
  game.props = game.st.props.map(makeProp);
  game.boss = null; game.bossSeq = null; game.time = 0; game.evIdx = 0; game.spawnT = 2.2;
  game.chainN = 0; game.chainT = -9; game.shake = 0; game.flashT = 0; game.slowT = 0; game.hitStop = 0;
  game.stageStats = freshStats();
  game.dustCol = ART[game.st.id].dust;
  game.wx = [];
  game.nextBolt = rand(5, 9);
  game.hideHero = false; game.autoWalk = false;
  game.downT = 0;
  setState(game.demo ? 'play' : 'intro');
  if (!game.demo) { chip.play('start'); chip.ambience(game.st.id); }
}

function beginPlay() {
  setState('play');
  chip.play(game.st.song);
}

/** Start the current stage again from the pause menu: costs nothing, keeps the score from before it. */
function restartStage() {
  game.score = game.stageScore0 || 0;
  game.carry = game.stageCarry0 || null;
  chip.duck(false);
  startStage(game.stageIdx);
}

/* ---- per frame update by state --------------------------------------------- */
function updateGame(dt, I, P) {
  game.t += dt;
  game.stateT += dt;
  game.shake = Math.max(0, game.shake - dt * 18);
  game.flashT = Math.max(0, game.flashT - dt);
  game.fadeT = Math.max(0, (game.fadeT || 0) - dt);
  game.readyT = Math.max(0, (game.readyT || 0) - dt);
  if (game.toasts.length) {
    const q = game.toasts[0];
    if (q.t === 0) chip.sfx('medal');
    q.t += dt;
    if (q.t > 2.6) game.toasts.shift();
  }
  switch (game.state) {
    case 'intro':
      tickWorld(dt);
      if (game.stateT > 3.4 || (game.stateT > 0.8 && (P.knife || P.jump || P.start))) beginPlay();
      break;
    case 'play': {
      if (game.demo && (P.any)) { exitDemo(); return; }
      let sdt = dt;
      if (game.hitStop > 0) {
        game.hitStop -= dt;
        const h = game.hero;
        if (P.knife) h.kbuf = 0.16; if (P.jump) h.jbuf = 0.12; if (P.special) h.sbuf = 0.12;
        if (P.pause && !game.demo) openPause();
        break;
      }
      if (game.slowT > 0) { game.slowT -= dt; sdt = dt * 0.35; }
      if (game.demo) { const BI = botInput(sdt); updatePlay(sdt, BI, botPressed()); }
      else updatePlay(sdt, I, P);
      if (game.demo && (game.stateT > 34 || (game.hero.dead && game.downT > 1.5))) exitDemo();
      break;
    }
    case 'clear': updateClear(dt, I, P); break;
    case 'continue': updateContinue(dt, I, P); break;
    case 'gameover':
      tickWorld(dt);
      if (game.stateT > 4 || (game.stateT > 1.2 && (P.knife || P.start))) finishRun();
      break;
    case 'ending': updateEnding(dt, I, P); break;
    default: updateMenus(dt, I, P); break;
  }
}

/** Keep effects and weather alive on non-play screens drawn over the world. */
function tickWorld(dt) { if (dt > 0) { updateFx(dt); updateWeather(dt); } }

function updatePlay(dt, I, P) {
  game.time += dt;
  game.stageStats.time += dt;
  const h = game.hero;
  if (P.pause && !game.demo && !h.dead) { openPause(); return; }
  if (game.time <= dt * 1.5) { game.stageScore0 = game.score; game.stageCarry0 = game.carry; }
  updateHero(h, dt, I, P);
  updateCamera(dt);
  if (!game.autoWalk) {
    const xb = h.x;
    h.x = clamp(h.x, game.camX + 8, game.camX + W - 8);
    if (game.boss && game.boss.kind === 'ironclad' && !game.boss.dead) h.x = Math.min(h.x, game.boss.x - 6);
    heroWallContact(h, xb, dt);
  }
  if (!game.bossSeq) { runEvents(); ambientSpawn(dt); }
  else runSched();
  for (const e of game.foes) updateFoe(e, dt);
  updateBossSeq(dt);
  updateShots(dt);
  resolveHeroAttacks();
  resolveFoeAttacks();
  updateProps(dt);
  updateItems(dt);
  updateFx(dt);
  updateWeather(dt);
  game.foes = game.foes.filter((e) => !e.gone);
  if (h.dead) {
    game.downT += dt;
    if (game.downT > 2.6 && !game.demo) heroLost();
  }
}

function updateCamera(dt) {
  const h = game.hero, maxCam = game.st.len - W;
  if (game.lockCam) return;
  const target = clamp(h.x - 150, 0, maxCam);
  if (target > game.camX) game.camX = Math.min(target, game.camX + 260 * dt);
  if (game.camX >= maxCam - 0.5) {
    game.camX = maxCam; game.lockCam = true;
    if (!game.bossSeq) game.bossSeq = { st: 'warn', t: 0 };
    chip.stopMusic();
  }
}

/* ---- boss sequence: warning, fight, defeat ------------------------------------- */
function updateBossSeq(dt) {
  const S = game.bossSeq;
  if (!S) return;
  S.t += dt;
  if (S.st === 'warn') {
    if (S.t < dt * 1.5) { chip.sfx('alarm'); }
    if (S.t > 2.4) {
      S.st = 'fight'; S.t = 0;
      game.boss = makeBoss(game.st.boss);
      if (!game.hero.dead) chip.play('boss');
    }
  } else if (S.st === 'fight') {
    const b = game.boss;
    if (b) { b.update(dt); if (b.dead) b.deathT += dt; }
  } else if (S.st === 'down') {
    const b = game.boss;
    b.update(dt); b.deathT += dt;
    if (S.t > 3.2 && !game.hero.dead) startClear();
  }
}

function onBossDown(b) {
  game.bossSeq.st = 'down'; game.bossSeq.t = 0;
  game.slowT = Math.max(game.slowT, 0.8); game.flashT = 0.12;
  addShake(8);
  chip.stopMusic(true);
  chip.sfx('boom', { big: true });
  addScore(BOSS_POINTS[b.kind], b.x + (b.kind === 'ironclad' ? 60 : 0), b.y - 60, false);
  award(b.kind);
  game.shots = game.shots.filter((s) => !s.foe);
  for (const e of game.foes) if (e.st !== 'dead') { setSt(e, 'dead'); e.vy = -100; e.vx = rand(-60, 60); e.ground = false; e.deadT = 0; }
}

/* ---- spawning -------------------------------------------------------------- */
function runEvents() {
  const st = game.st, center = game.camX + W / 2;
  while (game.evIdx < st.events.length && center >= st.events[game.evIdx].at) {
    const ev = st.events[game.evIdx++];
    if (ev.wave) for (const [kind, side, lv, delay] of ev.wave) game.sched.push({ t: game.time + delay, kind, side, lv });
    if (ev.e) game.sched.push({ t: game.time, kind: ev.e, side: ev.side, lv: ev.lv, x: ev.x, drop: ev.drop });
    if (ev.dogs) for (let i = 0; i < ev.dogs; i++) game.sched.push({ t: game.time + 0.4 + i * 0.5, kind: 'dog', side: 'R', lv: 0 });
    if (ev.para) for (let i = 0; i < ev.para; i++) game.sched.push({ t: game.time + i * 0.7, kind: 'para', para: true });
  }
  runSched();
}

function runSched() {
  for (const s of game.sched) {
    if (s.done || game.time < s.t) continue;
    if (s.x != null && s.x > game.camX + W + 24) continue;
    s.done = true;
    if (s.x != null && s.x < game.camX - 20) continue;
    doSpawn(s);
  }
  game.sched = game.sched.filter((s) => !s.done);
}

function doSpawn(s) {
  if (game.hero.dead) return;
  if (s.para) {
    const x = game.camX + rand(70, W - 50);
    spawnFoe('para', x, HUD_H + 2, x > game.hero.x ? -1 : 1, { para: true });
    return;
  }
  const y0 = LV_Y[s.lv || 0];
  if (s.x != null) { spawnFoe(s.kind, s.x, y0, -1, { drop: s.drop }); return; }
  let side = s.side === 'L' ? -1 : 1;
  if (side < 0 && game.camX < 24) side = 1;
  const x = side > 0 ? game.camX + W + 12 : game.camX - 12;
  let y = y0;
  if (s.lv && !deckAt(x, y)) y = GROUND_Y;
  spawnFoe(s.kind, x, y, -side, { drop: s.drop });
}

function ambientSpawn(dt) {
  const A = game.st.ambient;
  game.spawnT -= dt * game.diff.spawn;
  if (game.spawnT > 0) return;
  game.spawnT = rand(A.gap[0], A.gap[1]);
  if (game.hero.dead || game.camX + W > game.st.len - 30) return;
  const alive = game.foes.filter((e) => e.st !== 'dead').length;
  if (alive >= Math.round(A.max * Math.min(1.25, Math.max(0.75, game.diff.spawn)))) return;
  const kinds = Object.keys(A.mix), total = kinds.reduce((a, k) => a + A.mix[k], 0);
  let r = Math.random() * total, kind = kinds[0];
  for (const k of kinds) { r -= A.mix[k]; if (r <= 0) { kind = k; break; } }
  if (kind === 'ninja' && game.foes.some((e) => e.T.ninja && e.st !== 'dead')) kind = 'grunt';
  let side = chance(A.left) && game.camX > 40 ? -1 : 1;
  const x = side > 0 ? game.camX + W + 12 : game.camX - 12;
  let y = GROUND_Y;
  if (kind !== 'dog' && chance(A.deck)) { const ds = game.st.decks.filter((d) => x >= d.x0 && x <= d.x1); if (ds.length) y = pick(ds).y; }
  spawnFoe(kind, x, y, -side, { runner: kind !== 'officer' && chance(A.runner) });
}

/* ---- scoring --------------------------------------------------------------------- */
function addScore(pts, x, y, chain, quiet) {
  let total = pts;
  if (chain) {
    if (game.time - game.chainT < 1.6) game.chainN = Math.min(10, game.chainN + 1); else game.chainN = 1;
    game.chainT = game.time;
    if (game.chainN > 1) total += (game.chainN - 1) * 50;
    if (game.chainN >= 2 && !quiet) pop(x, y - 9, 'CHAIN X' + game.chainN, '#ffd27a');
    if (game.chainN >= 5) award('chain');
  }
  game.score += total;
  if (!quiet) pop(x, y, String(total), '#ffffff');
  if (!game.demo && !game.invincible && game.score > game.hi) game.hi = game.score;
  while (!game.demo && game.score >= game.nextExtend) {
    game.lives = Math.min(9, game.lives + 1);
    game.nextExtend += 70000;
    chip.sfx('oneup');
    if (game.hero) pop(game.hero.x, game.hero.y - 48, 'EXTEND!', '#4ad16a');
  }
}

/* ---- death, respawn, continue -------------------------------------------------------- */
function onHeroDown() { game.downT = 0; game.stageStats.deaths++; }

function heroLost() {
  if (game.lives > 0) { game.lives--; respawn(); }
  else { setState('continue'); game.contT = 9.99; chip.play('gameover'); }
}

function respawn() {
  const b = game.boss && !game.boss.dead ? game.boss : null;
  let x = game.camX + 40;
  if (b && b.kind !== 'ironclad' && Math.abs(b.x - x) < 90) x = game.camX + W - 40;
  const h = makeHero(x);
  h.inv = 2.6; h.face = x > game.camX + W / 2 ? -1 : 1;
  game.hero = h;
  game.foes = game.foes.filter((e) => e.T.fixed || !onScreen(e.x, 60));
  for (const e of game.foes) e.cd = Math.max(e.cd, 2.2);
  game.shots = []; game.sched = game.sched.filter((s) => s.x != null);
  game.spawnT = 2.4; game.downT = 0; game.chainN = 0; game.readyT = 1.6;
  if (b) chip.play('boss');
  else if (!game.bossSeq) chip.play(game.st.song);
}

function updateContinue(dt, I, P) {
  tickWorld(dt);
  const before = Math.ceil(game.contT);
  game.contT -= dt * (P.special ? 6 : 1);
  if (Math.ceil(game.contT) !== before && game.contT > 0) chip.sfx('tick');
  if (game.stateT > 0.6 && (P.knife || P.jump || P.start || input.tap)) {
    chip.sfx('coin');
    game.continues++; game.lives = game.diff.lives;
    setState('play');
    respawn();
    return;
  }
  if (game.contT <= 0) { setState('gameover'); chip.stopMusic(); }
}

function finishRun() {
  chip.stopMusic(); chip.ambience(null);
  const rank = qualifies(game.score);
  if (rank >= 0) startEntry(rank);
  else { setState('title'); chip.play('title'); }
}

/* ---- stage clear and tally ------------------------------------------------------------ */
function startClear() {
  setState('clear');
  const h = game.hero;
  h.act = null; h.vx = 0; h.inv = 0; h.roll = null; h.flipT = -1;
  chip.play('clear');
  const cages = game.props.filter((p) => p.t === 'cage');
  const freed = cages.filter((p) => p.open).length;
  const S = game.stageStats;
  const clean = S.hits === 0 && S.deaths === 0;
  game.tally = [
    { label: 'CAPTIVES FREED', val: freed + ' / ' + cages.length, pts: freed === cages.length && cages.length ? 5000 : 0, note: freed === cages.length ? 'ALL FREED' : '' },
    { label: 'NO MISS BONUS', val: S.deaths ? 'MISSED ' + S.deaths : 'PERFECT', pts: S.deaths ? 0 : 10000 },
    { label: 'TIME', val: fmtTime(S.time), pts: Math.max(0, Math.round((240 - S.time) / 10)) * 100 },
    { label: 'CRITICAL HITS', val: String(S.crits), pts: S.crits * 100 },
    { label: 'ENEMIES DOWN', val: String(S.kills), pts: 0 }
  ];
  game.tallyIdx = -1; game.tallyT = 0; game.tallyDone = false;
  if (freed === cages.length && cages.length) award('free');
  if (clean) award('clean');
  if (game.stageIdx + 1 < STAGES.length) reachStage(game.stageIdx + 1);
}

function fmtTime(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + "'" + String(r).padStart(2, '0') + '"'; }

function updateClear(dt, I, P) {
  const h = game.hero, t = game.stateT;
  updateFx(dt); updateWeather(dt); updateProps(dt); updateItems(dt);
  if (game.boss) { game.boss.update(dt); game.boss.deathT += dt; }
  if (t < 1.4) {
    h.pose = h.ground ? ['victory', 0] : null; h.vx = 0;
    if (!h.ground) actorPhys(h, dt);
  } else if (t < 3.6) {
    h.pose = null; game.autoWalk = true;
    h.face = 1; h.act = null; h.crouch = false;
    if (h.climb) h.climb = null;
    h.vx = RUN_V * 1.1; actorPhys(h, dt); h.runT += h.vx * dt;
    if (h.x > game.camX + W + 20) game.hideHero = true;
  } else {
    game.autoWalk = false; game.hideHero = true;
    game.tallyT += dt;
    if (!game.tallyDone) {
      if (game.tallyIdx < 0 || game.tallyT > 0.6) {
        game.tallyIdx++; game.tallyT = 0;
        if (game.tallyIdx < game.tally.length) {
          const row = game.tally[game.tallyIdx];
          if (row.pts) { addScore(row.pts, 0, 0, false, true); chip.sfx('pickup'); } else chip.sfx('move');
        } else { game.tallyDone = true; game.tallyT = 0; }
      }
    } else if (game.tallyT > 2.6 || (game.tallyT > 0.5 && (P.knife || P.jump || P.start || input.tap))) {
      nextStage();
    }
  }
}

function nextStage() {
  const h = game.hero;
  game.carry = { wpn: h.wpn, ammo: h.ammo, hp: h.hp, blade: h.blade, bladeN: h.bladeN };
  for (const k in game.stageStats) game.stats[k] += game.stageStats[k];
  if (game.stageIdx + 1 < STAGES.length) startStage(game.stageIdx + 1);
  else { missionCleared(); startEnding(); }
}

/* ---- ending ------------------------------------------------------------------------------- */
const ENDING_LINES = [
  ['MISSION COMPLETE', '#ffd27a'], ['', ''],
  ['GENERAL KROME HAS FALLEN.', '#ffffff'], ['EVERY CAPTIVE IS ON THE', '#ffffff'], ['ROAD HOME TONIGHT.', '#ffffff'], ['', ''],
  ['THE KNIFE GOES BACK IN ITS', '#c9d6e6'], ['SHEATH. FOR NOW.', '#c9d6e6'], ['', ''], ['', ''],
  ['DAGGER RAID', '#e8392a'], ['AN ORIGINAL ARCADE ADVENTURE', '#9fe8ff'], ['', ''],
  ['THANK YOU FOR PLAYING!', '#4ad16a']
];
function startEnding() {
  setState('ending');
  chip.ambience(null);
  chip.play('ending');
  game.endScroll = 0;
}
function updateEnding(dt, I, P) {
  game.endScroll += dt * 14;
  updateFx(dt);
  if (game.stateT > 4 && (P.knife || P.start || input.tap)) { if (game.endScroll > ENDING_LINES.length * 12 + 150) { finishRun(); return; } game.endScroll += 40; }
  if (game.endScroll > ENDING_LINES.length * 12 + 520) finishRun();
}

/* ---- high scores ---------------------------------------------------------------------------- */
function qualifies(score) {
  if (game.demo || game.invincible || score <= 0) return -1;
  for (let i = 0; i < game.scores.length; i++) if (score > game.scores[i].s) return i;
  return -1;
}
const ENTRY_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.- ';
function startEntry(rank) {
  setState('entry');
  const last = store.get('initials', 'AAA');
  game.entry = { rank, chars: last.split('').map((c) => Math.max(0, ENTRY_CHARS.indexOf(c))), pos: 0, done: false, t: 30 };
  chip.play('entry');
}
function commitEntry() {
  const E = game.entry;
  const name = E.chars.map((i) => ENTRY_CHARS[i]).join('');
  store.set('initials', name);
  game.scores.splice(E.rank, 0, { n: name, s: game.score, st: Math.min(4, game.stageIdx + 1) });
  game.scores.length = 5;
  store.set('scores', game.scores);
  game.hi = Math.max(game.hi, game.scores[0].s);
  E.done = true; E.doneT = 0;
  chip.sfx('select');
}

/* ---- demo bot: plays the attract demo and the automated test runs ---------------------- */
const BOT = { pressed: {}, jumpCD: 0, stabCD: 0, specCD: 0, dashCD: 0, hold: 0 };
function botInput(dt) {
  const h = game.hero, I = { left: false, right: false, up: false, down: false, jump: false, knife: false, special: false, dash: false };
  const P = { jump: false, knife: false, special: false, dash: false };
  BOT.jumpCD -= dt; BOT.stabCD -= dt; BOT.specCD -= dt; BOT.dashCD -= dt; BOT.hold -= dt;
  BOT.pressed = P;
  if (h.dead) return I;
  if (BOT.hold > 0) I.jump = true;
  if (h.climb) { I.up = true; return I; }
  let near = null, nd = 1e9;
  for (const e of game.foes) {
    if (e.st === 'dead' || foeGhost(e) || (Math.abs(e.y - h.y) > 16 && e.st !== 'kick')) continue;
    const d = Math.abs(e.x - h.x);
    if (d < nd) { nd = d; near = e; }
  }
  let dir = 1;
  if (near && nd < 32) {
    const side = Math.sign(near.x - h.x) || 1;
    if (h.face !== side) dir = side;
    else if (BOT.stabCD <= 0) { P.knife = true; BOT.stabCD = 0.18; }
    if (near.kind === 'dog' || near.st === 'kneel' || near.st === 'snipe') I.down = true;
    if (nd < 18 && h.face === side) dir = 0;
  }
  for (const s of game.shots) {
    if (!s.foe || (s.k !== 'bullet' && s.k !== 'star') || s.aimed) continue;
    const toward = (s.x - h.x) * -Math.sign(s.vx || 0);
    if (toward > 0 && toward < 50) {
      if (s.y > h.y - 15 && BOT.jumpCD <= 0 && h.ground) { P.jump = true; BOT.jumpCD = 0.7; BOT.hold = 0.3; I.jump = true; }
      else if (s.y <= h.y - 15 && h.ground) { I.down = true; dir = 0; }
    }
  }
  const b = game.boss;
  if (b && !b.dead && b.st !== 'enter') {
    // close on the boss and keep cutting
    const bx = b.kind === 'ironclad' ? b.x + 4 : b.x, side = Math.sign(bx - h.x) || 1, d = Math.abs(bx - h.x);
    if (!(near && nd < 30)) {
      dir = d > (b.kind === 'gunship' ? 8 : 18) ? side : 0;
      if (b.kind === 'gunship') {

/* ---- weather ------------------------------------------------------------------------------------ */
function updateWeather(dt) {
  const kind = game.st.weather;
  const want = Math.round(({ pollen: 30, snow: 120, dust: 46, rain: 150 }[kind] || 0) * (QUALITY.level ? 0.6 : 1));
  while (game.wx.length < want) {
    game.wx.push({ x: rand(0, W), y: rand(HUD_H - 20, H), s: Math.random(), ph: rand(0, TAU) });
  }
  if (game.wx.length > want) game.wx.length = want;
  for (const p of game.wx) {
    if (kind === 'snow') { p.y += (18 + p.s * 26) * dt; p.x += (-10 + Math.sin(game.t + p.ph) * 8) * dt; }
    else if (kind === 'rain') { p.y += (300 + p.s * 120) * dt; p.x -= 60 * dt; }
    else if (kind === 'dust') { p.x -= (30 + p.s * 40) * dt; p.y += Math.sin(game.t * 2 + p.ph) * 6 * dt; }
    else { p.y += Math.sin(game.t + p.ph) * 6 * dt - 2 * dt; p.x += Math.cos(game.t * 0.7 + p.ph) * 8 * dt; }
    if (p.y > H) { p.y = HUD_H - 4; p.x = rand(0, W + 40); }
    if (p.x < -4) p.x += W + 8;
    if (p.x > W + 4) p.x -= W + 8;
    if (p.y < HUD_H - 30) p.y = H;
  }
  if (kind === 'rain' && game.state === 'play') {
    game.nextBolt -= dt;
    if (game.nextBolt <= 0) {
      game.nextBolt = rand(7, 13); game.flashT = 0.16;
      game.fx.push({ k: 'bolt', x: game.camX + rand(40, W - 40), y: rand(96, 128), t: 0, life: 0.22, seed: Math.random() * 99 });
      setTimeout(() => chip.sfx('thunder'), 380);
    }
  }
}

/* ==========================================================================
   Menus: boot, title, attract loop, how to play, options, pause, name entry

const TITLE_ITEMS = ['START MISSION', 'HOW TO PLAY', 'HIGH SCORES', 'MEDALS', 'OPTIONS'];

function updateMenus(dt, I, P) {
  if (game.state !== 'pause') tickWorld(dt);

  const back = P.special || P.back;
  const hit = tapHit();
  switch (game.state) {
    case 'boot':

      break;
    case 'title': {

      menuMove(TITLE_ITEMS.length, P);
      let act = confirm ? game.menu : -1;
      if (hit) { game.menu = hit.i; act = hit.i; }
      if (act === 0) { chip.sfx('select'); setState('setup'); game.menu = 4; }
      else if (act === 1) { chip.sfx('select'); setState('howto'); game.page = 0; }
      else if (act === 2) { chip.sfx('select'); setState('scores'); game.attract = false; }
      else if (act === 3) { chip.sfx('select'); setState('medals'); }
      else if (act === 4) { chip.sfx('select'); game.optFrom = 'title'; setState('options'); }
      if (game.idleT > 22) { game.idleT = 0; game.attract = true; setState('scores'); }
      break;
    }
    case 'setup': {
      menuMove(SETUP_ITEMS.length, P);
      let d = P.left ? -1 : P.right ? 1 : 0;
      let act = confirm;
      if (hit) { if (hit.back) { chip.sfx('move'); setState('title'); break; } game.menu = hit.i; if (hit.dir) d = hit.dir; else act = true; }
      if (game.menu === 4) { if (act) { chip.sfx('coin'); chip.stopMusic(); newGame(false); break; } }

      if (back) { chip.sfx('move'); setState('title'); }
      break;
    }
    case 'medals':

      break;
    case 'scores':

      break;

        game.page++; chip.sfx('move');
        if (game.page >= HOWTO_PAGES) { setState('title'); game.menu = 1; }
      } else if (P.left && game.page > 0) { game.page--; chip.sfx('move'); }
      else if (back || (hit && hit.back)) { setState('title'); game.menu = 1; chip.sfx('move'); }
      break;
    case 'options': {

      let d = P.left ? -1 : P.right ? 1 : 0;
      let act = confirm;
      if (hit) { game.menu = hit.i; if (hit.dir) d = hit.dir; else act = true; }
      if (d || act) adjustOption(game.menu, d || 1, act && !d);
      if (back) leaveOptions();

      if (act === 0) { game.state = 'play'; chip.duck(false); chip.sfx('select'); }
      else if (act === 1) { chip.sfx('coin'); restartStage(); }
      else if (act === 2) { chip.sfx('select'); game.optFrom = 'pause'; setState('options'); }

function adjustSetup(i, d) {
  const cyc = (list, cur) => list[(list.indexOf(cur) + (d > 0 ? 1 : list.length - 1)) % list.length];
  switch (SETUP_ITEMS[i]) {
    case 'LEVEL': settings.level = cyc(DIFF_ORDER, settings.level); break;
    case 'STAGE': { const n = Math.min(PROG.reached, STAGES.length - 1) + 1; settings.stage = ((settings.stage | 0) + (d > 0 ? 1 : n - 1)) % n; break; }

}

function adjustOption(i, d, activate) {
  switch (OPTION_ITEMS[i]) {

    case 'EFFECTS': settings.sfx = clamp(Math.round(settings.sfx * 10 + d) / 10, 0, 1); chip.applyVolumes(); chip.sfx('pickup'); break;

/* ---- world ---------------------------------------------------------------------- */
function drawBackdrop(g, L, st, cx, k) {
  const art = ART[st.id];
  blitArt(g, L.sky, 0, 0, W, H, 0, 0);
  drawLayer(g, L.clouds, cx * 0.05 * k + game.t * 3.2);
  drawLayer(g, L.far, cx * 0.12 * k);
  const mx = (((cx * 0.35 * k) % LAYER_W) + LAYER_W) % LAYER_W;
  drawLayer(g, L.mid, mx);
  if (art.live && settings.fx) art.live(g, mx, game.t);
  drawLayer(g, L.near, cx * 0.6 * k);
}

function drawLights(g, L, cx) {
  if (!settings.fx || QUALITY.level > 1) return;
  for (const l of L.lights) {
    const x = l.x - cx;
    if (x < -l.r || x > W + l.r) continue;
    let a = 0.8;
    if (l.blink) { if (((game.t / l.blink + l.ph) % 1) > 0.5) continue; }
    else if (l.f) a = 0.8 * (1 - l.f * (0.5 + 0.5 * Math.sin(game.t * 9 + l.ph) * Math.sin(game.t * 23 + l.ph * 3)));
    drawGlow(g, x, l.y, l.r, l.col, a);
    if (l.flame) {
      const fl = 0.8 + 0.2 * Math.sin(game.t * 14 + l.ph);
      for (const [w, h, c] of [[3.4, 8, '#ff7a2a'], [2.2, 5.6, '#ffc24a'], [1, 3, '#fff4c0']]) {
        g.fillStyle = c; g.beginPath(); g.moveTo(x - w / 2, l.y + 2);
        g.quadraticCurveTo(x - w * 0.7, l.y + 2 - h * 0.5 * fl, x + Math.sin(game.t * 9 + l.ph) * 0.9, l.y + 2 - h * fl);
        g.quadraticCurveTo(x + w * 0.7, l.y + 2 - h * 0.5 * fl, x + w / 2, l.y + 2); g.closePath(); g.fill();
      }
    }
  }
}

const GRADE_CACHE = {};
/** Colour grade and vignette that tie each stage together. */
function drawGrade(g, st) {

    q.fillRect(0, 0, 192, 108);
    GRADE_CACHE[key] = c;

  g.drawImage(c, 0, 0, W, H);
}

function drawWeather(g) {
  const kind = game.st.weather;
  for (const p of game.wx) {
    const x = p.x, y = p.y;
    if (kind === 'snow') { g.globalAlpha = 0.55 + p.s * 0.45; disc(g, x, y, 0.5 + p.s * 0.7, '#ffffff'); }
    else if (kind === 'rain') { g.globalAlpha = 0.34; stampLine(g, x, y, x - 1.6, y + 7.5, 0.4, '#b4c6f0'); }
    else if (kind === 'dust') { g.globalAlpha = 0.25 + p.s * 0.4; stampLine(g, x, y, x + 2 + p.s * 3, y, 0.4, '#ffd8a0'); }
    else {
      const a = 0.35 + 0.5 * Math.abs(Math.sin(game.t * 1.6 + p.ph));
      if (p.s > 0.7 && QUALITY.level < 2) drawGlow(g, x, y, 3.2, '#fff2a0', a * 0.7);
      g.globalAlpha = a; disc(g, x, y, 0.45 + p.s * 0.3, '#fff6b0');

}

function drawWorld(g) {
  const st = game.st, L = stageArt(st);

  const cx = game.camX, art = ART[st.id];

  g.save();
  g.translate(sx, sy);
  if (!DBG.noBack) drawBackdrop(g, L, st, cx, 1);
  drawLevel(g, L, st, cx);
  const h = game.hero, b = game.boss;
  for (const p of game.props) { drawProp(g, p, cx, false); drawProp(g, p, cx, true); }
  for (const e of game.foes) if (e.st !== 'dead' && e.st !== 'para' && e.kind !== 'dog' && !(e.T.ninja && foeGhost(e)) && onScreen(e.x, 20)) drawShadowV(g, cx, e.x, e.y, 9);
  for (const c of game.caps) drawCaptive(g, c, cx);

}

/* ---- frame ------------------------------------------------------------------------------ */
/** Repaint cached art when the screen scale changes enough to matter. */
function ensureArtScale() {
  const want = clamp(view.scale, 1, 3);
  if (Math.abs(want - RS) <= RS * 0.12) return;
  RS = Math.round(want * 100) / 100;
}

function renderFrame() {
  const cv = $('screen'), g = cv.getContext('2d');
  game.hits = [];
  ensureArtScale();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#05060a'; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
  g.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in g) g.imageSmoothingQuality = 'low';
  g.save();
  g.beginPath(); g.rect(0, 0, W, H); g.clip();
  switch (game.state) {
    case 'boot': drawBoot(g); break;
    case 'title': drawTitle(g); break;
    case 'setup': drawSetup(g); break;
    case 'scores': drawScores(g); break;
    case 'howto': drawHowTo(g); break;
    case 'medals': drawMedals(g); break;
    case 'options': drawOptions(g); break;
    case 'intro': drawIntro(g); break;
    case 'play': drawWorld(g); if (!DBG.noHud) drawHUD(g); drawBanners(g); break;
    case 'pause': drawPause(g); break;
    case 'clear': drawClear(g); drawHUD(g); break;
    case 'continue': drawContinue(g); drawHUD(g); break;
    case 'gameover': drawGameOver(g); drawHUD(g); break;
    case 'entry': drawEntry(g); break;
    case 'ending': drawEnding(g); break;
    default: break;
  }
  drawToasts(g);
  if (game.fadeT > 0) { g.globalAlpha = Math.min(1, game.fadeT / 0.22); rect(g, 0, 0, W, H, '#000000'); g.globalAlpha = 1; }
  g.restore();
}

  safe = { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0 };
}

/** Size the touch pad for landscape and report how much side room it needs. */
function sizePad(vw, vh, portrait) {
  const root = $('touch');
  if (!root) return { left: 0, right: 0 };
  if (portrait) { for (const k of ['--dp', '--bk', '--bj', '--bs']) root.style.removeProperty(k); return { left: 0, right: 0 }; }
  const dp = Math.round(clamp(Math.min(vh, 520) * 0.33, 100, 160));
  const bk = Math.round(dp * 0.44), bj = Math.round(dp * 0.37), bs = Math.round(dp * 0.32);
  root.style.setProperty('--dp', dp + 'px'); root.style.setProperty('--bk', bk + 'px');
  root.style.setProperty('--bj', bj + 'px'); root.style.setProperty('--bs', bs + 'px');
  return { left: Math.max(16, safe.l) + dp + 14, right: Math.max(16, safe.r) + bk * 2 + 12 + 14 };
}

function layout() {
  readSafe();
  const cv = $('screen');
  const vw = Math.max(1, window.innerWidth || document.documentElement.clientWidth), vh = Math.max(1, window.innerHeight || document.documentElement.clientHeight);
  laidOut = window.innerWidth + 'x' + window.innerHeight + '@' + (window.devicePixelRatio || 1);
  // full resolution, capped so huge screens stay smooth
  const dpr = Math.min(3, window.devicePixelRatio || 1, 2600 / Math.max(1, vw), 1600 / Math.max(1, vh)) * QUALITY.res[QUALITY.level];
  const tw = Math.max(1, Math.round(vw * dpr)), th = Math.max(1, Math.round(vh * dpr));
  if (cv.width !== tw || cv.height !== th) { cv.width = tw; cv.height = th; }
  const touchOn = touchVisible();
  const portrait = vh > vw * 1.05;
  const B = document.body.classList;
  B.toggle('touch-on', touchOn);
  B.toggle('portrait', portrait);
  let gx = 0, gy = 0, gw = vw, gh = vh;
  if (touchOn && portrait) {
    gy = safe.t + 8;
    gh = Math.min((vw * 9) / 16, vh * 0.52);
  } else if (touchOn) {
    // handheld landscape: the pad lives in side panels, the screen sits between them
    const pad = sizePad(vw, vh, false);
    const side = Math.max(pad.left, pad.right);
    const full = Math.min(vw, (vh * 16) / 9);
    // the picture takes the full height; the pad may overlap its outer edges rather than shrink it
    gw = Math.min(vw, Math.max(vw - 2 * side, full));
    gx = (vw - gw) / 2;
    gy = Math.max(0, safe.t);
    gh = vh - gy - Math.max(0, safe.b * 0.5);
  }
  if (!touchOn || portrait) sizePad(vw, vh, true);
  const s = Math.min(gw / W, gh / H) * dpr;
  view.scale = s;
  view.ox = Math.round(gx * dpr + (gw * dpr - W * s) / 2);
  view.oy = Math.round(gy * dpr + (gh * dpr - H * s) / 2);
  document.documentElement.style.setProperty('--game-bottom', Math.round((view.oy + H * s) / dpr) + 'px');
}
function layoutTouch() { layout(); }

/* ---- keep the page from zooming or scrolling out from under the game --------------- */
const VIEWPORT_LOCK = 'width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
let laidOut = '';
function viewportMeta() {
  let m = document.querySelector('meta[name="viewport"]');
  if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
  return m;
}
/** If the browser zoomed in anyway (double tap, pinch, rotation), snap back to 1:1. */
function unzoom() {
  const vv = window.visualViewport;
  if (vv && Math.abs(vv.scale - 1) > 0.02) {
    const m = viewportMeta();
    m.setAttribute('content', VIEWPORT_LOCK + ',_r=' + Date.now() % 97);
    setTimeout(() => m.setAttribute('content', VIEWPORT_LOCK), 60);
  }
  if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
}
function guardViewport() {
  viewportMeta().setAttribute('content', VIEWPORT_LOCK);
  const stop = (e) => { if (e.cancelable) e.preventDefault(); };
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, stop, { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) stop(e); }, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
  document.addEventListener('wheel', (e) => { if (e.ctrlKey) stop(e); }, { passive: false });
  // a fast second tap anywhere on the game is play, never a zoom request
  let lastEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = performance.now();
    const t = e.target, form = t && t.closest && t.closest('input,textarea,select,a');
    if (now - lastEnd < 350 && !form) stop(e);
    lastEnd = now;
  }, { passive: false });
  const relayout = () => { unzoom(); layout(); };
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', relayout); window.visualViewport.addEventListener('scroll', unzoom); }
  window.addEventListener('pageshow', relayout);
  window.addEventListener('orientationchange', () => { for (const d of [60, 300, 700, 1200]) setTimeout(relayout, d); });
  if (window.screen && screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', () => { for (const d of [60, 400, 900]) setTimeout(relayout, d); });
  // belt and braces: some browsers report the new size late and send no event for it
  setInterval(() => {
    const key = window.innerWidth + 'x' + window.innerHeight + '@' + (window.devicePixelRatio || 1);
    if (key !== laidOut) relayout(); else unzoom();
  }, 500);
}

let lastT = 0, acc = 0, manual = false, lastTouchState = null;
function frame(now) {
  requestAnimationFrame(frame);
  if (manual) return;
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.25) dt = 0.25;
  watchSpeed(dt);
  acc += dt;
  pollInput();
  const tv = touchVisible();
  if (tv !== lastTouchState) { lastTouchState = tv; layout(); }
  let steps = 0;
  while (acc >= STEP && steps < 8) {
    if (steps === 0) updateGame(STEP, input.held, takeInput());
    else { clearStepInput(); updateGame(STEP, input.held, NO_PRESS); }
    acc -= STEP; steps++;
  }
  if (steps >= 8) acc = 0;
  renderFrame();
}

/** If the device can't hold a smooth frame rate, render at a lower resolution. */
const speed = { t: 0, n: 0, slow: 0 };
function watchSpeed(dt) {
  if (document.hidden || dt <= 0 || dt > 0.2) return;
  speed.t += dt; speed.n++;
  if (dt > 1 / 42) speed.slow++;
  if (speed.t < 2.5) return;
  const slowShare = speed.slow / speed.n;
  speed.t = 0; speed.n = 0; speed.slow = 0;
  if (slowShare > 0.45 && QUALITY.level < QUALITY.res.length - 1 && (game.state === 'play' || game.state === 'title')) {
    QUALITY.level++;
    layout();
  }
}

function boot() {
  initInput();
  layout();
  window.addEventListener('resize', layout);
  guardViewport();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (game.state === 'play' && !game.demo) openPause();
      if (chip.ctx) chip.ctx.suspend().catch(() => {});
    } else {
      lastT = 0;
      if (chip.ctx) chip.ctx.resume().catch(() => {});
    }
  });
  window.addEventListener('blur', () => { if (game.state === 'play' && !game.demo) openPause(); });
  loadFonts();
  ensureArtScale();
  stageArt(STAGES[0]);
  try { $('screen').focus({ preventScroll: true }); } catch (e) { /* focus is best effort */ }
  setState('boot');
  requestAnimationFrame(frame);
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
    try { window.claude.hot.snapshot(hotSnapshot); } catch (e) { /* viewer without hot updates */ }
  }

  // hooks for automated testing
  const blank = () => ({ left: false, right: false, up: false, down: false, jump: false, knife: false, special: false, dash: false, start: false, pause: false, back: false, any: false });
  window.__dagger = {
    game, input, chip, settings, STAGES, ETYPES, Chip, SONGS, parseTrack, DIFFS, MEDALS, PROG, MELEE, HERO_OUTFITS, ART, DBG, QUALITY,
    setManual(v) { manual = v; },
    step(n, held, pressed, quiet) {
      const H0 = Object.assign(blank(), held || {});
      for (let i = 0; i < n; i++) {
        const P = i === 0 ? Object.assign(blank(), pressed || {}) : NO_PRESS;
        if (i === 0 && pressed && pressed.tap) input.tap = pressed.tap; else input.tap = null;
        input.typed = (i === 0 && pressed && pressed.typed) || [];
        updateGame(STEP, H0, P);
      }
      if (!quiet) renderFrame();
    },
    render: renderFrame, newGame, startStage, startDemo, setState, spawnFoe, makeBoss, layout, view, beginPlay, hurtHero, killFoe, qualifies, botInput, botPressed,
    updateGame, spawnItem, collect, award, heroKnifeBox, foeBox, drawSprite, stageArt, restartStage, outfitOpen
  };
}

/** State worth keeping if the page is updated while someone is mid-run. */
function hotSnapshot() {
  const live = ['intro', 'play', 'pause', 'clear', 'continue'].includes(game.state) && !game.demo;
  if (!live) return {};
  const h = game.hero;
  return { run: { stage: game.stageIdx, score: game.score, lives: game.lives, continues: game.continues, level: game.diff.id, carry: h ? { wpn: h.wpn, ammo: h.ammo, hp: h.hp, blade: h.blade, bladeN: h.bladeN } : null } };
}

function resumeRun(r) {
  if (r.level && DIFFS[r.level]) settings.level = r.level;
  newGame(false);
  game.score = r.score || 0; game.lives = r.lives == null ? game.diff.lives : r.lives; game.continues = r.continues || 0;
  game.nextExtend = 30000;
  while (game.nextExtend <= game.score) game.nextExtend += 70000;
  game.hi = Math.max(game.hi, game.score);
  game.carry = r.carry || null;
  startStage(clamp(r.stage | 0, 0, STAGES.length - 1));
}

function start(data) {
  boot();
  if (data && data.run) { try { resumeRun(data.run); } catch (e) { setState('boot'); } }
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});

})();
</script>
