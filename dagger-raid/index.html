<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dagger Raid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#05060a">
<meta name="description" content="Dagger Raid: an original side-scrolling commando arcade game in hand-drawn HD, with knife combos, ninja moves, special weapons, captives to free and four boss fights.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Black+Ops+One&display=swap">
<style>
/* One deliberate world: a dark arcade cabinet. The canvas is full-bleed; the touch pad
   sits inside safe-area gutters (portrait: handheld layout under the screen, landscape: overlay). */
:root {
  color-scheme: dark;
  --bg: #05060a;
  --body: #0d1018;
  --line: #232a3c;
  --ink: #e8edf5;
  --ink-dim: #6d7890;
  --knife: #e8392a;
  --knife-deep: #8f1d14;
  --jump: #e3b02a;
  --jump-deep: #8a6410;
  --spec: #2fa8c8;
  --spec-deep: #156078;
  --dash: #8a6aff;
  --dash-deep: #3e2a9a;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(10px, env(safe-area-inset-top, 0px));
  --gb: max(14px, env(safe-area-inset-bottom, 0px));
  --pix: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --game-bottom: 50vh;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--pix); font-size: 10px; line-height: 1.15;
  overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#safeProbe {
  position: absolute; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
noscript { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }

/* ---------- touch pad ---------- */
#touch {
  position: absolute; inset: 0; display: none; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: var(--gt) var(--gb);
  --dp: min(40vw, 30vh, 176px);
  --bk: min(19vw, 13.5vh, 80px);
  --bj: min(16vw, 11.5vh, 68px);
  --bs: min(14vw, 10vh, 58px);
}
body.touch-on #touch { display: block; }
body.touch-on.portrait #touch {
  background:
    linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) var(--game-bottom), var(--body) calc(var(--game-bottom) + 1px), #0a0c13 100%);
}
.brand {
  display: none; position: absolute; left: var(--gl); right: var(--gr); top: calc(var(--game-bottom) + 18px);
  text-align: center; font-family: "Black Ops One", "Barlow Condensed", Impact, sans-serif; font-size: 20px; letter-spacing: 4px; line-height: 1.15; color: #8a96b4;
}
body.portrait .brand { display: block; }
.brand b { color: #e8392a; font-weight: 400; }
.brand span { display: block; margin-top: 10px; font-family: var(--pix); font-size: 11px; font-weight: 500; letter-spacing: 1px; line-height: 1.15; color: #56607c; }
.grille {
  display: none; position: absolute; left: 50%; width: 180px; margin-left: -90px; height: 12px;
  top: calc(var(--game-bottom) + 74px);
  background: linear-gradient(90deg, transparent, rgba(232,57,42,0.6) 28%, rgba(232,57,42,0.6) 72%, transparent) center / 100% 1px no-repeat;
}
.grille::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -5px 0 0 -5px;
  transform: rotate(45deg); border: 1px solid rgba(255,120,100,0.85); background: #2a1014;
}
body.portrait .grille { display: block; }
@media (max-height: 700px) { .grille { display: none !important; } .brand span { display: none; } }

#dpad {
  position: absolute; left: var(--gl); bottom: calc(var(--gb) + 6px);
  width: var(--dp); height: var(--dp); border-radius: 50%; pointer-events: auto; touch-action: none;
  background: radial-gradient(circle at 50% 45%, rgba(40,48,70,0.55), rgba(14,17,26,0.7) 70%);
  border: 2px solid rgba(80,92,124,0.45);
}
body.portrait #dpad { bottom: calc(var(--gb) + 40px); }
#dpad .arm { position: absolute; background: #1b2030; border: 2px solid #313a52; border-radius: 6px; }
#dpad .arm.h { left: 12%; right: 12%; top: 38%; bottom: 38%; }
#dpad .arm.v { top: 12%; bottom: 12%; left: 38%; right: 38%; }
#dpad .ar { position: absolute; width: 0; height: 0; border: 7px solid transparent; opacity: 0.65; }
#dpad .ar.l { left: 16%; top: calc(50% - 7px); border-right-color: #9aa6c0; border-left-width: 0; }
#dpad .ar.r { right: 16%; top: calc(50% - 7px); border-left-color: #9aa6c0; border-right-width: 0; }
#dpad .ar.u { top: 16%; left: calc(50% - 7px); border-bottom-color: #9aa6c0; border-top-width: 0; }
#dpad .ar.d { bottom: 16%; left: calc(50% - 7px); border-top-color: #9aa6c0; border-bottom-width: 0; }
#dpad.left .ar.l, #dpad.right .ar.r, #dpad.up .ar.u, #dpad.down .ar.d { opacity: 1; filter: drop-shadow(0 0 4px #ffd27a); }
#dpadKnob {
  position: absolute; left: calc(50% - 15%); top: calc(50% - 15%); width: 30%; height: 30%; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #5a6684, #262d42); border: 2px solid #11141d; pointer-events: none;
  transition: transform 40ms linear;
}

/* arcade layout: KNIFE and JUMP on the bottom row, SPECIAL and DASH staggered above them */
#btns { position: absolute; right: var(--gr); bottom: calc(var(--gb) + 6px); width: calc(var(--bk) * 2 + 12px); height: calc(var(--bk) * 1.3 + var(--bj) + 12px); pointer-events: none; }
body.portrait #btns { bottom: calc(var(--gb) + 40px); }
.tbtn {
  position: absolute; border-radius: 50%; border: 0; padding: 0; margin: 0; pointer-events: auto; touch-action: none;
  display: grid; place-content: center; gap: 4px; text-align: center; color: #fff; font-family: var(--pix);
  box-shadow: inset 0 -5px 0 rgba(0,0,0,0.35), 0 4px 0 rgba(0,0,0,0.55);
  transition: transform 50ms linear, filter 50ms linear;
}
.tbtn b { font-size: 20px; font-weight: 700; text-shadow: 0 2px 0 rgba(0,0,0,0.45); }
.tbtn small { font-size: 10px; letter-spacing: 1px; font-weight: 600; opacity: 0.92; }
.tbtn.on { transform: translateY(3px) scale(0.96); filter: brightness(1.25); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.35), 0 1px 0 rgba(0,0,0,0.55); }
#bKnife { width: var(--bk); height: var(--bk); left: 0; bottom: 0; background: radial-gradient(circle at 40% 32%, #ff6a58, var(--knife) 55%, var(--knife-deep)); }
#bJump { width: var(--bk); height: var(--bk); right: 0; bottom: calc(var(--bk) * 0.3); background: radial-gradient(circle at 40% 32%, #ffd86a, var(--jump) 55%, var(--jump-deep)); color: #2a1c00; }
#bJump b { text-shadow: none; }
#bDash { width: var(--bj); height: var(--bj); right: calc((var(--bk) - var(--bj)) / 2); bottom: calc(var(--bk) * 1.3 + 10px); background: radial-gradient(circle at 40% 32%, #b8a4ff, var(--dash) 55%, var(--dash-deep)); }
#bSpecial { width: var(--bs); height: var(--bs); left: calc((var(--bk) - var(--bs)) / 2); bottom: calc(var(--bk) + 12px); background: radial-gradient(circle at 40% 32%, #6ad8f0, var(--spec) 55%, var(--spec-deep)); }

#tPause {
  position: absolute; pointer-events: auto; touch-action: none;
  width: 44px; height: 30px; border-radius: 15px; border: 2px solid #313a52; background: rgba(20,24,36,0.78);
  color: #c9d2e4; font-family: var(--pix); font-size: 13px; font-weight: 700; letter-spacing: 1px;
  right: var(--gr); top: var(--gt);
}
body.portrait #tPause { top: auto; right: auto; left: calc(50% - 22px); bottom: calc(var(--gb) + 6px); width: 58px; }

/* landscape: a handheld layout with the pad in side panels; slightly translucent in case it overlaps the screen edge */
body.touch-on:not(.portrait) #dpad, body.touch-on:not(.portrait) .tbtn { opacity: 0.82; }
body.touch-on:not(.portrait) .tbtn.on { opacity: 1; }
body.touch-on:not(.portrait) #tPause { opacity: 0.85; }
@media (max-height: 420px) {
  .tbtn small { display: none; }
}
.tbtn:focus-visible, #tPause:focus-visible { outline: 2px solid #ffd27a; outline-offset: 3px; }
#screen:focus-visible { outline: none; }
@media (prefers-reduced-motion: reduce) {
  .tbtn, #dpadKnob { transition: none; }
}
</style>

</head>
<body>
<div id="app">
  <canvas id="screen" tabindex="0" aria-label="Dagger Raid game screen. Arrow keys move, Z knife, X jump, C special weapon, V dash, P pause."></canvas>
  <div id="safeProbe" aria-hidden="true"></div>
  <div id="touch" aria-hidden="true">
    <div class="brand"><b>DAGGER</b> RAID<span>TIP: TURN YOUR PHONE SIDEWAYS FOR A BIGGER SCREEN</span></div>
    <div class="grille" aria-hidden="true"></div>
    <div id="dpad" class="tctl">
      <i class="arm h"></i><i class="arm v"></i>
      <i class="ar l"></i><i class="ar r"></i><i class="ar u"></i><i class="ar d"></i>
      <span id="dpadKnob"></span>
    </div>
    <div id="btns">
      <button class="tbtn tctl" type="button" data-k="special" id="bSpecial"><b>C</b><small>SPECIAL</small></button>
      <button class="tbtn tctl" type="button" data-k="dash" id="bDash"><b>D</b><small>DASH</small></button>
      <button class="tbtn tctl" type="button" data-k="knife" id="bKnife"><b>B</b><small>KNIFE</small></button>
      <button class="tbtn tctl" type="button" data-k="jump" id="bJump"><b>A</b><small>JUMP</small></button>
    </div>
    <button id="tPause" type="button" aria-label="Pause">II</button>
  </div>
  <noscript>Dagger Raid needs JavaScript to run.</noscript>
</div>

<script>
(function () {
/* ==========================================================================
   DAGGER RAID
   Core: screen constants, helpers, seeded random, settings, storage
   ========================================================================== */
'use strict';

const W = 384, H = 216;           // internal pixel resolution (16:9)
const HUD_H = 18;
const GROUND_Y = 194;             // ground surface
const L1_Y = 142;                 // first deck
const L2_Y = 92;                  // top deck
const GRAV = 640;
const STEP = 1 / 60;
const TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (p) => Math.random() < p;
const sgn = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const $ = (id) => document.getElementById(id);

function seeded(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

function boxHit(a, b) {
  return a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
}
function box(x0, y0, x1, y1) { return { x0, y0, x1, y1 }; }

const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
const coarse = window.matchMedia ? matchMedia('(pointer: coarse)').matches : isTouch;
const reducedMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)').matches : false;

const store = {
  get(k, d) {
    try { const v = localStorage.getItem('daggerRaid.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; }
  },
  set(k, v) { try { localStorage.setItem('daggerRaid.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } }
};

const settings = Object.assign(
  { music: 0.7, sfx: 0.85, fx: true, shake: !reducedMotion, level: 'soldier', invincible: false, outfit: 'commando', stage: 0, touch: 'auto', muted: false },
  store.get('settings', {})
);
function saveSettings() { store.set('settings', settings); }

const DEFAULT_SCORES = [
  { n: 'DAG', s: 50000, st: 4 }, { n: 'KNF', s: 40000, st: 3 }, { n: 'RAD', s: 30000, st: 3 },
  { n: 'ACE', s: 20000, st: 2 }, { n: 'ZAP', s: 10000, st: 1 }
];
function loadScores() {
  const s = store.get('scores', null);
  if (!Array.isArray(s) || s.length !== 5) return DEFAULT_SCORES.map((e) => Object.assign({}, e));
  return s;
}

const DBG = {};               // profiling switches used by the tests
const QUALITY = { level: 0, res: [1, 0.8, 0.64] };

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

function hexRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixHex(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  const c = A.map((v, i) => Math.round(lerp(v, B[i], t)));
  return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
}

/* ==========================================================================
   Vector drawing helpers. Everything is drawn in world units (384 x 216);
   the screen transform scales it to the device, so shapes stay crisp at any size.
   ========================================================================== */

function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function disc(g, cx, cy, r, c) { if (r <= 0) return; g.fillStyle = c; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill(); }
function ring(g, cx, cy, r, t, c) { g.strokeStyle = c; g.lineWidth = t; g.beginPath(); g.arc(cx, cy, Math.max(0.05, r - t / 2), 0, TAU); g.stroke(); }
function tri(g, cx, top, w, h, c) { g.fillStyle = c; g.beginPath(); g.moveTo(cx, top); g.lineTo(cx + w / 2, top + h); g.lineTo(cx - w / 2, top + h); g.closePath(); g.fill(); }
function stampLine(g, x0, y0, x1, y1, w, col) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function ellipse(g, cx, cy, rx, ry, rot, c) { g.fillStyle = c; g.beginPath(); g.ellipse(cx, cy, Math.max(0.01, rx), Math.max(0.01, ry), rot || 0, 0, TAU); g.fill(); }
function polyPath(g, pts) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); }
function poly(g, pts, c) { g.fillStyle = c; polyPath(g, pts); g.fill(); }
function roundRectPath(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function rrect(g, x, y, w, h, r, c) { g.fillStyle = c; roundRectPath(g, x, y, w, h, r); g.fill(); }
function lgrad(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); for (const [t, c] of stops) gr.addColorStop(t, c); return gr; }
function rgrad(g, x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); for (const [t, c] of stops) gr.addColorStop(t, c); return gr; }
function rgba(hex, a) { const [r, gg, b] = hexRgb(hex); return 'rgba(' + r + ',' + gg + ',' + b + ',' + a + ')'; }
function shade(hex, t) { return t < 0 ? mixHex(hex, '#000000', -t) : mixHex(hex, '#ffffff', t); }

/** A tapered capsule from A to B (radii ra at A, rb at B). */
function capsulePath(g, ax, ay, bx, by, ra, rb) {
  const ang = Math.atan2(by - ay, bx - ax);
  g.beginPath();
  g.arc(ax, ay, Math.max(0.01, ra), ang + Math.PI / 2, ang + Math.PI * 1.5);
  g.arc(bx, by, Math.max(0.01, rb), ang - Math.PI / 2, ang + Math.PI / 2);
  g.closePath();
}

/** A waving, tapered ribbon (sashes, hair, plumes, banners). Returns the tip. */
function ribbonPath(g, x0, y0, ang, len, w0, w1, wave, phase, segs) {
  const n = segs || 8, L = [], R = [];
  let x = x0, y = y0, a = ang;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const w = lerp(w0, w1, t) / 2;
    const nx = -Math.sin(a), ny = Math.cos(a);
    L.push(x + nx * w, y + ny * w); R.push(x - nx * w, y - ny * w);
    a = ang + Math.sin(phase + t * 3.2) * wave * (0.25 + t);
    x += Math.cos(a) * len / n; y += Math.sin(a) * len / n;
  }
  g.beginPath();
  g.moveTo(L[0], L[1]);
  for (let i = 2; i < L.length; i += 2) g.lineTo(L[i], L[i + 1]);
  for (let i = R.length - 2; i >= 0; i -= 2) g.lineTo(R[i], R[i + 1]);
  g.closePath();
  return [x, y];
}

/* ---- cached soft sprites: glows and ground shadows ------------------------------ */
const GLOW_CACHE = {};
function glowSprite(col) {
  let c = GLOW_CACHE[col];
  if (c) return c;
  c = makeCanvas(128, 128);
  const g = c.getContext('2d');
  g.fillStyle = rgrad(g, 64, 64, 0, 64, [[0, rgba(col, 0.6)], [0.35, rgba(col, 0.22)], [0.7, rgba(col, 0.06)], [1, rgba(col, 0)]]);
  g.fillRect(0, 0, 128, 128);
  GLOW_CACHE[col] = c;
  return c;
}
/** Additive soft light centred on x, y with radius r. */
function drawGlow(g, x, y, r, col, a) {
  if (!settings.fx && r > 12) a = (a === undefined ? 1 : a) * 0.6;
  const op = g.globalCompositeOperation, ga = g.globalAlpha;
  g.globalCompositeOperation = 'lighter';
  if (a !== undefined) g.globalAlpha = ga * a;
  g.drawImage(glowSprite(col), x - r, y - r, r * 2, r * 2);
  g.globalCompositeOperation = op; g.globalAlpha = ga;
}
let SOFT_DOT = null;
function softDot() {
  if (SOFT_DOT) return SOFT_DOT;
  const c = makeCanvas(64, 64), g = c.getContext('2d');
  g.fillStyle = rgrad(g, 32, 32, 0, 32, [[0, 'rgba(255,255,255,1)'], [0.5, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
  g.fillRect(0, 0, 64, 64);
  SOFT_DOT = c;
  return c;
}
let SHADOW_SPR = null;
function shadowSprite() {
  if (SHADOW_SPR) return SHADOW_SPR;
  const c = makeCanvas(96, 32), g = c.getContext('2d');
  g.save(); g.scale(1, 1 / 3);
  g.fillStyle = rgrad(g, 48, 48, 0, 48, [[0, 'rgba(0,0,0,0.55)'], [0.55, 'rgba(0,0,0,0.3)'], [1, 'rgba(0,0,0,0)']]);
  g.fillRect(0, 0, 96, 96);
  g.restore();
  SHADOW_SPR = c;
  return c;
}

/** Offscreen canvas for pre-rendered art at the current render scale (world units in, crisp pixels out). */
let RS = 2;
function artCanvas(w, h) {
  const c = makeCanvas(Math.ceil(w * RS), Math.ceil(h * RS));
  const g = c.getContext('2d');
  g.scale(RS, RS);
  c.rs = RS; c.uw = w; c.uh = h;
  return [c, g];
}
/** Draw part of a pre-rendered art canvas; source and destination in world units. */
function blitArt(g, c, sx, sy, sw, sh, dx, dy, dw, dh) {
  const r = c.rs;
  g.drawImage(c, sx * r, sy * r, sw * r, sh * r, dx, dy, dw === undefined ? sw : dw, dh === undefined ? sh : dh);
}

/* ==========================================================================
   Type: Barlow Condensed for the interface and Black Ops One, a stencil face,
   for titles. Sizes are in world units, so text stays sharp at any resolution.
   ========================================================================== */

const FONT_UI = '"Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif';
const FONT_DISPLAY = '"Black Ops One", "Barlow Condensed", Impact, "Arial Narrow", sans-serif';
const MEASURE = makeCanvas(4, 4).getContext('2d');

function fontSpec(scale, opts) {
  const s = 8.4 * (scale || 1);
  if (opts && opts.display) return '400 ' + s + 'px ' + FONT_DISPLAY;
  return (opts && opts.weight || 600) + ' ' + s + 'px ' + FONT_UI;
}

function textWidth(str, scale, opts) {
  MEASURE.font = fontSpec(scale, opts);
  return MEASURE.measureText(opts && opts.raw ? String(str) : String(str).toUpperCase()).width;
}

/** Draw text with its top at y. opts: { scale, align, shadow, display, weight, raw, stroke, strokeW } */
function drawText(g, str, x, y, color, opts) {
  str = String(str);
  if (!(opts && opts.raw)) str = str.toUpperCase();
  const s = (opts && opts.scale) || 1;
  g.font = fontSpec(s, opts);
  g.textBaseline = 'top';

   Sound polish: a room reverb on every effect, and extra body layered under the
   hits, blades, shots and blasts so they land with weight.
   ========================================================================== */

(function soundPolish() {
  const ROOM = [1.3, 2.3, 0.15];
  const MAP = {
    hit: [['impact', 1]], down: [['impact', 1], ['soft', 1.2]], hurt: [['impact', 0.9]], die: [['impact', 1.2], ['soft', 1.4]], chop: [['impact', 1]],
    crate: [['impact', 0.9], ['soft', 1]], thud: [['soft', 1.2]], land: [['soft', 0.8]], clang: [['steel', 1.1], ['impact', 0.6]], tink: [['steel', 1]],
    knife: [['air', 0.9], ['steel', 0.5]], katana: [['air', 1.1], ['steel', 0.8]], thrust: [['air', 1], ['steel', 0.7]], throw: [['air', 0.9]],
    star: [['steel', 0.6]], dash: [['air', 1.1]], whoosh: [['air', 0.9]], jump2: [['air', 0.6]], crit: [['steel', 1], ['impact', 1.2]],
    shot: [['shot', 1]], snipe: [['shot', 1.3]], rocket: [['shot', 0.8], ['air', 1.2]], boom: [['heavy', 1]], roar: [['heavy', 0.6]],
    pickup: [['shine', 1]], weapon: [['shine', 1], ['steel', 0.6]], coin: [['shine', 1]], free: [['shine', 1.1]], finisher: [['heavy', 0.7], ['steel', 1.2]]
  };

    const len = Math.floor(c.sampleRate * seconds), buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  /** Built once, the first time a sound plays: effects bus -> short hall -> master. */
  function room(chip) {
    if (chip.room || !chip.ctx || !chip.sfxBus || !chip.master) return;
    chip.room = true;
    try {
      const c = chip.ctx, cv = c.createConvolver(), wet = c.createGain(), lp = c.createBiquadFilter();
      cv.buffer = impulse(c, ROOM[0], ROOM[1]);
      lp.type = 'lowpass'; lp.frequency.value = 3800;
      wet.gain.value = ROOM[2];

  }

    impact(s, t, k) {
      s.tone(t, 150 * r(0.88, 1.12), 0.09, 'sin', 0.24 * k, null, { slide: 52 });
      s.noise(t, 0.028, 0.24 * k, 'bandpass', r(2200, 3200), 1.2);
      s.noise(t + 0.012, 0.06, 0.1 * k, 'lowpass', 900, 0.7);
    },
    heavy(s, t, k) {
      s.tone(t, 78, 0.42, 'sin', 0.4 * k, null, { slide: 27 });
      s.noise(t, 0.7, 0.3 * k, 'lowpass', 240, 0.6, null, { sweep: 60 });
      for (let i = 0; i < 5; i++) s.noise(t + 0.12 + i * r(0.05, 0.09), 0.03, 0.09 * k, 'highpass', r(2000, 5000), 0.8);
    },
    air(s, t, k) { s.noise(t, 0.13, 0.13 * k, 'bandpass', r(1100, 2000), 0.7, null, { sweep: r(4600, 6200) }); },
    steel(s, t, k) {
      s.tone(t, r(3300, 3900), 0.2, 'sin', 0.035 * k, null, { slide: 2500 });
      s.noise(t, 0.05, 0.1 * k, 'highpass', 5200, 0.8, null, { metal: true });
    },
    shot(s, t, k) {
      s.tone(t, 130, 0.08, 'sin', 0.24 * k, null, { slide: 46 });
      s.noise(t + 0.02, 0.26, 0.09 * k, 'lowpass', 1500, 0.5, null, { sweep: 260 });
    },
    soft(s, t, k) { s.tone(t, 96, 0.07, 'sin', 0.14 * k, null, { slide: 50 }); },
    shine(s, t, k) { s.tone(t + 0.02, r(2900, 3300), 0.22, 'sin', 0.03 * k, null, { decay: 0.06, sus: 0.3 }); }
  };

/* ---- inverse kinematics --------------------------------------------- */
function ik2(ax, ay, bx, by, l1, l2, prefer) {
  let dx = bx - ax, dy = by - ay;
  let d = Math.hypot(dx, dy);
  const maxD = l1 + l2 - 0.02;
  if (d > maxD) { bx = ax + (dx / d) * maxD; by = ay + (dy / d) * maxD; dx = bx - ax; dy = by - ay; d = maxD; }
  if (d < 0.01) d = 0.01;
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mx = ax + (dx * a) / d, my = ay + (dy * a) / d;
  const pxv = -dy / d, pyv = dx / d;
  const j1 = [mx + pxv * h, my + pyv * h], j2 = [mx - pxv * h, my - pyv * h];
  let j;
  if (prefer === 'fwd') j = j1[0] >= j2[0] ? j1 : j2;
  else if (prefer === 'back') j = j1[0] <= j2[0] ? j1 : j2;
  else if (prefer === 'down') j = j1[1] >= j2[1] ? j1 : j2;
  else j = j1[1] <= j2[1] ? j1 : j2;
  return { j, e: [bx, by] };
}

/* ---- puppet ------------------------------------------------------------ */
function rotPt(p, r) {
  if (!r) return p;
  const c = Math.cos(r), s = Math.sin(r);
  return [p[0] * c + p[1] * s, -p[0] * s + p[1] * c];
}

function solvePose(pose, k) {
  const hipY = -(pose.hip == null ? 14 : pose.hip) * k;
  const tl = (pose.tl || 10) * k;
  const lean = (pose.lean || 0) * k;
  const hip = [0, hipY];
  const neck = [lean, hipY - Math.sqrt(Math.max(1, tl * tl - lean * lean))];
  const hd = pose.hd || [0, 0];
  const head = [neck[0] + 0.5 * k + hd[0] * k, neck[1] - 3.5 * k + hd[1] * k];
  const shF = [neck[0] + 0.5 * k, neck[1] + 1.5 * k];
  const shB = [neck[0] - 0.5 * k, neck[1] + 1.5 * k];
  const S = (p) => [p[0] * k, p[1] * k];
  const legF = ik2(hip[0] + 1 * k, hip[1], ...S(pose.ff || [3, 0]), 7 * k, 7 * k, pose.kneeF || 'fwd');
  const legB = ik2(hip[0] - 1 * k, hip[1], ...S(pose.bf || [-3, 0]), 7 * k, 7 * k, pose.kneeB || 'fwd');
  const armF = ik2(shF[0], shF[1], ...S(pose.fh || [5, -13]), 5 * k, 5 * k, pose.elbowF || 'back');
  const armB = ik2(shB[0], shB[1], ...S(pose.bh || [-2, -12]), 5 * k, 5 * k, pose.elbowB || 'back');
  const r = ((pose.rot || 0) * Math.PI) / 180;
  const R = (p) => rotPt(p, r);
  return {
    hip: R(hip), neck: R(neck), head: R(head), shF: R(shF), shB: R(shB),
    kneeF: R(legF.j), footF: R(legF.e), kneeB: R(legB.j), footB: R(legB.e),
    elbF: R(armF.j), handF: R(armF.e), elbB: R(armB.j), handB: R(armB.e),
    rot: r
  };
}

      g.lineWidth = 1.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - ux * 12, y - uy * 12); g.lineTo(x, y); g.stroke();

      g.restore();
      break;
    }
    case 'star': {
      const dir = sgn(s.vx) || 1, col = s.foe ? '#ff8a8a' : '#bfe6ff';
      g.globalAlpha *= 0.4; stampLine(g, x - dir * 13, y, x, y, 1.6, col); g.globalAlpha /= 0.4;
      drawGlow(g, x, y, 6.5, s.foe ? '#ff5a4a' : '#9fe8ff', 0.6);

      g.beginPath(); g.moveTo(x - f * 4.5, y - 1.6); g.quadraticCurveTo(x - f * (5 + fl * 0.6), y - 1.2, x - f * (5 + fl), y); g.quadraticCurveTo(x - f * (5 + fl * 0.6), y + 1.2, x - f * 4.5, y + 1.6); g.closePath(); g.fill();

/* ---- explosions and other effects ------------------------------------------------------- */
function drawBoomV(g, x, y, r, t) {
  const k = clamp(t / 0.5, 0, 1);
  if (t < 0.06) {
    drawGlow(g, x, y, r * 2.6, '#fff2c0', 1);
    disc(g, x, y, r * (0.5 + t * 6), '#fffdf0');
    return;
  }
  drawGlow(g, x, y - k * 5, r * (2.3 - k * 0.6), '#ff9a30', 0.95 * (1 - k));
  const rr = r * (0.6 + k * 0.5), n = 8;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + r, w = 0.6 + 0.4 * Math.sin(i * 3.1 + r);
    const d = rr * 0.5 * w * (0.5 + k * 0.7);
    const bx = x + Math.cos(a) * d, by = y + Math.sin(a) * d * 0.8 - k * 8;
    const br = Math.max(0.6, rr * 0.56 * (1 - k * 0.45) * (0.8 + 0.3 * w));
    const col = k < 0.22 ? '#ffe68a' : k < 0.45 ? '#ff9a30' : k < 0.7 ? '#c8502a' : '#55504e';
    drawPuff(g, bx, by, br, col, 1 - k * k * 0.9);
  }
  if (k < 0.5) drawPuff(g, x, y - k * 8, rr * 0.5 * (1 - k), '#fff8d8', 1 - k * 2);
  // shock ring hugging the ground plane
  g.save(); g.translate(x, y); g.scale(1, 0.55);
  g.globalAlpha = (1 - k) * 0.8; g.strokeStyle = '#fff0c8'; g.lineWidth = 1.4 * (1 - k) + 0.3;
  g.beginPath(); g.arc(0, 0, r * (0.5 + k * 1.5), 0, TAU); g.stroke();
  g.restore(); g.globalAlpha = 1;
}

function drawFxV(g, cx) {
  for (const f of game.fx) {
    const x = f.x - cx, y = f.y;
    switch (f.k) {
      case 'p': {
        const a = clamp(1 - f.t / f.life, 0, 1);
        g.globalAlpha = Math.min(1, a * 1.6);
        if (f.glow) drawGlow(g, x, y, 4 + f.sz * 2, f.col, 0.7 * a);
        const sp = Math.hypot(f.vx, f.vy);
        if (sp > 40 && !f.chunk) stampLine(g, x - (f.vx / sp) * (1.2 + f.sz), y - (f.vy / sp) * (1.2 + f.sz), x, y, 0.5 + f.sz * 0.35, f.col);
        else { g.save(); g.translate(x, y); g.rotate(f.t * 9 + f.life * 40); rect(g, -f.sz * 0.6, -f.sz * 0.6, f.sz * 1.2, f.sz * 1.2, f.col); g.restore(); }
        g.globalAlpha = 1;
        break;
      }
      case 'smoke': {
        const k = f.t / f.life;
        drawPuff(g, x, y, f.r * (1.4 + k * 1.8), f.col, (1 - k) * 0.75);
        break;
      }
      case 'star': {
        const k = f.t / f.life, s = (f.big ? 8 : 5) * (1 - k * 0.5);
        drawGlow(g, x, y, s * 2.2, f.col || '#fff2a0', 1 - k);
        g.save(); g.translate(x, y); g.rotate((f.x * 7) % 1.5);
        g.fillStyle = '#ffffff';
        for (let i = 0; i < 4; i++) { g.rotate(Math.PI / 2); g.beginPath(); g.moveTo(-0.8, 0); g.lineTo(0, -s); g.lineTo(0.8, 0); g.closePath(); g.fill(); }
        g.restore(); disc(g, x, y, s * 0.3, f.col || '#fff2a0');
        break;
      }
      case 'flash': {
        const k = f.t / f.life;
        drawGlow(g, x, y, 11, '#ffd880', 1 - k * 0.5);
        g.save(); g.translate(x, y); g.fillStyle = '#fff8dc';
        for (let i = 0; i < 6; i++) { g.rotate(TAU / 6); g.beginPath(); g.moveTo(-0.7, 0); g.lineTo(0, -(i % 2 ? 3.2 : 5.4)); g.lineTo(0.7, 0); g.closePath(); g.fill(); }
        g.restore(); disc(g, x, y, 1.7, '#ffffff');
        break;
      }
      case 'boom': drawBoomV(g, x, y, f.r, f.t); break;
      case 'ring': {
        const k = f.t / f.life, r = lerp(f.r0, f.r1, 1 - (1 - k) * (1 - k));
        g.save(); g.translate(x, y); if (f.flat) g.scale(1, 0.4);
        g.globalAlpha = (1 - k) * (f.a || 0.9); g.strokeStyle = f.col || '#ffffff'; g.lineWidth = (f.w || 1.2) * (1 - k * 0.6);
        g.beginPath(); g.arc(0, 0, Math.max(0.1, r), 0, TAU); g.stroke();
        g.restore(); g.globalAlpha = 1;
        break;
      }
      case 'slash': {
        // crescent left hanging in the air by a blade
        const k = f.t / f.life, a0 = f.a0, a1 = f.a1, R = f.r;
        g.save(); g.translate(x, y); g.scale(f.face, 1);
        g.globalAlpha = (1 - k) * 0.85;
        g.fillStyle = lgrad(g, 0, -R, 0, R, [[0, 'rgba(255,255,255,0)'], [0.5, f.col || '#eaf6ff'], [1, 'rgba(255,255,255,0)']]);
        g.beginPath(); g.arc(0, 0, R, a0, a1); g.arc(-R * 0.18, 0, R * 0.82, a1, a0, true); g.closePath(); g.fill();
        g.restore(); g.globalAlpha = 1;
        break;
      }
      case 'bolt': {
        // jagged electric line used by the citadel storm
        g.globalAlpha = 1 - f.t / f.life; g.strokeStyle = '#eaf2ff'; g.lineWidth = 1.2; g.lineJoin = 'bevel';
        g.beginPath(); g.moveTo(x, HUD_H);
        for (let i = 1; i <= 8; i++) g.lineTo(x + (h01(f.seed + i) - 0.5) * 26 * (1 - i / 9), HUD_H + (y - HUD_H) * (i / 8));
        g.stroke(); g.globalAlpha = 1;
        break;
      }
      default: break;
    }
  }
}

const LV_Y = [GROUND_Y, L1_Y, L2_Y];
const LAYER_W = 768;

function D(x0, x1, lv, style) { return { x0, x1, lv, y: LV_Y[lv], style }; }
function LAD(x, a, b) { return { x, lo: LV_Y[a], hi: LV_Y[b], a, b }; }
function wrapX(LW, x, w, fn) { fn(x); if (x - w < 0) fn(x + LW); if (x + w > LW) fn(x - LW); }

/** The surface a deck's supports stand on. */
function floorBelow(st, d) {
  let y = GROUND_Y;
  for (const o of st.decks) if (o.y > d.y && o.x0 <= d.x0 + 8 && o.x1 >= d.x1 - 8 && o.y < y) y = o.y;
  return y;
}

/* ==========================================================================
   Stage art: painted parallax backdrops and the playfield, all vector.
   Backdrops are pre-rendered once per stage at the screen's resolution. The
   long playfield is painted in 512 unit chunks on demand, so memory stays low.
   ========================================================================== */

const CHUNK = 512;

function skyFill(g, stops) { g.fillStyle = lgrad(g, 0, 0, 0, H, stops); g.fillRect(0, 0, W, H); }

/** Tileable ridge filled downward with a vertical gradient. Returns the height lookup. */
function ridgeV(g, LW, base, harm, sharp, seed, cTop, cBot, bottom) {
  const R = seeded(seed), ph = harm.map(() => R() * TAU);
  const yAt = (x) => {
    let y = base;
    for (let i = 0; i < harm.length; i++) {
      const s = Math.sin((x / LW) * TAU * harm[i][0] + ph[i]);
      y -= harm[i][1] * (sharp ? 1 - Math.abs(s) : (s + 1) / 2);
    }
    return y;
  };
  let top = 1e9;
  for (let x = 0; x <= LW; x += 3) top = Math.min(top, yAt(x));
  const bot = bottom || H;
  g.fillStyle = lgrad(g, 0, top, 0, bot, [[0, cTop], [1, cBot]]);
  g.beginPath(); g.moveTo(-2, bot);
  for (let x = -2; x <= LW + 2; x += sharp ? 1 : 2) g.lineTo(x, yAt(x));
  g.lineTo(LW + 2, bot); g.closePath(); g.fill();
  return yAt;
}

function cloudV(g, x, y, w, h, lit, shadow) {
  const lobes = [[-0.36, 0.16, 0.2, 0.34], [-0.14, -0.06, 0.24, 0.5], [0.12, 0.02, 0.26, 0.44], [0.36, 0.18, 0.18, 0.3]];
  for (const [ox, oy, rx, ry] of lobes) ellipse(g, x + ox * w, y + oy * h + h * 0.1, rx * w, ry * h, 0, shadow);
  rrect(g, x - w * 0.5, y + h * 0.2, w, h * 0.3, h * 0.15, shadow);
  for (const [ox, oy, rx, ry] of lobes) ellipse(g, x + ox * w - w * 0.02, y + oy * h, rx * w * 0.92, ry * h * 0.82, 0, lit);
}

function hazeBand(g, LW, y0, y1, col, a) {
  g.fillStyle = lgrad(g, 0, y0, 0, y1, [[0, rgba(col, 0)], [0.5, rgba(col, a)], [1, rgba(col, 0)]]);
  g.fillRect(0, y0, LW, y1 - y0);
}

/* ---- trees ------------------------------------------------------------------- */
function palmV(g, x, base, h, lean, trunk, leafD, leafL) {
  const tx = x + lean, ty = base - h;
  g.lineCap = 'round';
  g.strokeStyle = trunk; g.lineWidth = 3.4;
  g.beginPath(); g.moveTo(x, base); g.quadraticCurveTo(x + lean * 0.15, base - h * 0.55, tx, ty); g.stroke();
  g.strokeStyle = shade(trunk, 0.2); g.lineWidth = 0.9;
  g.beginPath(); g.moveTo(x - 0.9, base); g.quadraticCurveTo(x + lean * 0.15 - 0.9, base - h * 0.55, tx - 0.8, ty); g.stroke();
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI + (i / 8) * Math.PI, len = 22 + 7 * Math.sin(i * 2.1 + x);
    const ex = tx + Math.cos(a) * len, ey = ty + Math.sin(a) * len * 0.36 + 9 + Math.abs(Math.cos(a)) * 5;
    const cx = tx + Math.cos(a) * len * 0.55, cy = ty - 7 + Math.sin(a) * 5;
    g.fillStyle = i % 2 ? leafD : leafL;
    g.beginPath(); g.moveTo(tx, ty); g.quadraticCurveTo(cx, cy - 3.4, ex, ey); g.quadraticCurveTo(cx, cy + 3.2, tx, ty + 1.6); g.closePath(); g.fill();
  }
  disc(g, tx, ty + 0.6, 2.2, leafD);
}

function canopyV(g, x, y, r, dark, mid, lit) {
  for (const [ox, oy, k] of [[-0.6, 0.2, 0.72], [0.55, 0.25, 0.7], [0, 0, 1], [-0.25, -0.45, 0.66], [0.32, -0.38, 0.6]]) disc(g, x + ox * r, y + oy * r, r * k, dark);
  for (const [ox, oy, k] of [[-0.5, 0.05, 0.56], [0.42, 0.1, 0.52], [-0.05, -0.2, 0.74], [0.2, -0.55, 0.42]]) disc(g, x + ox * r - r * 0.08, y + oy * r - r * 0.1, r * k, mid);
  for (const [ox, oy, k] of [[-0.42, -0.2, 0.3], [0.05, -0.5, 0.34], [0.4, -0.3, 0.22]]) disc(g, x + ox * r - r * 0.12, y + oy * r - r * 0.12, r * k, lit);
}

function pineV(g, x, base, h, dark, mid, snow) {
  rect(g, x - 1, base - 3, 2, 5, '#3a2c24');
  const tiers = 4;
  for (let i = 0; i < tiers; i++) {
    const t = i / tiers, ty = base - 2 - t * h * 0.8, tw = (1 - t * 0.72) * h * 0.4, th = h * 0.36;
    poly(g, [x, ty - th, x + tw, ty, x - tw, ty], dark);
    poly(g, [x, ty - th, x + tw * 0.2, ty - th * 0.3, x - tw * 0.86, ty, x - tw, ty], mid);
    if (snow) { poly(g, [x, ty - th, x + tw * 0.5, ty - th * 0.45, x + tw * 0.12, ty - th * 0.5, x - tw * 0.2, ty - th * 0.35, x - tw * 0.45, ty - th * 0.5], snow); }
  }
}

/* ---- ladders and the four kinds of deck ------------------------------------------- */
function paintLadderV(g, L, s) {
  const x = L.x, top = L.hi - 12, bot = L.lo;
  for (const dx of [-5.6, 4.2]) {
    rect(g, x + dx - 0.35, top - 0.3, 2.1, bot - top + 0.3, INK);
    g.fillStyle = lgrad(g, x + dx, 0, x + dx + 1.4, 0, [[0, s.lHi], [1, s.lRail]]); g.fillRect(x + dx, top, 1.4, bot - top);
  }
  for (let y = bot - 4; y > top + 1; y -= 6) {
    rrect(g, x - 4.6, y - 0.3, 9.6, 2.2, 0.8, INK);
    rrect(g, x - 4.2, y, 8.8, 1.5, 0.6, s.lRung); rect(g, x - 4, y + 1, 8.4, 0.5, s.lRail);
  }
}

function deckShadow(g, d, fy) {
  g.fillStyle = lgrad(g, 0, d.y + 5, 0, Math.min(fy, d.y + 26), [[0, 'rgba(0,0,0,0.3)'], [1, 'rgba(0,0,0,0)']]);
  g.fillRect(d.x0 + 2, d.y + 5, d.x1 - d.x0 - 4, Math.min(fy, d.y + 26) - d.y - 5);
}

function paintDeckWood(g, st, d) {
  const s = st.look, fy = floorBelow(st, d), w = d.x1 - d.x0;
  const n = Math.max(2, Math.round(w / 44));
  const px = (i) => lerp(d.x0 + 5, d.x1 - 9, i / n);
  for (let i = 0; i < n; i++) {
    const a = px(i) + 4, b = px(i + 1), y0 = d.y + 7, y1 = Math.min(fy - 4, d.y + 28);
    stampLine(g, a, y0, b, y1, 2.6, INK); stampLine(g, a, y1, b, y0, 2.6, INK);
    stampLine(g, a, y0, b, y1, 1.8, s.brace); stampLine(g, a, y1, b, y0, 1.8, shade(s.brace, 0.12));
  }
  for (let i = 0; i <= n; i++) {
    const x = px(i);
    rect(g, x - 0.4, d.y + 4, 5.8, fy - d.y - 4, INK);
    g.fillStyle = lgrad(g, x, 0, x + 5, 0, [[0, s.postHi], [0.45, s.post], [1, s.postLo]]); g.fillRect(x, d.y + 4, 5, fy - d.y - 4);

function paintDeckSteel(g, st, d, girder) {
  const s = st.look, fy = floorBelow(st, d), w = d.x1 - d.x0;
  const n = Math.max(1, Math.round(w / 70));
  for (let i = 0; i <= n; i++) {
    const x = lerp(d.x0 + 6, d.x1 - 14, i / n);
    g.lineCap = 'butt';
    for (let y = d.y + 8; y < fy - 6; y += 10) { stampLine(g, x + 1, y, x + 7, y + 10, 0.9, s.brace); stampLine(g, x + 7, y, x + 1, y + 10, 0.9, shade(s.brace, 0.15)); }
    for (const dx of [0, 6]) { rect(g, x + dx - 0.4, d.y + 5, 2.8, fy - d.y - 5, INK); rect(g, x + dx, d.y + 5, 2, fy - d.y - 5, s.post); rect(g, x + dx, d.y + 5, 0.6, fy - d.y - 5, s.postHi); }
    rect(g, x - 2, fy - 2.2, 12, 2.2, INK); rect(g, x - 1.6, fy - 1.8, 11.2, 1.8, s.postLo);
  }
  deckShadow(g, d, fy);
  // railing
  for (let x = d.x0; x <= d.x1 + 0.1; x += 16) { rect(g, x - 0.7, d.y - 11.4, 1.5, 11.6, INK); rect(g, x - 0.4, d.y - 11.2, 0.9, 11.2, s.rail); }
  rect(g, d.x0 - 0.6, d.y - 11.8, w + 1.2, 1.5, INK); rect(g, d.x0 - 0.3, d.y - 11.5, w + 0.6, 0.9, s.rail);
  rect(g, d.x0, d.y - 6.3, w, 0.7, s.railLo);
  // slab
  const th = girder ? 7 : 5;
  rrect(g, d.x0 - 1.4, d.y - 0.4, w + 2.8, th + 0.8, 0.8, INK);
  g.fillStyle = lgrad(g, 0, d.y, 0, d.y + th, [[0, s.dkHi], [0.3, s.dk], [1, s.dkLo]]); g.fillRect(d.x0 - 1, d.y, w + 2, th);
  rect(g, d.x0 - 1, d.y, w + 2, 0.7, shade(s.dkHi, 0.3));
  if (girder) {
    rect(g, d.x0 - 1, d.y + 1.6, w + 2, 0.5, s.dkLo); rect(g, d.x0 - 1, d.y + 5.2, w + 2, 0.5, s.dkLo);
    for (let x = d.x0 + 4; x < d.x1 - 2; x += 8) { disc(g, x, d.y + 3.4, 0.55, s.rivet); disc(g, x - 0.15, d.y + 3.25, 0.25, '#ffffff'); }
    for (const ex of [d.x0 + 2, d.x1 - 2]) { rect(g, ex - 0.8, d.y - 14.4, 1.6, 3, INK); disc(g, ex, d.y - 14.6, 1.5, INK); disc(g, ex, d.y - 14.6, 1.1, '#a02a22'); }
  } else {
    g.save(); g.beginPath(); g.rect(d.x0 - 1, d.y + 2.6, w + 2, 2.4); g.clip();
    g.fillStyle = s.hazB; g.fillRect(d.x0 - 1, d.y + 2.6, w + 2, 2.4);
    g.fillStyle = s.hazA;
    for (let x = d.x0 - 6; x < d.x1 + 4; x += 6) { g.beginPath(); g.moveTo(x, d.y + 5.2); g.lineTo(x + 3, d.y + 5.2); g.lineTo(x + 6, d.y + 2.4); g.lineTo(x + 3, d.y + 2.4); g.closePath(); g.fill(); }
    g.restore();
  }
}

function paintDeckV(g, st, d) {
  const style = d.style || (st.look.deck === 'car' && d.lv === 2 ? 'steel' : st.look.deck);
  if (style === 'wood') paintDeckWood(g, st, d);
  else if (style === 'car') paintDeckCar(g, st, d);
  else paintDeckSteel(g, st, d, style === 'girder');
}

/** Scatter positions that the old sequential generator produced, computed once per stage. */
function scatter(st, key, from, to, step, jitter, seed) {
  st._sc = st._sc || {};
  if (st._sc[key]) return st._sc[key];
  const R = seeded(seed), out = [];
  for (let x = from; x < to; x += step + R() * jitter) out.push({ x, r: R() });
  st._sc[key] = out;
  return out;
}

/** Stone portal of the rail tunnel. The front face is redrawn over the train as it rolls out. */
function paintTunnel(g, tx, frontOnly) {
  const gy = GROUND_Y;
  const stone = (x, y, w, h, i) => { rrect(g, x, y, w, h, 0.8, ['#7b828c', '#6b727c', '#868d98'][i % 3]); rect(g, x + 0.4, y + 0.3, w - 0.8, 0.6, 'rgba(255,255,255,0.22)'); };
  if (!frontOnly) {
    rect(g, tx - 0.6, gy - 124.6, 70, 125, INK);
    g.fillStyle = lgrad(g, 0, gy - 124, 0, gy, [[0, '#6c737d'], [1, '#4a5058']]); g.fillRect(tx, gy - 124, 70, 124);
    for (let y = gy - 122, r = 0; y < gy; y += 8, r++) for (let x = tx + (r % 2) * 6 - 6; x < tx + 70; x += 12) stone(x + 0.5, y + 0.5, 11, 7, Math.floor(h01(x * 3 + y) * 3));
    // the dark bore
    g.fillStyle = '#07080b'; g.beginPath(); g.moveTo(tx + 14, gy); g.lineTo(tx + 14, gy - 84); g.arc(tx + 38, gy - 84, 24, Math.PI, 0); g.lineTo(tx + 70, gy); g.closePath(); g.fill();
    g.fillStyle = lgrad(g, tx + 14, 0, tx + 44, 0, [[0, 'rgba(60,70,86,0.5)'], [1, 'rgba(60,70,86,0)']]); g.fillRect(tx + 14, gy - 108, 30, 108);
  }
  // voussoirs round the arch and the left jamb, in front of anything leaving the tunnel
  for (let i = 0; i <= 18; i++) {
    const a = Math.PI + (i / 18) * Math.PI, ax = tx + 38 + Math.cos(a) * 27.5, ay = gy - 84 + Math.sin(a) * 27.5;
    g.save(); g.translate(ax, ay); g.rotate(a + Math.PI / 2);
    rrect(g, -3.6, -4.4, 7.2, 8.8, 1, INK); rrect(g, -3.1, -3.9, 6.2, 7.8, 0.8, i === 9 ? '#a8aeb8' : i % 2 ? '#8a919c' : '#7a818c');
    g.restore();
  }
  for (let y = gy - 84; y < gy; y += 9) { rrect(g, tx + 5.6, y, 9.4, 9.4, 1, INK); rrect(g, tx + 6.1, y + 0.5, 8.4, 8.4, 0.8, Math.floor(y / 9) % 2 ? '#8a919c' : '#7a818c'); }
  if (!frontOnly) {
    // snow on the parapet
    g.fillStyle = '#f4f8fb'; g.beginPath(); g.moveTo(tx - 2, gy - 122);
    for (let x = tx - 2; x < tx + 70; x += 8) g.quadraticCurveTo(x + 4, gy - 130 - h01(x) * 3, x + 8, gy - 124.5);
    g.lineTo(tx + 72, gy - 121); g.lineTo(tx - 2, gy - 121); g.closePath(); g.fill();
    for (let x = tx + 3; x < tx + 68; x += 6 + h01(x) * 6) poly(g, [x, gy - 121, x + 1.6, gy - 121, x + 0.8, gy - 116 - h01(x * 2) * 4], '#e8f1f8');
  }
}

/* ====================== building and drawing ====================== */
let STAGE_ART = null;

function artCanvasK(w, h, k) {
  const keep = RS;
  RS = Math.max(1, RS * k);
  const out = artCanvas(w, h);
  RS = keep;
  return out;
}
function freeArt(L) {
  if (!L) return;
  for (const k of ['sky', 'clouds', 'far', 'mid', 'near', 'overlay']) if (L[k]) { L[k].width = 1; L[k].height = 1; }
  for (const c of L.chunks.values()) { c.width = 1; c.height = 1; }
  L.chunks.clear();
}

/** The painted layers for a stage at the current render scale. Only one stage is held at a time. */
function stageArt(st) {
  if (STAGE_ART && STAGE_ART.id === st.id && STAGE_ART.rs === RS) return STAGE_ART;
  freeArt(STAGE_ART);
  const art = ART[st.id];
  const L = { id: st.id, rs: RS, chunks: new Map() };
  let c, g;
  [c, g] = artCanvasK(W, H, 0.75); art.sky(g); L.sky = c;
  [c, g] = artCanvasK(LAYER_W, H, 0.6); art.clouds(g); L.clouds = c;
  [c, g] = artCanvasK(LAYER_W, H, 0.8); art.far(g); L.far = c;
  [c, g] = artCanvas(LAYER_W, H); art.mid(g); L.mid = c;
  [c, g] = artCanvas(LAYER_W, H); art.near(g); L.near = c;
  if (art.overlay) { [c, g] = artCanvas(art.overlay.w, H); art.overlay.paint(g); L.overlay = c; L.overlayX = art.overlay.x(st); }
  L.lights = art.lights ? art.lights(st) : [];
  const R = seeded(st.len);
  L.front = [];
  for (let x = 40; x < st.len * 1.3; x += 90 + R() * 160) L.front.push({ x, kind: art.front[Math.floor(R() * art.front.length)], s: R() });
  STAGE_ART = L;
  return L;
}

function paintLevelRange(g, st, x0, x1) {
  const art = ART[st.id];
  art.decor(g, st, x0, x1);
  const ds = st.decks.filter((d) => d.x1 > x0 - 40 && d.x0 < x1 + 40).sort((a, b) => a.y - b.y);
  for (const d of ds) paintDeckV(g, st, d);
  for (const l of st.ladders) if (l.x > x0 - 10 && l.x < x1 + 10) paintLadderV(g, l, st.look);
  art.ground(g, x0, x1);
}

function levelChunk(L, st, i) {
  let c = L.chunks.get(i);
  if (c) return c;
  const x0 = i * CHUNK;
  let g;
  [c, g] = artCanvas(CHUNK + 1, H);
  g.translate(-x0, 0);
  paintLevelRange(g, st, x0, x0 + CHUNK + 1);
  L.chunks.set(i, c);
  if (L.chunks.size > 4) {
    let far = null, fd = -1;
    for (const k of L.chunks.keys()) { const d = Math.abs(k - i); if (d > fd) { fd = d; far = k; } }
    const old = L.chunks.get(far); old.width = 1; old.height = 1; L.chunks.delete(far);
  }
  return c;
}

/** Draw the playfield under the camera, painting chunks just before they scroll in. */
function drawLevel(g, L, st, cx) {
  const i0 = Math.max(0, Math.floor(cx / CHUNK)), i1 = Math.floor((cx + W) / CHUNK);
  for (let i = i0; i <= i1 && i * CHUNK < st.len; i++) blitArt(g, levelChunk(L, st, i), 0, 0, CHUNK + 1, H, i * CHUNK - cx, 0);
  const nxt = i1 + 1;
  if (nxt * CHUNK - (cx + W) < 96 && nxt * CHUNK < st.len && !L.chunks.has(nxt)) levelChunk(L, st, nxt);
}

/** One wrapped parallax layer. */
function drawLayer(g, c, ox) {
  ox = ((ox % LAYER_W) + LAYER_W) % LAYER_W;
  blitArt(g, c, 0, 0, LAYER_W, H, -ox, 0);
  if (LAYER_W - ox < W) blitArt(g, c, 0, 0, LAYER_W, H, LAYER_W - ox - 0.25, 0);
}

/* ---- the close foreground: dark shapes that slide past faster than the playfield ---- */
function drawFrontPiece(g, f, x, col, t) {
  const sway = Math.sin(t * 1.3 + f.s * 6);
  switch (f.kind) {
    case 'fern':
      for (let i = 0; i < 7; i++) {
        const a = -Math.PI / 2 + (i - 3) * 0.34 + sway * 0.04, len = 30 + (i % 3) * 6;
        const ex = x + Math.cos(a) * len, ey = H - 4 + Math.sin(a) * len * 0.8;
        g.fillStyle = i % 2 ? col : shade(col, 0.1);
        g.beginPath(); g.moveTo(x - 2, H + 2); g.quadraticCurveTo(x + Math.cos(a) * len * 0.5 - 5, H + Math.sin(a) * len * 0.55, ex, ey);
        g.quadraticCurveTo(x + Math.cos(a) * len * 0.5 + 5, H + Math.sin(a) * len * 0.45, x + 2, H + 2); g.closePath(); g.fill();
      }
      break;
    case 'leaf':
      for (let i = 0; i < 3; i++) {
        const a = -Math.PI / 2 + (i - 1) * 0.7 + sway * 0.05, len = 34 - i * 4;
        const ex = x + Math.cos(a) * len, ey = H + Math.sin(a) * len;
        const nx = -Math.sin(a) * 9, ny = Math.cos(a) * 9;
        g.fillStyle = i === 1 ? shade(col, 0.1) : col;
        g.beginPath(); g.moveTo(x, H + 2); g.quadraticCurveTo((x + ex) / 2 + nx, (H + ey) / 2 + ny, ex, ey); g.quadraticCurveTo((x + ex) / 2 - nx, (H + ey) / 2 - ny, x, H + 2); g.closePath(); g.fill();
        stampLine(g, x, H + 2, ex, ey, 0.6, shade(col, 0.22));
      }
      break;

/* ==========================================================================
   Entities, part one: difficulty, world queries and the hero
   ========================================================================== */

const RUN_V = 78, CLIMB_V = 56, JUMP_V = 236, MAX_FALL = 330;

/* ---- difficulty ---------------------------------------------------------------- */
const DIFFS = {
  recruit: { id: 'recruit', name: 'RECRUIT', hp: 5, lives: 3, speed: 0.86, spawn: 0.72, bullet: 0.84, tele: 1.3, bossHp: 0.8, blurb: 'FIVE HITS PER LIFE. SLOWER ENEMIES, LONGER WARNINGS.' },
  soldier: { id: 'soldier', name: 'SOLDIER', hp: 3, lives: 2, speed: 1, spawn: 1, bullet: 1, tele: 1, bossHp: 1, blurb: 'THREE HITS PER LIFE. THE MISSION AS BRIEFED.' },
  veteran: { id: 'veteran', name: 'VETERAN', hp: 2, lives: 2, speed: 1.1, spawn: 1.22, bullet: 1.12, tele: 0.86, bossHp: 1.2, blurb: 'TWO HITS PER LIFE. FASTER SHOTS, BIGGER PATROLS.' },
  elite: { id: 'elite', name: 'ELITE', hp: 1, lives: 2, speed: 1.18, spawn: 1.4, bullet: 1.22, tele: 0.74, bossHp: 1.4, blurb: 'ONE HIT AND YOU ARE DOWN. CLASSIC ARCADE RULES.' }
};
const DIFF_ORDER = ['recruit', 'soldier', 'veteran', 'elite'];
/** Scale a wind-up by the difficulty: easier levels give longer warnings. */
function tw(sec) { return sec * game.diff.tele; }

/* ---- world queries --------------------------------------------------------- */
function landY(x, y0, y1, skipY) {
  let best = null;
  if (y1 >= GROUND_Y && y0 <= GROUND_Y + 0.01) best = GROUND_Y;
  for (const d of game.st.decks) {
    if (skipY != null && Math.abs(d.y - skipY) < 0.5) continue;
    if (x < d.x0 || x > d.x1) continue;
    if (d.y >= y0 - 0.01 && d.y <= y1 && (best === null || d.y < best)) best = d.y;
  }
  return best;
}
function deckAt(x, y) {
  for (const d of game.st.decks) if (Math.abs(d.y - y) < 0.6 && x >= d.x0 - 1 && x <= d.x1 + 1) return d;
  return null;
}
function supportAt(x, y) { return y >= GROUND_Y - 0.5 || !!deckAt(x, y); }
function ladderFor(x, y, dir) {
  for (const L of game.st.ladders) {
    if (Math.abs(L.x - x) > 7) continue;
    if (dir < 0 && (Math.abs(y - L.lo) < 1 || (y < L.lo - 1 && y > L.hi + 3))) return L;
    if (dir > 0 && Math.abs(y - L.hi) < 1) return L;
  }
  return null;
}
function distBox(b, x, y) {
  const dx = Math.max(b.x0 - x, 0, x - b.x1), dy = Math.max(b.y0 - y, 0, y - b.y1);
  return Math.hypot(dx, dy);
}
function onScreen(x, m) { return x > game.camX - m && x < game.camX + W + m; }

/** Shared platformer integration for anything with feet. Returns true on landing. */
function actorPhys(a, dt) {
  if (a.climb) return false;
  a.x += a.vx * dt;
  if (a.ground) {
    if (supportAt(a.x, a.y)) return false;
    a.ground = false; a.vy = 0; a.coyote = 0.08;
  }
  const y0 = a.y;
  a.vy = Math.min(MAX_FALL, a.vy + GRAV * dt);
  a.y += a.vy * dt;
  if (a.vy > 0) {
    const ly = landY(a.x, y0, a.y, a.dropY);
    if (ly !== null) { a.y = ly; a.vy = 0; a.ground = true; a.dropY = null; return true; }
  }
  if (a.dropY != null && a.y > a.dropY + 6) a.dropY = null;
  if (a.y > H + 40) { a.y = GROUND_Y; a.vy = 0; a.ground = true; }
  return false;
}

/* ---- hero ------------------------------------------------------------------ */
/* Blade moves: active window, reach and damage. The ground combo runs stab, slash, thrust. */
const MELEE = {
  stab: { dur: 0.2, a0: 0.03, a1: 0.15, reach: 19, y0: -25, y1: -11, dmg: 1, anim: 'stab' },
  slash: { dur: 0.24, a0: 0.05, a1: 0.17, reach: 21, y0: -32, y1: -5, dmg: 1, anim: 'slash' },
  thrust: { dur: 0.3, a0: 0.06, a1: 0.2, reach: 27, y0: -24, y1: -10, dmg: 2, anim: 'thrust' },
  cstab: { dur: 0.2, a0: 0.03, a1: 0.15, reach: 21, y0: -14, y1: -3, dmg: 1, anim: 'crouchStab' },
  jstab: { dur: 0.24, a0: 0.03, a1: 0.2, reach: 20, y0: -27, y1: -7, dmg: 1, anim: 'jumpStab' },
  dive: { dur: 9, a0: 0.04, a1: 9, reach: 9, y0: -13, y1: 6, dmg: 2, anim: 'dive' }

const COMBO = ['stab', 'slash', 'thrust'];
const AMMO_CAP = { tri: 9, gren: 9, rocket: 9, star: 24, flame: 99 };

function makeHero(x) {
  return {
    x, y: GROUND_Y, vx: 0, vy: 0, face: 1, ground: true, climb: null, dropY: null, crouch: false, act: null,
    inv: 0, hp: game.diff.hp, dead: false, deadT: 0, coyote: 0, jbuf: 0, kbuf: 0, sbuf: 0, runT: 0, climbT: 0, hurtT: 0,
    wpn: null, ammo: 0, blade: 'knife', bladeN: 0, flash: 0, pose: null,
    airJumps: 1, airDash: false, flipT: -1, roll: null, dashCD: 0, counterT: 0, combo: 0, comboT: 0,
    wallSide: 0, wallT: 0, wallLock: 0, sliding: false, tapDir: 0, tapT: -9, jumpCut: true, jumpT: 0, pogo: 0,
    ghosts: [], stepD: 0, shieldT: 0, flameT: 0, flameSnd: 0

}

function heroHurt(h) {
  if (h.roll && h.roll.tuck) return box(h.x - 5, h.y - 13, h.x + 5, h.y);
  if (h.crouch) return box(h.x - 5, h.y - 14, h.x + 5, h.y);
  if (h.climb) return box(h.x - 4, h.y - 26, h.x + 4, h.y);
  if (!h.ground) return box(h.x - 4, h.y - 25, h.x + 4, h.y - 3);
  return box(h.x - 4, h.y - 26, h.x + 4, h.y - 1);
}
/** True during the untouchable part of a roll or air dash. */
function heroDodging(h) { const r = h.roll; return !!(r && r.t >= r.i0 && r.t <= r.i1); }
/** An attack passed through a dodge: open the counter window (once per dodge). */
function dodgeCredit(h) {
  const r = h.roll;
  if (!r || r.dodged) return;
  r.dodged = true;
  h.counterT = 1.1;
  game.slowT = Math.max(game.slowT, 0.14);
  pop(h.x, h.y - 40, 'DODGE!', '#9fe8ff');
  chip.sfx('dodge');
  game.stageStats.dodges++;
}

function heroKnifeBox(h) {
  const a = h.act;
  if (!a || h.dead) return null;
  const M = MELEE[a.type];
  if (!M || a.t < M.a0 || a.t > M.a1) return null;
  if (a.type === 'dive') return box(h.x - 8 + h.face * 3, h.y - 13, h.x + 8 + h.face * 3, h.y + 6);
  const r1 = M.reach + (a.kat ? 9 : 0), e = a.kat ? 3 : 0;
  const y0 = h.y + M.y0 - e, y1 = h.y + M.y1 + e;
  return h.face > 0 ? box(h.x + 1, y0, h.x + r1, y1) : box(h.x - r1, y0, h.x - 1, y1);
}

function startRoll(h, d) {
  const air = !h.ground;
  h.roll = { t: 0, dir: d, tuck: !air, dur: air ? 0.2 : 0.34, i0: 0.02, i1: air ? 0.18 : 0.28, dodged: false };
  h.face = d; h.act = null; h.crouch = false; h.climb = null; h.combo = 0;
  h.dashCD = h.roll.dur + 0.34;
  if (air) { h.airDash = true; h.vy = 0; h.flipT = -1; h.ground = false; }
  chip.sfx('dash');
  dust(h.x, h.y - (air ? 14 : 0), 3);
  game.stageStats.dashes++;
}

function updateRoll(h, dt, dir) {
  const r = h.roll;
  r.t += dt;
  const k = clamp(r.t / r.dur, 0, 1);
  if (r.tuck) h.vx = r.dir * lerp(218, 112, k);
  else { h.vx = r.dir * 258; h.vy = 0; }
  if (r.tuck && h.ground && chance(0.45)) dust(h.x - r.dir * 5, h.y, 1);
  const wasAir = !h.ground;
  if (actorPhys(h, dt) && wasAir) { chip.sfx('land'); dust(h.x, h.y, 2); h.airJumps = 1; h.airDash = false; }
  if (h.ground) h.runT += Math.abs(h.vx) * dt;
  // once the tumble is underway it can be cancelled into a jump
  if (r.tuck && h.jbuf > 0 && r.t > 0.1 && (h.ground || h.coyote > 0)) {
    h.jbuf = 0; h.roll = null;
    h.vy = -JUMP_V; h.ground = false; h.coyote = 0; h.jumpCut = false; h.jumpT = 0;
    chip.sfx('jump');
    return;
  }
  if (r.t >= r.dur) {
    h.roll = null;
    h.vx = r.dir * RUN_V * (dir === r.dir ? 1 : 0.45);
  }

function startMelee(h, type, dir) {
  const M = MELEE[type], kat = h.blade === 'katana';
  h.act = { type, t: 0, dur: M.dur, hits: [], kat, lunge: type === 'thrust' && dir === h.face, arc: false };
  if (COMBO.includes(type)) { h.combo = (COMBO.indexOf(type) + 1) % 3; h.comboT = M.dur + 0.36; }
  else h.combo = 0;
  if (type === 'dive') { h.vy = Math.max(h.vy, 250); h.vx = h.face * 50; h.flipT = -1; }
  if (kat) h.bladeN--;
  chip.sfx(kat ? 'katana' : type === 'thrust' || type === 'dive' ? 'thrust' : 'knife');
  if (type === 'thrust' || type === 'dive' || (kat && type === 'slash')) chip.voice('kiai');

/** Light trail left by the blade as its active frames begin. */
function meleeArc(h) {
  const a = h.act, M = MELEE[a.type];
  if (!M || a.arc || a.t < M.a0) return;
  a.arc = true;
  const col = a.kat ? '#bfe9ff' : '#f4f8ff', f = h.face, r = M.reach + (a.kat ? 9 : 0);
  if (a.type === 'slash') game.fx.push({ k: 'slash', x: h.x + f * 3, y: h.y - 17, face: f, r: r - 1, a0: -1.95, a1: 1.05, col, t: 0, life: 0.17 });
  else if (a.type === 'cstab') game.fx.push({ k: 'slash', x: h.x + f * 3, y: h.y - 9, face: f, r: r - 2, a0: -0.42, a1: 0.36, col, t: 0, life: 0.12 });
  else if (a.type === 'dive') game.fx.push({ k: 'slash', x: h.x, y: h.y - 16, face: f, r: 15, a0: 0.5, a1: 2.3, col, t: 0, life: 0.2 });

function updateHero(h, dt, I, P) {
  h.flash = Math.max(0, h.flash - dt);
  h.shieldT = Math.max(0, h.shieldT - dt);
  if (h.dead) {
    h.deadT += dt;
    h.vx = approach(h.vx, 0, (h.ground ? 200 : 30) * dt);
    actorPhys(h, dt);
    return;
  }
  h.inv = Math.max(0, h.inv - dt);
  h.hurtT = Math.max(0, h.hurtT - dt);
  h.jbuf = P.jump ? 0.12 : Math.max(0, h.jbuf - dt);
  h.kbuf = P.knife ? 0.16 : Math.max(0, h.kbuf - dt);
  h.sbuf = P.special ? 0.12 : Math.max(0, h.sbuf - dt);
  h.coyote = Math.max(0, h.coyote - dt);
  h.dashCD = Math.max(0, h.dashCD - dt);
  h.counterT = Math.max(0, h.counterT - dt);
  h.comboT = Math.max(0, h.comboT - dt);
  h.wallLock = Math.max(0, h.wallLock - dt);
  h.flameT = Math.max(0, h.flameT - dt);
  if (h.comboT <= 0 && !h.act) h.combo = 0;
  if (h.flipT >= 0) { h.flipT += dt; if (h.flipT > 0.42) h.flipT = -1; }
  let dir = (I.right ? 1 : 0) - (I.left ? 1 : 0);
  if (h.hurtT > 0) dir = 0;

  // dash: the dash button, or a quick double tap of a direction
  let dashDir = 0;
  if (P.left || P.right) {
    const d = P.left ? -1 : 1;
    if (h.tapDir === d && game.t - h.tapT < 0.24) dashDir = d;
    h.tapDir = d; h.tapT = game.t;
  }
  if (P.dash) dashDir = dir || h.face;
  if (h.roll) { updateRoll(h, dt, dir); return; }
  if (dashDir && h.dashCD <= 0 && h.hurtT <= 0 && (h.ground || h.climb || !h.airDash)) {
    if (h.climb) { h.climb = null; h.ground = false; }
    startRoll(h, dashDir);
    updateRoll(h, dt, dir);
    return;
  }

  if (h.act) {
    const a = h.act;
    a.t += dt;
    if (a.fireAt !== undefined && !a.fired && a.t >= a.fireAt) { a.fired = true; fireSpecial(h); }
    meleeArc(h);
    if (a.type === 'dive') { if (h.ground) diveLand(h); }

    }

    else if (h.y >= L.lo) { h.y = L.lo; h.climb = null; h.ground = true; }
    else if (h.jbuf > 0) { h.jbuf = 0; h.climb = null; h.ground = false; h.vy = dir ? -170 : 0; h.vx = dir * RUN_V; h.jumpCut = true; }
  } else if (!h.act || h.act.type === 'jstab') {
    if (I.up && h.hurtT <= 0) {
      const L = ladderFor(h.x, h.y, -1);
      if (L && (h.ground || h.vy > -90)) {
        h.climb = L; h.x = L.x; h.ground = false; h.vx = 0; h.vy = 0; h.crouch = false; h.act = null; h.flipT = -1;
        h.airJumps = 1; h.airDash = false;
        if (Math.abs(h.y - L.lo) < 1) h.y = L.lo - 1;

    }

    h.crouch = lockAct ? a.type === 'cstab' || a.type === 'recover' : h.ground && I.down && !flaming;

      else if (a && a.type === 'thrust' && a.lunge && a.t < 0.15) h.vx = h.face * 150;
      else if (h.crouch || lockAct) h.vx = approach(h.vx, 0, 1500 * dt);
      else h.vx = approach(h.vx, dir * RUN_V * (flaming ? 0.5 : 1), (dir ? 1150 : 1400) * dt);
      if (dir && !lockAct && !flaming && h.hurtT <= 0) h.face = dir;
    } else {
      // pressing into a wall on the way down grips it
      h.sliding = !!h.wallSide && dir === h.wallSide && h.vy > 0 && !a;
      if (h.sliding) {
        h.vy = Math.min(h.vy, 64); h.face = -h.wallSide; h.flipT = -1;
        if (chance(0.3)) dust(h.x + h.wallSide * 5, h.y - 22, 1);
      }
      if (h.wallLock <= 0 && !(a && a.type === 'dive')) h.vx = approach(h.vx, dir * RUN_V, 620 * dt);
      if (dir && !a && h.hurtT <= 0 && !h.sliding) h.face = dir;
    }

    const busy = lockAct && (M ? a.t < M.a1 : true);
    if (h.jbuf > 0 && !busy && h.hurtT <= 0) {
      if (h.ground || h.coyote > 0) {
        h.jbuf = 0;
        if (I.down && h.ground && h.y < GROUND_Y - 1) { h.dropY = h.y; h.ground = false; h.vy = 30; h.crouch = false; h.jumpCut = true; }
        else {

          if (lockAct) h.act = null;
          chip.sfx('jump'); dust(h.x, h.y, 2);
        }
      } else if (h.wallSide && !(a && a.type === 'dive')) {
        // kick off the wall
        h.jbuf = 0;
        h.vy = -JUMP_V * 0.94; h.vx = -h.wallSide * RUN_V * 1.5; h.face = -h.wallSide;
        h.airJumps = 1; h.airDash = false; h.flipT = 0; h.wallLock = 0.2; h.jumpCut = true; h.act = null;
        chip.sfx('jump2');
        game.fx.push({ k: 'ring', x: h.x + h.wallSide * 5, y: h.y - 16, t: 0, life: 0.26, r0: 2, r1: 13, col: '#ffffff' });

        chip.sfx('jump2');
        game.fx.push({ k: 'ring', x: h.x, y: h.y - 2, t: 0, life: 0.28, r0: 3, r1: 15, col: '#ffffff', flat: true, a: 0.7 });

    }

  const canChain = h.act && MELEE[h.act.type] && h.act.type !== 'dive' && h.ground && h.act.t >= MELEE[h.act.type].a1 + 0.02;
