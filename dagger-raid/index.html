      for (let i = 0; i < 6; i++) rect(g, sx - 30 + i * 12 + Math.floor(Math.random() * 4), GROUND_Y - 3, 6, 2, '#f0d8a0');
      g.globalAlpha = 1;
    }
  }
};

/* ---- GENERAL KROME: the final duel -------------------------------------------------- */
const KROME = {
  boxes() {
    if (this.dead) return [];
    if (this.st === 'dash') return [{ b: box(this.x - 7, this.y - 26, this.x + 7, this.y - 1) }];
    return [{ b: box(this.x - 6, this.y - 34, this.x + 6, this.y - 1) }];
  },
  knife(kb) {
    const r = bossKnifeOn(this, kb, this.boxes());
    if (r && !this.dead) {
      this.recentHits = this.recentHits.filter((t) => game.t - t < 1.2);
      this.recentHits.push(game.t);
      if (this.recentHits.length >= 3 && this.ground && this.st !== 'evade') {
        this.recentHits = [];
        this.st = 'evade'; this.t = 0; this.vy = -230; this.vx = -sgn(game.hero.x - this.x) * 120; this.ground = false;
      }
    }
    return r;
  },
  shotHit(s, sb) { return bossShotOn(this, s, sb, this.boxes()); },
  blast(x, y, r, d) { bossBlastOn(this, x, y, r, d, this.boxes()); },
  touches(hb) {
    if (this.dead || this.st === 'enter') return false;
    const f = this.face;
    if (this.st === 'slash' && this.t >= 0.3 && this.t < 0.44) {
      const z = f > 0 ? box(this.x + 4, this.y - 38, this.x + 30, this.y - 6) : box(this.x - 30, this.y - 38, this.x - 4, this.y - 6);
      if (boxHit(z, hb)) return true;
    }
    if (this.st === 'dash' && this.t > 0.45) {
      const z = f > 0 ? box(this.x - 4, this.y - 24, this.x + 18, this.y - 4) : box(this.x - 18, this.y - 24, this.x + 4, this.y - 4);
      if (boxHit(z, hb)) return true;
    }
    return false;
  },
  onPhase() {
    pop(this.x, this.y - 48, 'GUARDS!', '#ff8a6a'); chip.sfx('alarm');
    spawnFoe('guard', this.ax + W + 10, GROUND_Y, -1, {});
    spawnFoe('guard', this.ax - 10, GROUND_Y, 1, {});
  },
  update(dt) {
    const h = game.hero;
    this.t += dt; this.flash = Math.max(0, this.flash - dt);
    const p2 = this.phase === 2;
    const dx = h.x - this.x, adx = Math.abs(dx), toward = dx >= 0 ? 1 : -1;
    const same = !h.climb && Math.abs(h.y - this.y) < 14;
    const sp = p2 ? 66 : 52;
    switch (this.st) {
      case 'enter':
        this.face = -1; this.vx = -60;
        if (this.x < this.ax + W - 70) { this.vx = 0; this.st = 'taunt'; this.t = 0; pop(this.x, this.y - 46, 'YOU END HERE.', '#ffd27a'); }
        break;
      case 'taunt':
        this.vx = 0;
        if (this.t > 1.2) { this.st = 'stalk'; this.t = 0; }
        break;
      case 'stalk': {
        this.face = toward;
        if (!same && this.ground && !h.climb && (h.ground || h.y > this.y)) {
          if (this.t > 0.5) { this.st = 'leap'; this.t = 0; this.leapTo(h); }
          else this.vx = 0;
          break;
        }
        this.vx = adx > 26 ? toward * sp : 0;
        if (!same) break;
        if (adx < 30 && this.t > 0.25) { this.st = 'slash'; this.t = 0; break; }
        if (this.t > (p2 ? 0.8 : 1.3)) {
          const r = Math.random();
          if (adx > 70 && r < 0.4) { this.st = 'dashPrep'; this.t = 0; }
          else if (r < 0.7) { this.st = 'shoot'; this.t = 0; this.n = 0; }
          else if (adx > 50) { this.st = 'grenade'; this.t = 0; this.n = 0; }
          else { this.st = 'slash'; this.t = 0; }
        }
        break;
      }
      case 'slash':
        this.vx = this.t > 0.28 && this.t < 0.42 ? this.face * 80 : 0;
        if (this.t > 0.3 && this.t < 0.32) chip.sfx('knife');
        if (this.t > 0.72) { this.st = 'stalk'; this.t = 0; }
        break;
      case 'dashPrep':
        this.vx = 0; this.face = toward;
        if (this.t > 0.45) { this.st = 'dash'; this.t = 0.45; this.dashFrom = this.x; chip.sfx('throw'); }
        break;
      case 'dash':
        this.vx = this.face * (p2 ? 240 : 205);
        if (Math.floor(this.t * 30) % 2) dust(this.x - this.face * 6, this.y, 1);
        if (Math.abs(this.x - this.dashFrom) > 190 || this.x < this.ax + 16 || this.x > this.ax + W - 16 || !supportAt(this.x + this.face * 6, this.y)) {
          this.vx = 0; this.st = p2 ? 'slash' : 'stalk'; this.t = 0; this.face = toward;
        }
        break;
      case 'shoot':
        this.vx = 0; this.face = toward;
        if (this.n < (p2 ? 4 : 3) && this.t > 0.35 + this.n * 0.32) {
          this.n++;
          const mx = this.x + this.face * 14, my = this.y - 24;
          game.shots.push({ k: 'bullet', x: mx, y: my, vx: this.face * 165, vy: 0, t: 0, foe: true });
          muzzle(mx, my); chip.sfx('shot');
        }
        if (this.t > 0.6 + (p2 ? 4 : 3) * 0.32) { this.st = 'stalk'; this.t = 0; }
        break;
      case 'grenade':
        this.vx = 0; this.face = toward;
        if (this.n < 2 && this.t > 0.35 + this.n * 0.45) {
          this.n++;
          const ty = h.ground || h.climb ? h.y : (landY(h.x, h.y, GROUND_Y, null) || GROUND_Y);
          lob('egren', this.x, this.y - 30, h.x + (this.n === 2 ? rand(-30, 30) : 0), ty, 0.9, true);
          chip.sfx('throw');
        }
        if (this.t > 1.3) { this.st = 'stalk'; this.t = 0; }
        break;
      case 'leap': case 'evade':
        if (this.ground && this.t > 0.1) { this.st = 'stalk'; this.t = 0; dust(this.x, this.y, 4); }
        break;
      case 'dying':
        this.vx = approach(this.vx || 0, 0, 200 * dt);
        break;
      default: break;
    }
    const wasAir = !this.ground;
    actorPhys(this, dt);
    if (wasAir && this.ground) addShake(2);
    this.x = clamp(this.x, this.ax + 10, this.ax + W - 10);
    if (this.vx && this.ground) this.dist = (this.dist || 0) + Math.abs(this.vx) * dt;
  },
  leapTo(h) {
    // jump onto the hero's level: up onto a deck, or down off one
    const ty = h.ground ? h.y : GROUND_Y;
    let tx = clamp(h.x + rand(-30, 30), this.ax + 20, this.ax + W - 20);
    if (ty < this.y) {
      const d = game.st.decks.find((k) => Math.abs(k.y - ty) < 1 && k.x1 > this.ax && k.x0 < this.ax + W);
      if (d) tx = clamp(tx, d.x0 + 10, d.x1 - 10);
      const height = this.y - ty + 18;
      this.vy = -Math.sqrt(2 * GRAV * height);
      const tUp = -this.vy / GRAV, tDown = Math.sqrt(2 * 18 / GRAV);
      this.vx = (tx - this.x) / (tUp + tDown);
    } else {
      this.dropY = this.y; this.vy = -160;
      const T = 0.9;
      this.vx = (tx - this.x) / T;
    }
    this.ground = false;
    this.face = sgn(this.vx) || this.face;
    chip.sfx('jump');
  },
  draw(g, cx) {
    let anim = 'idle', fr = Math.floor(game.t * 2) % 2;
    switch (this.st) {
      case 'enter': case 'stalk': if (this.vx) { anim = 'run'; fr = Math.floor((this.dist || 0) / 7) % 8; } break;
      case 'slash': anim = 'slash'; fr = this.t < 0.3 ? 0 : this.t < 0.44 ? 1 : 2; break;
      case 'dashPrep': anim = 'idle'; fr = 0; break;
      case 'dash': anim = 'dash'; fr = 0; break;
      case 'shoot': anim = 'shoot'; fr = 0; break;
      case 'grenade': anim = 'throw'; fr = (this.t % 0.45) < 0.3 ? 0 : 1; break;
      case 'leap': case 'evade': anim = 'dash'; fr = 0; break;
      case 'dying': anim = this.deathT < 1.0 ? 'hurt' : 'dead'; fr = this.deathT < 1.0 ? 0 : Math.min(2, Math.floor((this.deathT - 1) / 0.15)); break;
      default: break;
    }
    const sx = this.x - cx;
    if (this.st === 'dash') { g.globalAlpha = 0.3; drawSprite(g, 'general', anim, fr, this.face, sx - this.face * 8, this.y); g.globalAlpha = 1; }
    drawSprite(g, 'general', anim, fr, this.face, sx, this.y, this.flash > 0);
    if (this.st === 'dashPrep' && Math.floor(this.t * 16) % 2 === 0) {
      const gx = sx + this.face * 9, gy = this.y - 30;
      rect(g, gx - 3, gy, 7, 1, '#ffffff'); rect(g, gx, gy - 3, 1, 7, '#ffffff');
    }
  }
};

/* ==========================================================================
   Game state: flow, stage runtime, spawning, collisions, scoring
   ========================================================================== */

const game = {
  state: 'boot', t: 0, stateT: 0,
  st: STAGES[0], L: null, stageIdx: 0, camX: 0, lockCam: false,
  hero: null, foes: [], shots: [], fx: [], props: [], items: [], caps: [], pops: [], wx: [], sched: [],
  boss: null, bossSeq: null, time: 0, evIdx: 0, spawnT: 0,
  score: 0, hi: 0, lives: 2, nextExtend: 30000, continues: 0, loop: 1,
  chainN: 0, chainT: -9, shake: 0, flashT: 0, slowT: 0,
  diff: { speed: 1, spawn: 1 }, stats: null, stageStats: null,
  demo: false, menu: 0, hits: [], scores: loadScores(), entry: null, idleT: 0
};
game.hi = game.scores[0].s;

const ART_CACHE = {};
function stageArt(st) { if (!ART_CACHE[st.id]) ART_CACHE[st.id] = buildStageArt(st); return ART_CACHE[st.id]; }

function freshStats() { return { kills: 0, captives: 0, specials: 0, deaths: 0, hits: 0, items: 0, time: 0 }; }

function setState(s) {
  if (s !== game.state && s !== 'pause' && game.state !== 'pause') game.fadeT = 0.22;
  game.state = s; game.stateT = 0; game.menu = 0; game.hits = [];
}

/* ---- starting a run ---------------------------------------------------------- */
function newGame(demo) {
  game.demo = !!demo;
  chip.mute = game.demo;
  game.score = 0; game.lives = 2; game.nextExtend = 30000; game.continues = 0; game.loop = 1;
  game.stats = freshStats();
  game.carry = null;
  startStage(0);
}

function startStage(i) {
  game.stageIdx = i;
  game.st = STAGES[i];
  game.L = stageArt(game.st);
  game.camX = 0; game.lockCam = false;
  const keep = game.carry;
  game.hero = makeHero(48);
  if (keep) { game.hero.wpn = keep.wpn; game.hero.ammo = keep.ammo; game.hero.hp = keep.hp; }
  game.foes = []; game.shots = []; game.fx = []; game.items = []; game.caps = []; game.pops = []; game.sched = [];
  game.props = game.st.props.map(makeProp);
  game.boss = null; game.bossSeq = null; game.time = 0; game.evIdx = 0; game.spawnT = 2.2;
  game.chainN = 0; game.chainT = -9; game.shake = 0; game.flashT = 0; game.slowT = 0;
  game.stageStats = freshStats();
  game.dustCol = { jungle: '#c8b088', rail: '#ffffff', refinery: '#f0c27a', citadel: '#9aa0ac' }[game.st.id];
  game.wx = [];
  game.nextBolt = rand(5, 9);
  game.hideHero = false;
  game.downT = 0;
  setState(game.demo ? 'play' : 'intro');
  if (!game.demo) chip.play('start');
}

function beginPlay() {
  setState('play');
  chip.play(game.st.song);
}

/* ---- per frame update by state --------------------------------------------- */
function updateGame(dt, I, P) {
  game.t += dt;
  game.stateT += dt;
  game.shake = Math.max(0, game.shake - dt * 18);
  game.flashT = Math.max(0, game.flashT - dt);
  game.fadeT = Math.max(0, (game.fadeT || 0) - dt);
  game.readyT = Math.max(0, (game.readyT || 0) - dt);
  switch (game.state) {
    case 'intro':
      tickWorld(dt);
      if (game.stateT > 3.4 || (game.stateT > 0.8 && (P.knife || P.jump || P.start))) beginPlay();
      break;
    case 'play': {
      if (game.demo && (P.any)) { exitDemo(); return; }
      let sdt = dt;
      if (game.hitStop > 0) {
        game.hitStop -= dt;
        const h = game.hero;
        if (P.knife) h.kbuf = 0.14; if (P.jump) h.jbuf = 0.12; if (P.special) h.sbuf = 0.12;
        if (P.pause && !game.demo) openPause();
        break;
      }
      if (game.slowT > 0) { game.slowT -= dt; sdt = dt * 0.35; }
      if (game.demo) { const BI = botInput(sdt); updatePlay(sdt, BI, botPressed()); }
      else updatePlay(sdt, I, P);
      if (game.demo && (game.stateT > 34 || (game.hero.dead && game.downT > 1.5))) exitDemo();
      break;
    }
    case 'clear': updateClear(dt, I, P); break;
    case 'continue': updateContinue(dt, I, P); break;
    case 'gameover':
      tickWorld(dt);
      if (game.stateT > 4 || (game.stateT > 1.2 && (P.knife || P.start))) finishRun();
      break;
    case 'ending': updateEnding(dt, I, P); break;
    default: updateMenus(dt, I, P); break;
  }
}

/** Keep effects and weather alive on non-play screens drawn over the world. */
function tickWorld(dt) { if (dt > 0) { updateFx(dt); updateWeather(dt); } }

function updatePlay(dt, I, P) {
  game.time += dt;
  game.stageStats.time += dt;
  const h = game.hero;
  if (P.pause && !game.demo && !h.dead) { openPause(); return; }
  updateHero(h, dt, I, P);
  updateCamera(dt);
  if (!game.autoWalk) h.x = clamp(h.x, game.camX + 8, game.camX + W - 8);
  if (game.boss && game.boss.kind === 'ironclad' && !game.boss.dead) h.x = Math.min(h.x, game.boss.x - 6);
  if (!game.bossSeq) { runEvents(); ambientSpawn(dt); }
  else runSched();
  for (const e of game.foes) updateFoe(e, dt);
  updateBossSeq(dt);
  updateShots(dt);
  resolveHeroAttacks();
  resolveFoeAttacks();
  updateProps(dt);
  updateItems(dt);
  updateFx(dt);
  updateWeather(dt);
  game.foes = game.foes.filter((e) => !e.gone);
  if (h.dead) {
    game.downT += dt;
    if (game.downT > 2.6 && !game.demo) heroLost();
  }
}

function updateCamera(dt) {
  const h = game.hero, maxCam = game.st.len - W;
  if (game.lockCam) return;
  const target = clamp(h.x - 150, 0, maxCam);
  if (target > game.camX) game.camX = Math.min(target, game.camX + 240 * dt);
  if (game.camX >= maxCam - 0.5) {
    game.camX = maxCam; game.lockCam = true;
    if (!game.bossSeq) game.bossSeq = { st: 'warn', t: 0 };
    chip.stopMusic();
  }
}

/* ---- boss sequence: warning, fight, defeat ------------------------------------- */
function updateBossSeq(dt) {
  const S = game.bossSeq;
  if (!S) return;
  S.t += dt;
  if (S.st === 'warn') {
    if (S.t < dt * 1.5) { chip.sfx('alarm'); }
    if (S.t > 2.4) {
      S.st = 'fight'; S.t = 0;
      game.boss = makeBoss(game.st.boss);
      if (!game.hero.dead) chip.play('boss');
    }
  } else if (S.st === 'fight') {
    const b = game.boss;
    if (b) { b.update(dt); if (b.dead) b.deathT += dt; }
  } else if (S.st === 'down') {
    const b = game.boss;
    b.update(dt); b.deathT += dt;
    if (S.t > 3.2 && !game.hero.dead) startClear();
  }
}

function onBossDown(b) {
  game.bossSeq.st = 'down'; game.bossSeq.t = 0;
  game.slowT = 0.8; game.flashT = 0.12;
  addShake(8);
  chip.stopMusic(true);
  chip.sfx('boom', { big: true });
  addScore(BOSS_POINTS[b.kind], b.x, b.y - 60, false);
  game.shots = game.shots.filter((s) => !s.foe);
  for (const e of game.foes) if (e.st !== 'dead') { setSt(e, 'dead'); e.vy = -100; e.vx = rand(-60, 60); e.ground = false; e.deadT = 0; }
}

/* ---- spawning -------------------------------------------------------------- */
function runEvents() {
  const st = game.st, center = game.camX + W / 2;
  while (game.evIdx < st.events.length && center >= st.events[game.evIdx].at) {
    const ev = st.events[game.evIdx++];
    if (ev.wave) for (const [kind, side, lv, delay] of ev.wave) game.sched.push({ t: game.time + delay, kind, side, lv });
    if (ev.e) game.sched.push({ t: game.time, kind: ev.e, side: ev.side, lv: ev.lv, x: ev.x, drop: ev.drop });
    if (ev.dogs) for (let i = 0; i < ev.dogs; i++) game.sched.push({ t: game.time + 0.4 + i * 0.5, kind: 'dog', side: 'R', lv: 0 });
    if (ev.para) for (let i = 0; i < ev.para; i++) game.sched.push({ t: game.time + i * 0.7, kind: 'para', para: true });
  }
  runSched();
}

function runSched() {
  for (const s of game.sched) {
    if (s.done || game.time < s.t) continue;
    if (s.x != null && s.x > game.camX + W + 24) continue;
    s.done = true;
    if (s.x != null && s.x < game.camX - 20) continue;
    doSpawn(s);
  }
  game.sched = game.sched.filter((s) => !s.done);
}

function doSpawn(s) {
  if (game.hero.dead) return;
  if (s.para) {
    const x = game.camX + rand(70, W - 50);
    spawnFoe('para', x, HUD_H + 2, x > game.hero.x ? -1 : 1, { para: true });
    return;
  }
  const y0 = LV_Y[s.lv || 0];
  if (s.x != null) { spawnFoe(s.kind, s.x, y0, -1, { drop: s.drop }); return; }
  let side = s.side === 'L' ? -1 : 1;
  if (side < 0 && game.camX < 24) side = 1;
  const x = side > 0 ? game.camX + W + 12 : game.camX - 12;
  let y = y0;
  if (s.lv && !deckAt(x, y)) y = GROUND_Y;
  spawnFoe(s.kind, x, y, -side, { drop: s.drop });
}

function ambientSpawn(dt) {
  const A = game.st.ambient;
  game.spawnT -= dt * game.diff.spawn;
  if (game.spawnT > 0) return;
  game.spawnT = rand(A.gap[0], A.gap[1]);
  if (game.hero.dead || game.camX + W > game.st.len - 30) return;
  const alive = game.foes.filter((e) => e.st !== 'dead').length;
  if (alive >= A.max) return;
  const kinds = Object.keys(A.mix), total = kinds.reduce((a, k) => a + A.mix[k], 0);
  let r = Math.random() * total, kind = kinds[0];
  for (const k of kinds) { r -= A.mix[k]; if (r <= 0) { kind = k; break; } }
  let side = chance(A.left) && game.camX > 40 ? -1 : 1;
  const x = side > 0 ? game.camX + W + 12 : game.camX - 12;
  let y = GROUND_Y;
  if (kind !== 'dog' && chance(A.deck)) { const ds = game.st.decks.filter((d) => x >= d.x0 && x <= d.x1); if (ds.length) y = pick(ds).y; }
  spawnFoe(kind, x, y, -side, { runner: kind !== 'officer' && chance(A.runner) });
}

/* ---- collisions ---------------------------------------------------------------- */
function resolveHeroAttacks() {
  const h = game.hero;
  const kb = heroKnifeBox(h);
  if (!kb) return;
  const a = h.act;
  for (const e of game.foes) {
    if (e.st === 'dead' || a.hits.includes(e.id)) continue;
    if (boxHit(kb, foeBox(e))) { a.hits.push(e.id); if (killFoe(e, 'knife', h.face, 1)) game.hitStop = Math.max(game.hitStop || 0, 0.035); }
  }
  for (const p of game.props) {
    if (!propSolid(p) || p.t === 'mine' || a.hits.includes(p)) continue;
    if (boxHit(kb, propBox(p))) { a.hits.push(p); hitProp(p, 'knife'); }
  }
  for (const s of game.shots) {
    if (!s.foe || s.k !== 'bullet' || s.gone) continue;
    if (boxHit(kb, box(s.x - 3, s.y - 3, s.x + 3, s.y + 3))) {
      s.gone = true; chip.sfx('tink'); sparks(s.x, s.y, 4, '#ffe27a');
      addScore(50, s.x, s.y - 10, false, true); pop(s.x, s.y - 12, 'PARRY 50', '#9fe8ff');
    }
  }
  if (game.boss && !game.boss.dead && !a.bossHit && game.boss.st !== 'enter') { if (game.boss.knife(kb)) a.bossHit = true; }
}

function resolveFoeAttacks() {
  const h = game.hero;
  if (h.dead || h.inv > 0) return;
  const hb = heroHurt(h);
  for (const e of game.foes) {
    const ab = foeAttackBox(e);
    if (ab && boxHit(ab, hb)) { hurtHero(h, e.face, e.st + ':' + e.kind); return; }
  }
  const b = game.boss;
  if (b && !b.dead && b.touches(hb)) hurtHero(h, sgn(h.x - b.x) || -1, 'boss-' + b.kind + ':' + b.st);
}

/* ---- scoring --------------------------------------------------------------------- */
function addScore(pts, x, y, chain, quiet) {
  let total = pts;
  if (chain) {
    if (game.time - game.chainT < 1.6) game.chainN = Math.min(10, game.chainN + 1); else game.chainN = 1;
    game.chainT = game.time;
    if (game.chainN > 1) total += (game.chainN - 1) * 50;
    if (game.chainN >= 2 && !quiet) pop(x, y - 9, 'CHAIN X' + game.chainN, '#ffd27a');
  }
  game.score += total;
  if (!quiet) pop(x, y, String(total), '#ffffff');
  if (!game.demo && game.score > game.hi) game.hi = game.score;
  while (!game.demo && game.score >= game.nextExtend) {
    game.lives = Math.min(9, game.lives + 1);
    game.nextExtend += 70000;
    chip.sfx('oneup');
    if (game.hero) pop(game.hero.x, game.hero.y - 48, 'EXTEND!', '#4ad16a');
  }
}

/* ---- death, respawn, continue -------------------------------------------------------- */
function onHeroDown() { game.downT = 0; game.stageStats.deaths++; }

function heroLost() {
  if (game.lives > 0) { game.lives--; respawn(); }
  else { setState('continue'); game.contT = 9.99; chip.play('gameover'); }
}

function respawn() {
  const b = game.boss && !game.boss.dead ? game.boss : null;
  let x = game.camX + 40;
  if (b && b.kind !== 'ironclad' && Math.abs(b.x - x) < 90) x = game.camX + W - 40;
  const h = makeHero(x);
  h.inv = 2.6; h.face = x > game.camX + W / 2 ? -1 : 1;
  game.hero = h;
  game.foes = game.foes.filter((e) => e.T.fixed || !onScreen(e.x, 60));
  for (const e of game.foes) e.cd = Math.max(e.cd, 2.2);
  game.shots = []; game.sched = game.sched.filter((s) => s.x != null);
  game.spawnT = 2.4; game.downT = 0; game.chainN = 0; game.readyT = 1.6;
  if (b) chip.play('boss');
  else if (!game.bossSeq) chip.play(game.st.song);
}

function updateContinue(dt, I, P) {
  tickWorld(dt);
  const before = Math.ceil(game.contT);
  game.contT -= dt * (P.special ? 6 : 1);
  if (Math.ceil(game.contT) !== before && game.contT > 0) chip.sfx('tick');
  if (game.stateT > 0.6 && (P.knife || P.jump || P.start || input.tap)) {
    chip.sfx('coin');
    game.continues++; game.lives = 2;
    setState('play');
    respawn();
    return;
  }
  if (game.contT <= 0) { setState('gameover'); chip.stopMusic(); }
}

function finishRun() {
  chip.stopMusic();
  const rank = qualifies(game.score);
  if (rank >= 0) startEntry(rank);
  else { setState('title'); chip.play('title'); }
}

/* ---- stage clear and tally ------------------------------------------------------------ */
function startClear() {
  setState('clear');
  const h = game.hero;
  h.act = null; h.vx = 0; h.inv = 0;
  chip.play('clear');
  const cages = game.props.filter((p) => p.t === 'cage');
  const freed = cages.filter((p) => p.open).length;
  const S = game.stageStats;
  game.tally = [
    { label: 'CAPTIVES FREED', val: freed + ' / ' + cages.length, pts: freed === cages.length && cages.length ? 5000 : 0, note: freed === cages.length ? 'ALL FREED' : '' },
    { label: 'NO MISS BONUS', val: S.deaths ? 'MISSED ' + S.deaths : 'PERFECT', pts: S.deaths ? 0 : 10000 },
    { label: 'TIME', val: fmtTime(S.time), pts: Math.max(0, Math.round((240 - S.time) / 10)) * 100 },
    { label: 'ENEMIES DOWN', val: String(S.kills), pts: 0 }
  ];
  game.tallyIdx = -1; game.tallyT = 0; game.tallyDone = false;
}

function fmtTime(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + "'" + String(r).padStart(2, '0') + '"'; }

function updateClear(dt, I, P) {
  const h = game.hero, t = game.stateT;
  updateFx(dt); updateWeather(dt); updateProps(dt); updateItems(dt);
  if (game.boss) { game.boss.update(dt); game.boss.deathT += dt; }
  if (t < 1.4) { h.pose = ['victory', 0]; h.vx = 0; }
  else if (t < 3.6) {
    h.pose = null; game.autoWalk = true;
    h.face = 1; h.act = null; h.crouch = false;
    if (h.climb) h.climb = null;
    h.vx = RUN_V * 1.1; actorPhys(h, dt); h.runT += h.vx * dt;
    if (h.x > game.camX + W + 20) game.hideHero = true;
  } else {
    game.autoWalk = false; game.hideHero = true;
    game.tallyT += dt;
    if (!game.tallyDone) {
      if (game.tallyIdx < 0 || game.tallyT > 0.7) {
        game.tallyIdx++; game.tallyT = 0;
        if (game.tallyIdx < game.tally.length) {
          const row = game.tally[game.tallyIdx];
          if (row.pts) { addScore(row.pts, 0, 0, false, true); chip.sfx('pickup'); } else chip.sfx('move');
        } else { game.tallyDone = true; game.tallyT = 0; }
      }
    } else if (game.tallyT > 2.6 || (game.tallyT > 0.5 && (P.knife || P.jump || P.start))) {
      nextStage();
    }
  }
}

function nextStage() {
  const h = game.hero;
  game.carry = { wpn: h.wpn, ammo: h.ammo, hp: h.hp };
  for (const k in game.stageStats) game.stats[k] += game.stageStats[k];
  if (game.stageIdx + 1 < STAGES.length) startStage(game.stageIdx + 1);
  else startEnding();
}

/* ---- ending ------------------------------------------------------------------------------- */
const ENDING_LINES = [
  ['MISSION COMPLETE', '#ffd27a'], ['', ''],
  ['GENERAL KROME HAS FALLEN.', '#ffffff'], ['EVERY CAPTIVE IS ON THE', '#ffffff'], ['ROAD HOME TONIGHT.', '#ffffff'], ['', ''],
  ['THE KNIFE GOES BACK IN ITS', '#c9d6e6'], ['SHEATH. FOR NOW.', '#c9d6e6'], ['', ''], ['', ''],
  ['DAGGER RAID', '#e8392a'], ['AN ORIGINAL ARCADE ADVENTURE', '#9fe8ff'], ['', ''],
  ['THANK YOU FOR PLAYING!', '#4ad16a']
];
function startEnding() {
  setState('ending');
  chip.play('ending');
  game.endScroll = 0;
}
function updateEnding(dt, I, P) {
  game.endScroll += dt * 14;
  updateFx(dt);
  if (game.stateT > 4 && (P.knife || P.start || input.tap)) { if (game.endScroll > ENDING_LINES.length * 12 + 150) { finishRun(); return; } game.endScroll += 40; }
  if (game.endScroll > ENDING_LINES.length * 12 + 520) finishRun();
}

/* ---- high scores ---------------------------------------------------------------------------- */
function qualifies(score) {
  if (game.demo || score <= 0) return -1;
  for (let i = 0; i < game.scores.length; i++) if (score > game.scores[i].s) return i;
  return -1;
}
const ENTRY_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.- ';
function startEntry(rank) {
  setState('entry');
  const last = store.get('initials', 'AAA');
  game.entry = { rank, chars: last.split('').map((c) => Math.max(0, ENTRY_CHARS.indexOf(c))), pos: 0, done: false, t: 30 };
  chip.play('entry');
}
function commitEntry() {
  const E = game.entry;
  const name = E.chars.map((i) => ENTRY_CHARS[i]).join('');
  store.set('initials', name);
  game.scores.splice(E.rank, 0, { n: name, s: game.score, st: Math.min(4, game.stageIdx + 1) });
  game.scores.length = 5;
  store.set('scores', game.scores);
  game.hi = Math.max(game.hi, game.scores[0].s);
  E.done = true; E.doneT = 0;
  chip.sfx('select');
}

/* ---- demo bot: plays the attract demo ------------------------------------------------ */
const BOT = { pressed: {}, jumpCD: 0, stabCD: 0, specCD: 0 };
function botInput(dt) {
  const h = game.hero, I = { left: false, right: false, up: false, down: false, jump: false, knife: false, special: false };
  const P = { jump: false, knife: false, special: false };
  BOT.jumpCD -= dt; BOT.stabCD -= dt; BOT.specCD -= dt;
  BOT.pressed = P;
  if (h.dead) return I;
  if (h.climb) { I.up = true; return I; }
  let near = null, nd = 1e9;
  for (const e of game.foes) {
    if (e.st === 'dead' || (Math.abs(e.y - h.y) > 16 && e.st !== 'kick')) continue;
    const d = Math.abs(e.x - h.x);
    if (d < nd) { nd = d; near = e; }
  }
  let dir = 1;
  if (near && nd < 30) {
    const side = Math.sign(near.x - h.x) || 1;
    if (h.face !== side) dir = side;
    else if (BOT.stabCD <= 0) { P.knife = true; BOT.stabCD = 0.2; }
    if (near.kind === 'dog' || near.st === 'kneel' || near.st === 'snipe') I.down = true;
    if (nd < 18 && h.face === side) dir = 0;
  }
  for (const s of game.shots) {
    if (!s.foe || s.k !== 'bullet' || s.aimed) continue;
    const toward = (s.x - h.x) * -Math.sign(s.vx || 0);
    if (toward > 0 && toward < 50) {
      if (s.y > h.y - 15 && BOT.jumpCD <= 0 && h.ground) { P.jump = true; BOT.jumpCD = 0.7; }
      else if (s.y <= h.y - 15 && h.ground) { I.down = true; dir = 0; }
    }
  }
  if (h.wpn && near && nd < 150 && BOT.specCD <= 0 && Math.sign(near.x - h.x) === h.face) { P.special = true; BOT.specCD = 1.2; }
  if (dir > 0) I.right = true; else if (dir < 0) I.left = true;
  return I;
}
function botPressed() { return BOT.pressed; }

function startDemo() {
  newGame(true);
  game.cheat = true;
  setState('play');
  game.stateT = 0;
}
function exitDemo() {
  game.demo = false; chip.mute = false; game.cheat = false;
  chip.stopMusic();
  setState('title');
  game.idleT = 0;
}

/* ---- weather ------------------------------------------------------------------------------------ */
function updateWeather(dt) {
  const kind = game.st.weather;
  const want = { pollen: 26, snow: 110, dust: 40, rain: 140 }[kind] || 0;
  while (game.wx.length < want) {
    game.wx.push({ x: rand(0, W), y: rand(HUD_H - 20, H), s: Math.random(), ph: rand(0, TAU) });
  }
  for (const p of game.wx) {
    if (kind === 'snow') { p.y += (18 + p.s * 26) * dt; p.x += (-10 + Math.sin(game.t + p.ph) * 8) * dt; }
    else if (kind === 'rain') { p.y += (300 + p.s * 120) * dt; p.x -= 60 * dt; }
    else if (kind === 'dust') { p.x -= (30 + p.s * 40) * dt; p.y += Math.sin(game.t * 2 + p.ph) * 6 * dt; }
    else { p.y += Math.sin(game.t + p.ph) * 6 * dt - 2 * dt; p.x += Math.cos(game.t * 0.7 + p.ph) * 8 * dt; }
    if (p.y > H) { p.y = HUD_H - 4; p.x = rand(0, W + 40); }
    if (p.x < -4) p.x += W + 8;
    if (p.x > W + 4) p.x -= W + 8;
    if (p.y < HUD_H - 30) p.y = H;
  }
  if (kind === 'rain' && game.state === 'play') {
    game.nextBolt -= dt;
    if (game.nextBolt <= 0) { game.nextBolt = rand(7, 13); game.flashT = 0.16; game.bolt = { x: rand(40, W - 40), t: 0 }; setTimeout(() => chip.sfx('thunder'), 380); }
  }
}

/* ==========================================================================
   Menus: boot, title, attract loop, how to play, options, pause, name entry
   ========================================================================== */

const TITLE_ITEMS = ['START GAME', 'MODE', 'HOW TO PLAY', 'HIGH SCORES', 'OPTIONS'];
const OPTION_ITEMS = ['MUSIC', 'EFFECTS', 'CRT FILTER', 'SCREEN SHAKE', 'TOUCH PAD', 'BACK'];
const PAUSE_ITEMS = ['RESUME', 'OPTIONS', 'QUIT GAME'];
const HOWTO_PAGES = 3;

function menuMove(n, P) {
  let m = game.menu;
  if (P.up) m = (m + n - 1) % n;
  if (P.down) m = (m + 1) % n;
  if (m !== game.menu) { game.menu = m; chip.sfx('move'); }
}

/** Taps on registered hit areas: returns the hit or null. */
function tapHit() {
  const tp = input.tap;
  if (!tp) return null;
  for (const h of game.hits) if (tp.x >= h.x0 && tp.x <= h.x1 && tp.y >= h.y0 && tp.y <= h.y1) return h;
  return null;
}

function updateMenus(dt, I, P) {
  if (game.state !== 'pause') tickWorld(dt);
  const confirm = P.knife || P.jump || P.start;
  const back = P.special || P.back;
  const hit = tapHit();
  switch (game.state) {
    case 'boot':
      if (P.any || input.tap) { chip.unlock(); chip.play('title'); setState('title'); }
      break;
    case 'title': {
      game.idleT += dt;
      if (P.any || input.tap) game.idleT = 0;
      menuMove(TITLE_ITEMS.length, P);
      let act = confirm ? game.menu : -1;
      if (hit) { game.menu = hit.i; act = hit.i; if (hit.dir) { toggleMode(); act = -1; } }
      if (game.menu === 1 && (P.left || P.right)) { toggleMode(); }
      if (act === 0) { chip.sfx('coin'); chip.stopMusic(); newGame(false); }
      else if (act === 1) toggleMode();
      else if (act === 2) { chip.sfx('select'); setState('howto'); game.page = 0; }
      else if (act === 3) { chip.sfx('select'); setState('scores'); game.attract = false; }
      else if (act === 4) { chip.sfx('select'); game.optFrom = 'title'; setState('options'); }
      if (game.idleT > 22) { game.idleT = 0; game.attract = true; setState('scores'); }
      break;
    }
    case 'scores':
      if (game.attract) {
        if (P.any || input.tap) { game.attract = false; setState('title'); game.idleT = 0; break; }
        if (game.stateT > 7) startDemo();
      } else if (confirm || back || hit || (input.tap && game.stateT > 0.3)) { chip.sfx('move'); setState('title'); game.menu = 3; }
      break;
    case 'howto':
      if (P.right || confirm || (hit && hit.next) || (input.tap && !hit && game.stateT > 0.2)) {
        game.page++; chip.sfx('move');
        if (game.page >= HOWTO_PAGES) { setState('title'); game.menu = 2; }
      } else if (P.left && game.page > 0) { game.page--; chip.sfx('move'); }
      else if (back || (hit && hit.back)) { setState('title'); game.menu = 2; chip.sfx('move'); }
      break;
    case 'options': {
      menuMove(OPTION_ITEMS.length, P);
      let d = P.left ? -1 : P.right ? 1 : 0;
      let act = confirm;
      if (hit) { game.menu = hit.i; if (hit.dir) d = hit.dir; else act = true; }
      if (d || act) adjustOption(game.menu, d || 1, act && !d);
      if (back) leaveOptions();
      break;
    }
    case 'pause': {
      menuMove(PAUSE_ITEMS.length, P);
      let act = confirm ? game.menu : -1;
      if (hit) { game.menu = hit.i; act = hit.i; }
      if (P.pause || back) act = 0;
      if (act === 0) { game.state = 'play'; chip.duck(false); chip.sfx('select'); }
      else if (act === 1) { chip.sfx('select'); game.optFrom = 'pause'; setState('options'); }
      else if (act === 2) { chip.duck(false); chip.stopMusic(); game.demo = false; finishRun(); }
      break;
    }
    case 'entry': updateEntry(dt, P, hit); break;
    default: break;
  }
}

function toggleMode() {
  settings.mode = settings.mode === 'arcade' ? 'modern' : 'arcade';
  saveSettings(); chip.sfx('move');
}

function adjustOption(i, d, activate) {
  switch (OPTION_ITEMS[i]) {
    case 'MUSIC': settings.music = clamp(Math.round(settings.music * 10 + d) / 10, 0, 1); chip.applyVolumes(); chip.sfx('move'); break;
    case 'EFFECTS': settings.sfx = clamp(Math.round(settings.sfx * 10 + d) / 10, 0, 1); chip.applyVolumes(); chip.sfx('pickup'); break;
    case 'CRT FILTER': settings.crt = !settings.crt; chip.sfx('move'); break;
    case 'SCREEN SHAKE': settings.shake = !settings.shake; chip.sfx('move'); if (settings.shake) game.shake = 4; break;
    case 'TOUCH PAD': {
      const order = ['auto', 'on', 'off'];
      settings.touch = order[(order.indexOf(settings.touch || 'auto') + (d > 0 ? 1 : 2)) % 3];
      chip.sfx('move'); layoutTouch();
      break;
    }
    case 'BACK': if (activate || d) leaveOptions(); return;
    default: break;
  }
  saveSettings();
}

function leaveOptions() {
  chip.sfx('move');
  if (game.optFrom === 'pause') { setState('pause'); game.menu = 1; }
  else { setState('title'); game.menu = 4; }
}

function openPause() {
  setState('pause');
  chip.duck(true);
  chip.sfx('select');
}

function updateEntry(dt, P, hit) {
  const E = game.entry;
  if (E.done) {
    E.doneT += dt;
    if (E.doneT > 3.2 || (E.doneT > 0.8 && (P.knife || P.start || input.tap))) { setState('title'); chip.play('title'); game.idleT = 0; }
    return;
  }
  E.t -= dt;
  const n = ENTRY_CHARS.length;
  if (P.up) { E.chars[E.pos] = (E.chars[E.pos] + 1) % n; chip.sfx('move'); }
  if (P.down) { E.chars[E.pos] = (E.chars[E.pos] + n - 1) % n; chip.sfx('move'); }
  if (P.left && E.pos > 0) { E.pos--; chip.sfx('move'); }
  if (P.right && E.pos < 2) { E.pos++; chip.sfx('move'); }
  for (const ch of input.typed) {
    const idx = ENTRY_CHARS.indexOf(ch.toUpperCase());
    if (idx >= 0 && E.pos < 3) { E.chars[E.pos] = idx; chip.sfx('type'); if (E.pos < 2) E.pos++; else { commitEntry(); return; } }
  }
  if (input.backspace && E.pos > 0) { E.pos--; chip.sfx('move'); }
  if (hit) {
    if (hit.up !== undefined) { E.pos = hit.up; E.chars[E.pos] = (E.chars[E.pos] + 1) % n; chip.sfx('move'); }
    else if (hit.down !== undefined) { E.pos = hit.down; E.chars[E.pos] = (E.chars[E.pos] + n - 1) % n; chip.sfx('move'); }
    else if (hit.slot !== undefined) { E.pos = hit.slot; chip.sfx('move'); }
    else if (hit.ok) { commitEntry(); return; }
  }
  if (P.knife || P.jump || P.start) {
    chip.sfx('select');
    if (E.pos < 2) E.pos++; else { commitEntry(); return; }
  }
  if (P.special && E.pos > 0) { E.pos--; chip.sfx('move'); }
  if (E.t <= 0) commitEntry();
}

/* ==========================================================================
   Input: keyboard, gamepad and touch pad merged into one action state
   ========================================================================== */

const ACTIONS = ['left', 'right', 'up', 'down', 'jump', 'knife', 'special', 'start', 'pause', 'back'];
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'jump', KeyX: 'jump', KeyK: 'jump',
  KeyZ: 'knife', KeyJ: 'knife', KeyF: 'knife',
  KeyC: 'special', KeyL: 'special', ShiftLeft: 'special', ShiftRight: 'special',
  Enter: 'start', NumpadEnter: 'start', KeyP: 'pause', Escape: 'back'
};

const input = {
  held: {}, pressed: {}, prev: {}, kb: {}, latch: {}, touch: {}, pad: {},
  tap: null, tapQueue: [], typed: [], typedQueue: [], backspace: false, bsLatch: false, anyLatch: false,
  usingTouch: false, usingPad: false, padIdx: -1, pend: {}
};
for (const a of ACTIONS) { input.held[a] = false; input.pressed[a] = false; input.prev[a] = false; }
const NO_PRESS = Object.freeze({ left: false, right: false, up: false, down: false, jump: false, knife: false, special: false, start: false, pause: false, back: false, any: false });

function initInput() {
  window.addEventListener('keydown', (ev) => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    input.usingTouch = false;
    if (game.state === 'entry' && !game.entry.done) {
      if (/^Key[A-Z]$/.test(ev.code) || /^Digit[0-9]$/.test(ev.code) || ev.code === 'Period' || ev.code === 'Minus') {
        input.typedQueue.push(ev.key.length === 1 ? ev.key : ev.code.slice(-1));
        ev.preventDefault(); return;
      }
      if (ev.code === 'Backspace') { input.bsLatch = true; ev.preventDefault(); return; }
    }
    const a = KEYMAP[ev.code];
    input.anyLatch = true;
    if (!a) return;
    ev.preventDefault();
    if (!input.kb[a]) input.latch[a] = true;
    input.kb[a] = true;
    if (a === 'back') input.latch.pause = true;
    chip.unlock();
  }, { passive: false });
  window.addEventListener('keyup', (ev) => {
    const a = KEYMAP[ev.code];
    if (a) input.kb[a] = false;
  });
  window.addEventListener('blur', () => { for (const a of ACTIONS) { input.kb[a] = false; input.touch[a] = false; } touchPointers.clear(); });
  window.addEventListener('gamepadconnected', (e) => { input.padIdx = e.gamepad.index; input.usingPad = true; });
  window.addEventListener('gamepaddisconnected', () => { input.padIdx = -1; });
  initTouch();
  const cv = $('screen');
  cv.addEventListener('pointerdown', (ev) => {
    chip.unlock();
    try { cv.focus({ preventScroll: true }); } catch (e) { /* focus is best effort */ }
    if (ev.pointerType === 'touch') input.usingTouch = true;
    const r = cv.getBoundingClientRect();
    const v = view;
    const x = ((ev.clientX - r.left) * (cv.width / r.width) - v.ox) / v.scale;
    const y = ((ev.clientY - r.top) * (cv.height / r.height) - v.oy) / v.scale;
    input.tapQueue.push({ x, y });
    input.anyLatch = true;
  });
}

/* ---- touch pad ----------------------------------------------------------------- */
const touchPointers = new Map();
function initTouch() {
  const root = $('touch');
  if (!root) return;
  const onDown = (ev) => {
    ev.preventDefault();
    chip.unlock();
    input.usingTouch = true;
    try { ev.target.setPointerCapture(ev.pointerId); } catch (e) { /* not capturable */ }
    touchPointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    recomputeTouch(true);
  };
  const onMove = (ev) => {
    if (!touchPointers.has(ev.pointerId)) return;
    ev.preventDefault();
    touchPointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    recomputeTouch(false);
  };
  const onUp = (ev) => {
    if (!touchPointers.has(ev.pointerId)) return;
    touchPointers.delete(ev.pointerId);
    recomputeTouch(false);
  };
  for (const el of root.querySelectorAll('.tctl')) {
    el.addEventListener('pointerdown', onDown, { passive: false });
    el.addEventListener('pointermove', onMove, { passive: false });
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
    el.addEventListener('lostpointercapture', onUp);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  const pb = $('tPause');
  if (pb) pb.addEventListener('pointerdown', (ev) => { ev.preventDefault(); input.latch.pause = true; input.latch.back = true; input.anyLatch = true; });
}

function recomputeTouch(isDown) {
  const next = { left: false, right: false, up: false, down: false, jump: false, knife: false, special: false };
  const dp = $('dpad').getBoundingClientRect();
  const dcx = dp.left + dp.width / 2, dcy = dp.top + dp.height / 2, rad = dp.width / 2;
  let knob = null;
  for (const p of touchPointers.values()) {
    const dx = p.x - dcx, dy = p.y - dcy, d = Math.hypot(dx, dy);
    if (d < rad * 1.35 && p.x < window.innerWidth * 0.6) {
      knob = [clamp(dx, -rad * 0.55, rad * 0.55), clamp(dy, -rad * 0.55, rad * 0.55)];
      if (d > rad * 0.2) {
        const a = Math.atan2(dy, dx);
        const s8 = Math.round(a / (Math.PI / 4));
        if (s8 === 0 || s8 === 1 || s8 === -1) next.right = true;
        if (s8 === 4 || s8 === -4 || s8 === 3 || s8 === -3) next.left = true;
        if (s8 === 2 || s8 === 1 || s8 === 3) next.down = true;
        if (s8 === -2 || s8 === -1 || s8 === -3) next.up = true;
      }
      continue;
    }
    for (const b of document.querySelectorAll('#touch .tbtn')) {
      const r = b.getBoundingClientRect();
      const m = 10;
      if (p.x >= r.left - m && p.x <= r.right + m && p.y >= r.top - m && p.y <= r.bottom + m) next[b.dataset.k] = true;
    }
  }
  for (const k in next) {
    if (next[k] && !input.touch[k]) { input.latch[k] = true; input.anyLatch = true; }
    input.touch[k] = next[k];
  }
  for (const b of document.querySelectorAll('#touch .tbtn')) b.classList.toggle('on', !!next[b.dataset.k]);
  const kn = $('dpadKnob');
  if (kn) kn.style.transform = knob ? 'translate(' + knob[0] + 'px,' + knob[1] + 'px)' : '';
  const dpEl = $('dpad');
  for (const dir of ['left', 'right', 'up', 'down']) dpEl.classList.toggle(dir, next[dir]);
  if (isDown && navigator.vibrate && settings.shake) { try { navigator.vibrate(6); } catch (e) { /* ignore */ } }
}

/* ---- gamepad --------------------------------------------------------------------- */
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  if (pads) for (const p of pads) if (p && p.connected) { gp = p; break; }
  const P = input.pad;
  for (const a of ACTIONS) P[a] = false;
  if (!gp) return;
  const b = (i) => gp.buttons[i] && gp.buttons[i].pressed;
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  P.left = b(14) || ax < -0.45;
  P.right = b(15) || ax > 0.45;
  P.up = b(12) || ay < -0.55;
  P.down = b(13) || ay > 0.55;
  P.jump = b(0);
  P.knife = b(2) || b(5) || b(7);
  P.special = b(1) || b(3) || b(4) || b(6);
  P.start = b(9);
  P.back = b(8);
  if (gp.buttons.some((x) => x && x.pressed)) { input.usingPad = true; input.usingTouch = false; }
}

/* ---- per frame merge ----------------------------------------------------------------- */
/** Sample every device once per animation frame; edges accumulate until a game step consumes them. */
function pollInput() {
  pollPad();
  for (const a of ACTIONS) {
    const now = !!(input.kb[a] || input.pad[a] || input.touch[a]);
    if ((now && !input.prev[a]) || input.latch[a]) input.pend[a] = true;
    input.held[a] = now;
    input.prev[a] = now;
    input.latch[a] = false;
  }
  if (input.anyLatch) input.pend.any = true;
  input.anyLatch = false;
  if (input.pad.start || input.pad.back) chip.unlock();
}

/** Hand the accumulated presses to one game step and clear them. */
function takeInput() {
  const P = input.pressed;
  let any = !!input.pend.any;
  for (const a of ACTIONS) { P[a] = !!input.pend[a]; if (P[a]) any = true; input.pend[a] = false; }
  if (P.start && game.state === 'play') P.pause = true;
  P.any = any; input.pend.any = false;
  input.tap = input.tapQueue.length ? input.tapQueue.shift() : null;
  input.typed = input.typedQueue.splice(0);
  input.backspace = input.bsLatch; input.bsLatch = false;
  return P;
}
function clearStepInput() { input.tap = null; input.typed = []; input.backspace = false; }

/* ==========================================================================
   Rendering: world, HUD, screens and the final CRT blit
   ========================================================================== */

const buf = makeCanvas(W, H);
const bg = buf.getContext('2d');
bg.imageSmoothingEnabled = false;
const view = { scale: 2, ox: 0, oy: 0, cw: 0, ch: 0, gx: 0, gy: 0, gw: 0, gh: 0 };

const C = {
  ink: '#ffffff', dim: '#9aa6b8', red: '#e8392a', gold: '#ffd27a', cyan: '#9fe8ff', green: '#4ad16a', shadow: '#000000', panel: 'rgba(8,10,20,0.86)'
};

function hitArea(x0, y0, x1, y1, data) { game.hits.push(Object.assign({ x0, y0, x1, y1 }, data)); }

function panel(g, x, y, w, h, border) {
  g.fillStyle = C.panel; g.fillRect(x, y, w, h);
  rect(g, x, y, w, 1, border || '#3a4a6a'); rect(g, x, y + h - 1, w, 1, border || '#3a4a6a');
  rect(g, x, y, 1, h, border || '#3a4a6a'); rect(g, x + w - 1, y, 1, h, border || '#3a4a6a');
}

function T(g, s, x, y, col, o) { return drawText(g, s, x, y, col || C.ink, Object.assign({ shadow: C.shadow }, o || {})); }
function blink(rate) { return Math.floor(game.t * (rate || 2)) % 2 === 0; }
function pad7(n) { return String(Math.max(0, Math.floor(n))).padStart(7, '0'); }

/* ---- world ---------------------------------------------------------------------- */
function drawWorld(g) {
  const L = game.L, st = game.st;
  const cx = Math.round(game.camX);
  let sx = 0, sy = 0;
  if (game.shake > 0.3 && game.state !== 'pause') { sx = Math.round(rand(-1, 1) * game.shake); sy = Math.round(rand(-1, 1) * game.shake * 0.6); }
  g.save();
  g.translate(sx, sy);
  g.drawImage(L.sky, 0, 0);
  if (game.bolt && st.weather === 'rain') {
    game.bolt.t += 1 / 60;
    if (game.bolt.t < 0.22) drawBolt(g, game.bolt.x);
  }
  const lay = [['far', 0.12], ['mid', 0.35], ['near', 0.6]];
  for (const [k, p] of lay) {
    const ox = Math.floor(cx * p) % LAYER_W;
    g.drawImage(L[k], -ox, 0); g.drawImage(L[k], LAYER_W - ox, 0);
    if (k === 'mid') drawMidAnim(g, ox, st);
  }
  g.drawImage(L.level, cx, 0, W, H, 0, 0, W, H);
  if (st.id === 'citadel') drawSearchlights(g, cx);
  for (const p of game.props) drawProp(g, p, cx);
  for (const c of game.caps) drawCaptive(g, c, cx);

  for (const it of game.items) drawItem(g, it, cx);
  if (game.hero) drawHero(g, game.hero, cx);
  for (const s of game.shots) drawShot(g, s, cx);
  drawFx(g, cx);
  const art = ART[st.id];

function drawSearchlights(g, cx) {

    const ex = bx + Math.cos(a) * 260, ey = 140 + Math.sin(a) * 260;
    g.fillStyle = '#e8f0ff';
    g.beginPath(); g.moveTo(bx, 140); g.lineTo(ex - 22, ey); g.lineTo(ex + 22, ey); g.closePath(); g.fill();
  }
  g.globalAlpha = 1;
}

function drawWeather(g) {
  const kind = game.st.weather;
  for (const p of game.wx) {
    const x = Math.round(p.x), y = Math.round(p.y);

    else if (kind === 'rain') { g.globalAlpha = 0.5; stampLine(g, x, y, x - 2, y + 7, 1, '#9ab0d8'); g.globalAlpha = 1; }
    else if (kind === 'dust') { g.globalAlpha = 0.6; rect(g, x, y, 1, 1, '#ffd8a0'); g.globalAlpha = 1; }
    else { g.globalAlpha = 0.5 + 0.5 * Math.sin(game.t * 3 + p.ph); rect(g, x, y, 1, 1, '#fff6b0'); g.globalAlpha = 1; }

}

    rect(g, x - 2, y - 4, 26, 30, sel ? 'rgba(232,57,42,0.35)' : 'rgba(255,255,255,0.06)');
    T(g, ENTRY_CHARS[E.chars[i]] === ' ' ? '_' : ENTRY_CHARS[E.chars[i]], x + 11, y + 4, sel && blink(4) ? C.gold : C.ink, { align: 'center', scale: 3 });
    T(g, '^', x + 11, y - 14, sel ? C.gold : C.dim, { align: 'center' });
    T(g, 'V', x + 11, y + 30, sel ? C.gold : C.dim, { align: 'center' });
    hitArea(x - 4, y - 20, x + 26, y - 4, { up: i });
    hitArea(x - 4, y + 26, x + 26, y + 42, { down: i });
    hitArea(x - 2, y - 4, x + 24, y + 26, { slot: i });
  }
  T(g, 'OK', W / 2 + 76, 104, C.green, { scale: 2 }); hitArea(W / 2 + 70, 96, W / 2 + 104, 124, { ok: true });
  T(g, 'TIME ' + Math.max(0, Math.ceil(E.t)), W / 2, 150, C.dim, { align: 'center' });
  T(g, input.usingTouch ? 'TAP ARROWS, THEN OK' : 'TYPE, OR UP/DOWN THEN KNIFE', W / 2, 168, '#6a7a94', { align: 'center' });
}

function drawEnding(g) {
  // dawn over the mountains
  bandSky(g, W, 0, H, [[0, '#1a2050'], [0.45, '#7a4a8a'], [0.75, '#f08a5a'], [1, '#ffd27a']], 14);
  const R = seeded(77);
  ridge(g, W, 160, [[2, 26], [5, 10]], true, '#3a2a4a', R, H);
  ridge(g, W, 180, [[3, 16], [7, 5]], true, '#2a1e36', R, H);
  const sunY = 150 - Math.min(40, game.stateT * 3);
  for (let r = 34; r > 18; r -= 5) { g.globalAlpha = 0.12; disc(g, 290, sunY, r, '#fff0c0'); }
  g.globalAlpha = 1; disc(g, 290, sunY, 16, '#fff2c8');
  rect(g, 0, 188, W, H - 188, '#1e1428');
  drawSprite(g, 'hero', 'victory', 0, 1, 96, 188);
  for (let i = 0; i < 3; i++) drawSprite(g, 'captive', i === 1 ? 'salute' : 'tied', 0, -1, 130 + i * 16, 188);
  const y0 = H + 10 - game.endScroll;
  const vis = (y) => y > 8 && y < 150;
  ENDING_LINES.forEach(([str, c], i) => { const y = y0 + i * 12; if (vis(y)) T(g, str, W / 2, y, c, { align: 'center' }); });
  const yS = Math.max(70, y0 + ENDING_LINES.length * 12 + 18);
  if (vis(yS)) T(g, 'FINAL SCORE ' + pad7(game.score), W / 2, yS, C.gold, { align: 'center' });
  if (yS <= 70 && blink(2)) T(g, input.usingTouch ? 'TAP TO CONTINUE' : 'PRESS KNIFE', W / 2, 92, C.ink, { align: 'center' });
}

/* ---- frame ------------------------------------------------------------------------------ */
function renderFrame() {
  const g = bg;
  game.hits = [];
  switch (game.state) {
    case 'boot': drawBoot(g); break;
    case 'title': drawTitle(g); break;
    case 'scores': drawScores(g); break;
    case 'howto': drawHowTo(g); break;
    case 'options': drawOptions(g); break;
    case 'intro': drawIntro(g); break;
    case 'play': drawWorld(g); drawHUD(g); drawBanners(g); break;
    case 'pause': drawPause(g); break;
    case 'clear': drawClear(g); drawHUD(g); break;
    case 'continue': drawContinue(g); drawHUD(g); break;
    case 'gameover': drawGameOver(g); drawHUD(g); break;
    case 'entry': drawEntry(g); break;
    case 'ending': drawEnding(g); break;
    default: break;
  }
  if (game.fadeT > 0) { g.globalAlpha = Math.min(1, game.fadeT / 0.22); rect(g, 0, 0, W, H, '#000000'); g.globalAlpha = 1; }
  blit();
}

let crtCache = null;
function blit() {
  const cv = $('screen'), g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#05060a';
  g.fillRect(0, 0, cv.width, cv.height);
  const s = view.scale, w = Math.round(W * s), h = Math.round(H * s);
  g.drawImage(buf, 0, 0, W, H, view.ox, view.oy, w, h);
  if (settings.crt && s >= 2) {
    const key = w + 'x' + h + 's' + s;
    if (!crtCache || crtCache.key !== key) crtCache = { key, cv: buildCrt(w, h, s) };
    g.drawImage(crtCache.cv, view.ox, view.oy);
  }
}

function buildCrt(w, h, s) {
  const c = makeCanvas(w, h), g = c.getContext('2d');
  const step = s;
  g.fillStyle = 'rgba(0,0,0,0.22)';
  for (let y = 0; y < h; y += step) g.fillRect(0, Math.floor(y + step * 0.62), w, Math.max(1, Math.round(step * 0.3)));
  const gr = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.72);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.42)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  return c;
}

/* ==========================================================================
   Boot, layout and the main loop
   ========================================================================== */

function touchVisible() {
  const m = settings.touch || 'auto';
  if (m === 'on') return true;
  if (m === 'off') return false;
  return (isTouch && coarse && !input.usingPad) || input.usingTouch;
}

let safe = { t: 0, b: 0, l: 0, r: 0 };
function readSafe() {
  const pr = $('safeProbe');
  if (!pr) return;
  const cs = getComputedStyle(pr);
  safe = { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0 };
}

/** Size the touch pad for landscape and report how much side room it needs. */
function sizePad(vw, vh, portrait) {
  const root = $('touch');
  if (!root) return { left: 0, right: 0 };
  if (portrait) { for (const k of ['--dp', '--bk', '--bj', '--bs']) root.style.removeProperty(k); return { left: 0, right: 0 }; }
  const dp = Math.round(clamp(Math.min(vh, 520) * 0.33, 100, 160));
  const bk = Math.round(dp * 0.47), bj = Math.round(dp * 0.41), bs = Math.round(dp * 0.33);
  root.style.setProperty('--dp', dp + 'px'); root.style.setProperty('--bk', bk + 'px');
  root.style.setProperty('--bj', bj + 'px'); root.style.setProperty('--bs', bs + 'px');
  return { left: Math.max(16, safe.l) + dp + 14, right: Math.max(16, safe.r) + bk + bj + 18 + 14 };
}

function layout() {
  readSafe();
  const cv = $('screen');
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const vw = window.innerWidth, vh = window.innerHeight;
  const tw = Math.max(1, Math.round(vw * dpr)), th = Math.max(1, Math.round(vh * dpr));
  if (cv.width !== tw || cv.height !== th) { cv.width = tw; cv.height = th; }
  const touchOn = touchVisible();
  const portrait = vh > vw * 1.05;
  const B = document.body.classList;
  B.toggle('touch-on', touchOn);
  B.toggle('portrait', portrait);
  let gx = 0, gy = 0, gw = vw, gh = vh;
  if (touchOn && portrait) {
    gy = safe.t + 8;
    gh = Math.min((vw * 9) / 16, vh * 0.52);
  } else if (touchOn) {
    // handheld landscape: the pad lives in side panels, the screen sits between them
    const pad = sizePad(vw, vh, false);
    const side = Math.max(pad.left, pad.right);
    const full = Math.min(vw, (vh * 16) / 9);
    gw = Math.min(vw, Math.max(vw - 2 * side, full * 0.72));
    gx = (vw - gw) / 2;
    gy = Math.max(0, safe.t);
    gh = vh - gy - Math.max(0, safe.b * 0.5);
  }
  if (!touchOn || portrait) sizePad(vw, vh, true);
  const fit = Math.min(gw / W, gh / H) * dpr;
  let s = fit;
  if (fit >= 2) { const f = Math.floor(fit); if (f / fit > 0.9) s = f; }
  view.scale = s;
  view.ox = Math.round(gx * dpr + (gw * dpr - W * s) / 2);
  view.oy = Math.round(gy * dpr + (gh * dpr - H * s) / 2);
  document.documentElement.style.setProperty('--game-bottom', Math.round((view.oy + H * s) / dpr) + 'px');
  crtCache = null;
}
function layoutTouch() { layout(); }

let lastT = 0, acc = 0, manual = false, lastTouchState = null;
function frame(now) {
  requestAnimationFrame(frame);
  if (manual) return;
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  pollInput();
  const tv = touchVisible();
  if (tv !== lastTouchState) { lastTouchState = tv; layout(); }
  let steps = 0;
  while (acc >= STEP && steps < 8) {
    if (steps === 0) updateGame(STEP, input.held, takeInput());
    else { clearStepInput(); updateGame(STEP, input.held, NO_PRESS); }
    acc -= STEP; steps++;
  }
  if (steps >= 8) acc = 0;
  renderFrame();
}

function boot() {
  initInput();
  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 150));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (game.state === 'play' && !game.demo) openPause();
      if (chip.ctx) chip.ctx.suspend().catch(() => {});
    } else {
      lastT = 0;
      if (chip.ctx) chip.ctx.resume().catch(() => {});
    }
  });
  window.addEventListener('blur', () => { if (game.state === 'play' && !game.demo) openPause(); });
  stageArt(STAGES[0]);
  try { $('screen').focus({ preventScroll: true }); } catch (e) { /* focus is best effort */ }
  setState('boot');
  requestAnimationFrame(frame);
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
    try { window.claude.hot.snapshot(hotSnapshot); } catch (e) { /* viewer without hot updates */ }
  }

  // hooks for automated testing
  const blank = () => ({ left: false, right: false, up: false, down: false, jump: false, knife: false, special: false, start: false, pause: false, back: false, any: false });
  window.__dagger = {
    game, input, chip, settings, STAGES, ETYPES, Chip, SONGS, parseTrack,
    setManual(v) { manual = v; },
    step(n, held, pressed, quiet) {
      const H0 = Object.assign(blank(), held || {});
      for (let i = 0; i < n; i++) {
        const P = i === 0 ? Object.assign(blank(), pressed || {}) : NO_PRESS;
        if (i === 0 && pressed && pressed.tap) input.tap = pressed.tap; else input.tap = null;
        input.typed = (i === 0 && pressed && pressed.typed) || [];
        updateGame(STEP, H0, P);
      }
      if (!quiet) renderFrame();
    },
    render: renderFrame, newGame, startStage, startDemo, setState, spawnFoe, makeBoss, layout, view
  };
}

/** State worth keeping if the page is updated while someone is mid-run. */
function hotSnapshot() {
  const live = ['intro', 'play', 'pause', 'clear', 'continue'].includes(game.state) && !game.demo;
  if (!live) return {};
  const h = game.hero;
  return { run: { stage: game.stageIdx, score: game.score, lives: game.lives, continues: game.continues, carry: h ? { wpn: h.wpn, ammo: h.ammo, hp: h.hp } : null } };
}

function resumeRun(r) {
  newGame(false);
  game.score = r.score || 0; game.lives = r.lives == null ? 2 : r.lives; game.continues = r.continues || 0;
  game.nextExtend = 30000;
  while (game.nextExtend <= game.score) game.nextExtend += 70000;
  game.hi = Math.max(game.hi, game.score);
  game.carry = r.carry || null;
  startStage(clamp(r.stage | 0, 0, STAGES.length - 1));
}

function start(data) {
  boot();
  if (data && data.run) { try { resumeRun(data.run); } catch (e) { setState('boot'); } }
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});

})();
</script>
