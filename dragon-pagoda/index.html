<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dragon Pagoda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#07040a">
<meta name="description" content="Dragon Pagoda: an original kung fu arcade climb. Fight up five temple floors with punches, kicks, combos and a Dragon Wave, beat five guardians and free Grandmaster Hu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cinzel:wght@700;900&family=Ma+Shan+Zheng&display=swap">
<style>
/* One deliberate world: a lacquered arcade cabinet at night. The canvas is full-bleed; the touch pad
   sits inside safe-area gutters (portrait: handheld layout under the screen, landscape: side panels). */
:root {
  color-scheme: dark;
  --bg: #07040a;
  --body: #140b10;
  --line: #3a2228;
  --ink: #f2e8e0;
  --ink-dim: #8a7a80;
  --punch: #d6312a;
  --punch-deep: #7a1410;
  --kick: #2f7ad0;
  --kick-deep: #143e78;
  --jump: #2aa070;
  --jump-deep: #105a3a;
  --chi: #e0b030;
  --chi-deep: #7a5a10;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(10px, env(safe-area-inset-top, 0px));
  --gb: max(14px, env(safe-area-inset-bottom, 0px));
  --pix: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --game-bottom: 50vh;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--pix); font-size: 10px; line-height: 1.15;
  overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#safeProbe {
  position: absolute; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
noscript { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }

/* ---------- touch pad ---------- */
#touch {
  position: absolute; inset: 0; display: none; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: var(--gt) var(--gb);
  --dp: min(40vw, 30vh, 176px);
  --bk: min(19vw, 13.5vh, 80px);
  --bj: min(16vw, 11.5vh, 68px);
  --bs: min(14vw, 10vh, 58px);
}
body.touch-on #touch { display: block; }
body.touch-on.portrait #touch {
  background:
    linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) var(--game-bottom), var(--body) calc(var(--game-bottom) + 1px), #0a0c13 100%);
}
.brand {
  display: none; position: absolute; left: var(--gl); right: var(--gr); top: calc(var(--game-bottom) + 18px);
  text-align: center; font-family: "Cinzel", Georgia, serif; font-size: 19px; letter-spacing: 5px; font-weight: 700; line-height: 1.15; color: #b48a52;
}
body.portrait .brand { display: block; }
.brand b { color: #d0463a; font-weight: 900; }
.brand span { display: block; margin-top: 10px; font-family: var(--pix); font-size: 11px; font-weight: 500; letter-spacing: 1px; line-height: 1.15; color: #6a5058; }
.grille {
  display: none; position: absolute; left: 50%; width: 180px; margin-left: -90px; height: 12px;
  top: calc(var(--game-bottom) + 74px);
  background: linear-gradient(90deg, transparent, rgba(201,154,74,0.6) 28%, rgba(201,154,74,0.6) 72%, transparent) center / 100% 1px no-repeat;
}
.grille::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -5px 0 0 -5px;
  transform: rotate(45deg); border: 1px solid rgba(214,168,90,0.85); background: #3a1418;
}
body.portrait .grille { display: block; }
@media (max-height: 700px) { .grille { display: none !important; } .brand span { display: none; } }

#dpad {
  position: absolute; left: var(--gl); bottom: calc(var(--gb) + 6px);
  width: var(--dp); height: var(--dp); border-radius: 50%; pointer-events: auto; touch-action: none;
  background: radial-gradient(circle at 50% 45%, rgba(70,40,40,0.55), rgba(24,12,14,0.72) 70%);
  border: 2px solid rgba(140,90,70,0.45);
}
body.portrait #dpad { bottom: calc(var(--gb) + 40px); }
#dpad .arm { position: absolute; background: #2a1618; border: 2px solid #5a3430; border-radius: 6px; }
#dpad .arm.h { left: 12%; right: 12%; top: 38%; bottom: 38%; }
#dpad .arm.v { top: 12%; bottom: 12%; left: 38%; right: 38%; }
#dpad .ar { position: absolute; width: 0; height: 0; border: 7px solid transparent; opacity: 0.65; }
#dpad .ar.l { left: 16%; top: calc(50% - 7px); border-right-color: #d0a890; border-left-width: 0; }
#dpad .ar.r { right: 16%; top: calc(50% - 7px); border-left-color: #d0a890; border-right-width: 0; }
#dpad .ar.u { top: 16%; left: calc(50% - 7px); border-bottom-color: #d0a890; border-top-width: 0; }
#dpad .ar.d { bottom: 16%; left: calc(50% - 7px); border-top-color: #d0a890; border-bottom-width: 0; }
#dpad.left .ar.l, #dpad.right .ar.r, #dpad.up .ar.u, #dpad.down .ar.d { opacity: 1; filter: drop-shadow(0 0 4px #ffd27a); }
#dpadKnob {
  position: absolute; left: calc(50% - 15%); top: calc(50% - 15%); width: 30%; height: 30%; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #8a5a50, #3a2022); border: 2px solid #160a0c; pointer-events: none;
  transition: transform 40ms linear;
}

/* arcade layout: PUNCH and KICK on the bottom row, CHI and JUMP staggered above them */
#btns { position: absolute; right: var(--gr); bottom: calc(var(--gb) + 6px); width: calc(var(--bk) * 2 + 12px); height: calc(var(--bk) * 1.3 + var(--bj) + 12px); pointer-events: none; }
body.portrait #btns { bottom: calc(var(--gb) + 40px); }
.tbtn {
  position: absolute; border-radius: 50%; border: 0; padding: 0; margin: 0; pointer-events: auto; touch-action: none;
  display: grid; place-content: center; gap: 4px; text-align: center; color: #fff; font-family: var(--pix);
  box-shadow: inset 0 -5px 0 rgba(0,0,0,0.35), 0 4px 0 rgba(0,0,0,0.55);
  transition: transform 50ms linear, filter 50ms linear;
}
.tbtn b { font-size: 20px; font-weight: 700; text-shadow: 0 2px 0 rgba(0,0,0,0.45); }
.tbtn small { font-size: 10px; letter-spacing: 1px; font-weight: 600; opacity: 0.92; }
.tbtn.on { transform: translateY(3px) scale(0.96); filter: brightness(1.25); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.35), 0 1px 0 rgba(0,0,0,0.55); }
#bPunch { width: var(--bk); height: var(--bk); left: 0; bottom: 0; background: radial-gradient(circle at 40% 32%, #ff7060, var(--punch) 55%, var(--punch-deep)); }
#bKick { width: var(--bk); height: var(--bk); right: 0; bottom: calc(var(--bk) * 0.3); background: radial-gradient(circle at 40% 32%, #70b0ff, var(--kick) 55%, var(--kick-deep)); }
#bJump { width: var(--bj); height: var(--bj); right: calc((var(--bk) - var(--bj)) / 2); bottom: calc(var(--bk) * 1.3 + 10px); background: radial-gradient(circle at 40% 32%, #6ae0b0, var(--jump) 55%, var(--jump-deep)); }
#bChi { width: var(--bs); height: var(--bs); left: calc((var(--bk) - var(--bs)) / 2); bottom: calc(var(--bk) + 12px); background: radial-gradient(circle at 40% 32%, #ffe080, var(--chi) 55%, var(--chi-deep)); color: #2a1c00; }
#bChi b { text-shadow: none; }

#tPause {
  position: absolute; pointer-events: auto; touch-action: none;
  width: 44px; height: 30px; border-radius: 15px; border: 2px solid #5a3430; background: rgba(36,18,20,0.8);
  color: #e8d2c8; font-family: var(--pix); font-size: 13px; font-weight: 700; letter-spacing: 1px;
  right: var(--gr); top: var(--gt);
}
body.portrait #tPause { top: auto; right: auto; left: calc(50% - 22px); bottom: calc(var(--gb) + 6px); width: 58px; }

/* landscape: a handheld layout with the pad in side panels; slightly translucent in case it overlaps the screen edge */
body.touch-on:not(.portrait) #dpad, body.touch-on:not(.portrait) .tbtn { opacity: 0.82; }
body.touch-on:not(.portrait) .tbtn.on { opacity: 1; }
body.touch-on:not(.portrait) #tPause { opacity: 0.85; }
@media (max-height: 420px) {
  .tbtn small { display: none; }
}
.tbtn:focus-visible, #tPause:focus-visible { outline: 2px solid #ffd27a; outline-offset: 3px; }
#screen:focus-visible { outline: none; }
@media (prefers-reduced-motion: reduce) {
  .tbtn, #dpadKnob { transition: none; }
}
</style>

</head>
<body>
<div id="app">
  <canvas id="screen" tabindex="0" aria-label="Dragon Pagoda game screen. Arrow keys move, Z punch, X kick, Space or Up jump, C chi wave, P pause."></canvas>
  <div id="safeProbe" aria-hidden="true"></div>
  <div id="touch" aria-hidden="true">
    <div class="brand"><b>DRAGON</b> PAGODA<span>TIP: TURN YOUR PHONE SIDEWAYS FOR A BIGGER SCREEN</span></div>
    <div class="grille" aria-hidden="true"></div>
    <div id="dpad" class="tctl">
      <i class="arm h"></i><i class="arm v"></i>
      <i class="ar l"></i><i class="ar r"></i><i class="ar u"></i><i class="ar d"></i>
      <span id="dpadKnob"></span>
    </div>
    <div id="btns">
      <button class="tbtn tctl" type="button" data-k="special" id="bChi"><b>C</b><small>CHI</small></button>
      <button class="tbtn tctl" type="button" data-k="jump" id="bJump"><b>J</b><small>JUMP</small></button>
      <button class="tbtn tctl" type="button" data-k="punch" id="bPunch"><b>P</b><small>PUNCH</small></button>
      <button class="tbtn tctl" type="button" data-k="kick" id="bKick"><b>K</b><small>KICK</small></button>
    </div>
    <button id="tPause" type="button" aria-label="Pause">II</button>
  </div>
  <noscript>Dragon Pagoda needs JavaScript to run.</noscript>
</div>

<script>
(function () {
/* ==========================================================================
   DRAGON PAGODA
   Core: screen constants, helpers, seeded random, settings, storage
   ========================================================================== */
'use strict';

const W = 384, H = 216;           // internal pixel resolution (16:9)
const HUD_H = 30;
const GROUND_Y = 194;             // where everyone's feet meet the floor
const GRAV = 900;
const STEP = 1 / 60;
const TAU = Math.PI * 2;
const DBG = {};               // profiling switches used by the tests
/** Adaptive quality: level 0 is full resolution; slower devices step down automatically. */
const QUALITY = { level: 0, res: [1, 0.8, 0.64] };

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (p) => Math.random() < p;
const sgn = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const $ = (id) => document.getElementById(id);

function seeded(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

function boxHit(a, b) { return a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0; }
function box(x0, y0, x1, y1) { return { x0, y0, x1, y1 }; }
/** A strike box in front of an actor: from `near` to `far` pixels ahead, between heights `lo` and `hi` above y. */
function front(a, near, far, lo, hi) {
  return a.face > 0 ? box(a.x + near, a.y - hi, a.x + far, a.y - lo) : box(a.x - far, a.y - hi, a.x - near, a.y - lo);
}

const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
const coarse = window.matchMedia ? matchMedia('(pointer: coarse)').matches : isTouch;
const reducedMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)').matches : false;

const store = {
  get(k, d) {
    try { const v = localStorage.getItem('dragonPagoda.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; }
  },
  set(k, v) { try { localStorage.setItem('dragonPagoda.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } }
};

const settings = Object.assign(
  { music: 0.7, sfx: 0.85, fx: true, shake: !reducedMotion, level: 'disciple', fighter: 'tao', touch: 'auto', muted: false },
  store.get('settings', {})
);
function saveSettings() { store.set('settings', settings); }

const DEFAULT_SCORES = [
  { n: 'HU.', s: 80000, st: 5 }, { n: 'TAO', s: 60000, st: 4 }, { n: 'LIN', s: 40000, st: 3 },
  { n: 'MEI', s: 25000, st: 2 }, { n: 'KAI', s: 10000, st: 1 }
];
function loadScores() {
  const s = store.get('scores', null);
  if (!Array.isArray(s) || s.length !== 5) return DEFAULT_SCORES.map((e) => Object.assign({}, e));
  return s;
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

function hexRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixHex(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  const c = A.map((v, i) => Math.round(lerp(v, B[i], t)));
  return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
}

/* ==========================================================================
   Vector drawing helpers. Everything is drawn in world units (384 x 216);
   the screen transform scales it to the device, so shapes stay crisp at any size.
   ========================================================================== */

function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function disc(g, cx, cy, r, c) { if (r <= 0) return; g.fillStyle = c; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill(); }
function ring(g, cx, cy, r, t, c) { g.strokeStyle = c; g.lineWidth = t; g.beginPath(); g.arc(cx, cy, Math.max(0.05, r - t / 2), 0, TAU); g.stroke(); }
function tri(g, cx, top, w, h, c) { g.fillStyle = c; g.beginPath(); g.moveTo(cx, top); g.lineTo(cx + w / 2, top + h); g.lineTo(cx - w / 2, top + h); g.closePath(); g.fill(); }
function stampLine(g, x0, y0, x1, y1, w, col) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function ellipse(g, cx, cy, rx, ry, rot, c) { g.fillStyle = c; g.beginPath(); g.ellipse(cx, cy, Math.max(0.01, rx), Math.max(0.01, ry), rot || 0, 0, TAU); g.fill(); }
function polyPath(g, pts) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); }
function poly(g, pts, c) { g.fillStyle = c; polyPath(g, pts); g.fill(); }
function roundRectPath(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function rrect(g, x, y, w, h, r, c) { g.fillStyle = c; roundRectPath(g, x, y, w, h, r); g.fill(); }
function lgrad(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); for (const [t, c] of stops) gr.addColorStop(t, c); return gr; }
function rgrad(g, x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); for (const [t, c] of stops) gr.addColorStop(t, c); return gr; }
function rgba(hex, a) { const [r, gg, b] = hexRgb(hex); return 'rgba(' + r + ',' + gg + ',' + b + ',' + a + ')'; }
function shade(hex, t) { return t < 0 ? mixHex(hex, '#000000', -t) : mixHex(hex, '#ffffff', t); }

/** A tapered capsule from A to B (radii ra at A, rb at B). */
function capsulePath(g, ax, ay, bx, by, ra, rb) {
  const ang = Math.atan2(by - ay, bx - ax);
  g.beginPath();
  g.arc(ax, ay, Math.max(0.01, ra), ang + Math.PI / 2, ang + Math.PI * 1.5);
  g.arc(bx, by, Math.max(0.01, rb), ang - Math.PI / 2, ang + Math.PI / 2);
  g.closePath();
}

/** A waving, tapered ribbon (sashes, hair, plumes, banners). Returns the tip. */
function ribbonPath(g, x0, y0, ang, len, w0, w1, wave, phase, segs) {
  const n = segs || 8, L = [], R = [];
  let x = x0, y = y0, a = ang;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const w = lerp(w0, w1, t) / 2;
    const nx = -Math.sin(a), ny = Math.cos(a);
    L.push(x + nx * w, y + ny * w); R.push(x - nx * w, y - ny * w);
    a = ang + Math.sin(phase + t * 3.2) * wave * (0.25 + t);
    x += Math.cos(a) * len / n; y += Math.sin(a) * len / n;
  }
  g.beginPath();
  g.moveTo(L[0], L[1]);
  for (let i = 2; i < L.length; i += 2) g.lineTo(L[i], L[i + 1]);
  for (let i = R.length - 2; i >= 0; i -= 2) g.lineTo(R[i], R[i + 1]);
  g.closePath();
  return [x, y];
}

/* ---- cached soft sprites: glows and ground shadows ------------------------------ */
const GLOW_CACHE = {};
function glowSprite(col) {
  let c = GLOW_CACHE[col];
  if (c) return c;
  c = makeCanvas(128, 128);
  const g = c.getContext('2d');
  g.fillStyle = rgrad(g, 64, 64, 0, 64, [[0, rgba(col, 0.6)], [0.35, rgba(col, 0.22)], [0.7, rgba(col, 0.06)], [1, rgba(col, 0)]]);
  g.fillRect(0, 0, 128, 128);
  GLOW_CACHE[col] = c;
  return c;
}
/** Additive soft light centred on x, y with radius r. */
function drawGlow(g, x, y, r, col, a) {
  if (!settings.fx && r > 12) a = (a === undefined ? 1 : a) * 0.6;
  const op = g.globalCompositeOperation, ga = g.globalAlpha;
  g.globalCompositeOperation = 'lighter';
  if (a !== undefined) g.globalAlpha = ga * a;
  g.drawImage(glowSprite(col), x - r, y - r, r * 2, r * 2);
  g.globalCompositeOperation = op; g.globalAlpha = ga;
}
let SOFT_DOT = null;
function softDot() {
  if (SOFT_DOT) return SOFT_DOT;
  const c = makeCanvas(64, 64), g = c.getContext('2d');
  g.fillStyle = rgrad(g, 32, 32, 0, 32, [[0, 'rgba(255,255,255,1)'], [0.5, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
  g.fillRect(0, 0, 64, 64);
  SOFT_DOT = c;
  return c;
}
let SHADOW_SPR = null;
function shadowSprite() {
  if (SHADOW_SPR) return SHADOW_SPR;
  const c = makeCanvas(96, 32), g = c.getContext('2d');
  g.save(); g.scale(1, 1 / 3);
  g.fillStyle = rgrad(g, 48, 48, 0, 48, [[0, 'rgba(0,0,0,0.55)'], [0.55, 'rgba(0,0,0,0.3)'], [1, 'rgba(0,0,0,0)']]);
  g.fillRect(0, 0, 96, 96);
  g.restore();
  SHADOW_SPR = c;
  return c;
}

/** Offscreen canvas for pre-rendered art at the current render scale (world units in, crisp pixels out). */
let RS = 2;
function artCanvas(w, h) {
  const c = makeCanvas(Math.ceil(w * RS), Math.ceil(h * RS));
  const g = c.getContext('2d');
  g.scale(RS, RS);
  c.rs = RS; c.uw = w; c.uh = h;
  return [c, g];
}
/** Draw part of a pre-rendered art canvas; source and destination in world units. */
function blitArt(g, c, sx, sy, sw, sh, dx, dy, dw, dh) {
  const r = c.rs;
  g.drawImage(c, sx * r, sy * r, sw * r, sh * r, dx, dy, dw === undefined ? sw : dw, dh === undefined ? sh : dh);
}

/* ==========================================================================
   Type: Barlow Condensed for the interface, Cinzel for titles, Ma Shan Zheng
   for calligraphy seals. Sizes are in world units, so text stays sharp.
   ========================================================================== */

const FONT_UI = '"Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif';
const FONT_DISPLAY = 'Cinzel, "Trajan Pro", "Times New Roman", Georgia, serif';
const FONT_BRUSH = '"Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", serif';
const MEASURE = makeCanvas(4, 4).getContext('2d');

function fontSpec(scale, opts) {
  const s = 8.4 * (scale || 1);
  if (opts && opts.display) return (opts.weight || 700) + ' ' + s + 'px ' + FONT_DISPLAY;
  if (opts && opts.brush) return s + 'px ' + FONT_BRUSH;
  return (opts && opts.weight || 600) + ' ' + s + 'px ' + FONT_UI;
}

function textWidth(str, scale, opts) {
  MEASURE.font = fontSpec(scale, opts);
  return MEASURE.measureText(opts && opts.raw ? String(str) : String(str).toUpperCase()).width;
}

/** Draw text with its top at y. opts: { scale, align, shadow, display, brush, weight, raw, stroke } */
function drawText(g, str, x, y, color, opts) {
  str = String(str);
  if (!(opts && opts.raw)) str = str.toUpperCase();
  const s = (opts && opts.scale) || 1;
  g.font = fontSpec(s, opts);
  g.textBaseline = 'top';
  g.textAlign = (opts && opts.align) || 'left';
  if (opts && opts.stroke) { g.lineJoin = 'round'; g.lineWidth = opts.strokeW || 1.6 * s; g.strokeStyle = opts.stroke; g.strokeText(str, x, y); }
  const shadow = opts && opts.shadow;
  if (shadow) { g.fillStyle = shadow; g.fillText(str, x + 0.5 * s, y + 0.6 * s); }
  g.fillStyle = color;
  g.fillText(str, x, y);
  const w = g.measureText(str).width;
  g.textAlign = 'left';
  return w;
}

/** Ask the browser for the web fonts early; text uses fallbacks until they arrive. */
function loadFonts() {
  if (!document.fonts || !document.fonts.load) return;
  const want = ['600 12px "Barlow Condensed"', '700 12px "Barlow Condensed"', '700 12px Cinzel', '900 12px Cinzel'];
  for (const f of want) document.fonts.load(f).catch(() => {});
  document.fonts.load('12px "Ma Shan Zheng"', '龍塔').catch(() => {});
}

const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteFreq(tok) {
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(tok);
  if (!m) return 0;
  let n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  const oct = +m[3];
  const midi = 12 * (oct + 1) + n;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

/* Bass helper: roots per half bar -> eighth-note octave pattern */
function octBass(roots) {
  const out = [];
  for (const r of roots) {
    const m = /^([A-G][#b]?)(\d)$/.exec(r);
    const lo = r, hi = m[1] + (+m[2] + 1);
    out.push(lo, '.', hi, '.', lo, '.', hi, '.');
  }
  return out.join(' ');
}
function rep(s, n) { return Array(n).fill(s).join(' '); }
/* Driving sixteenth-note octave bass, one root per half bar */
function halfBass(roots) {
  return roots.map((r) => {
    const m = /^([A-G][#b]?)(\d)$/.exec(r);
    const hi = m[1] + (+m[2] + 1);
    return rep(r + ' ' + hi, 4);
  }).join(' ');
}

/* Sustained pad: one note per half bar */
function pad(notes) { return notes.map((n) => n + ' - - - - - - -').join(' '); }

function parseTrack(str) {
  return str.split(/\s+/).filter((t) => t && t !== '|');
}

class Chip {
  constructor() {
    this.ctx = null;
    this.song = null;
    this.timer = null;
    this.loops = {};
  }

  unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ctx) {
      let c;
      try { c = new AC({ latencyHint: 'interactive' }); } catch (e) { c = new AC(); }
      this.initCtx(c);
      if (this.pending) { const p = this.pending; this.pending = null; this.play(p); }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  }

  /** Build the bus graph and wave tables on a context (also used for offline renders in tests). */
  initCtx(c) {
    {
      this.ctx = c;
      this.master = c.createGain(); this.master.gain.value = 0.9;
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 3; comp.attack.value = 0.002; comp.release.value = 0.15;
      this.master.connect(comp); comp.connect(c.destination);
      this.musicBus = c.createGain(); this.musicBus.connect(this.master);
      this.sfxBus = c.createGain(); this.sfxBus.connect(this.master);
      this.waves = {
        p12: this.pulseWave(0.125), p25: this.pulseWave(0.25), p50: this.pulseWave(0.5)
      };
      const len = c.sampleRate * 1.5;
      this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      // short-period "metallic" noise like old sound chips
      this.metalBuf = c.createBuffer(1, len, c.sampleRate);
      const m = this.metalBuf.getChannelData(0);
      let lfsr = 1;
      for (let i = 0; i < len; i++) {
        if (i % 12 === 0) { const bit = ((lfsr >> 0) ^ (lfsr >> 6)) & 1; lfsr = (lfsr >> 1) | (bit << 14); }
        m[i] = lfsr & 1 ? 1 : -1;
      }
      this.applyVolumes();
    }
  }

  ok() { return !!(this.ctx && this.ctx.state === 'running'); }

  applyVolumes() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const on = settings.muted ? 0 : 1;
    this.musicBus.gain.setTargetAtTime(on * settings.music * 0.78, t, 0.05);
    this.sfxBus.gain.setTargetAtTime(on * settings.sfx * 2.1, t, 0.05);
  }

  pulseWave(duty) {
    const n = 48, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) {
      re[k] = Math.sin(2 * Math.PI * k * duty) / (k * Math.PI);
      im[k] = (1 - Math.cos(2 * Math.PI * k * duty)) / (k * Math.PI);
    }
    return this.ctx.createPeriodicWave(re, im);
  }

  osc(wave, freq, t) {
    const o = this.ctx.createOscillator();
    if (this.waves[wave]) o.setPeriodicWave(this.waves[wave]);
    else o.type = wave === 'tri' ? 'triangle' : wave === 'saw' ? 'sawtooth' : wave === 'sin' ? 'sine' : 'square';
    o.frequency.setValueAtTime(freq, t);
    return o;
  }

  tone(t, freq, dur, wave, vol, bus, opt) {
    const c = this.ctx;
    const o = this.osc(wave, freq, t);
    const g = c.createGain();
    const a = (opt && opt.a) || 0.004, rel = (opt && opt.r) || 0.04;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    if (opt && opt.decay) g.gain.setTargetAtTime(vol * (opt.sus || 0.5), t + a, opt.decay);
    g.gain.setValueAtTime(opt && opt.decay ? vol * (opt.sus || 0.5) : vol, Math.max(t + a, t + dur - rel));
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    if (opt && opt.slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, opt.slide), t + dur);
    if (opt && opt.vib) {
      const l = c.createOscillator(); l.frequency.value = opt.vib[0];
      const lg = c.createGain(); lg.gain.value = opt.vib[1];
      l.connect(lg); lg.connect(o.frequency); l.start(t + (opt.vib[2] || 0.1)); l.stop(t + dur + 0.05);
    }
    o.connect(g); g.connect(bus || this.sfxBus);
    o.start(t); o.stop(t + dur + 0.05);
  }

  noise(t, dur, vol, type, freq, q, bus, opt) {
    const c = this.ctx;
    const s = c.createBufferSource();
    s.buffer = opt && opt.metal ? this.metalBuf : this.noiseBuf;
    if (opt && opt.rate) s.playbackRate.value = opt.rate;
    const f = c.createBiquadFilter();
    f.type = type || 'lowpass'; f.frequency.setValueAtTime(freq || 4000, t); f.Q.value = q || 0.7;
    if (opt && opt.sweep) f.frequency.exponentialRampToValueAtTime(opt.sweep, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus || this.sfxBus);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }

  /** Big temple drum: a pitched thump with a skin slap. */
  taiko(t, vol, bus) {
    this.tone(t, 96, 0.32, 'sin', vol, bus, { slide: 48, r: 0.12 });
    this.noise(t, 0.08, vol * 0.35, 'lowpass', 600, 0.8, bus);
  }

  /** Bronze gong: inharmonic partials with a long shimmer. */
  gong(t, vol, bus) {
    const base = 98;
    [[1, 1], [1.48, 0.55], [2.07, 0.45], [2.63, 0.3], [3.41, 0.22], [4.2, 0.12]].forEach(([r, a], i) => {
      this.tone(t, base * r, 2.6 - i * 0.25, 'sin', vol * a, bus, { a: 0.008, decay: 0.5 + i * 0.05, sus: 0.25, r: 1.4, vib: [4 + i, 1.5, 0.05], slide: base * r * 0.985 });
    });
    this.noise(t, 0.5, vol * 0.4, 'bandpass', 900, 0.6, bus, { sweep: 300 });
  }

  /* ---- music ---------------------------------------------------------- */
  play(name, onEnd) {
    if (!this.ctx) { this.pending = name; return; }
    this.stopMusic(true);
    const s = SONGS[name];
    if (!s) return;
    if (!s.parsed) {
      s.parsed = {
        lead: parseTrack(s.lead), harm: parseTrack(s.harm), bass: parseTrack(s.bass), drum: parseTrack(s.drum), arp: s.arp ? parseTrack(s.arp) : []
      };
      s.len = Math.max(s.parsed.lead.length, s.parsed.bass.length, s.parsed.drum.length);
    }

  const mx = ax + (dx * a) / d, my = ay + (dy * a) / d;
  const pxv = -dy / d, pyv = dx / d;
  const j1 = [mx + pxv * h, my + pyv * h], j2 = [mx - pxv * h, my - pyv * h];
  let j;
  if (prefer === 'fwd') j = j1[0] >= j2[0] ? j1 : j2;
  else if (prefer === 'back') j = j1[0] <= j2[0] ? j1 : j2;
  else if (prefer === 'down') j = j1[1] >= j2[1] ? j1 : j2;
  else j = j1[1] <= j2[1] ? j1 : j2;
  return { j, e: [bx, by] };
}

function rotPt(p, r) {
  if (!r) return p;
  const c = Math.cos(r), s = Math.sin(r);
  return [p[0] * c + p[1] * s, -p[0] * s + p[1] * c];
}

function solvePose(pose, k) {
  const hipY = -(pose.hip == null ? 13 : pose.hip) * k;
  const tl = (pose.tl || 10) * k;
  const lean = (pose.lean || 0) * k;
  const hip = [0, hipY];
  const neck = [lean, hipY - Math.sqrt(Math.max(1, tl * tl - lean * lean))];
  const hd = pose.hd || [0, 0];
  const head = [neck[0] + 0.5 * k + hd[0] * k, neck[1] - 3.5 * k + hd[1] * k];
  const shF = [neck[0] + 0.6 * k, neck[1] + 1.6 * k];
  const shB = [neck[0] - 0.6 * k, neck[1] + 1.6 * k];
  const S = (p) => [p[0] * k, p[1] * k];
  const legF = ik2(hip[0] + 1 * k, hip[1], ...S(pose.ff || [4, 0]), 7 * k, 7 * k, pose.kneeF || 'fwd');
  const legB = ik2(hip[0] - 1 * k, hip[1], ...S(pose.bf || [-4, 0]), 7 * k, 7 * k, pose.kneeB || 'fwd');
  const armF = ik2(shF[0], shF[1], ...S(pose.fh || [6, -16]), 5 * k, 5 * k, pose.elbowF || 'down');
  const armB = ik2(shB[0], shB[1], ...S(pose.bh || [3, -15]), 5 * k, 5 * k, pose.elbowB || 'down');
  const r = ((pose.rot || 0) * Math.PI) / 180;
  const R = (p) => rotPt(p, r);
  return {
    hip: R(hip), neck: R(neck), head: R(head), shF: R(shF), shB: R(shB),
    kneeF: R(legF.j), footF: R(legF.e), kneeB: R(legB.j), footB: R(legB.e),
    elbF: R(armF.j), handF: R(armF.e), elbB: R(armB.j), handB: R(armB.e), rot: r
  };
}

      eyeV(g, d, 1.15 * u, -0.05 * u, u, expr, blink); browV(g, u, 'kiai', d.hair, 0.6); noseV(g, d, u);
      celFill(g, () => { g.beginPath(); g.moveTo(2.2 * u, 0.4 * u); g.quadraticCurveTo(2.9 * u, 1.6 * u, 1.7 * u, 3.3 * u); g.quadraticCurveTo(0.4 * u, 3.9 * u, -1.2 * u, 2.3 * u); g.lineTo(-1.0 * u, 0.6 * u); g.quadraticCurveTo(0.6 * u, 1.1 * u, 2.2 * u, 0.4 * u); g.closePath(); }, 0.6 * u, 2 * u, d.hair, d.hairL, d, 0.8 * u);

      poly(g, [1.0 * u, 1.0 * u, 2.4 * u, 0.9 * u, 2.2 * u, 1.9 * u, 1.2 * u, 1.9 * u], '#3a0a0e');
      poly(g, [1.25 * u, 1.0 * u, 1.55 * u, 1.0 * u, 1.4 * u, 1.65 * u], '#fffbe8'); poly(g, [1.95 * u, 0.95 * u, 2.25 * u, 0.95 * u, 2.1 * u, 1.6 * u], '#fffbe8');

function hairBand(g, d, u) {
  celFill(g, () => {
    g.beginPath(); g.moveTo(2.15 * u, -1.25 * u);
    g.quadraticCurveTo(1.9 * u, -2.6 * u, 1.0 * u, -3.0 * u);

    g.lineTo(-0.2 * u, -4.05 * u); g.lineTo(-0.95 * u, -3.1 * u);

/* ---- the whole fighter ------------------------------------------------------------------ */
function renderFighter(g, kind, pose, x, y, face, anim, frame, tint) {
  const def = CHARS[kind], k = def.k;
  let d = dpal(def.pal);
  if (tint) d = tintPal(d, tint);
  const P = solvePose(pose, k);
  LX = -0.24 * face; LY = -0.26;
  const expr = PAIN_ANIMS.has(anim) ? 'hurt' : (KIAI_ANIMS.has(anim) && frame >= 0.55 && frame < 2.2 ? 'kiai' : 'calm');
  const seed = (x * 0.731) % 7;
  const ph = game.t * 6.5 + seed;
  g.save();
  g.translate(x, y + (pose.dy || 0) * k);
  if (face < 0) g.scale(-1, 1);
  if (!pose.noBackArm) drawArmV(g, d, P.shB, P.elbB, P.handB, k, true, pose.fistB);
  if (pose.itemB) drawHeldV(g, d, P.handB, pose.itemB, pose.iaB, k, P.rot);
  drawSashTails(g, d, P, k, ph);
  drawLegV(g, d, P, P.kneeB, P.footB, k, true);
  drawTorsoV(g, d, P, k);
  drawLegV(g, d, P, P.kneeF, P.footF, k, false);
  if (d.robe) drawSkirtV(g, d, P, k);
  drawBeltV(g, d, P, k);
  const T = torsoFrame(P);
  drawHeadV(g, d, P.head[0], P.head[1], P.neck[0], P.neck[1], Math.atan2(T.ax, -T.ay) * 0.55, k, expr, ph, seed);
  if (!pose.noFrontArm) {
    drawArmV(g, d, P.shF, P.elbF, P.handF, k, false, pose.fistF);
    if (pose.item) drawHeldV(g, d, P.handF, pose.item, pose.ia, k, P.rot);
  }
  if (pose.tied && !d.tint) {
    for (let i = 0; i < 3; i++) line(g, T.hx - 3 * k, T.hy - (1.5 + i * 1.6) * k, T.hx + 3 * k, T.hy - (2.2 + i * 1.6) * k, 0.45 * k, '#c9a463');
  }
  g.restore();
}

/* Translucent or flashing fighters are painted once into a scratch layer and composited in
   a single pass, so overlapping limbs never stack up into a washed out, see-through figure. */
let SPRITE_DIRECT = false;   // reflections set this: they are faint enough to draw straight through
let SPRITE_LAYER = null;
function spriteLayer(cv) {
  if (!SPRITE_LAYER || SPRITE_LAYER.width !== cv.width || SPRITE_LAYER.height !== cv.height) SPRITE_LAYER = makeCanvas(cv.width, cv.height);
  return SPRITE_LAYER;
}
function spriteRect(m, cv, x, y, k) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const px of [x - 36 * k, x + 36 * k]) for (const py of [y - 46 * k, y + 8 * k]) {
    const X = m.a * px + m.c * py + m.e, Y = m.b * px + m.d * py + m.f;
    if (X < x0) x0 = X; if (X > x1) x1 = X; if (Y < y0) y0 = Y; if (Y > y1) y1 = Y;
  }
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  x1 = Math.min(cv.width, Math.ceil(x1)); y1 = Math.min(cv.height, Math.ceil(y1));
  return x1 > x0 && y1 > y0 ? [x0, y0, x1 - x0, y1 - y0] : null;
}

/** Same call shape as the old sprite blitter; frame may be fractional for smooth motion. */
function drawSprite(g, kind, anim, frame, facing, x, y, flash, alpha) {
  const a = alpha === undefined ? 1 : clamp(alpha, 0, 1);
  if (a <= 0.01) return;
  const pose = poseAt(kind, anim, frame);
  const ga = g.globalAlpha, net = ga * a;
  const cv = g.canvas;
  const layered = (flash || net < 0.97) && !SPRITE_DIRECT && QUALITY.level < 2 && cv && cv.id === 'screen' && g.getTransform;
  if (!layered) {
    g.globalAlpha = net;
    renderFighter(g, kind, pose, x, y, facing, anim, frame, null);
    if (flash) { g.globalAlpha = net * 0.22; renderFighter(g, kind, pose, x, y, facing, anim, frame, flash === true ? '#ffffff' : flash); }
    g.globalAlpha = ga;
    return;
  }
  const m = g.getTransform();
  const r = spriteRect(m, cv, x, y, CHARS[kind].k);
  if (!r) return;
  const L = spriteLayer(cv), q = L.getContext('2d');
  q.setTransform(1, 0, 0, 1, 0, 0); q.globalAlpha = 1; q.globalCompositeOperation = 'source-over';
  q.clearRect(r[0], r[1], r[2], r[3]);
  q.setTransform(m.a, m.b, m.c, m.d, m.e, m.f);
  renderFighter(q, kind, pose, x, y, facing, anim, frame, null);
  if (flash) {
    // lighten only the painted figure, keeping its line art readable under the flash
    q.setTransform(1, 0, 0, 1, 0, 0);
    q.globalCompositeOperation = 'source-atop';
    q.globalAlpha = flash === true ? 0.42 : 0.4;
    q.fillStyle = flash === true ? '#fff8ee' : flash;
    q.fillRect(r[0], r[1], r[2], r[3]);
    q.globalCompositeOperation = 'source-over'; q.globalAlpha = 1;
  }
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = net;
  g.drawImage(L, r[0], r[1], r[2], r[3], r[0], r[1], r[2], r[3]);
  g.restore();
}

/** Joint positions in world space, used for motion trails. */
function fighterJoints(kind, anim, frame, facing, x, y) {
  const def = CHARS[kind], pose = poseAt(kind, anim, frame);
  const P = solvePose(pose, def.k);
  const oy = y + (pose.dy || 0) * def.k;
  const w = (p) => [x + p[0] * facing, oy + p[1]];
  return { handF: w(P.handF), handB: w(P.handB), footF: w(P.footF), footB: w(P.footB), head: w(P.head) };
}

/** A fighter's head alone, for portraits and life icons. */
function drawPortrait(g, kind, x, y, size, face) {
  const def = CHARS[kind], d = dpal(def.pal), k = def.k;
  const s = size / (8 * k);
  g.save(); g.translate(x, y); g.scale(s * (face || 1), s);
  LX = -0.24; LY = -0.26;
  drawHeadV(g, d, 0, 0, 0, 3.6 * k, 0, k, 'calm', game.t * 5, 1);
  g.restore();
}

/* ==== creatures, props, pickups and projectiles ==================================================== */
const MONKEY_PAL = dpal({ fur: '#8a5a34', face: '#efcfa8', vest: '#c0392b', cap: '#d6312a' });

function drawMonkey(g, x, y, face, fr, flash, alpha) {
  let d = MONKEY_PAL;
  if (flash) d = tintPal(d, '#ffffff');
  const ga = g.globalAlpha;
  g.globalAlpha = ga * (alpha === undefined ? 1 : alpha);
  g.save(); g.translate(x, y); if (face < 0) g.scale(-1, 1);
  LX = -0.24 * face; LY = -0.26;
  const leap = fr >= 4 && fr < 5, tumble = fr >= 5;
  if (tumble) { g.translate(0, -7); g.rotate(-2.4 - (game.t * 9) % TAU); g.translate(0, 7); }
  const ph = ((fr % 4) / 4) * TAU;
  const by = leap ? -10.5 : -8.6 - Math.abs(Math.sin(ph)) * 0.8;
  ribbon(g, d, -5.2, by - 1, -2.3, 9, 1.7, 0.7, 0.7, game.t * 6, d.furS);
  const leg = (hx, hy, o, back) => {
    const a = ph + o;
    const fx = leap ? hx + (back ? -3.5 : 3.5) : hx + Math.sin(a) * 3.6, fy = leap ? hy + 3 : -0.9 - Math.max(0, Math.cos(a)) * 2.4;
    const kx = (hx + fx) / 2 + 1.2, ky = (hy + fy) / 2 - 0.6;
    limbs(g, [[hx, hy, kx, ky, 1.25, 1.0, back ? d.furS : shade(d.fur, -0.2), back ? shade(d.fur, -0.15) : d.fur], [kx, ky, fx, fy, 1.0, 0.85, back ? d.furS : shade(d.fur, -0.2), back ? shade(d.fur, -0.15) : d.fur]], d);
  };
  leg(-3.2, by + 2.6, Math.PI, true);
  leg(3.0, by + 2.4, Math.PI * 0.5, true);
  celFill(g, () => { g.beginPath(); g.ellipse(0, by, 6.2, 4.2, -0.12, 0, TAU); }, 0, by, d.furS, d.fur, d, 2.2);
  if (!d.tint) { g.fillStyle = d.vest; g.beginPath(); g.ellipse(0.6, by - 0.6, 4.6, 3.4, -0.12, Math.PI * 1.05, Math.PI * 1.95); g.lineTo(0.6, by + 1.2); g.closePath(); g.fill(); }
  leg(-2.4, by + 2.6, 0, false);
  leg(3.6, by + 2.4, Math.PI * 1.5, false);
  // head
  const hx = 6.2, hy = by - 4.4;
  disc(g, hx - 2.4, hy - 1.9, 1.5 + OLW, d.ink); disc(g, hx - 2.4, hy - 1.9, 1.5, d.tint ? d.ink : d.faceS);
  celFill(g, () => { g.beginPath(); g.arc(hx, hy, 3.7, 0, TAU); }, hx, hy, d.furS, d.fur, d, 1.4);
  if (!d.tint) {
    g.fillStyle = d.face; g.beginPath(); g.ellipse(hx + 1.3, hy + 0.5, 2.5, 2.3, 0, 0, TAU); g.fill();
    disc(g, hx + 1.4, hy - 0.5, 0.55, INK); disc(g, hx + 2.6, hy - 0.4, 0.5, INK); disc(g, hx + 1.55, hy - 0.65, 0.18, '#ffffff');
    line(g, hx + 1.6, hy + 1.6, hx + 2.9, hy + 1.4, 0.3, '#5a2a1a');
    g.fillStyle = d.cap; g.beginPath(); g.ellipse(hx - 0.4, hy - 3.1, 2.4, 1.2, -0.2, Math.PI, TAU); g.fill();
    disc(g, hx - 0.6, hy - 4.1, 0.55, '#f2c94c');
  }
  // reaching arm
  const ax = leap ? hx + 4.5 : 4 + Math.sin(ph + 1) * 2, ay = leap ? hy - 2 : -1.5;
  limbs(g, [[3.2, by - 0.5, ax, ay, 1.05, 0.85, shade(d.fur, -0.2), d.fur]], d);
  g.restore();
  g.globalAlpha = ga;
}

function drawSnake(g, x, y, face, fr, alpha) {
  const ga = g.globalAlpha;
  g.globalAlpha = ga * (alpha === undefined ? 1 : alpha);
  g.save(); g.translate(x, y); if (face < 0) g.scale(-1, 1);
  const strike = fr === 2, phs = game.t * 9 + x * 0.1;
  const pts = [];
  for (let i = 0; i <= 14; i++) {
    const t = i / 14, px0 = -10 + t * 18;
    let py = -1.6 + Math.sin(phs + t * 6) * 1.3 * (1 - t * 0.4);
    if (strike && t > 0.55) py -= (t - 0.55) * 18;
    pts.push(px0, py);
  }
  const path = () => { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); };
  g.lineCap = 'round'; g.lineJoin = 'round';
  path(); g.strokeStyle = INK; g.lineWidth = 3.8; g.stroke();
  path(); g.strokeStyle = '#3e8a3a'; g.lineWidth = 2.8; g.stroke();
  path(); g.strokeStyle = '#7ccf5a'; g.lineWidth = 1.2; g.stroke();
  for (let i = 4; i < pts.length - 4; i += 6) disc(g, pts[i], pts[i + 1], 0.6, '#2a5a2a');
  const hx = pts[pts.length - 2], hy = pts[pts.length - 1];
  ellipse(g, hx + 1.2, hy, 2.7 + OLW, 1.9 + OLW, 0, INK); ellipse(g, hx + 1.2, hy, 2.7, 1.9, 0, '#4fa04a');
  disc(g, hx + 1.9, hy - 0.6, 0.45, '#ffd04a'); disc(g, hx + 2.0, hy - 0.6, 0.2, INK);
  if (Math.sin(game.t * 12) > 0) { line(g, hx + 3.7, hy + 0.3, hx + 5.4, hy + 0.1, 0.3, '#e8392a'); }
  g.restore();
  g.globalAlpha = ga;
}

/** Porcelain vase with its base at (x, y). kind 1 is blue-and-white, 0 is red lacquer. */
function drawVase(g, x, y, kind, s) {
  s = s || 1;
  g.save(); g.translate(x, y); g.scale(s, s);
  const blue = kind === 1;
  const path = () => {
    g.beginPath();
    g.moveTo(-1.6, -17.5); g.lineTo(1.6, -17.5);
    g.quadraticCurveTo(1.4, -15, 2.4, -14);
    g.bezierCurveTo(7.2, -12, 6.8, -4, 3.0, -1.2);
    g.lineTo(3.0, 0); g.lineTo(-3.0, 0); g.lineTo(-3.0, -1.2);
    g.bezierCurveTo(-6.8, -4, -7.2, -12, -2.4, -14);
    g.quadraticCurveTo(-1.4, -15, -1.6, -17.5);
    g.closePath();
  };
  path(); g.lineWidth = 1.0; g.strokeStyle = INK; g.stroke();
  g.fillStyle = blue ? lgrad(g, -6, 0, 6, 0, [[0, '#b8c4d4'], [0.35, '#f4f8fc'], [0.7, '#e2e8f0'], [1, '#98a6b8']]) : lgrad(g, -6, 0, 6, 0, [[0, '#7a2014'], [0.35, '#d0502e'], [0.7, '#b23a22'], [1, '#5a160e']]);
  g.fill();
  g.save(); path(); g.clip();
  if (blue) {
    rect(g, -7, -11, 14, 1.0, '#2f5fae'); rect(g, -7, -4.5, 14, 0.8, '#2f5fae');
    for (let i = -2; i <= 2; i++) { ring(g, i * 2.8, -7.8, 1.2, 0.45, '#3a6ab8'); }
  } else {
    rect(g, -7, -11.5, 14, 1.4, '#f2c94c'); rect(g, -7, -4.2, 14, 1.0, '#f2c94c');
    for (let i = -2; i <= 2; i++) disc(g, i * 2.8, -7.8, 0.7, '#f2c94c');
  }
  rect(g, -3.6, -13, 1.1, 10, 'rgba(255,255,255,0.4)');
  g.restore();
  rect(g, -2.1, -18.2, 4.2, 1.2, blue ? '#e8eef4' : '#c0452a');
  g.restore();
}

/** Hanging paper lantern; (x, y) is where its cord meets the cap. */
function drawLantern(g, x, y, lit, s) {
  s = s || 1;
  g.save(); g.translate(x, y); g.scale(s, s);
  rrect(g, -3.2, 0, 6.4, 2, 0.6, '#d9a43a');
  g.beginPath(); g.ellipse(0, 9, 5.6, 6.8, 0, 0, TAU);
  g.lineWidth = 0.9; g.strokeStyle = INK; g.stroke();
  g.fillStyle = lit ? rgrad(g, -0.8, 8, 0.5, 7.5, [[0, '#fff0b0'], [0.35, '#ff8a3a'], [0.8, '#d4321e'], [1, '#8a1810']]) : lgrad(g, -5, 0, 5, 0, [[0, '#5a1a12'], [0.5, '#9a2a1a'], [1, '#4a140e']]);
  g.fill();
  g.strokeStyle = 'rgba(90,20,10,0.55)'; g.lineWidth = 0.4;
  for (const r of [0.3, 0.62]) { g.beginPath(); g.ellipse(0, 9, 5.6 * r, 6.8, 0, -Math.PI / 2, Math.PI / 2); g.stroke(); g.beginPath(); g.ellipse(0, 9, 5.6 * r, 6.8, 0, Math.PI / 2, Math.PI * 1.5); g.stroke(); }
  rrect(g, -3.2, 15.6, 6.4, 1.8, 0.6, '#d9a43a');
  for (let i = -1; i <= 1; i++) line(g, i * 0.9, 17.4, i * 1.2, 22.5, 0.5, '#c0282c');
  g.restore();
}

const PICK_DRAW = {
  bun(g) {
    g.beginPath(); g.ellipse(0, 1.5, 5.4, 3.6, 0, Math.PI, TAU); g.lineTo(5.4, 2.6); g.quadraticCurveTo(0, 4.2, -5.4, 2.6); g.closePath();
    g.lineWidth = 0.8; g.strokeStyle = INK; g.stroke();
    g.fillStyle = rgrad(g, -1.5, -1, 0.5, 6, [[0, '#ffffff'], [1, '#d8cfb8']]); g.fill();
    for (let i = -2; i <= 2; i++) line(g, i * 0.8, -1.6, i * 2.0, 0.6, 0.35, 'rgba(160,140,110,0.7)');

/* ---- helpers ------------------------------------------------------------------- */
function stars(g, w, h, n, R, col) {
  for (let i = 0; i < n; i++) {
    const x = R() * w, y = R() * h, s = R();
    g.globalAlpha = 0.3 + s * 0.7;
    disc(g, x, y, 0.25 + s * 0.45, col || '#ffffff');
    if (s > 0.92) { g.globalAlpha = 0.25; disc(g, x, y, 1.6, col || '#ffffff'); }
  }
  g.globalAlpha = 1;
}
/** Tileable mountain ridge (integer harmonics) filled with a vertical gradient. */
function ridgeHD(g, LW, base, harm, sharp, top, bottom, rnd, fillTo) {
  const ph = harm.map(() => rnd() * TAU);
  const end = fillTo || H;
  g.beginPath(); g.moveTo(0, end);
  for (let x = 0; x <= LW; x += 2) {
    let y = base;
    for (let i = 0; i < harm.length; i++) {
      const s = Math.sin((x / LW) * TAU * harm[i][0] + ph[i]);
      y -= harm[i][1] * (sharp ? 1 - Math.abs(s) : (s + 1) / 2);
    }
    g.lineTo(x, y);
  }
  g.lineTo(LW, end); g.closePath();
  const minY = base - harm.reduce((a, h) => a + h[1], 0);
  g.fillStyle = lgrad(g, 0, minY, 0, end, [[0, top], [1, bottom]]);
  g.fill();
}
function mist(g, w, y, h, col, a) { g.fillStyle = lgrad(g, 0, y - h, 0, y + h, [[0, rgba(col, 0)], [0.5, rgba(col, a)], [1, rgba(col, 0)]]); g.fillRect(0, y - h, w, h * 2); }

/** A pagoda with curved, upturned eaves. */
function pagodaHD(g, cx, baseY, tiers, w0, tierH, body, roof, win, glow) {
  let y = baseY, w = w0;
  for (let i = 0; i < tiers; i++) {
    const bw = w * 0.6;
    g.fillStyle = body; g.fillRect(cx - bw / 2, y - tierH, bw, tierH);
    if (win) for (let kx = -1; kx <= 1; kx++) {
      const wx = cx + kx * bw * 0.28;
      rect(g, wx - 1.1, y - tierH * 0.7, 2.2, tierH * 0.42, win);
      if (glow) drawGlow(g, wx, y - tierH * 0.5, tierH * 0.9, '#ff9a40', 0.5);
    }
    const ey = y - tierH;
    g.fillStyle = roof;
    g.beginPath();
    g.moveTo(cx - w / 2 - 3, ey - 4.5);
    g.quadraticCurveTo(cx - w / 2 + 2, ey - 0.5, cx - w * 0.2, ey - 1.2);
    g.lineTo(cx + w * 0.2, ey - 1.2);
    g.quadraticCurveTo(cx + w / 2 - 2, ey - 0.5, cx + w / 2 + 3, ey - 4.5);
    g.lineTo(cx + w * 0.28, ey - 4.2); g.lineTo(cx - w * 0.28, ey - 4.2); g.closePath(); g.fill();
    y = ey - 4; w *= 0.84;
  }
  rect(g, cx - 0.8, y - 12, 1.6, 12, roof); disc(g, cx, y - 13, 1.8, roof);
}

function paintFloorHD(g, cv, len, A, tiles) {

    for (let x = -(r * 37) % step; x < len; x += step) {
      g.globalAlpha = 0.05 + R() * 0.06;
      rect(g, x, y0, step, y1 - y0, R() < 0.5 ? '#000000' : '#ffffff');
      g.globalAlpha = 1;
      rect(g, x, y0, 0.45, y1 - y0, rgba(A.seam, 0.8));

  g.fillRect(0, BASE_Y, len, 3);
}

  g.fillStyle = lgrad(g, x0 - 7, 0, x0 + w + 7, 0, [[0, A.trimLo], [0.2, A.trimHi], [0.5, A.trim], [1, A.trimLo]]);

  g.fillStyle = lgrad(g, 0, top, 0, BASE_Y, [[0, '#2a1810'], [0.4, '#0c0608'], [1, '#050304']]);
  g.fillRect(x0, top, w, BASE_Y - top);
  const n = 9;
  for (let i = 0; i < n; i++) {
    const yy = BASE_Y - (i + 1) * 13;
    const xa = d > 0 ? x0 + i * 6 : x0 + w - (i + 1) * 6 - 18;
    g.fillStyle = lgrad(g, 0, yy, 0, yy + 13, [[0, shade(A.floorHi, -0.1 - i * 0.04)], [0.18, shade(A.floor, -0.25 - i * 0.05)], [1, shade(A.floor, -0.55 - i * 0.03)]]);
    g.fillRect(xa, yy, 24, 13);
  }
  g.save(); g.globalCompositeOperation = 'lighter';
  g.fillStyle = lgrad(g, 0, top, 0, top + 40, [[0, rgba(A.shaft, 0.35)], [1, rgba(A.shaft, 0)]]); g.fillRect(x0, top, w, 40);
  g.restore();
  g.fillStyle = lgrad(g, 0, top - 19, 0, top - 7, [[0, A.trimHi], [1, A.trimLo]]); roundRectPath(g, sx - 23, top - 19, 46, 12, 1.5); g.fill();
  rect(g, sx - 21, top - 17, 42, 8, '#2a1410');
  const ax = d > 0 ? 1 : -1;
  stampLine(g, sx - 7 * ax, top - 13, sx + 7 * ax, top - 13, 1.1, A.trimHi);
  stampLine(g, sx + 7 * ax, top - 13, sx + 3.5 * ax, top - 15.8, 1.1, A.trimHi);
  stampLine(g, sx + 7 * ax, top - 13, sx + 3.5 * ax, top - 10.2, 1.1, A.trimHi);
}

function paintHall(F) {
  const A = LOOKS[F.id], len = F.len;
  const [cv, g] = artCanvas(len, H);
  const R = seeded(len * 7 + F.dir * 3 + F.id.length);
  const lights = [], lanterns = [];
  paintWallBase(g, len, A, R);
  paintWainscot(g, len, A);
  const sx = stairX(F);
  const plan = {
    lantern: ['window', 'mural', 'window', 'banner', 'round', 'window', 'banner'],
    drum: ['drum', 'shelf', 'window', 'drum', 'banner', 'shelf', 'round'],
    forge: ['furnace', 'rack', 'chains', 'furnace', 'banner', 'rack'],
    mirror: ['round', 'mirror', 'altar', 'round', 'mirror', 'banner']
  }[F.id];
  let k = Math.floor(R() * plan.length);
  for (let x = BAY / 2; x < len; x += BAY) {
    if (Math.abs(x - sx) < 70) continue;
    const kind = plan[k++ % plan.length];
    if (kind === 'window') paintWindow(g, x, A, false);
    else if (kind === 'round') paintWindow(g, x, A, true);
    else if (kind === 'mural') paintMural(g, x, A, R);
    else if (kind === 'banner') { paintBanner(g, x - 24, A, R); paintBanner(g, x + 24, A, R); }
    else if (kind === 'drum') paintDrum(g, x);
    else if (kind === 'shelf') paintShelf(g, x, A, R);
    else if (kind === 'furnace') { paintFurnace(g, x); lights.push({ x, y: 160, r: 58, col: '#ff6a1a', f: 0.35, ph: R() * TAU }); }
    else if (kind === 'rack') paintRack(g, x);
    else if (kind === 'chains') paintChains(g, x);
    else if (kind === 'mirror') { paintMirror(g, x); lights.push({ x, y: 94, r: 34, col: '#8ab8ff', f: 0.1, ph: R() * TAU }); }
    else if (kind === 'altar') { paintAltar(g, x); lights.push({ x: x - 20, y: 121, r: 18, col: '#ffb060', f: 0.3, ph: R() * TAU }, { x: x + 20, y: 121, r: 18, col: '#ffb060', f: 0.3, ph: R() * TAU }); }
    if ((F.id === 'lantern' || F.id === 'drum') && kind !== 'banner') {
      const lx = x + BAY / 2;
      if (Math.abs(lx - sx) > 60) lanterns.push({ x: lx, y: WALL_TOP + 4, ph: R() * TAU, len: 10 + Math.floor(R() * 14) });
    }
  }
  for (let x = 0; x <= len; x += BAY) if (Math.abs(x - sx) > 44) paintPillar(g, x, A);
  paintCeiling(g, len, A);
  paintStairs(g, F, A);
  paintFloorHD(g, cv, len, A, F.id === 'mirror' || F.id === 'forge');
  if (F.id === 'forge') for (const p of F.vents) {
    const vx = floorX(F, p);
    g.fillStyle = lgrad(g, 0, GROUND_Y - 3, 0, GROUND_Y + 3, [[0, '#3a2a26'], [1, '#0e0a0a']]);
    roundRectPath(g, vx - 15, GROUND_Y - 3, 30, 6.5, 1.5); g.fill();
    for (let i = 0; i < 7; i++) rect(g, vx - 12.5 + i * 3.8, GROUND_Y - 2, 1.6, 4.5, '#1a0e0c');
  }
  for (const l of lights) { drawGlow(g, l.x, l.y, l.r, l.col, 0.85); l.r *= 0.55; l.live = true; }
  for (const l of lanterns) lights.push({ x: l.x, y: l.y + l.len + 9, r: 36, col: '#ff8a3a', f: 0.12, ph: l.ph, lantern: l });
  return { level: cv, lights, lanterns };
}

/* ---- skies seen through the windows (tileable) ------------------------------------------ */
function paintOutside(F) {

    for (let i = 0; i < 7; i++) { const cx2 = R() * LAYER_W, cy2 = 60 + R() * 50; g.globalAlpha = 0.35; ellipse(g, cx2, cy2, 30 + R() * 30, 4 + R() * 3, 0, '#ffb0a0'); } g.globalAlpha = 1;
    ridgeHD(g, LAYER_W, 150, [[2, 30], [4, 10]], false, '#9a4a7a', '#5a2a5a', R);
    ridgeHD(g, LAYER_W, 166, [[3, 16], [8, 4]], false, '#6a3060', '#3a1a40', R);
    for (let y = 172; y < H; y += 7) { g.globalAlpha = 0.18; rect(g, 0, y, LAYER_W, 1.2, '#ffb070'); } g.globalAlpha = 1;
    for (let i = 0; i < 9; i++) { const bx = R() * LAYER_W, by = 60 + R() * 50; g.strokeStyle = '#3a1a3a'; g.lineWidth = 0.7; g.beginPath(); g.moveTo(bx - 3, by - 2); g.quadraticCurveTo(bx - 1, by - 2, bx, by); g.quadraticCurveTo(bx + 1, by - 2, bx + 3, by - 2); g.stroke(); }
  } else {
    g.fillStyle = lgrad(g, 0, 0, 0, H, [[0, '#040a22'], [0.5, '#0e2448'], [0.85, '#1e4a6a'], [1, '#2a6a7a']]); g.fillRect(0, 0, LAYER_W, H);
    stars(g, LAYER_W, 150, 240, R, '#d8f0ff');
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      g.fillStyle = lgrad(g, 0, 40 + i * 16, 0, 70 + i * 16, [[0, 'rgba(0,0,0,0)'], [0.5, i % 2 ? 'rgba(90,255,190,0.12)' : 'rgba(140,120,255,0.12)'], [1, 'rgba(0,0,0,0)']]);
      g.beginPath(); g.moveTo(0, 50 + i * 16);
      for (let x = 0; x <= LAYER_W; x += 16) g.lineTo(x, 46 + i * 16 + Math.sin((x / LAYER_W) * TAU * 3 + i) * 10);
      for (let x = LAYER_W; x >= 0; x -= 16) g.lineTo(x, 66 + i * 16 + Math.sin((x / LAYER_W) * TAU * 3 + i + 0.6) * 10);
      g.closePath(); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    drawGlow(g, 420, 70, 30, '#cfe8ff', 0.6);
    disc(g, 420, 70, 12, '#eef8ff'); disc(g, 425, 66, 11, '#0e2448');
    for (let x = 4; x < LAYER_W; x += 9 + Math.floor(R() * 8)) {
      const top = 80 + R() * 60, c = R() < 0.5 ? '#0a1e22' : '#0e262a';
      rect(g, x, top, 2.6, H - top, c);
      for (let y = top + 10; y < H; y += 16) rect(g, x - 0.8, y, 4.2, 0.9, '#16343a');
      for (let j = 0; j < 3; j++) { g.fillStyle = c; g.beginPath(); g.ellipse(x + (j % 2 ? 5 : -4), top + j * 12 - 3, 5, 1.4, j % 2 ? -0.5 : 0.5, 0, TAU); g.fill(); }
    }
  }
  return cv;
}

/* ---- the summit: an open roof terrace under a storm ------------------------------------------ */
function paintSummit(F) {
  const len = F.len;
  const L = {};
  let g;
  [L.sky, g] = artCanvas(W, H);
  g.fillStyle = lgrad(g, 0, 0, 0, H, [[0, '#07081a'], [0.4, '#1a1636'], [0.7, '#3a2448'], [1, '#6e3450']]); g.fillRect(0, 0, W, H);

  disc(g, 296, 60, 3.6, 'rgba(200,170,140,0.4)'); disc(g, 305, 70, 2.4, 'rgba(200,170,140,0.35)');
  const R = seeded(91);

    g.fillStyle = '#1a1430'; g.beginPath(); g.moveTo(x - 3, 178 - h); g.quadraticCurveTo(x + w / 2, 178 - h - 4, x + w + 3, 178 - h); g.lineTo(x + w, 178 - h + 2); g.lineTo(x, 178 - h + 2); g.closePath(); g.fill();
    for (let i = 0; i < 3; i++) if (R() < 0.55) { const lx = x + 2 + R() * (w - 4), ly = 181 - h + R() * h; rect(g, lx, ly, 1.2, 1.4, R() < 0.5 ? '#ffb060' : '#ffd890'); drawGlow(g, lx, ly, 4, '#ff9a40', 0.6); }
  }
  for (let i = 0; i < 3; i++) pagodaHD(g, 120 + i * 260 + R() * 30, 176, 4, 34, 10, '#0e0a1a', '#0a0814', '#ff9a50', true);
  // the terrace
  [L.level, g] = artCanvas(len, H);
  g.fillStyle = lgrad(g, 0, 150, 0, 154, [[0, '#c0b4c8'], [1, '#5a5264']]); g.fillRect(0, 150, len, 4);
  g.fillStyle = lgrad(g, 0, 174, 0, BASE_Y, [[0, '#5a5264'], [1, '#2a2434']]); g.fillRect(0, 174, len, BASE_Y - 174);
  for (let x = 0; x < len; x += 18) {
    g.fillStyle = lgrad(g, x + 4, 0, x + 10, 0, [[0, '#8a8094'], [0.4, '#6a6274'], [1, '#3a3444']]);
    roundRectPath(g, x + 4, 154, 6, 20, 2.6); g.fill();
  }
  for (let x = 0; x < len; x += 144) {
    g.fillStyle = lgrad(g, x, 0, x + 12, 0, [[0, '#9a90a4'], [0.4, '#7a7084'], [1, '#3a3444']]); g.fillRect(x, 140, 12, 44);
    g.fillStyle = rgrad(g, x + 4, 133, 1, 7, [[0, '#d0c8d8'], [1, '#6a6274']]); g.beginPath(); g.arc(x + 6, 136, 6, 0, TAU); g.fill();
  }
  const A = { floor: '#4e4658', floorHi: '#6a6274', floorLo: '#1a1622', seam: '#1e1a26', reflect: 0.28 };
  paintFloorHD(g, L.level, len, A, true);

  for (let i = 0; i < len / 40; i++) { const x = (i * 53.3) % len, y = BASE_Y + 4 + (i * 7) % 26; g.globalAlpha = 0.12; ellipse(g, x, y, 10 + (i % 5) * 4, 1, 0, '#c8c0ff'); }
  g.globalAlpha = 1;
  // the great dragon statue coiled around a column before the arena
  const pearl = paintDragonColumn(g, floorX(F, len - W - 70), -F.dir);
  // the shrine pavilion at the end, where the Grandmaster is held
  const sx = stairX(F);
  for (const px of [sx - 36, sx + 30]) { g.fillStyle = lgrad(g, px, 0, px + 6, 0, [[0, '#5a1410'], [0.35, '#d0604a'], [1, '#4a0e0c']]); g.fillRect(px, 76, 6, BASE_Y - 76); }
  g.fillStyle = lgrad(g, sx - 3, 0, sx + 3, 0, [[0, '#3a2414'], [0.4, '#7a5434'], [1, '#2a180c']]); g.fillRect(sx - 3, 118, 6, BASE_Y - 118);
  g.fillStyle = lgrad(g, 0, 40, 0, 74, [[0, '#4a2a34'], [1, '#1e0e14']]);
  g.beginPath(); g.moveTo(sx - 62, 66); g.quadraticCurveTo(sx - 40, 66, sx - 22, 48); g.lineTo(sx, 40); g.lineTo(sx + 22, 48); g.quadraticCurveTo(sx + 40, 66, sx + 62, 66); g.lineTo(sx + 50, 74); g.lineTo(sx - 50, 74); g.closePath(); g.fill();
  for (let i = -5; i <= 5; i++) stampLine(g, sx + i * 8, 46 + Math.abs(i) * 2, sx + i * 10, 72, 0.4, 'rgba(255,255,255,0.08)');

  L.lights.push({ x: pearl.x, y: pearl.y, r: 22, col: '#ffb04a', f: 0.25, ph: 0.5 });

/* ---- building and caching a floor's layers --------------------------------------------------- */
function buildFloorArt(F) {
  let L;
  if (F.outdoor) L = paintSummit(F);
  else { const hall = paintHall(F); L = { level: hall.level, lights: hall.lights, lanterns: hall.lanterns, outside: paintOutside(F) }; }
  const R = seeded(F.len * 3 + 1);
  L.front = [];
  for (let x = 60; x < F.len * 1.3; x += 280 + R() * 260) L.front.push({ x, kind: F.front[Math.floor(R() * F.front.length)], s: R() });
  L.rs = RS;
  return L;
}

/** Foreground silhouettes that pass in front of the action (drawn translucent). */
function drawFrontPiece(g, f, sx, t) {
  const x = sx;
  switch (f.kind) {
    case 'pillarF': {
      // a lacquered column right by the lens: soft edges, a dim sheen and gilded bands
      const w = 22, a0 = g.globalAlpha, top = HUD_H, hh = H - HUD_H;
      g.globalAlpha = a0 * 0.3; rect(g, x - 3, top, 1.6, hh, '#0a0406'); rect(g, x + w + 1.4, top, 1.6, hh, '#0a0406');
      g.globalAlpha = a0 * 0.6; rect(g, x - 1.4, top, 1.4, hh, '#0a0406'); rect(g, x + w, top, 1.4, hh, '#0a0406');
      g.globalAlpha = a0;
      g.fillStyle = lgrad(g, x, 0, x + w, 0, [[0, '#0a0406'], [0.22, '#2e1012'], [0.4, '#48191a'], [0.62, '#22100f'], [1, '#080304']]);
      g.fillRect(x, top, w, hh);
      for (const by of [top + 16, 150]) {
        g.fillStyle = lgrad(g, x - 1, 0, x + w + 1, 0, [[0, '#120a04'], [0.36, '#5e4422'], [0.62, '#2e200c'], [1, '#0a0602']]);

      rrect(g, x + 3 + sw, HUD_H + 16, 14, 3, 1, '#2a1410'); rrect(g, x + 3 + sw, HUD_H + 42, 14, 3, 1, '#2a1410');
      g.fillStyle = rgrad(g, x + 10 + sw, HUD_H + 30, 1, 10, [[0, 'rgba(255,170,90,0.55)'], [1, 'rgba(255,90,40,0)']]); g.beginPath(); g.ellipse(x + 10 + sw, HUD_H + 30, 8, 10, 0, 0, TAU); g.fill();
      break;
    }
    case 'tasselF': {

      g.fillStyle = '#16090c'; g.beginPath(); g.moveTo(x - 7, HUD_H + 30); g.lineTo(x + 11, HUD_H + 30); g.lineTo(x + 9 + sw, HUD_H + 72); g.lineTo(x - 5 + sw, HUD_H + 72); g.closePath(); g.fill();
      for (let i = 0; i < 6; i++) stampLine(g, x - 4 + i * 2.8 + sw, HUD_H + 72, x - 4 + i * 2.8 + sw * 1.6, HUD_H + 86, 0.8, '#16090c');
      break;
    }
    case 'chainF':
      g.strokeStyle = '#0e0a0c'; g.lineWidth = 1.8;
      for (let y = HUD_H; y < 130; y += 7) { g.beginPath(); g.ellipse(x + 2, y + 3, ((y / 7) | 0) % 2 ? 1.4 : 2.6, 3.6, 0, 0, TAU); g.stroke(); }
      disc(g, x + 2, 136, 9, '#0e0a0c');
      break;
    case 'silkF': {
      const sw = Math.sin(t * 0.8 + f.s * 6) * 3;
      g.fillStyle = 'rgba(12,10,30,0.85)';
      g.beginPath(); g.moveTo(x, HUD_H);
      for (let i = 0; i <= 18; i++) g.lineTo(x + Math.sin(i * 0.4 + t + f.s) * 2 + sw * (i / 18), HUD_H + i * 6);

      g.fillStyle = lgrad(g, x - 2, 0, x + 2, 0, [[0, '#060408'], [0.45, '#2a2232'], [1, '#060408']]);
      g.beginPath(); g.moveTo(x - 1.3, top + 6); g.lineTo(x + 1.3, top + 6); g.lineTo(x + 2.1, H); g.lineTo(x - 2.1, H); g.closePath(); g.fill();
      poly(g, [x, top - 3, x + 1.6, top + 3, x, top + 6, x - 1.6, top + 3], '#6a4c22');

      g.beginPath(); g.moveTo(x - 17, top + 9.6); g.lineTo(x - 1, top + 9.6);
      for (let i = 0; i <= 12; i++) { const yy = top + 9.6 + i * 6; g.lineTo(x - 1 + Math.sin(t * 2.4 - i * 0.5) * i * 0.18 + sway * i * 0.3, yy); }
      g.lineTo(x - 9 + sway * 4, top + 72); g.lineTo(x - 17 + sway * 3.6, top + 81.6);

/* ==========================================================================
   Dragons: the gilded statue coiled around the summit column, and the dragon
   that glides across the moon on the title screen
   ========================================================================== */

const DRAGON_INK = '#2a1606';
const smooth01 = (v) => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };

/** Line through points with quadratic smoothing at the midpoints. */
function smoothRun(g, P, move) {
  if (move) g.moveTo(P[0][0], P[0][1]); else g.lineTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length - 1; i++) g.quadraticCurveTo(P[i][0], P[i][1], (P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2);
  if (P.length > 1) g.lineTo(P[P.length - 1][0], P[P.length - 1][1]);
}

/** Unit tangent and left hand normal for each point of [[x, y, r], ...]. */
function tubeFrames(pts) {
  const n = pts.length, F = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    F.push([tx, ty, ty, -tx]);
  }
  return F;
}

/** One closed, smooth outline for a tapered tube with rounded ends. */
function tubePath(g, pts) {
  const n = pts.length, F = tubeFrames(pts), Lf = [], Rt = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i], nx = F[i][2], ny = F[i][3];
    Lf.push([p[0] + nx * p[2], p[1] + ny * p[2]]); Rt.push([p[0] - nx * p[2], p[1] - ny * p[2]]);
  }
  const ang = (i) => Math.atan2(F[i][3], F[i][2]);
  g.beginPath();
  smoothRun(g, Lf, true);
  const e = pts[n - 1]; g.arc(e[0], e[1], Math.max(0.01, e[2]), ang(n - 1), ang(n - 1) + Math.PI, false);
  smoothRun(g, Rt.reverse(), false);
  const s = pts[0]; g.arc(s[0], s[1], Math.max(0.01, s[2]), ang(0) + Math.PI, ang(0) + TAU, false);
  g.closePath();
}

/** A narrower tube shifted to one side (side +1 is left of travel). */
function tubeBand(pts, side, off, rk) {
  const F = tubeFrames(pts);
  return pts.map((p, i) => [p[0] + F[i][2] * side * off * p[2], p[1] + F[i][3] * side * off * p[2], p[2] * rk]);
}

/** Which side of a tube faces a direction, judged once at its middle so bands never flip. */
function tubeSide(pts, dx, dy) {
  const m = tubeFrames(pts)[Math.floor(pts.length / 2)];
  return m[2] * dx + m[3] * dy >= 0 ? 1 : -1;
}

/** Teardrop flame tuft from a root to a tip: manes, beards, elbow tufts, tail fins. */
function flameTuft(g, x0, y0, x1, y1, w, col, ink) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const mx = x0 + dx * 0.45 + nx * w * 0.5, my = y0 + dy * 0.45 + ny * w * 0.5;
  g.beginPath(); g.moveTo(x0 + nx * w, y0 + ny * w);
  g.quadraticCurveTo(mx + nx * w * 0.8, my + ny * w * 0.8, x1, y1);
  g.quadraticCurveTo(mx - nx * w * 0.6, my - ny * w * 0.6, x0 - nx * w, y0 - ny * w);
  g.closePath();
  if (ink !== col) { g.lineJoin = 'round'; g.strokeStyle = ink; g.lineWidth = 0.9; g.stroke(); }
  g.fillStyle = col; g.fill();
}

/** Scaled body: fins, ink outline, gold, pale belly plates, a moonlit sheen and scales. */
function dragonBody(g, pts, lit) {
  const up = tubeSide(pts, -0.35, -0.94);
  const F = tubeFrames(pts);
  g.lineJoin = 'round'; g.lineCap = 'round';
  // dorsal fins first so the body covers their roots
  let acc = 0;
  for (let i = 1; i < pts.length - 1; i++) {
    acc += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (acc < 3.4 || pts[i][2] < 1.6) continue;
    acc = 0;
    const [x, y, r] = pts[i], [tx, ty, nx, ny] = F[i];
    const ux = nx * up, uy = ny * up, bx = x + ux * r * 0.72, by = y + uy * r * 0.72, h = 2 + r * 0.42;
    const tri3 = [bx + tx * 1.6, by + ty * 1.6, bx - tx * 1.6, by - ty * 1.6, bx + ux * h - tx * 2.4, by + uy * h - ty * 2.4];
    polyPath(g, tri3); g.strokeStyle = DRAGON_INK; g.lineWidth = 0.9; g.stroke();
    g.fillStyle = lit ? '#c8322a' : '#5a1612'; g.fill();
  }
  tubePath(g, pts); g.strokeStyle = DRAGON_INK; g.lineWidth = 1.1; g.stroke();
  g.fillStyle = lit ? '#c4902e' : '#5e3e12'; g.fill();
  // belly plates on the lower side, with seams across them
  const belly = tubeBand(pts, -up, 0.5, 0.48);
  tubePath(g, belly); g.fillStyle = lit ? '#f0d79a' : '#7a5c2c'; g.fill();
  const FB = tubeFrames(belly);
  g.strokeStyle = lit ? 'rgba(150,100,30,0.8)' : 'rgba(40,24,6,0.6)'; g.lineWidth = 0.35;
  acc = 0;
  for (let i = 1; i < belly.length - 1; i++) {
    acc += Math.hypot(belly[i][0] - belly[i - 1][0], belly[i][1] - belly[i - 1][1]);
    if (acc < 1.8 || belly[i][2] < 0.8) continue;
    acc = 0;
    const [x, y, r] = belly[i], nx = FB[i][2], ny = FB[i][3];
    g.beginPath(); g.moveTo(x + nx * r * 0.95, y + ny * r * 0.95); g.lineTo(x - nx * r * 0.95, y - ny * r * 0.95); g.stroke();
  }
  // sheen along the top
  const hi = tubeBand(pts, up, 0.4, 0.34);
  tubePath(g, hi); g.fillStyle = lit ? 'rgba(255,236,160,0.72)' : 'rgba(190,150,80,0.22)'; g.fill();
  if (!lit) return;
  // overlapping scales
  g.strokeStyle = 'rgba(110,70,14,0.75)'; g.lineWidth = 0.35;
  acc = 0; let alt = 0;
  for (let i = 1; i < pts.length - 1; i++) {
    acc += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (acc < 1.7 || pts[i][2] < 1.8) continue;
    acc = 0; alt = 1 - alt;
    const [x, y, r] = pts[i], [tx, ty, nx, ny] = F[i];
    const o = (alt ? 0.18 : -0.12) * up, cx = x + nx * o * r, cy = y + ny * o * r, a = Math.atan2(ty, tx);
    g.beginPath(); g.arc(cx, cy, r * 0.3, a + Math.PI * 0.5, a + Math.PI * 1.5); g.stroke();
  }
}

/** A clawed leg reaching from the body: d is the outward (downward) normal, t points to the head. */
function dragonLeg(g, x, y, r, dx, dy, tx, ty, lit, sc) {
  const k = sc || 1;
  const kx = x + dx * (r + 3 * k) - tx * 1.6 * k, ky = y + dy * (r + 3 * k) - ty * 1.6 * k;
  const fx = kx + tx * 3.4 * k + dx * 1.4 * k, fy = ky + ty * 3.4 * k + dy * 1.4 * k;
  const body = lit ? '#c4902e' : '#5e3e12', claw = lit ? '#f6ead0' : '#8a7a5a';
  flameTuft(g, kx, ky, kx - tx * 4.2 * k + dx * 1.2 * k, ky - ty * 4.2 * k + dy * 1.2 * k, 1.3 * k, lit ? '#c8322a' : '#5a1612', DRAGON_INK);
  stampLine(g, x, y, kx, ky, 4.2 * k, DRAGON_INK); stampLine(g, kx, ky, fx, fy, 3.4 * k, DRAGON_INK);
  stampLine(g, x, y, kx, ky, 2.9 * k, body); stampLine(g, kx, ky, fx, fy, 2.2 * k, body);
  for (const s of [-1, 0, 1]) {
    const cx = fx + (tx * 2.1 + dx * (0.5 + s * 0.9)) * k, cy = fy + (ty * 2.1 + dy * (0.5 + s * 0.9)) * k;
    stampLine(g, fx, fy, cx, cy, 1.3 * k, DRAGON_INK); stampLine(g, fx, fy, cx, cy, 0.6 * k, claw);
  }
}

/** Antler horn rooted at (x, y), sweeping back. */
function dragonHorn(g, x, y, col, ink) {
  const main = [[x, y], [x - 5.5, y - 4.6], [x - 11.5, y - 5.4]];
  for (const [w, c] of [[2.4, ink], [1.3, col]]) {
    g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(main[0][0], main[0][1]); g.quadraticCurveTo(main[1][0], main[1][1], main[2][0], main[2][1]); g.stroke();
    g.beginPath(); g.moveTo(x - 4.6, y - 3.6); g.quadraticCurveTo(x - 5, y - 6.6, x - 6.6, y - 8.6); g.stroke();
  }
}

/** Dragon head in profile facing +x, origin at the back of the skull. sil paints it as one flat shape. */
function dragonHead(g, sil) {
  const ink = sil || DRAGON_INK;

    g.fillStyle = '#3a080a'; g.fill();
  }

  g.quadraticCurveTo(12, 7.2, 6, 6); g.quadraticCurveTo(1.5, 5, -0.6, 2.4); g.closePath();
  g.strokeStyle = ink; g.lineWidth = 1.1; g.stroke(); g.fillStyle = col('#a8741e'); g.fill();
  if (!sil) {

    g.beginPath(); g.moveTo(9, 2); g.quadraticCurveTo(15, 1.6, 19.5, 2.6); g.quadraticCurveTo(22.6, 3.2, 23.4, 1.2);
    g.quadraticCurveTo(22.4, 2.2, 20, 1.6); g.quadraticCurveTo(15, 0.8, 9, 2); g.closePath();
    g.fillStyle = '#d0484a'; g.fill();

  g.quadraticCurveTo(12.6, -5.3, 15.6, -4.7); g.quadraticCurveTo(18.4, -6.8, 20.6, -4.9); g.quadraticCurveTo(21.8, -3.2, 20.6, -1.5);
  g.quadraticCurveTo(14, -0.6, 6.6, 0.8); g.quadraticCurveTo(3, 1.8, -0.6, 2.2); g.closePath();
  g.strokeStyle = ink; g.lineWidth = 1.1; g.stroke();
  g.fillStyle = sil || lgrad(g, 0, -8, 0, 2, [[0, '#ffeaa8'], [0.45, '#dcaa40'], [1, '#93631a']]); g.fill();
  if (!sil) {
    for (const [x, y] of [[10, 0.3], [12.8, -0.1], [15.6, -0.6]]) poly(g, [x - 0.7, y - 0.3, x + 0.7, y - 0.5, x + 0.1, y + 1.3], '#fff6e0');
    poly(g, [17.8, -1.1, 19.2, -1.4, 18.7, 2.1], '#fff6e0');
    // snout ridges and a nostril curl

    g.beginPath(); g.moveTo(19.2, -4.8); g.bezierCurveTo(17, -11, 9.5, -12.5, 3.4, -10.6); g.quadraticCurveTo(-0.6, -9.4, -3.6, -11.6); g.stroke();

/** The flaming pearl the dragon chases. */
function dragonPearl(g, x, y, s) {
  drawGlow(g, x, y, 15 * s, '#ffb04a', 0.85);
  for (let i = 0; i < 4; i++) {
    const a = -Math.PI / 2 + (i - 1.5) * 0.7;
    flameTuft(g, x + Math.cos(a) * 2 * s, y + Math.sin(a) * 2 * s, x + Math.cos(a) * 6.2 * s, y + Math.sin(a) * 6.2 * s - 1.5 * s, 1.1 * s, i % 2 ? '#ffb43a' : '#ff6a2a', 'rgba(0,0,0,0)');
  }
  g.fillStyle = rgrad(g, x - 1 * s, y - 1 * s, 0.2, 3.6 * s, [[0, '#fffdf0'], [0.45, '#ffe3a0'], [1, '#d07a20']]);
  g.beginPath(); g.arc(x, y, 3.2 * s, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(90,40,6,0.8)'; g.lineWidth = 0.5; g.stroke();
}

/**
 * The summit's ceremonial column with a gilded dragon coiled around it, painted into the level
 * layer. Returns the pearl position so the floor can give it a live glow.
 */
function paintDragonColumn(g, dx, face) {
  g.save(); g.translate(dx, 0); g.scale(face, 1);
  const y0 = 168, y1 = 82, R = 15, turns = 2.25, th0 = -Math.PI / 6, N = 210;
  const P = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, th = th0 + t * turns * TAU;
    P.push([Math.sin(th) * R, lerp(y0, y1, t) + Math.cos(th) * 3, 0.8 + 4.9 * smooth01(t / 0.36) - 0.5 * t, Math.cos(th)]);
  }
  // the neck rises from the last coil and turns the head toward the stairs
  const E = P[N], C = [E[0] + 9, E[1] - 5], H = [E[0] + 8.5, E[1] - 22];
  for (let i = 1; i <= 14; i++) {
    const u = i / 14, v = 1 - u;
    P.push([v * v * E[0] + 2 * v * u * C[0] + u * u * H[0], v * v * E[1] + 2 * v * u * C[1] + u * u * H[1], lerp(E[2], 4.1, u), 1]);
  }
  const runs = [];
  let cur = [P[0]], front = P[0][3] >= 0;
  for (let i = 1; i < P.length; i++) {
    const f = P[i][3] >= 0;
    cur.push(P[i]);
    if (f !== front) { runs.push({ front, pts: cur }); cur = [P[i]]; front = f; }
  }
  runs.push({ front, pts: cur });
  // coils passing behind the column
  for (const run of runs) if (!run.front) dragonBody(g, run.pts, false);
  // stone plinth, lacquered shaft, gilded bands and the capital
  g.fillStyle = lgrad(g, -15, 0, 15, 0, [[0, '#2e2836'], [0.32, '#8e869a'], [0.55, '#6c6478'], [1, '#221c2a']]);
  roundRectPath(g, -15, 174, 30, 10.5, 1.4); g.fill();
  rect(g, -16, 172.5, 32, 2.5, '#a49cb2'); rect(g, -15, 175, 30, 0.8, 'rgba(0,0,0,0.35)');
  g.fillStyle = lgrad(g, -9, 0, 9, 0, [[0, '#2e0806'], [0.26, '#b8402e'], [0.42, '#e2684e'], [0.7, '#86261e'], [1, '#240606']]);
  g.fillRect(-9, 48, 18, 125);
  const gold = lgrad(g, -10, 0, 10, 0, [[0, '#4a2e0c'], [0.32, '#ffe28e'], [0.6, '#c3902e'], [1, '#3a240a']]);
  for (const by of [50, 165]) { g.fillStyle = gold; g.fillRect(-9.8, by, 19.6, 3.2); rect(g, -9.8, by + 3.2, 19.6, 0.6, 'rgba(0,0,0,0.4)'); }
  g.fillStyle = gold; g.fillRect(-10.8, 42, 21.6, 7);
  ellipse(g, 0, 42, 13.8, 2.9, 0, '#b8862a'); ellipse(g, 0, 41.4, 12.8, 2.1, 0, '#ffe08a');
  dragonPearl(g, 0, 35, 0.9);
  // coils in front, with the legs gripping the column
  const FP = tubeFrames(P);
  for (const tt of [0.44, 0.885]) {
    const i = Math.round(tt * N), [x, y, r] = P[i], [tx, ty, nx, ny] = FP[i];
    const s = ny > 0 ? 1 : -1;
    dragonLeg(g, x, y, r, nx * s, ny * s, tx, ty, true);
  }
  for (const run of runs) if (run.front) dragonBody(g, run.pts, true);
  // head and the pearl it chases
  g.save(); g.translate(H[0] - 0.5, H[1] + 0.5); g.rotate(0.12); g.scale(1.06, 1.06);
  dragonHead(g, null);
  dragonPearl(g, 28.5, 1.8, 1);
  g.restore();
  g.restore();
  const c = Math.cos(0.12) * 1.06, sn = Math.sin(0.12) * 1.06;
  return { x: dx + face * (H[0] - 0.5 + 28.5 * c - 1.8 * sn), y: H[1] + 0.5 + 28.5 * sn + 1.8 * c };
}

/** A dark dragon silhouette gliding across the title sky, flying toward -x. */
function drawSkyDragon(g, hx, hy, t) {
  const col = '#120a20', pts = [];
  for (let i = 0; i <= 40; i++) {
    const u = i / 40;
    pts.push([hx + 4 + i * 3.3, hy + 2 + Math.sin(t * 2.6 - i * 0.26) * 7 * Math.min(1, 0.25 + u * 2),
      i < 6 ? 2.6 + i * 0.32 : 4.5 * Math.pow(1 - u, 0.9) + 0.35]);
  }
  const F = tubeFrames(pts);
  g.lineJoin = 'round'; g.lineCap = 'round';
  for (const i of [8, 26]) {
    const [x, y, r] = pts[i], [tx, ty, nx, ny] = F[i];
    const s = ny > 0 ? 1 : -1, ax = nx * s, ay = ny * s;
    const kx = x + ax * (r + 2.6) + tx * 1.5, ky = y + ay * (r + 2.6) + ty * 1.5;
    const fx = kx - tx * 2.8 + ax * 1.6, fy = ky - ty * 2.8 + ay * 1.6;
    stampLine(g, x, y, kx, ky, 2.6, col); stampLine(g, kx, ky, fx, fy, 1.8, col);
    for (const k of [-1, 0, 1]) stampLine(g, fx, fy, fx - tx * 1.9 + ax * (0.5 + k * 0.8), fy - ty * 1.9 + ay * (0.5 + k * 0.8), 0.6, col);
  }
  for (let i = 3; i < 38; i += 2) {
    const [x, y, r] = pts[i], [tx, ty, nx, ny] = F[i];
    const s = ny < 0 ? 1 : -1, ux = nx * s, uy = ny * s, bx = x + ux * r * 0.7, by = y + uy * r * 0.7, h = 1.6 + r * 0.45;
    poly(g, [bx - tx * 1.4, by - ty * 1.4, bx + tx * 1.4, by + ty * 1.4, bx + ux * h + tx * 2.2, by + uy * h + ty * 2.2], col);
  }
  tubePath(g, pts); g.fillStyle = col; g.fill();
  g.strokeStyle = 'rgba(140,120,200,0.22)'; g.lineWidth = 0.7; g.stroke();
  const e = pts[40], fe = F[40];
  flameTuft(g, e[0], e[1], e[0] + fe[0] * 9, e[1] + fe[1] * 9 - 3, 2.2, col, col);
  g.save(); g.translate(hx + 5, pts[0][1] - 1); g.scale(-0.82, 0.82); g.rotate(0.05);
  dragonHead(g, col);
  g.restore();
}

/* ==========================================================================
   Entities: the hero, temple fighters, projectiles, hazards, pickups, effects
   ========================================================================== */

const MAX_HP = 24;
const MAX_CHI = 100;
const HERO_STATS = {
  tao: { name: 'TAO', speed: 88, jumpV: 314, punch: 1, kick: 2, chiGain: 1, airJumps: 0, quick: 1, blurb: ['POWER STYLE', 'KICKS HIT TWICE AS HARD'] },
  lian: { name: 'LIAN', speed: 102, jumpV: 318, punch: 1, kick: 1, chiGain: 1.35, airJumps: 1, quick: 0.82, blurb: ['SWIFT STYLE', 'DOUBLE JUMP, FAST CHI'] }
};

/** Attack table. box = [near, far, lo, hi] in pixels in front of the feet. */
const ATK = {
  jab: { anim: 'punch', dur: 0.22, a0: 0.05, a1: 0.12, box: [3, 24, 22, 38], dmg: 'punch', kb: 40, sfx: 'punch' },
  cross: { anim: 'punch2', dur: 0.24, a0: 0.06, a1: 0.13, box: [3, 25, 22, 38], dmg: 'punch', kb: 50, sfx: 'punch' },
  fist: { anim: 'punch2', dur: 0.34, a0: 0.07, a1: 0.16, box: [3, 28, 18, 40], dmg: 'fin', kb: 150, sfx: 'smash', fin: true },
  kick: { anim: 'kick', dur: 0.3, a0: 0.09, a1: 0.18, box: [5, 31, 9, 30], dmg: 'kick', kb: 70, sfx: 'kick' },
  kick2: { anim: 'kick', dur: 0.3, a0: 0.08, a1: 0.17, box: [5, 31, 9, 30], dmg: 'kick', kb: 70, sfx: 'kick' },
  round: { anim: 'highKick', dur: 0.38, a0: 0.1, a1: 0.2, box: [5, 32, 16, 46], dmg: 'fin', kb: 160, sfx: 'smash', fin: true },
  cpunch: { anim: 'crouchPunch', dur: 0.22, a0: 0.05, a1: 0.12, box: [3, 24, 3, 18], dmg: 'punch', kb: 40, sfx: 'punch', crouch: true },
  sweep: { anim: 'sweep', dur: 0.36, a0: 0.1, a1: 0.2, box: [3, 31, 0, 9], dmg: 'kick', kb: 50, sfx: 'sweep', crouch: true, trip: true },
  jkick: { anim: 'jumpKick', dur: 9, a0: 0.06, a1: 9, box: [5, 29, 3, 24], dmg: 'kick', kb: 90, sfx: 'kick', air: true },
  jpunch: { anim: 'jumpPunch', dur: 9, a0: 0.05, a1: 9, box: [3, 25, 12, 32], dmg: 'punch', kb: 50, sfx: 'punch', air: true }
};

const ETYPES = {
  thug: { hp: 1, speed: [50, 70], pts: 100, w: 7, h: 42, dmg: 0 },
  dagger: { hp: 2, speed: [44, 50], pts: 500, w: 7, h: 42, dmg: 4 },
  monkey: { hp: 1, speed: [118, 138], pts: 200, w: 7, h: 14, dmg: 3 },
  monk: { hp: 3, speed: [32, 38], pts: 800, w: 8, h: 44, dmg: 5 },
  ninja: { hp: 2, speed: [64, 72], pts: 700, w: 7, h: 38, dmg: 5 },
  snake: { hp: 1, speed: [40, 48], pts: 150, w: 8, h: 8, dmg: 2 }
};

let NEXT_ID = 1;

/* ==== the hero ============================================================== */
function makeHero(x, fighter) {
  const S = HERO_STATS[fighter] || HERO_STATS.tao;
  return {
    kind: fighter, S, x, y: GROUND_Y, vx: 0, vy: 0, face: game.F ? game.F.dir : 1, ground: true, crouch: false,
    act: null, hp: MAX_HP, inv: 0, hurtT: 0, dead: false, deadT: 0, grabbers: [], escape: 0, lastDir: 0,
    combo: 0, comboT: 0, jumps: 0, chi: 0, runT: 0, flash: 0, pose: null, bufK: null, bufT: 0, airAtk: false, flexT: 0, wig: 0
  };
}

function heroHurtBox(h) {
  if (h.crouch && h.ground) return box(h.x - 7, h.y - 25, h.x + 7, h.y);
  if (!h.ground) return box(h.x - 6, h.y - 38, h.x + 6, h.y - 2);
  return box(h.x - 6, h.y - 42, h.x + 6, h.y);
}

function heroAttackBox(h) {
  const a = h.act;
  if (!a || a.k === 'chi') return null;
  const D = ATK[a.k];
  if (a.t < D.a0 * h.S.quick || a.t > D.a1 * (D.air ? 1 : h.S.quick)) return null;
  return front(h, D.box[0], D.box[1], D.box[2], D.box[3]);
}

function startAttack(h, k) {
  const D = ATK[k];
  h.act = { k, t: 0, hits: [], bossHit: false, landed: false };
  if (!D.air) { h.vx = 0; }
  chip.sfx('swish', { kick: D.dmg !== 'punch' });
}

function updateHero(h, dt, I, P) {
  h.inv = Math.max(0, h.inv - dt);
  h.flash = Math.max(0, h.flash - dt);
  h.comboT -= dt;
  if (h.comboT <= 0) h.combo = 0;
  h.flexT = Math.max(0, h.flexT - dt);
  if (P.punch) { h.bufK = 'p'; h.bufT = 0.14; }
  if (P.kick) { h.bufK = 'k'; h.bufT = 0.14; }
  h.bufT -= dt;
  if (h.bufT <= 0) h.bufK = null;

  if (h.dead) {
    h.deadT += dt;
    heroPhys(h, dt);
    if (h.ground) h.vx *= 0.8;
    return;
  }
  if (h.pose) { heroPhys(h, dt); return; }

  // knocked back or staggered: no control until it wears off
  if (h.hurtT > 0) {
    h.hurtT -= dt;
    heroPhys(h, dt);
    if (h.ground) h.vx = approach(h.vx, 0, 500 * dt);
    h.act = null;
    return;
  }

  // held by thugs: wiggle and mash to break free
  if (h.grabbers.length) { updateGrabbed(h, dt, I, P); return; }

  // the Dragon Wave
  if (h.act && h.act.k === 'chi') {
    h.act.t += dt;
    if (!h.act.fired && h.act.t >= 0.32) { h.act.fired = true; releaseWave(h); }
    if (h.act.t >= 0.75) h.act = null;
    heroPhys(h, dt);
    return;
  }
  if (P.special && h.chi >= MAX_CHI && h.ground && !h.act) {
    h.act = { k: 'chi', t: 0, hits: [] };
    h.chi = 0; h.inv = Math.max(h.inv, 0.9); h.vx = 0;
    chip.sfx('charge');
    for (let i = 0; i < 16; i++) { const a = rand(0, TAU); fxAdd({ k: 'chiP', x: h.x + Math.cos(a) * 40, y: h.y - 24 + Math.sin(a) * 30, tx: h.x + h.face * 6, ty: h.y - 26, t: 0, life: 0.32 }); }
    return;
  } else if (P.special && h.chi < MAX_CHI && !game.demo) { chip.sfx('nochi'); }

  const dir = (I.right ? 1 : 0) - (I.left ? 1 : 0);
  // attacks (buffered presses, combos chain on hits)
  if (h.bufK && (!h.act || (h.act.landed && h.act.t > (ATK[h.act.k].a1 * h.S.quick) && !ATK[h.act.k].air))) {
    const isP = h.bufK === 'p';
    let k = null;
    if (!h.ground) { if (!h.airAtk) { k = isP ? 'jpunch' : 'jkick'; h.airAtk = true; } }
    else if (I.down) k = isP ? 'cpunch' : 'sweep';
    else if (h.combo >= 2 && h.comboT > 0) k = isP ? 'fist' : 'round';
    else if (h.combo === 1 && h.comboT > 0) k = isP ? 'cross' : 'kick2';
    else k = isP ? 'jab' : 'kick';
    if (k) {
      if (dir) h.face = dir;
      startAttack(h, k);
      h.bufK = null;
    }
  }
  // jumping (up or the jump button), with Lian's double jump
  const wantJump = P.jump || P.up;
  if (wantJump && !h.act) {
    if (h.ground) {
      h.vy = -h.S.jumpV; h.ground = false; h.jumps = 0; h.airAtk = false;
      h.vx = dir * h.S.speed; if (dir) h.face = dir;
      chip.sfx('jump'); dust(h.x, h.y, 4);
    } else if (h.jumps < h.S.airJumps && h.vy > -150) {
      h.jumps++; h.vy = -h.S.jumpV * 0.82; h.airAtk = false;
      if (dir) { h.vx = dir * h.S.speed; h.face = dir; }
      chip.sfx('jump2'); fxAdd({ k: 'ring', x: h.x, y: h.y, t: 0, life: 0.3, r0: 4, r1: 16, col: '#9fe8ff' });
    }
  }
  // movement
  const D = h.act ? ATK[h.act.k] : null;
  if (h.ground) {
    h.crouch = !!I.down && (!D || D.crouch);
    if (D && !D.air) h.vx = 0;
    else if (h.crouch) { h.vx = 0; if (dir) h.face = dir; }
    else {
      h.vx = dir * h.S.speed;
      if (dir) h.face = dir;
      if (dir) h.runT += dt * h.S.speed;
    }
  } else {
    h.crouch = false;
    if (dir && !h.act) h.face = dir;
    if (dir) h.vx = approach(h.vx, dir * h.S.speed, 260 * dt);
  }
  if (h.act) {
    h.act.t += dt;
    if (!D.air && h.act.t >= D.dur * h.S.quick) h.act = null;
  }
  const wasGround = h.ground;
  heroPhys(h, dt);
  if (h.ground && !wasGround) {
    if (h.act && ATK[h.act.k].air) h.act = null;
    h.airAtk = false; h.jumps = 0; h.vx = 0;
    chip.sfx('land'); dust(h.x, h.y, 3);
  }
}

function heroPhys(h, dt) {
  h.x += h.vx * dt;
  if (!h.ground) {
    h.vy += GRAV * dt;
    h.y += h.vy * dt;
    if (h.y >= GROUND_Y) { h.y = GROUND_Y; h.vy = 0; h.ground = true; }
  }
}

function updateGrabbed(h, dt, I, P) {
  h.act = null; h.vx = 0; h.crouch = false;
  const dir = P.left ? -1 : P.right ? 1 : 0;
  if (dir && dir !== h.lastDir) { h.escape += 1; h.lastDir = dir; h.wig = 0.12; }
  if (P.punch || P.kick || P.jump || P.up) { h.escape += 0.65; h.wig = 0.12; }
  h.wig = Math.max(0, h.wig - dt);
