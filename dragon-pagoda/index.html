    if (b) b.update(dt);
  } else if (game.boss) game.boss.update(dt);
}

function onBossDown(b) {
  game.bossSeq.st = 'down'; game.bossSeq.t = 0;
  game.slowT = 0.9; game.flashT = 0.16;
  addShake(8);
  chip.stopMusic(true);
  chip.sfx('bossko');
  addScore(b.D.pts, b.x, b.y - 70, false);
  pop(b.x, b.y - 82, 'K.O.!', '#ffd27a');
  game.shots = game.shots.filter((s) => !s.foe);
  const h = game.hero;
  if (h.grabbers.length) releaseGrabbers(h, true);
  for (const e of game.foes) if (foeAlive(e)) killFoe(e, sgn(e.x - h.x) || 1, 80, true);
}

/** After the guardian falls: the stair door opens and the hero climbs (or frees the Grandmaster). */
function updateCutscene(dt) {
  const S = game.bossSeq, h = game.hero, F = game.F, sx = stairX(F);
  h.act = null; h.crouch = false; h.inv = 1;
  heroPhys(h, dt);
  if (S.st === 'down') {
    h.vx = 0;
    if (h.ground) h.pose = S.t > 0.8 ? ['victory', 0] : null;
    if (S.t > 2.6) { S.st = 'exit'; S.t = 0; h.pose = null; if (!F.outdoor) chip.sfx('door'); }
  } else if (S.st === 'exit') {
    game.doorOpen = Math.min(1, game.doorOpen + dt * 1.2);
    if (S.t < 0.6 && !F.outdoor) return;
    const goal = F.outdoor ? sx - F.dir * 16 : sx - F.dir * 26;
    const d = goal - h.x;
    h.face = sgn(d) || F.dir;
    if (Math.abs(d) > 2) { h.x += sgn(d) * Math.min(Math.abs(d), 80 * dt); h.runT += 80 * dt; h.vx = sgn(d) * 80; }
    else {
      h.vx = 0; h.x = goal; h.face = F.dir;
      S.st = F.outdoor ? 'free' : 'climb'; S.t = 0;
      if (F.outdoor) { chip.sfx('free'); sparks(sx, GROUND_Y - 28, 12, '#ffd27a'); }
    }
    h.vx = 0;
    if (Math.abs(d) > 2) h.pose = ['walk', (h.runT / 6) % 8];
  } else if (S.st === 'climb') {
    h.pose = ['climb', (S.t * 8) % 4];
    h.x += F.dir * 28 * dt; h.y -= 52 * dt;
    if (Math.floor(S.t * 4) !== Math.floor((S.t - dt) * 4)) chip.sfx('step');
    if (S.t > 1.7) { game.hideHero = true; startClear(); }
  } else if (S.st === 'free') {
    h.pose = S.t < 1.6 ? ['idle', 0] : ['victory', 0];
    game.freed = Math.min(1, S.t / 1.2);
    if (S.t > 4.2) startEnding();
  }
}

/* ---- spawning -------------------------------------------------------------- */
function runEvents() {
  const F = game.F, prog = heroProgress(game.hero) + W * 0.25;
  while (game.evIdx < F.events.length && prog >= F.events[game.evIdx].at) {
    const ev = F.events[game.evIdx++];
    if (ev.wave) for (const [kind, side, delay] of ev.wave) game.sched.push({ t: game.time + delay, kind, side });
    if (ev.e) game.sched.push({ t: game.time, kind: ev.e, side: ev.side || 'F' });
  }
  runSched();
}

function runSched() {
  for (const s of game.sched) {
    if (s.done || game.time < s.t) continue;
    s.done = true;
    doSpawn(s.kind, s.side);
  }
  game.sched = game.sched.filter((s) => !s.done);
}

function doSpawn(kind, side) {
  const h = game.hero, F = game.F;
  if (h.dead || game.arena) return;
  if (kind === 'ninja') {
    const s = chance(0.65) ? F.dir : -F.dir;
    let x = h.x + s * rand(60, 90);
    if (x < game.camX + 16 || x > game.camX + W - 16) x = h.x - s * rand(60, 90);
    spawnFoe('ninja', clamp(x, game.camX + 16, game.camX + W - 16), -s);
    return;
  }
  let dir = side === 'B' ? -F.dir : F.dir;
  const x = dir > 0 ? game.camX + W + 14 : game.camX - 14;
  if (x < 4 || x > F.len - 4) { dir = -dir; }
  const sx = dir > 0 ? game.camX + W + 14 : game.camX - 14;
  spawnFoe(kind, sx, -dir);
}

function ambientSpawn(dt) {
  const F = game.F;
  game.spawnT -= dt * game.diff.spawn;
  if (game.spawnT > 0) return;
  game.spawnT = rand(F.gap[0], F.gap[1]);
  if (game.hero.dead || heroProgress(game.hero) > F.len - W - 40) return;
  const alive = game.foes.filter((e) => foeAlive(e)).length;
  if (alive >= F.max) return;
  const kind = pickWeighted(F.mix);
  doSpawn(kind, chance(F.behind) ? 'B' : 'F');
}

/* ---- scoring --------------------------------------------------------------------- */
function addScore(pts, x, y, chain, quiet) {
  let total = pts;
  if (chain) {
    if (game.time - game.chainT < 1.5) game.chainN = Math.min(10, game.chainN + 1); else game.chainN = 1;
    game.chainT = game.time;
    if (game.chainN > 1) total += (game.chainN - 1) * 50;
    if (game.chainN >= 3 && !quiet) pop(x, y - 9, 'CHAIN X' + game.chainN, '#ffd27a');
  }
  game.score += total;
  if (!quiet) pop(x, y, String(total), '#ffffff');
  if (!game.demo && game.score > game.hi) game.hi = game.score;
  while (!game.demo && game.score >= game.nextExtend) {
    game.lives = Math.min(9, game.lives + 1);
    game.nextExtend += 100000;
    chip.sfx('oneup');
    if (game.hero) pop(game.hero.x, game.hero.y - 60, 'EXTRA LIFE!', '#4ad16a');
  }
}

/* ---- death, respawn, continue -------------------------------------------------------- */
function onHeroDown() { game.downT = 0; game.stageStats.deaths++; }

function heroLost() {
  if (game.lives > 0) { game.lives--; respawn(); }
  else { setState('continue'); game.contT = 9.99; chip.play('gameover'); }
}

function respawn() {
  const F = game.F, old = game.hero;
  const b = game.boss && !game.boss.dead ? game.boss : null;
  let x = clamp(old.x, game.camX + 30, game.camX + W - 30);
  if (b) x = F.dir > 0 ? game.arena.x0 + 16 : game.arena.x1 - 16;
  const h = makeHero(x, game.fighter);
  h.chi = old.chi;
  h.inv = 2.6; h.face = F.dir;
  if (b) { h.face = sgn(b.x - x) || F.dir; b.x = F.dir > 0 ? game.arena.x1 - 10 : game.arena.x0 + 10; bossSt(b, 'taunt'); b.clones = []; b.cd = 1.2; }
  game.hero = h;
  for (const e of game.foes) if (foeAlive(e) && onScreen(e.x, 10)) { e.gone = true; smoke(e.x, e.y - 20, 4); }
  game.shots = []; game.sched = [];
  game.haz = game.haz.filter((z) => z.k === 'vent');
  game.spawnT = 2.4; game.downT = 0; game.chainN = 0; game.readyT = 1.6;
  if (game.timeLeft < 60) game.timeLeft = 60;
  if (b) chip.play(F.boss === 'abbot' ? 'final' : 'boss');
  else chip.play(F.song);
}

function updateContinue(dt, I, P) {
  tickWorld(dt);
  const before = Math.ceil(game.contT);
  game.contT -= dt * (P.special ? 6 : 1);
  if (Math.ceil(game.contT) !== before && game.contT > 0) chip.sfx('tick');
  if (game.stateT > 0.6 && (P.punch || P.kick || P.jump || P.start || input.tap)) {
    chip.sfx('coin');
    game.continues++; game.lives = 2;
    setState('play');
    respawn();
    return;
  }
  if (game.contT <= 0) { setState('gameover'); chip.stopMusic(); }
}

function finishRun() {
  chip.stopMusic();
  const rank = qualifies(game.score);
  if (rank >= 0) startEntry(rank);
  else { setState('title'); chip.play('title'); }
}

/* ---- floor clear and tally ------------------------------------------------------------ */
function startClear() {
  setState('clear');
  chip.play('clear');
  const S = game.stageStats, h = game.hero;
  const t = Math.floor(game.timeLeft);
  game.tally = [
    { label: 'TIME LEFT', val: String(t), pts: t * 50 },
    { label: 'VITALITY', val: Math.ceil(h.hp) + ' / ' + MAX_HP, pts: Math.ceil(h.hp) * 200 },
    { label: 'UNTOUCHED', val: S.hits ? 'HIT ' + S.hits + 'X' : 'PERFECT', pts: S.hits ? 0 : 10000 },
    { label: 'DEFLECTS', val: String(S.deflects), pts: S.deflects * 500 },
    { label: 'FIGHTERS DOWN', val: String(S.kills), pts: 0 }
  ];
  game.tallyIdx = -1; game.tallyT = 0; game.tallyDone = false;
}

function updateClear(dt, I, P) {
  tickWorld(dt);
  game.tallyT += dt;
  if (game.stateT < 0.6) return;
  if (!game.tallyDone) {
    if (game.tallyIdx < 0 || game.tallyT > 0.6) {
      game.tallyIdx++; game.tallyT = 0;
      if (game.tallyIdx < game.tally.length) {
        const row = game.tally[game.tallyIdx];
        if (row.pts) { addScore(row.pts, 0, 0, false, true); chip.sfx('pickup'); } else chip.sfx('move');
      } else { game.tallyDone = true; game.tallyT = 0; }
    }
  } else if (game.tallyT > 2.8 || (game.tallyT > 0.5 && (P.punch || P.kick || P.jump || P.start || input.tap))) {
    nextFloor();
  }
}

function nextFloor() {
  const h = game.hero;
  game.carry = { hp: h.hp, chi: h.chi };
  for (const k in game.stageStats) game.stats[k] += game.stageStats[k];
  game.hideHero = false;
  if (game.floorIdx + 1 < FLOORS.length) startFloor(game.floorIdx + 1);
  else startEnding();
}

/* ---- ending ------------------------------------------------------------------------------- */
const ENDING_LINES = [
  ['THE PAGODA IS FREE', '#ffd27a'], ['', ''],
  ['THE SHADOW ABBOT KNEELS', '#ffffff'], ['AND FADES WITH THE STORM.', '#ffffff'], ['', ''],
  ['GRANDMASTER HU BOWS TO', '#ffffff'], ['HIS STUDENT, THEN SMILES:', '#ffffff'], ['"NOW YOU TEACH ME."', '#9fe8ff'], ['', ''], ['', ''],
  ['DRAGON PAGODA', '#e8392a'], ['AN ORIGINAL ARCADE ADVENTURE', '#9fe8ff'], ['', ''],
  ['THANK YOU FOR PLAYING!', '#4ad16a']
];
function startEnding() {
  game.cleared = true;
  for (const k in game.stageStats) game.stats[k] += game.stageStats[k];
  game.stageStats = freshStats();
  setState('ending');
  chip.play('ending');
  game.endScroll = 0;
}
function updateEnding(dt, I, P) {
  game.endScroll += dt * 14;
  updateFx(dt); updateWeather(dt);
  const span = ENDING_LINES.length * 12;
  if (game.stateT > 4 && (P.punch || P.kick || P.start || input.tap)) { if (game.endScroll > span + 150) { finishRun(); return; } game.endScroll += 40; }
  if (game.endScroll > span + 520) finishRun();
}

/* ---- high scores ---------------------------------------------------------------------------- */
function qualifies(score) {
  if (game.demo || score <= 0) return -1;
  for (let i = 0; i < game.scores.length; i++) if (score > game.scores[i].s) return i;
  return -1;
}
const ENTRY_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.- ';
function startEntry(rank) {
  setState('entry');
  const last = store.get('initials', 'AAA');
  game.entry = { rank, chars: last.split('').map((c) => Math.max(0, ENTRY_CHARS.indexOf(c))), pos: 0, done: false, t: 30 };
  chip.play('entry');
}
function commitEntry() {
  const E = game.entry;
  const name = E.chars.map((i) => ENTRY_CHARS[i]).join('');
  store.set('initials', name);
  const reached = game.cleared ? 6 : game.floorIdx + 1;
  game.scores.splice(E.rank, 0, { n: name, s: game.score, st: reached });
  game.scores.length = 5;
  store.set('scores', game.scores);
  game.hi = Math.max(game.hi, game.scores[0].s);
  E.done = true; E.doneT = 0;
  chip.sfx('select');
}

/* ---- demo bot: plays the attract demo (and the automated tests) ------------------------- */
const BOT = { pressed: {}, atkCD: 0, jumpCD: 0, mash: 0, hold: 0, holdDown: false };
function botInput(dt) {
  const h = game.hero, F = game.F;
  const I = { left: false, right: false, up: false, down: false };
  const P = { punch: false, kick: false, jump: false, up: false, special: false, left: false, right: false };
  BOT.atkCD -= dt; BOT.jumpCD -= dt; BOT.hold -= dt;
  BOT.pressed = P;
  if (h.dead || h.pose) return I;
  if (h.grabbers.length) {
    BOT.mash = (BOT.mash + 1) % 4;
    if (BOT.mash === 0) P.left = true; else if (BOT.mash === 2) P.right = true;
    I.left = P.left; I.right = P.right;
    return I;
  }
  let dir = F.dir;
  // incoming projectiles and hazards
  let duck = false, hop = false;
  for (const s of game.shots) {
    if (!s.foe || s.gone) continue;
    const toward = (s.x - h.x) * -sgn(s.vx || 1);
    const near = Math.abs(s.x - h.x);
    if (s.k === 'shock' || s.k === 'fire') { if (toward > 0 && near < 56) hop = true; continue; }
    if (toward > 0 && near < 60) { if (s.y < GROUND_Y - 18) duck = true; else hop = true; }
    if (s.k === 'fan' && near < 34 && s.y < GROUND_Y - 18) duck = true;
  }
  for (const z of game.haz) {
    if (z.k === 'vent' && z.st !== 'idle' && Math.abs(z.x - (h.x + dir * 18)) < 26) dir = 0;
    if (z.k === 'bolt' && z.st === 'warn' && Math.abs(z.x - h.x) < 18) dir = -sgn(z.x - h.x) || -F.dir;
  }
  // nearest foe in reach
  let near = null, nd = 1e9;
  for (const e of game.foes) {
    if (!foeHittable(e)) continue;
    const d = Math.abs(e.x - h.x);
    if (d < nd) { nd = d; near = e; }
  }
  const b = game.boss;
  if (b && !b.dead && b.hittable() && (!near || Math.abs(b.x - h.x) < nd)) { near = { boss: true, x: b.x, kind: b.kind, b }; nd = Math.abs(b.x - h.x); }
  if (b && !b.dead && b.kind === 'ox' && b.st === 'charge' && Math.abs(b.x - h.x) < 70 && sgn(h.x - b.x) === b.face) hop = true;
  if (b && !b.dead && b.kind === 'fan' && b.st === 'dash' && Math.abs(b.x - h.x) < 60) hop = true;
  if (b && !b.dead && b.kind === 'spear' && b.st === 'spin' && Math.abs(b.x - h.x) < 50 && b.t > b.wind - 0.15) hop = true;
  if (b && !b.dead && b.kind === 'spear' && b.st === 'thrustH' && b.t > b.wind - 0.15) duck = true;
  if (b && !b.dead && b.kind === 'spear' && b.st === 'thrustL' && b.t > b.wind - 0.2 && Math.abs(b.x - h.x) < 60) hop = true;
  if (b && !b.dead && b.kind === 'abbot' && b.st === 'counter') { dir = 0; near = null; }
  if (h.chi >= MAX_CHI && h.ground && (game.foes.filter((e) => foeAlive(e) && Math.abs(e.x - h.x) < 120).length >= 2 || (b && !b.dead && b.hittable()))) P.special = true;
  if (near) {
    const side = sgn(near.x - h.x) || h.face;
    const reach = near.boss ? 26 : near.kind === 'monkey' || near.kind === 'snake' ? 26 : 24;
    if (nd < reach + 6) {
      dir = side === h.face ? 0 : side;
      if (BOT.atkCD <= 0 && h.ground) {
        const low = near.kind === 'snake' || near.kind === 'monk' || (near.kind === 'monkey' && near.y === GROUND_Y);
        if (low) { I.down = true; P.kick = near.kind !== 'snake'; P.punch = near.kind === 'snake'; }
        else if (nd < 20) P.punch = true; else P.kick = true;
        if (side !== h.face) { I.left = side < 0; I.right = side > 0; }
        BOT.atkCD = 0.2;
      }
    } else if (near.boss && b.kind === 'mirror' && b.clones.length) {
      dir = side;
    } else dir = (side === F.dir || nd < 90) ? side : F.dir;
  }
  if (hop && h.ground && BOT.jumpCD <= 0) { P.jump = true; BOT.jumpCD = 0.6; }
  else if (duck && h.ground) { I.down = true; dir = 0; }
  if (!h.ground && near && nd < 34 && BOT.atkCD <= 0) { P.kick = true; BOT.atkCD = 0.3; }
  if (dir > 0) I.right = true; else if (dir < 0) I.left = true;
  return I;
}
function botPressed() { return BOT.pressed; }

function startDemo() {
  newGame(true);
  game.cheat = true;
  setState('play');
  game.stateT = 0;
}
function exitDemo() {
  game.demo = false; chip.mute = false; game.cheat = false;
  chip.stopMusic();
  setState('title');
  game.idleT = 0;
}

/* ---- ambience ------------------------------------------------------------------------------------ */
function updateWeather(dt) {
  const kind = game.F.weather;
  const want = { motes: 28, embers: 44, fireflies: 22, storm: 120 }[kind] || 0;
  if (game.wx.length > want) game.wx.length = want;
  while (game.wx.length < want) game.wx.push({ x: rand(0, W), y: rand(HUD_H, H), s: Math.random(), ph: rand(0, TAU) });
  for (const p of game.wx) {
    if (kind === 'embers') { p.y -= (16 + p.s * 30) * dt; p.x += Math.sin(game.t * 2 + p.ph) * 10 * dt; }
    else if (kind === 'storm') { p.y += (280 + p.s * 120) * dt; p.x -= (70 + p.s * 30) * dt; }
    else if (kind === 'fireflies') { p.x += Math.cos(game.t * 0.6 + p.ph) * 12 * dt; p.y += Math.sin(game.t * 0.9 + p.ph * 2) * 10 * dt; }
    else { p.y += (Math.sin(game.t * 0.8 + p.ph) * 4 + 3) * dt; p.x += Math.cos(game.t * 0.5 + p.ph) * 6 * dt; }
    if (p.y > H) { p.y = HUD_H; p.x = rand(0, W + 60); }
    if (p.y < HUD_H - 2) { p.y = H; p.x = rand(0, W); }
    if (p.x < -4) p.x += W + 8;
    if (p.x > W + 4) p.x -= W + 8;
  }
  if (kind === 'storm' && game.state === 'play') {
    game.nextFlash = (game.nextFlash || 6) - dt;
    if (game.nextFlash <= 0) { game.nextFlash = rand(6, 11); game.skyFlash = 0.3; setTimeout(() => chip.sfx('rumble'), 300); }
  }
  game.skyFlash = Math.max(0, (game.skyFlash || 0) - dt);
}

/* ==========================================================================
   Menus: boot, title, fighter select, attract loop, how to play, options, pause, name entry
   ========================================================================== */

const TITLE_ITEMS = ['START GAME', 'HOW TO PLAY', 'HIGH SCORES', 'OPTIONS'];
const OPTION_ITEMS = ['MUSIC', 'EFFECTS', 'GLOW FX', 'SCREEN SHAKE', 'TOUCH PAD', 'BACK'];
const PAUSE_ITEMS = ['RESUME', 'OPTIONS', 'QUIT GAME'];
const HOWTO_PAGES = 3;
const FIGHTERS = ['tao', 'lian'];
const LEVELS = ['disciple', 'master'];

function menuMove(n, P) {
  let m = game.menu;
  if (P.up) m = (m + n - 1) % n;
  if (P.down) m = (m + 1) % n;

}

/** Taps on registered hit areas: returns the hit or null. */
function tapHit() {
  const tp = input.tap;

  return null;
}

function updateMenus(dt, I, P) {
  if (game.state !== 'pause') tickWorld(dt);
  const confirm = P.punch || P.kick || P.jump || P.start;
  const back = P.special || P.back;
  const hit = tapHit();
  switch (game.state) {
    case 'boot':
      if (P.any || input.tap) { chip.unlock(); chip.play('title'); setState('title'); }
      break;
    case 'title': {
      game.idleT += dt;
      if (P.any || input.tap) game.idleT = 0;
      menuMove(TITLE_ITEMS.length, P);
      let act = confirm ? game.menu : -1;
      if (hit) { game.menu = hit.i; act = hit.i; }
      if (act === 0) { chip.sfx('select'); setState('select'); game.menu = 2; }
      else if (act === 1) { chip.sfx('select'); setState('howto'); game.page = 0; }
      else if (act === 2) { chip.sfx('select'); setState('scores'); game.attract = false; }
      else if (act === 3) { chip.sfx('select'); game.optFrom = 'title'; setState('options'); }
      if (game.idleT > 22) { game.idleT = 0; game.attract = true; setState('scores'); }
      break;
    }
    case 'select': {
      menuMove(3, P);
      const d = P.left ? -1 : P.right ? 1 : 0;
      if (d && game.menu === 0) { settings.fighter = FIGHTERS[(FIGHTERS.indexOf(settings.fighter) + 1) % 2]; chip.sfx('move'); saveSettings(); }
      if (d && game.menu === 1) { settings.level = LEVELS[(LEVELS.indexOf(settings.level) + 1) % 2]; chip.sfx('move'); saveSettings(); }
      let go = confirm && game.menu === 2;
      if (confirm && game.menu < 2) { game.menu++; chip.sfx('move'); }
      if (hit) {
        if (hit.fighter) { settings.fighter = hit.fighter; game.menu = 0; chip.sfx('move'); saveSettings(); }
        else if (hit.level) { settings.level = hit.level; game.menu = 1; chip.sfx('move'); saveSettings(); }
        else if (hit.go) go = true;
        else if (hit.back) { setState('title'); chip.sfx('move'); break; }
      }
      if (go) { chip.sfx('coin'); chip.stopMusic(); newGame(false); }
      else if (back) { setState('title'); chip.sfx('move'); }
      break;
    }
    case 'scores':
      if (game.attract) {
        if (P.any || input.tap) { game.attract = false; setState('title'); game.idleT = 0; break; }
        if (game.stateT > 7) startDemo();
      } else if (confirm || back || hit || (input.tap && game.stateT > 0.3)) { chip.sfx('move'); setState('title'); game.menu = 2; }
      break;
    case 'howto':
      if (P.right || confirm || (hit && hit.next) || (input.tap && !hit && game.stateT > 0.2)) {
        game.page++; chip.sfx('move');
        if (game.page >= HOWTO_PAGES) { setState('title'); game.menu = 1; }
      } else if (P.left && game.page > 0) { game.page--; chip.sfx('move'); }
      else if (back || (hit && hit.back)) { setState('title'); game.menu = 1; chip.sfx('move'); }
      break;
    case 'options': {
      menuMove(OPTION_ITEMS.length, P);
      let d = P.left ? -1 : P.right ? 1 : 0;
      let act = confirm;
      if (hit) { game.menu = hit.i; if (hit.dir) d = hit.dir; else act = true; }
      if (d || act) adjustOption(game.menu, d || 1, act && !d);
      if (back) leaveOptions();

    }
    case 'pause': {

}

function adjustOption(i, d, activate) {
  switch (OPTION_ITEMS[i]) {
    case 'MUSIC': settings.music = clamp(Math.round(settings.music * 10 + d) / 10, 0, 1); chip.applyVolumes(); chip.sfx('move'); break;
    case 'EFFECTS': settings.sfx = clamp(Math.round(settings.sfx * 10 + d) / 10, 0, 1); chip.applyVolumes(); chip.sfx('punch'); break;
    case 'GLOW FX': settings.fx = !settings.fx; chip.sfx('move'); break;

function leaveOptions() {

function openPause() {

function updateEntry(dt, P, hit) {
  const E = game.entry;

function lanternPos(l) { const sw = Math.sin(game.t * 1.3 + l.ph) * 1.8; return [l.x + sw, l.y + l.len]; }

function drawLanterns(g, L, cx) {

function drawDoor(g, F, cx) {

/** Everyone standing on the polished floor, mirrored underneath. */

function drawWorld(g) {

  if (h && !game.hideHero) drawHero(g, h, cx);

  for (const s of game.shots) drawShot(g, s, cx);
  drawFx(g, cx);
  if (!game.arena) {

/** Colour grade and vignette that tie each hall together. */
const GRADE_CACHE = {};
function drawGrade(g, F) {

function drawPagodaMap(g, x0, y0, cur) {
  const tiers = FLOORS.length;
  drawGlow(g, x0, y0 + 60, 70, '#ff7a3a', 0.25);
  for (let i = 0; i < tiers; i++) {
    const fi = tiers - 1 - i;
    const w = 70 + fi * 12, y = y0 + i * 26, x = x0 - w / 2;
    const done = fi < cur, now = fi === cur;
    g.fillStyle = lgrad(g, x, y + 1, x + w, y + 21, now ? [[0, '#6a1e16'], [1, '#2a0a08']] : done ? [[0, '#3a2016'], [1, '#1a0c08']] : [[0, '#1e1218'], [1, '#0e080c']]);
    g.fillRect(x, y + 1, w, 20);
    for (let k = 0; k < 4; k++) {
      const wx = x + 6 + (k * (w - 12)) / 3 - 2.2;
      g.fillStyle = now ? lgrad(g, 0, y + 6, 0, y + 15, [[0, '#fff2b0'], [1, '#ff8a3a']]) : done ? '#7a5a2a' : '#2a1e24';
      roundRectPath(g, wx, y + 6, 4.4, 9, 1.4); g.fill();
      if (now) drawGlow(g, wx + 2.2, y + 10, 7, '#ff9a40', 0.6);
    }
    g.fillStyle = lgrad(g, 0, y - 7, 0, y + 1, [[0, now ? '#6a3a2a' : '#3a2230'], [1, '#140a10']]);
    g.beginPath(); g.moveTo(x - 12, y - 6); g.quadraticCurveTo(x - 2, y + 1, x + w * 0.2, y); g.lineTo(x + w * 0.8, y); g.quadraticCurveTo(x + w + 2, y + 1, x + w + 12, y - 6); g.lineTo(x + w * 0.75, y - 5); g.lineTo(x + w * 0.25, y - 5); g.closePath(); g.fill();
    if (now) { stampLine(g, x + w * 0.25, y - 5, x + w * 0.75, y - 5, 0.6, '#ffd27a'); }
    T(g, (fi + 1) + 'F', x - 22, y + 6, now ? C.gold : done ? '#a8823a' : '#5a4a50', { weight: 700 });
    if (now) { g.save(); g.translate(x + w / 2, y + 20.5); g.scale(0.42, 0.42); drawSprite(g, game.fighter, 'walk', game.t * 8, 1, 0, 0); g.restore(); }
  }
  rect(g, x0 - 1, y0 - 26, 2.4, 20, '#2a1620'); for (let i = 0; i < 3; i++) disc(g, x0 + 0.2, y0 - 10 - i * 5, 2.4 - i * 0.4, '#d9a43a');
}

  drawGlow(g, 300, sunY, 80, '#fff0c0', 0.8);
  disc(g, 300, sunY, 18, '#fff6d8');
  const R = seeded(77);
  ridgeHD(g, W, 160, [[2, 30], [5, 10]], true, '#7a4a8a', '#3a2448', R);
  ridgeHD(g, W, 176, [[3, 16], [7, 5]], true, '#4a2c5a', '#24142e', R);
  g.fillStyle = lgrad(g, 0, 150, 0, 178, [[0, '#9a90a4'], [1, '#4a4254']]); g.fillRect(0, 172, W, 6);
  for (let x = 0; x < W; x += 18) { g.fillStyle = lgrad(g, x + 4, 0, x + 10, 0, [[0, '#a89cb0'], [1, '#4a4254']]); roundRectPath(g, x + 4, 156, 6, 16, 2.4); g.fill(); }
  g.fillStyle = lgrad(g, 0, 178, 0, H, [[0, '#7a7084'], [1, '#2a2434']]); g.fillRect(0, 178, W, H - 178);
  drawShadow(g, 150, 196, 9, 0); drawShadow(g, 196, 196, 9, 0);
  drawSprite(g, game.fighter, 'victory', 0, 1, 150, 196);
  drawSprite(g, 'master', game.stateT % 6 < 3 ? 'bow' : 'idle', 0, -1, 196, 196);
  for (let i = 0; i < 18; i++) {
    const x = ((i * 61 - game.t * (16 + (i % 4) * 5)) % (W + 20) + W + 20) % (W + 20) - 10;
    const y = ((i * 41 + game.t * (9 + (i % 3) * 4)) % (H + 10)) - 5;
    g.save(); g.translate(x, y); g.rotate(game.t * 2 + i); ellipse(g, 0, 0, 1.5, 0.7, 0, i % 2 ? '#ffd0dc' : '#ff9ab8'); g.restore();
  }
  g.fillStyle = 'rgba(20,8,24,0.35)'; g.fillRect(0, 0, W, 140);
  const y0 = H + 10 - game.endScroll;
  const vis = (y) => y > 8 && y < 136;
  ENDING_LINES.forEach(([str, c], i) => {
    const y = y0 + i * 12;
    if (!vis(y)) return;
    if (i === 0 || str === 'DRAGON PAGODA') bigTitle(g, str, W / 2, y - 2, 1.4);
    else T(g, str, W / 2, y, c, { align: 'center', weight: 600, raw: str.startsWith('"') });
  });
  const yS = Math.max(64, y0 + ENDING_LINES.length * 12 + 18);
  if (vis(yS)) T(g, 'FINAL SCORE  ' + pad7(game.score), W / 2, yS, C.gold, { align: 'center', weight: 700, scale: 1.3 });
  if (yS <= 64 && blink(2)) T(g, input.usingTouch ? 'TAP TO CONTINUE' : 'PRESS PUNCH', W / 2, 88, C.ink, { align: 'center', weight: 700 });
}

/* ---- frame ------------------------------------------------------------------------------ */
/** Rebuild cached paintings when the screen scale changes enough to matter. */
function ensureArtScale() {
  const want = clamp(view.scale, 1, 4);
  if (Math.abs(want - RS) <= RS * 0.12) return;
  RS = Math.round(want * 100) / 100;
  for (const k in ART_CACHE) delete ART_CACHE[k];
  if (game.L) game.L = floorArt(game.F);
}

function renderFrame() {
  const cv = $('screen'), g = cv.getContext('2d');
  game.hits = [];
  ensureArtScale();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#07040a'; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
  g.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in g) g.imageSmoothingQuality = 'low';
  g.save();
  g.beginPath(); g.rect(0, 0, W, H); g.clip();
  switch (game.state) {
    case 'boot': drawBoot(g); break;
    case 'title': drawTitle(g); break;
    case 'select': drawSelect(g); break;
    case 'scores': drawScores(g); break;
    case 'howto': drawHowTo(g); break;
    case 'options': drawOptions(g); break;
    case 'intro': drawIntro(g); break;
    case 'play': drawWorld(g); if (!DBG.noHud) drawHUD(g); drawBanners(g); break;
    case 'pause': drawPause(g); break;
    case 'clear': drawClear(g); drawHUD(g); break;
    case 'continue': drawContinue(g); drawHUD(g); break;
    case 'gameover': drawGameOver(g); drawHUD(g); break;
    case 'entry': drawEntry(g); break;
    case 'ending': drawEnding(g); break;
    default: break;
  }
  if (game.fadeT > 0) { g.globalAlpha = Math.min(1, game.fadeT / 0.22); rect(g, 0, 0, W, H, '#000000'); g.globalAlpha = 1; }
  if (game.toast) {
    game.toast.t += 1 / 60;
    if (game.toast.t > 1.6) game.toast = null;
    else { const w = textWidth(game.toast.s) + 14; rrect(g, W / 2 - w / 2, H - 22, w, 13, 6.5, 'rgba(14,6,12,0.88)'); T(g, game.toast.s, W / 2, H - 19.6, C.gold, { align: 'center', weight: 700 }); }
  }
  g.restore();
}

/* ==========================================================================
   Boot, layout and the main loop
   ========================================================================== */

function touchVisible() {
  const m = settings.touch || 'auto';
  if (m === 'on') return true;
  if (m === 'off') return false;
  return (isTouch && coarse && !input.usingPad) || input.usingTouch;
}

let safe = { t: 0, b: 0, l: 0, r: 0 };
function readSafe() {
  const pr = $('safeProbe');
  if (!pr) return;
  const cs = getComputedStyle(pr);
  safe = { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0 };
}

/** Size the touch pad for landscape and report how much side room it needs. */
function sizePad(vw, vh, portrait) {
  const root = $('touch');
  if (!root) return { left: 0, right: 0 };
  if (portrait) { for (const k of ['--dp', '--bk', '--bj', '--bs']) root.style.removeProperty(k); return { left: 0, right: 0 }; }
  const dp = Math.round(clamp(Math.min(vh, 520) * 0.33, 100, 160));
  const bk = Math.round(dp * 0.44), bj = Math.round(dp * 0.37), bs = Math.round(dp * 0.32);
  root.style.setProperty('--dp', dp + 'px'); root.style.setProperty('--bk', bk + 'px');
  root.style.setProperty('--bj', bj + 'px'); root.style.setProperty('--bs', bs + 'px');
  return { left: Math.max(16, safe.l) + dp + 14, right: Math.max(16, safe.r) + bk * 2 + 12 + 14 };
}

function layout() {
  readSafe();
  const cv = $('screen');
  const vw = window.innerWidth, vh = window.innerHeight;
  // full resolution, capped so huge screens stay smooth
  const dpr = Math.min(3, window.devicePixelRatio || 1, 2600 / Math.max(1, vw), 1600 / Math.max(1, vh)) * QUALITY.res[QUALITY.level];
  const tw = Math.max(1, Math.round(vw * dpr)), th = Math.max(1, Math.round(vh * dpr));
  if (cv.width !== tw || cv.height !== th) { cv.width = tw; cv.height = th; }
  const touchOn = touchVisible();
  const portrait = vh > vw * 1.05;
  const B = document.body.classList;
  B.toggle('touch-on', touchOn);
  B.toggle('portrait', portrait);
  let gx = 0, gy = 0, gw = vw, gh = vh;
  if (touchOn && portrait) {
    gy = safe.t + 8;
    gh = Math.min((vw * 9) / 16, vh * 0.52);
  } else if (touchOn) {
    // handheld landscape: the pad lives in side panels, the screen sits between them
    const pad = sizePad(vw, vh, false);
    const side = Math.max(pad.left, pad.right);
    const full = Math.min(vw, (vh * 16) / 9);
    gw = Math.min(vw, Math.max(vw - 2 * side, full * 0.72));
    gx = (vw - gw) / 2;
    gy = Math.max(0, safe.t);
    gh = vh - gy - Math.max(0, safe.b * 0.5);
  }
  if (!touchOn || portrait) sizePad(vw, vh, true);
  const s = Math.min(gw / W, gh / H) * dpr;
  view.scale = s;
  view.ox = Math.round(gx * dpr + (gw * dpr - W * s) / 2);
  view.oy = Math.round(gy * dpr + (gh * dpr - H * s) / 2);
  document.documentElement.style.setProperty('--game-bottom', Math.round((view.oy + H * s) / dpr) + 'px');
}
function layoutTouch() { layout(); }

let lastT = 0, acc = 0, manual = false, lastTouchState = null;
function frame(now) {
  requestAnimationFrame(frame);
  if (manual) return;
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.25) dt = 0.25;
  watchSpeed(dt);
  acc += dt;
  pollInput();
  const tv = touchVisible();
  if (tv !== lastTouchState) { lastTouchState = tv; layout(); }
  let steps = 0;
  while (acc >= STEP && steps < 8) {
    if (steps === 0) updateGame(STEP, input.held, takeInput());
    else { clearStepInput(); updateGame(STEP, input.held, NO_PRESS); }
    acc -= STEP; steps++;
  }
  if (steps >= 8) acc = 0;
  renderFrame();
}

/** If the device can't hold a smooth frame rate, render at a lower resolution. */
const speed = { t: 0, n: 0, slow: 0 };
function watchSpeed(dt) {
  if (document.hidden || dt <= 0 || dt > 0.2) return;
  speed.t += dt; speed.n++;
  if (dt > 1 / 42) speed.slow++;
  if (speed.t < 2.5) return;
  const slowShare = speed.slow / speed.n;
  speed.t = 0; speed.n = 0; speed.slow = 0;
  if (slowShare > 0.45 && QUALITY.level < QUALITY.res.length - 1 && (game.state === 'play' || game.state === 'title')) {
    QUALITY.level++;
    layout();
  }
}

function boot() {
  initInput();
  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 150));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (game.state === 'play' && !game.demo) openPause();
      if (chip.ctx) chip.ctx.suspend().catch(() => {});
    } else {
      lastT = 0;
      if (chip.ctx) chip.ctx.resume().catch(() => {});
    }
  });
  window.addEventListener('blur', () => { if (game.state === 'play' && !game.demo) openPause(); });
  loadFonts();
  ensureArtScale();
  titleArt();
  try { $('screen').focus({ preventScroll: true }); } catch (e) { /* focus is best effort */ }
  setState('boot');
  requestAnimationFrame(frame);
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
    try { window.claude.hot.snapshot(hotSnapshot); } catch (e) { /* viewer without hot updates */ }
  }

  // hooks for automated testing
  const blank = () => ({ left: false, right: false, up: false, down: false, jump: false, punch: false, kick: false, special: false, start: false, pause: false, back: false, any: false });
  window.__pagoda = {
    game, input, chip, settings, FLOORS, ETYPES, BOSS_DEFS, Chip, SONGS, parseTrack, DIFFS,
    setManual(v) { manual = v; },
    step(n, held, pressed, quiet) {
      const H0 = Object.assign(blank(), held || {});
      for (let i = 0; i < n; i++) {
        const P = i === 0 ? Object.assign(blank(), pressed || {}) : NO_PRESS;
        if (i === 0 && pressed && pressed.tap) input.tap = pressed.tap; else input.tap = null;
        input.typed = (i === 0 && pressed && pressed.typed) || [];
        updateGame(STEP, H0, P);
      }
      if (!quiet) renderFrame();
    },
    render: renderFrame, newGame, startFloor, startDemo, setState, spawnFoe, makeBoss, layout, view, beginPlay, hurtHero, killFoe, botInput, botPressed, updateGame, drawSprite, drawPortrait, drawMonkey, drawSnake, drawVase, drawLantern, drawPickup, drawDragonHead,
    DBG
  };
}

/** State worth keeping if the page is updated while someone is mid-run. */
function hotSnapshot() {
  const live = ['intro', 'play', 'pause', 'clear', 'continue'].includes(game.state) && !game.demo;
  if (!live) return {};
  const h = game.hero;
  return { run: { floor: game.floorIdx, score: game.score, lives: game.lives, continues: game.continues, fighter: game.fighter, level: game.diff.id, carry: h ? { hp: h.hp, chi: h.chi } : null } };
}

function resumeRun(r) {
  if (r.fighter && HERO_STATS[r.fighter]) settings.fighter = r.fighter;
  if (r.level && DIFFS[r.level]) settings.level = r.level;
  newGame(false);
  game.score = r.score || 0; game.lives = r.lives == null ? 2 : r.lives; game.continues = r.continues || 0;
  game.nextExtend = 50000;
  while (game.nextExtend <= game.score) game.nextExtend += 100000;
  game.hi = Math.max(game.hi, game.score);
  game.carry = r.carry || null;
  startFloor(clamp(r.floor | 0, 0, FLOORS.length - 1));
}

function start(data) {
  boot();
  if (data && data.run) { try { resumeRun(data.run); } catch (e) { setState('boot'); } }
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});

})();
</script>
