  h.escape = Math.max(0, h.escape - dt * 0.7);
  const need = (game.diff.id === 'master' ? 4.2 : 3.2) + h.grabbers.length * 1.6;
  h.escNeed = need;
  const drain = 2.6 * game.diff.drain * h.grabbers.length;
  h.hp -= drain * dt;
  h.drainT = (h.drainT || 0) + dt;
  if (h.drainT > 0.4) { h.drainT = 0; chip.sfx('squeeze'); h.flash = 0.06; }
  if (h.hp <= 0) { h.hp = 0; releaseGrabbers(h, false); killHero(h, -h.face); return; }
  if (h.escape >= need) {
    releaseGrabbers(h, true);
    h.escape = 0; h.inv = 0.5; h.flexT = 0.3;
    chip.sfx('shake');
    fxAdd({ k: 'ring', x: h.x, y: h.y - 22, t: 0, life: 0.3, r0: 8, r1: 30, col: '#ffffff' });
  }
}

function releaseGrabbers(h, flung) {
  for (const id of h.grabbers) {
    const e = game.foes.find((f) => f.id === id);
    if (!e || e.st !== 'grab') continue;
    if (flung) {
      const side = sgn(e.x - h.x) || 1;
      killFoe(e, side, 120, true);
      addScore(e.T.pts, e.x, e.y - 48, true);
      pop(e.x, e.y - 58, 'SHAKE OFF!', '#9fe8ff');
    } else setFoeSt(e, 'walk');
  }
  h.grabbers = [];
}

/** Damage the hero. dir is the direction the hit pushes them. */
function hurtHero(h, dmg, dir, opt) {
  if (h.dead || h.inv > 0 || game.cheat) return false;
  const d = dmg * game.diff.dmg;
  h.hp = Math.max(0, h.hp - d);
  h.flash = 0.12;
  game.stageStats.hits++;
  if (h.grabbers.length) releaseGrabbers(h, false);
  addShake(3);
  if (h.hp <= 0) { killHero(h, dir); return true; }
  chip.sfx('hurt');
  const knock = opt && opt.knock;
  h.act = null; h.crouch = false;
  h.hurtT = knock ? 0.5 : 0.24;
  h.vx = dir * (knock ? 110 : 70);
  if (knock) { h.vy = -170; h.ground = false; }
  h.inv = 1.0;
  return true;
}

function killHero(h, dir) {
  if (h.dead) return;
  h.dead = true; h.deadT = 0; h.hp = 0;
  h.act = null; h.crouch = false; h.grabbers = [];
  h.vx = dir * 90; h.vy = -200; h.ground = false;
  chip.sfx('ko');
  chip.stopMusic(true);
  game.slowT = 0.5;
  onHeroDown();
}

/* ---- the Dragon Wave ------------------------------------------------------------- */
function releaseWave(h) {
  chip.sfx('dragon');
  game.flashT = 0.14; addShake(6); game.hitStop = 0.08;
  game.stageStats.waves++;
  game.shots.push({ k: 'wave', x: h.x + h.face * 14, y: GROUND_Y, vx: h.face * 300, vy: 0, foe: false, t: 0, life: 1.7, hits: [], trail: [] });
}

function grantChi(h, n) {
  if (!h || h.dead) return;
  const before = h.chi;
  h.chi = Math.min(MAX_CHI, h.chi + n * h.S.chiGain);
  if (before < MAX_CHI && h.chi >= MAX_CHI) { chip.sfx('chifull'); pop(h.x, h.y - 70, 'CHI READY!', '#ffd84a'); }
}

/* ==== temple fighters =========================================================== */
function spawnFoe(kind, x, face, opt) {
  const T = ETYPES[kind];
  const e = {
    id: NEXT_ID++, kind, T, x, y: GROUND_Y, vx: 0, vy: 0, face, st: 'walk', t: 0, hp: T.hp, ground: true,
    speed: rand(T.speed[0], T.speed[1]) * game.diff.foeSpeed, flash: 0, walkT: rand(0, 8), cd: rand(0.5, 1.1),
    throws: 0, blocks: 0, alpha: 1, warps: 0, high: chance(0.5)
  };
  if (opt) Object.assign(e, opt);
  if (kind === 'ninja') { e.st = 'appear'; e.alpha = 0; smoke(e.x, e.y - 20, 8); chip.sfx('poof'); }
  game.foes.push(e);
  return e;
}

function setFoeSt(e, st) { e.st = st; e.t = 0; }

function foeAlive(e) { return e.st !== 'dead' && !e.gone; }
function foeHittable(e) { return foeAlive(e) && !(e.st === 'appear' && e.t < 0.15) && e.st !== 'vanish'; }

function foeBox(e) {
  const w = e.T.w;
  let h = e.T.h;
  if (e.kind === 'dagger' && e.st === 'aim' && !e.high) h = 28;
  if (e.kind === 'ninja' && (e.st === 'ready' || e.st === 'appear')) h = 34;
  return box(e.x - w, e.y - h, e.x + w, e.y);
}

function foeAttackBox(e) {
  switch (e.kind) {
    case 'monk': if (e.st === 'bash' && e.t > e.wind && e.t < e.wind + 0.18) return front(e, 2, 24, 6, 40); break;
    case 'ninja': if (e.st === 'slash' && e.t > 0.08 && e.t < 0.2) return front(e, 2, 27, 8, 38); break;
    case 'snake': if (e.st === 'strike' && e.t > 0.22 && e.t < 0.36) return front(e, 2, 17, 0, 10); break;
    case 'monkey': if (e.st === 'leap') return box(e.x - 6, e.y - 14, e.x + 6, e.y); break;
    default: break;
  }
  return null;
}

/** Knock a fighter out: flies back in an arc and lands. */
function killFoe(e, dir, power, quiet) {
  if (e.st === 'dead') return;
  if (e.st === 'grab') { const h = game.hero; h.grabbers = h.grabbers.filter((id) => id !== e.id); }
  e.hp = 0;
  setFoeSt(e, 'dead');
  e.vx = dir * (power || 80) * rand(0.9, 1.15); e.vy = -rand(130, 180); e.ground = false; e.face = -dir;
  if (!quiet) chip.sfx('down');
  game.stageStats.kills++;
  if (e.kind === 'monk' && chance(0.4)) dropItem(chance(0.5) ? 'bun' : 'scroll', e.x, e.y - 30);
}

function updateFoe(e, dt) {
  const h = game.hero;
  e.t += dt;
  e.flash = Math.max(0, e.flash - dt);
  const dx = h.x - e.x, adx = Math.abs(dx), toward = sgn(dx) || e.face;
  if (e.st === 'dead') {
    e.x += e.vx * dt;
    if (!e.ground) {
      e.vy += GRAV * dt; e.y += e.vy * dt;
      if (e.y >= GROUND_Y) { e.y = GROUND_Y; e.ground = true; e.vy = 0; dust(e.x, e.y, 3); chip.sfx('thud'); }
    } else e.vx = approach(e.vx, 0, 400 * dt);
    if (e.t > 1.3) e.gone = true;
    return;
  }
  if (e.st === 'hurt') {
    e.x += e.vx * dt; e.vx = approach(e.vx, 0, 360 * dt);
    if (e.t > (e.stun || 0.3)) { setFoeSt(e, 'walk'); e.stun = 0; e.cd = Math.max(e.cd, 0.4); }
    return;
  }
  if (e.st === 'trip') {
    // swept off their feet
    e.x += e.vx * dt; e.vx = approach(e.vx, 0, 300 * dt);
    if (e.t > 0.75) { setFoeSt(e, 'walk'); e.cd = 0.5; }
    return;
  }
  e.cd -= dt;
  switch (e.kind) {
    case 'thug': thugAI(e, dt, dx, adx, toward, h); break;
    case 'dagger': daggerAI(e, dt, dx, adx, toward, h); break;
    case 'monkey': monkeyAI(e, dt, dx, adx, toward, h); break;
    case 'monk': monkAI(e, dt, dx, adx, toward, h); break;
    case 'ninja': ninjaAI(e, dt, dx, adx, toward, h); break;
    case 'snake': snakeAI(e, dt, dx, adx, toward, h); break;
    default: break;
  }
  // leave the fight if far off screen
  if (e.x < game.camX - 120 || e.x > game.camX + W + 120) e.gone = true;
}

function blockedAhead(e, toward, gap) {
  for (const o of game.foes) {
    if (o === e || !foeAlive(o) || o.kind === 'snake') continue;
    const d = (o.x - e.x) * toward;
    if (d > 0 && d < gap && (o.st === 'grab' || Math.abs(o.vx) < 1 || o.kind !== e.kind)) return true;
  }
  return false;
}

function thugAI(e, dt, dx, adx, toward, h) {
  if (e.st === 'grab') {
    if (h.dead || !h.grabbers.includes(e.id)) { setFoeSt(e, 'walk'); return; }
    const side = e.side;
    e.x = h.x + side * 11; e.face = -side;
    return;
  }
  e.face = adx > 6 ? toward : e.face;
  const wait = blockedAhead(e, e.face, 15);
  e.vx = wait || h.dead ? 0 : e.face * e.speed;
  e.x += e.vx * dt;
  if (e.vx) e.walkT += dt * e.speed;
  const side = sgn(e.x - h.x) || -e.face;
  const busy = h.grabbers.some((id) => { const o = game.foes.find((f) => f.id === id); return o && o.side === side; });
  if (adx < 13 && !busy && h.ground && !h.dead && h.inv <= 0 && h.hurtT <= 0 && !(h.act && h.act.k === 'chi') && !h.pose && game.state === 'play') {
    setFoeSt(e, 'grab'); e.side = side;
    h.grabbers.push(e.id); h.escape = Math.max(0, h.escape - 1);
    chip.sfx('grab');
    if (!game.tutGrab) { game.tutGrab = true; }
  }
}

function daggerAI(e, dt, dx, adx, toward, h) {
  const tele = 0.55 * game.diff.tele;
  if (e.st === 'aim') {
    e.face = toward; e.vx = 0;
    if (e.t >= tele) {
      setFoeSt(e, 'throw');
      const y = e.high ? GROUND_Y - 31 : GROUND_Y - 8;
      game.shots.push({ k: 'knife', x: e.x + e.face * 10, y, vx: e.face * 170 * game.diff.foeSpeed, vy: 0, foe: true, dmg: ETYPES.dagger.dmg, deflect: true, t: 0, life: 3, high: e.high });
      chip.sfx('throw');
      e.throws++;
    }
    return;
  }
  if (e.st === 'throw') {
    if (e.t > 0.35) { setFoeSt(e, 'walk'); e.cd = rand(0.9, 1.6) * game.diff.tele; e.high = chance(e.throws % 3 === 2 ? 0.2 : 0.55); }
    return;
  }
  // keep a throwing distance
  e.face = toward;
  let want = 0;
  if (adx > 120) want = toward;
  else if (adx < 58) want = -toward;
  if (blockedAhead(e, toward, 16) && want === toward) want = 0;
  e.vx = want * e.speed;
  e.x += e.vx * dt;
  if (e.vx) e.walkT += dt * e.speed;
  // stay on screen while throwing
  e.x = clamp(e.x, game.camX - 10, game.camX + W + 10);
  if (e.cd <= 0 && adx < 170 && adx > 40 && e.x > game.camX + 8 && e.x < game.camX + W - 8 && !h.dead) setFoeSt(e, 'aim');
}

function monkeyAI(e, dt, dx, adx, toward, h) {
  if (e.st === 'leap') {
    e.x += e.vx * dt; e.vy += GRAV * dt; e.y += e.vy * dt;
    if (e.y >= GROUND_Y) { e.y = GROUND_Y; e.vy = 0; setFoeSt(e, 'walk'); e.cd = rand(0.7, 1.2); }
    return;
  }
  if (e.st === 'flee') {
    e.x += e.vx * dt;
    if (!e.ground) { e.vy += GRAV * dt; e.y += e.vy * dt; if (e.y >= GROUND_Y) { e.y = GROUND_Y; e.vy = 0; e.ground = true; } }
    if (e.t > 0.7) { setFoeSt(e, 'walk'); e.cd = 0.4; }
    return;
  }
  e.face = toward;
  e.vx = e.face * e.speed;
  e.x += e.vx * dt;
  e.walkT += dt * e.speed;
  if (adx < 46 && adx > 18 && e.cd <= 0 && !h.dead) {
    setFoeSt(e, 'leap');
    e.vy = -235; e.vx = e.face * 150; e.ground = false;
    chip.sfx('monkey');
  }
}

function monkAI(e, dt, dx, adx, toward, h) {
  e.wind = 0.5 * game.diff.tele;
  if (e.st === 'bash') {
    if (e.t > e.wind && e.t < e.wind + 0.16) { e.x += e.face * 150 * dt; }
    if (e.t > e.wind + 0.6) { setFoeSt(e, 'walk'); e.cd = rand(1.0, 1.8); }
    if (e.t >= e.wind && !e.whoosh) { e.whoosh = true; chip.sfx('bash'); }
    return;
  }
  if (e.st === 'block') { if (e.t > 0.25) setFoeSt(e, 'walk'); return; }
  e.face = toward;
  const want = adx > 30 ? toward : 0;
  e.vx = blockedAhead(e, toward, 18) ? 0 : want * e.speed;
  e.x += e.vx * dt;
  if (e.vx) e.walkT += dt * e.speed;
  if (adx < 40 && e.cd <= 0 && !h.dead) { setFoeSt(e, 'bash'); e.whoosh = false; }
}

function ninjaAI(e, dt, dx, adx, toward, h) {
  if (e.st === 'appear') {
    e.alpha = Math.min(1, e.t / 0.3); e.face = toward;
    if (e.t > 0.35) setFoeSt(e, 'ready');
    return;
  }
  if (e.st === 'ready') {
    e.face = toward;
    if (e.t > 0.5 * game.diff.tele) { setFoeSt(e, 'dash'); chip.sfx('dash'); }
    return;
  }
  if (e.st === 'dash') {
    e.face = toward;
    e.x += e.face * 210 * dt; e.walkT += dt * 210;
    if (adx < 18 || e.t > 0.45) { setFoeSt(e, 'slash'); chip.sfx('slash'); }
    return;
  }
  if (e.st === 'slash') {
    if (e.t > 0.42) {
      if (e.warps < 2) { setFoeSt(e, 'vanish'); smoke(e.x, e.y - 20, 8); chip.sfx('poof'); }
      else { setFoeSt(e, 'walk'); e.cd = 0.9; }
    }
    return;
  }
  if (e.st === 'vanish') {
    e.alpha = Math.max(0, 1 - e.t / 0.2);
    if (e.t > 0.7) {
      e.warps++;
      const side = chance(0.5) ? 1 : -1;
      let x = h.x + side * rand(56, 86);
      if (x < game.camX + 16 || x > game.camX + W - 16) x = h.x - side * rand(56, 86);
      e.x = clamp(x, game.camX + 16, game.camX + W - 16);
      setFoeSt(e, 'appear'); smoke(e.x, e.y - 20, 8); chip.sfx('poof');
    }
    return;
  }
  e.face = toward;
  e.vx = adx > 24 ? toward * e.speed : 0;
  e.x += e.vx * dt;
  if (e.vx) e.walkT += dt * e.speed;
  if (adx < 70 && e.cd <= 0 && !h.dead) setFoeSt(e, 'ready');
}

function snakeAI(e, dt, dx, adx, toward, h) {
  if (e.st === 'strike') { if (e.t > 0.7) { setFoeSt(e, 'walk'); e.cd = 0.8; } return; }
  e.face = toward;
  e.x += e.face * e.speed * dt;
  e.walkT += dt * 6;
  if (adx < 20 && e.cd <= 0 && !h.dead) { setFoeSt(e, 'strike'); chip.sfx('hiss'); }
}

/* ---- the hero lands a blow --------------------------------------------------------- */
function attackLow(ab) { return ab.y1 > GROUND_Y - 8; }

/** Returns 'hit', 'block' or null. */
function strikeFoe(e, h, D, ab) {
  const fromFront = sgn(h.x - e.x) === e.face;
  if (e.kind === 'monk' && fromFront && !attackLow(ab) && e.st !== 'hurt' && e.st !== 'trip') {
    setFoeSt(e, 'block'); e.blocks++;
    chip.sfx('clang');
    sparks((h.x + e.x) / 2 + e.face * 4, h.y - 26, 6, '#ffe27a');
    h.x -= h.face * 6;
    if (e.blocks >= 3) { e.blocks = 0; setFoeSt(e, 'hurt'); e.stun = 1.2; e.vx = h.face * 40; pop(e.x, e.y - 52, 'GUARD BREAK!', '#ffd27a'); chip.sfx('break'); }
    return 'block';
  }
  let dmg = D.dmg === 'punch' ? h.S.punch : D.dmg === 'kick' ? h.S.kick : 3;
  e.hp -= dmg;
  e.flash = 0.08;
  const hx = e.x - h.face * 4, hy = clamp((ab.y0 + ab.y1) / 2, e.y - e.T.h + 4, e.y - 3);
  hitSpark(hx, hy, D.fin);
  chip.sfx(D.fin ? 'smash' : D.dmg === 'punch' ? 'punch' : 'kick');
  if (e.hp <= 0) {
    killFoe(e, h.face, D.fin ? 200 : D.kb + 40, true);
    chip.sfx('down');
    addScore(e.T.pts + (D.fin ? 200 : 0), e.x, e.y - e.T.h - 6, true);
    if (D.fin) pop(e.x, e.y - e.T.h - 28, 'FINISH!', '#ff9a30');
    grantChi(h, D.fin ? 12 : 4);
  } else if (D.trip) {
    setFoeSt(e, 'trip'); e.vx = h.face * 40;
    addScore(50, e.x, e.y - e.T.h - 6, false, true);
  } else {
    setFoeSt(e, 'hurt'); e.vx = h.face * D.kb; e.stun = 0.3;
    if (e.kind === 'dagger' || e.kind === 'ninja') e.cd = Math.max(e.cd, 0.5);
  }
  grantChi(h, 7);
  return 'hit';
}

function onLanded(h, D, strong) {
  h.act.landed = true;
  if (D.fin) { h.combo = 0; h.comboT = 0; }
  else if (!D.air && !D.crouch) { h.combo = Math.min(2, h.combo + 1); h.comboT = D.dur * h.S.quick - h.act.t + 0.42; }
  game.hitStop = Math.max(game.hitStop || 0, D.fin || strong ? 0.1 : 0.045);
  if (D.fin) addShake(4);
}

function resolveHeroAttacks() {
  const h = game.hero;
  if (!h || h.dead) return;
  const ab = heroAttackBox(h);
  if (!ab) return;
  const a = h.act, D = ATK[a.k];
  let landed = false;
  for (const e of game.foes) {
    if (!foeHittable(e) || a.hits.includes(e.id)) continue;
    if (boxHit(ab, foeBox(e))) { a.hits.push(e.id); if (strikeFoe(e, h, D, ab) === 'hit') landed = true; }
  }
  for (const s of game.shots) {
    if (!s.foe || s.gone || !s.deflect) continue;
    if (boxHit(ab, shotBox(s))) { deflectShot(s, h); landed = true; }
  }
  for (const z of game.haz) {
    if (z.gone || a.hits.includes(z)) continue;
    const zb = hazHitBox(z);
    if (zb && boxHit(ab, zb)) { a.hits.push(z); if (hitHazard(z, h)) landed = true; }
  }
  const b = game.boss;
  if (b && !b.dead && !a.bossHit && b.hittable()) {
    const r = b.strike(ab, D, h);
    if (r) { a.bossHit = true; if (r === 'hit') landed = true; }
  }
  if (landed) onLanded(h, D);
}

function resolveFoeAttacks() {
  const h = game.hero;
  if (!h || h.dead || h.inv > 0 || (h.act && h.act.k === 'chi') || h.pose) return;
  const hb = heroHurtBox(h);
  for (const e of game.foes) {
    if (!foeAlive(e)) continue;
    const ab = foeAttackBox(e);
    if (ab && boxHit(ab, hb)) {
      const dir = sgn(h.x - e.x) || -h.face;
      hurtHero(h, e.T.dmg, dir, { knock: e.kind === 'monk' || e.kind === 'ninja' });
      if (e.kind === 'monkey') { setFoeSt(e, 'flee'); e.vx = -e.face * 100; e.vy = -120; e.ground = false; }
      return;
    }
  }
  for (const s of game.shots) {
    if (!s.foe || s.gone) continue;
    if (boxHit(shotBox(s), hb)) {
      hurtHero(h, s.dmg, sgn(s.vx) || -h.face, { knock: !!s.knock });
      if (!s.pierce) { s.gone = true; sparks(s.x, s.y, 4, '#ffffff'); }
      return;
    }
  }
  for (const z of game.haz) {
    const zb = hazHurtBox(z);
    if (zb && boxHit(zb, hb)) { hurtHero(h, z.dmg, sgn(h.x - z.x) || -h.face, { knock: z.knock }); if (z.k === 'wisp') popWisp(z); return; }
  }
  const b = game.boss;
  if (b && !b.dead) {
    const hit = b.touches(hb);
    if (hit) hurtHero(h, hit.dmg, hit.dir || sgn(h.x - b.x) || -1, { knock: hit.knock });
  }
}

/* ==== projectiles ================================================================= */
function shotBox(s) {
  switch (s.k) {
    case 'knife': return box(s.x - 5, s.y - 2, s.x + 5, s.y + 2);
    case 'fan': return box(s.x - 7, s.y - 7, s.x + 7, s.y + 7);
    case 'tal': return box(s.x - 4, s.y - 6, s.x + 4, s.y + 6);
    case 'orb': return box(s.x - 6, s.y - 6, s.x + 6, s.y + 6);
    case 'shock': return box(s.x - 7, GROUND_Y - 10, s.x + 7, GROUND_Y);
    case 'fire': return box(s.x - 9, GROUND_Y - 16, s.x + 9, GROUND_Y);
    case 'wave': return box(s.x - 20, GROUND_Y - 54, s.x + 20, GROUND_Y);
    default: return box(s.x - 3, s.y - 3, s.x + 3, s.y + 3);
  }
}

function deflectShot(s, h) {
  if (s.k === 'tal' || s.k === 'fan' && s.brittle) {
    s.gone = true; chip.sfx('tear'); sparks(s.x, s.y, 6, s.k === 'tal' ? '#f2d16b' : '#d6283d');
    addScore(100, s.x, s.y - 8, false); grantChi(h, 6);
    return;
  }
  s.foe = false; s.vx = h.face * Math.max(200, Math.abs(s.vx) * 1.45); s.vy = 0; s.t = 0; s.life = 2; s.deflected = true;
  chip.sfx('parry');
  sparks(s.x, s.y, 6, '#ffe27a');
  fxAdd({ k: 'star', x: s.x, y: s.y, t: 0, life: 0.14 });
  addScore(300, s.x, s.y - 10, false);
  pop(s.x, s.y - 20, 'DEFLECT!', '#9fe8ff');
  grantChi(h, 15);
  game.stageStats.deflects++;
  game.hitStop = Math.max(game.hitStop || 0, 0.06);
}

function updateShots(dt) {
  const h = game.hero;
  for (const s of game.shots) {
    s.t += dt;
    if (s.k === 'fan' && s.foe && s.boomer) {
      // out, then curving home to the thrower
      const b = game.boss;
      if (s.t > s.turnT && b && !b.dead) {
        const tx = b.x, ty = b.y - 30;
        s.vx = approach(s.vx, sgn(tx - s.x) * 210, 520 * dt);
        s.vy = approach(s.vy, clamp((ty - s.y) * 3, -80, 80), 300 * dt);
        if (Math.abs(tx - s.x) < 10 && s.t > s.turnT + 0.3) { s.gone = true; b.catchFan && b.catchFan(); }
      }
    } else if (s.k === 'tal' && s.foe) {
      s.vy = Math.sin(s.t * 5 + s.ph) * 40 + clamp((h.y - 28 - s.y) * 0.8, -30, 30);
    } else if (s.k === 'wave') {
      s.trail.unshift({ x: s.x, y: GROUND_Y - 26 + Math.sin(s.t * 14) * 9 });
      if (s.trail.length > 16) s.trail.length = 16;
      for (const e of game.foes) {
        if (!foeHittable(e) || s.hits.includes(e.id)) continue;
        if (boxHit(shotBox(s), foeBox(e))) { s.hits.push(e.id); hitSpark(e.x, e.y - 22, true); killFoe(e, sgn(s.vx), 220, true); chip.sfx('smash'); addScore(e.T.pts, e.x, e.y - e.T.h - 6, true); }
      }
      for (const o of game.shots) if (o.foe && !o.gone && Math.abs(o.x - s.x) < 22) { o.gone = true; sparks(o.x, o.y, 5, '#ffd84a'); }
      for (const z of game.haz) if ((z.k === 'wisp' || z.k === 'vase') && !z.gone && Math.abs(z.x - s.x) < 22) hitHazard(z, h);
      const b = game.boss;
      if (b && !b.dead && !s.bossHit && b.hittable() && Math.abs(b.x - s.x) < 26) { s.bossHit = true; b.waveHit(sgn(s.vx)); }
    } else if (s.k === 'shock') {
      // ground shockwave
    } else if (s.grav) s.vy += s.grav * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.t > s.life || s.x < game.camX - 60 || s.x > game.camX + W + 60) s.gone = true;
    // deflected knives and orbs fly back into enemies
    if (!s.foe && s.k !== 'wave') {
      for (const e of game.foes) {
        if (!foeHittable(e)) continue;
        if (boxHit(shotBox(s), foeBox(e))) {
          s.gone = true; hitSpark(e.x, s.y, true); killFoe(e, sgn(s.vx), 140, true); chip.sfx('smash');
          addScore(e.T.pts + 300, e.x, e.y - e.T.h - 6, true); pop(e.x, e.y - e.T.h - 18, 'RETURN!', '#9fe8ff');
          break;
        }
      }
      const b = game.boss;
      if (!s.gone && b && !b.dead && b.hittable() && b.shotHit && b.shotHit(s)) s.gone = true;
    }
  }
  game.shots = game.shots.filter((s) => !s.gone);
}

/* ==== hazards: falling vases, fire vents, spirit wisps, lightning ======================= */
function hazHitBox(z) {
  if (z.k === 'vase' && z.st === 'fall') return box(z.x - 6, z.y - 16, z.x + 6, z.y);
  if (z.k === 'wisp') return box(z.x - 6, z.y - 6, z.x + 6, z.y + 6);
  return null;
}
function hazHurtBox(z) {
  if (z.k === 'vase' && z.st === 'fall' && z.y > GROUND_Y - 60) return box(z.x - 5, z.y - 14, z.x + 5, z.y);
  if (z.k === 'vent' && z.st === 'burst') return box(z.x - 11, GROUND_Y - 50, z.x + 11, GROUND_Y);
  if (z.k === 'wisp') return box(z.x - 4, z.y - 4, z.x + 4, z.y + 4);
  if (z.k === 'bolt' && z.st === 'strike' && z.t < 0.18) return box(z.x - 10, HUD_H, z.x + 10, GROUND_Y);
  return null;
}

function hitHazard(z, h) {
  if (z.k === 'vase') {
    breakVase(z, true);
    addScore(300, z.x, z.y - 20, false);
    pop(z.x, z.y - 30, 'NICE CATCH!', '#ffd27a');
    grantChi(h, 8);
    return true;
  }
  if (z.k === 'wisp') {
    popWisp(z);
    addScore(300, z.x, z.y - 10, true);
    grantChi(h, 6);
    return true;
  }
  return false;
}

function popWisp(z) { z.gone = true; chip.sfx('wisp'); sparks(z.x, z.y, 8, '#9fe8ff'); fxAdd({ k: 'ring', x: z.x, y: z.y + 6, t: 0, life: 0.25, r0: 2, r1: 12, col: '#9fe8ff' }); }

function spawnVase(x) {
  game.haz.push({ k: 'vase', x, y: HUD_H + 22, vy: 0, st: 'wobble', t: 0, kind: chance(0.5) ? 1 : 0, dmg: 3 });
  chip.sfx('rattle');
}

function breakVase(z, midair) {
  z.gone = true;
  chip.sfx('shatter');
  const c = z.kind ? ['#e8eef4', '#2f5fae'] : ['#c0452a', '#f2c94c'];
  for (let i = 0; i < 10; i++) fxAdd({ k: 'shard', x: z.x, y: z.y - 8, vx: rand(-90, 90), vy: rand(-180, -60), t: 0, life: 0.9, col: c[i % 2] });
  if (midair) { dropItem(pickWeighted({ bun: 4, scroll: 3, coin: 3, peach: game.floorIdx >= 1 ? 0.6 : 0 }), z.x, z.y - 8); return; }
  const r = Math.random();
  if (r < 0.5) { const e = spawnFoe('snake', z.x, sgn(game.hero.x - z.x) || 1); e.cd = 0.5; chip.sfx('hiss'); }
  else if (r < 0.72) dropItem(pickWeighted({ bun: 5, scroll: 3, coin: 4 }), z.x, z.y - 8);
}

function pickWeighted(mix) {
  const keys = Object.keys(mix), total = keys.reduce((a, k) => a + mix[k], 0);
  let r = Math.random() * total;
  for (const k of keys) { r -= mix[k]; if (r <= 0) return k; }
  return keys[0];
}

function updateHazards(dt) {
  const F = game.F, h = game.hero;
  // scheduled hazard spawns while walking the hall
  if (game.state === 'play' && !game.bossSeq && !h.dead) {
    game.hazT -= dt * game.diff.spawn;
    if (game.hazT <= 0) {
      if (F.hazard === 'vases') { game.hazT = rand(2.2, 3.8); spawnVase(clamp(h.x + F.dir * rand(14, 80), game.camX + 20, game.camX + W - 20)); }
      else if (F.hazard === 'wisps') { game.hazT = rand(3.4, 5.6); const side = chance(0.72) ? F.dir : -F.dir; game.haz.push({ k: 'wisp', x: side > 0 ? game.camX + W + 10 : game.camX - 10, y: GROUND_Y - 31, by: GROUND_Y - 31, vx: -side * 36, t: 0, ph: rand(0, TAU), dmg: 3 }); }
      else if (F.hazard === 'bolts') { game.hazT = rand(3.0, 5.2); game.haz.push({ k: 'bolt', x: clamp(h.x + rand(-26, 50) * F.dir, game.camX + 16, game.camX + W - 16), st: 'warn', t: 0, dmg: 6, knock: true }); chip.sfx('crackle'); }
      else game.hazT = 99;
    }
  }
  for (const z of game.haz) {
    z.t += dt;
    if (z.k === 'vase') {
      if (z.st === 'wobble') { if (z.t > 0.55) { z.st = 'fall'; z.t = 0; } }
      else { z.vy += 420 * dt; z.y += z.vy * dt; if (z.y >= GROUND_Y) { z.y = GROUND_Y; breakVase(z, false); } }
    } else if (z.k === 'vent') {
      const cyc = (game.time + z.off) % 4.6;
      const st = cyc < 2.7 ? 'idle' : cyc < 3.55 ? 'warn' : 'burst';
      if (st !== z.st) {
        z.st = st;
        if (st === 'warn' && onScreen(z.x, 40)) chip.sfx('sizzle');
        if (st === 'burst' && onScreen(z.x, 40)) chip.sfx('fire');
      }
      if (z.st === 'burst') {
        if (Math.random() < 0.6) fxAdd({ k: 'flame', x: z.x + rand(-8, 8), y: GROUND_Y - 4, vx: rand(-10, 10), vy: rand(-140, -90), t: 0, life: rand(0.25, 0.45) });
        for (const e of game.foes) {
          if (foeAlive(e) && Math.abs(e.x - z.x) < 13 && e.y > GROUND_Y - 50) {
            killFoe(e, sgn(e.x - z.x) || 1, 90, true); chip.sfx('down');
            addScore(300, e.x, e.y - 48, true); pop(e.x, e.y - 58, 'SCORCHED!', '#ff9a30');
          }
        }
      } else if (z.st === 'warn' && Math.random() < 0.3) fxAdd({ k: 'steam', x: z.x + rand(-8, 8), y: GROUND_Y - 2, vx: rand(-6, 6), vy: rand(-40, -20), t: 0, life: 0.6 });
    } else if (z.k === 'wisp') {
      z.x += z.vx * dt;
      const toward = sgn(h.x - z.x);
      if (toward && Math.abs(h.x - z.x) > 30) z.vx = approach(z.vx, toward * 36, 30 * dt);
      z.y = z.by + Math.sin(z.t * 3 + z.ph) * 7;
      if (z.x < game.camX - 40 || z.x > game.camX + W + 40 || z.t > 14) z.gone = true;
    } else if (z.k === 'bolt') {
      if (z.st === 'warn' && z.t > 1.05 * game.diff.tele) {
        z.st = 'strike'; z.t = 0; chip.sfx('thunder'); game.flashT = 0.1; addShake(4);
        for (const e of game.foes) if (foeAlive(e) && Math.abs(e.x - z.x) < 12) { killFoe(e, sgn(e.x - z.x) || 1, 90, true); addScore(300, e.x, e.y - 48, true); pop(e.x, e.y - 58, 'ZAPPED!', '#9fe8ff'); }
      } else if (z.st === 'strike' && z.t > 0.5) z.gone = true;
    }
  }
  game.haz = game.haz.filter((z) => !z.gone);
}

/* ==== pickups ======================================================================= */
const ITEM_FX = {
  bun: (h) => { h.hp = Math.min(MAX_HP, h.hp + 8); return '+8 HEALTH'; },
  scroll: (h) => { grantChi(h, 35 / h.S.chiGain); return '+CHI'; },
  coin: () => { addScore(1000, game.hero.x, game.hero.y - 50, false, true); return '1000'; },
  peach: (h) => { h.hp = MAX_HP; if (!game.demo) game.lives = Math.min(9, game.lives + 1); return '1UP + FULL HEALTH'; }
};
function dropItem(type, x, y) { game.items.push({ type, x, y, vy: -120, t: 0, ground: false }); }
function updateItems(dt) {
  const h = game.hero;
  for (const it of game.items) {
    it.t += dt;
    if (!it.ground) { it.vy += GRAV * 0.7 * dt; it.y += it.vy * dt; if (it.y >= GROUND_Y - 2) { it.y = GROUND_Y - 2; if (it.vy > 80) it.vy = -it.vy * 0.35; else { it.ground = true; it.vy = 0; } } }
    if (h && !h.dead && Math.abs(h.x - it.x) < 11 && h.y > it.y - 40 && it.t > 0.25) {
      it.gone = true;
      const label = ITEM_FX[it.type](h);
      chip.sfx(it.type === 'peach' ? 'oneup' : 'pickup');
      pop(it.x, it.y - 18, label, PICKUPS[it.type].color);
      game.stageStats.items++;
    }
    if (it.t > 9) it.gone = true;
  }
  game.items = game.items.filter((i) => !i.gone);
}

/* ==== effects ======================================================================== */
function fxAdd(f) { if (game.fx.length < 260) game.fx.push(f); }
function sparks(x, y, n, col) { for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(60, 160); fxAdd({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rand(0.15, 0.3), col }); } }
function hitSpark(x, y, big) { fxAdd({ k: 'star', x, y, t: 0, life: big ? 0.16 : 0.1, big }); sparks(x, y, big ? 8 : 4, big ? '#ffd27a' : '#ffffff'); }
function dust(x, y, n) { for (let i = 0; i < n; i++) fxAdd({ k: 'dust', x: x + rand(-6, 6), y: y - 1, vx: rand(-20, 20), vy: rand(-14, -4), t: 0, life: rand(0.3, 0.5) }); }
function smoke(x, y, n) { for (let i = 0; i < n; i++) fxAdd({ k: 'smoke', x: x + rand(-8, 8), y: y + rand(-14, 14), vx: rand(-16, 16), vy: rand(-20, 4), t: 0, life: rand(0.4, 0.65), r: rand(4, 8) }); }
function addShake(n) { if (settings.shake) game.shake = Math.max(game.shake, n); }
function pop(x, y, s, col) { game.pops.push({ x, y, s, col, t: 0 }); }
function onScreen(x, m) { return x > game.camX - (m || 0) && x < game.camX + W + (m || 0); }

function updateFx(dt) {
  for (const f of game.fx) {
    f.t += dt;
    if (f.k === 'chiP') { const p = Math.min(1, f.t / f.life); f.cx = lerp(f.x, f.tx, p * p); f.cy = lerp(f.y, f.ty, p * p); }
    else if (f.k === 'shard') { f.vy += GRAV * dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.y > GROUND_Y + 2) { f.y = GROUND_Y + 2; f.vy *= -0.3; f.vx *= 0.6; } }
    else if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; if (f.k === 'spark') { f.vx *= 0.9; f.vy *= 0.9; } }
  }
  game.fx = game.fx.filter((f) => f.t < f.life);
  for (const p of game.pops) p.t += dt;
  game.pops = game.pops.filter((p) => p.t < 1.1);
}

/* ==== drawing ========================================================================= */
function drawShadow(g, x, y, w, cx) {
  const lift = clamp((GROUND_Y - y) / 60, 0, 0.8);
  const ww = w * 2.5 * (1 - lift * 0.45);
  g.globalAlpha = 0.9 * (1 - lift * 0.6);
  g.drawImage(shadowSprite(), x - cx - ww / 2, GROUND_Y - 2.6, ww, 5.2);
  g.globalAlpha = 1;
}

/** Which animation and (fractional) frame the hero shows right now. */
function heroPose(h) {
  if (h.pose) return h.pose;
  if (h.dead) return ['dead', h.ground ? 2 : clamp(h.deadT / 0.25, 0, 1.6)];
  if (h.hurtT > 0) return h.ground ? ['hurt', 0] : ['dead', 0];
  if (h.grabbers.length) return ['grabbed', h.wig > 0 ? 1 : (game.t * 3) % 2];
  if (h.flexT > 0) return ['flex', 0];
  const a = h.act;
  if (a) {
    if (a.k === 'chi') return ['chi', a.t < 0.32 ? (a.t / 0.32) * 0.99 : 1];
    const D = ATK[a.k];
    if (D.air) return [D.anim, Math.min(1, a.t / D.a0)];
    const q = h.S.quick, a0 = D.a0 * q, a1 = (D.a1 + 0.05) * q, dur = D.dur * q;
    if (a.t < a0) return [D.anim, a.t / a0];
    if (a.t < a1) return [D.anim, 1];
    return [D.anim, 1 + Math.min(0.999, (a.t - a1) / Math.max(0.01, dur - a1))];
  }
  if (!h.ground) return [h.vy < 0 ? 'jumpUp' : 'jumpDown', 0];
  if (h.crouch) return ['crouch', 0];
  if (Math.abs(h.vx) > 1) return ['walk', (h.runT / 6) % 8];
  return ['idle', (game.t * 1.1) % 2];
}

const TRAIL_LIMB = { punch: 'handF', punch2: 'handB', crouchPunch: 'handF', jumpPunch: 'handF', kick: 'footF', highKick: 'footF', sweep: 'footF', jumpKick: 'footF' };

function drawHero(g, h, cx) {
  const [anim, fr] = heroPose(h);
  const blinkOff = h.inv > 0 && !h.dead && !h.pose && Math.floor(game.t * 20) % 2 === 0;
  if (h.chi >= MAX_CHI && !h.dead) {
    drawGlow(g, h.x - cx, h.y - 22, 30 + Math.sin(game.t * 8) * 3, '#ffd84a', 0.55);
    for (let i = 0; i < 3; i++) { const a = game.t * 3 + i * 2.1; disc(g, h.x - cx + Math.cos(a) * 11, h.y - 24 + Math.sin(a * 1.3) * 16, 0.8, '#fff2a0'); }
  }
  // motion trail behind the striking hand or foot
  h.trail = h.trail || [];
  const limb = TRAIL_LIMB[anim];
  if (limb && fr > 0.5 && fr < 1.6 && !h.dead) {
    const J = fighterJoints(h.kind, anim, fr, h.face, h.x, h.y);
    h.trail.push({ x: J[limb][0], y: J[limb][1], t: game.t });
  }
  h.trail = h.trail.filter((p) => game.t - p.t < 0.11);
  if (h.trail.length > 1) {
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let i = 1; i < h.trail.length; i++) {
      const p0 = h.trail[i - 1], p1 = h.trail[i], a = i / h.trail.length;
      stampLine(g, p0.x - cx, p0.y, p1.x - cx, p1.y, 1 + a * 3.4, 'rgba(255,240,200,' + (0.18 + a * 0.35) + ')');
    }
    g.restore();
  }
  if (!blinkOff) drawSprite(g, h.kind, anim, fr, h.face, h.x - cx, h.y, h.flash > 0 ? '#ff5a4a' : false);
  if (h.grabbers.length && !h.dead) {
    const need = h.escNeed || 5, p = clamp(h.escape / need, 0, 1);
    const x = h.x - cx, y = h.y - 64;
    rrect(g, x - 17, y + 11, 34, 5, 2.5, 'rgba(10,6,10,0.85)');
    g.fillStyle = lgrad(g, x - 16, 0, x + 16, 0, [[0, '#5ef0c0'], [1, '#9fe8ff']]);
    roundRectPath(g, x - 16, y + 12, Math.max(3, 32 * p), 3, 1.5); g.fill();
    const pulse = 1 + Math.sin(game.t * 18) * 0.06;
    g.save(); g.translate(x, y + 4); g.scale(pulse, pulse);
    T(g, input.usingTouch ? 'TAP FAST!' : 'MASH ← →', 0, -4, '#ffffff', { align: 'center', stroke: '#1a0a10', strokeW: 2.2, weight: 700 });
    g.restore();
  }
}

function foePose(e) {
  switch (e.st) {
    case 'dead': return ['dead', e.ground ? 2 : clamp(e.t / 0.25, 0, 1.6)];
    case 'hurt': return ['hurt', 0];
    case 'trip': return ['dead', e.t < 0.12 ? e.t / 0.12 : e.t < 0.55 ? 2 : 1];
    default: break;
  }
  const walkF = (e.walkT / 6) % 8, idleF = (game.t + e.id * 0.37) % 2;
  switch (e.kind) {
    case 'thug':
      if (e.st === 'grab') return ['grab', (game.t * 5) % 2];
      return Math.abs(e.vx) > 1 ? ['walk', walkF] : ['idle', idleF];
    case 'dagger':
      if (e.st === 'aim') return [e.high ? 'throwHigh' : 'throwLow', 0];
      if (e.st === 'throw') return [e.high ? 'throwHigh' : 'throwLow', Math.min(1, e.t / 0.07)];
      return Math.abs(e.vx) > 1 ? ['walk', walkF] : ['idle', idleF];
    case 'monk':
      if (e.st === 'bash') return ['bash', e.t < e.wind ? 0 : Math.min(1, (e.t - e.wind) / 0.07)];
      if (e.st === 'block') return ['block', 0];
      return Math.abs(e.vx) > 1 ? ['walk', walkF] : ['idle', idleF];
    case 'ninja':
      if (e.st === 'slash') return ['slash', Math.min(2, e.t / 0.12)];
      if (e.st === 'dash') return ['walk', (e.walkT / 7) % 8];
      if (e.st === 'ready' || e.st === 'appear' || e.st === 'vanish') return ['idle', 0];
      return Math.abs(e.vx) > 1 ? ['walk', walkF] : ['idle', idleF];
    default: return ['idle', 0];
  }
}

function drawFoe(g, e, cx) {
  const x = e.x - cx;
  if (x < -50 || x > W + 50) return;
  const fade = e.st === 'dead' && e.t > 0.9 ? (Math.floor(e.t * 20) % 2 ? 0.25 : 0.9) : e.alpha;
  if (e.kind === 'monkey') {
    let fr = (e.walkT / 8) % 4;
    if (e.st === 'leap' || e.st === 'flee') fr = 4;
    if (e.st === 'dead' || e.st === 'trip') fr = 5;
    drawMonkey(g, x, e.y, e.face, fr, e.flash > 0, fade);
    return;
  }
  if (e.kind === 'snake') { drawSnake(g, x, e.y, e.face, e.st === 'strike' && e.t > 0.15 ? 2 : 0, fade); return; }
  const [anim, fr] = foePose(e);
  drawSprite(g, e.kind, anim, fr, e.face, x, e.y, e.flash > 0 ? true : false, fade);
  let gl = null;
  if (e.kind === 'dagger' && e.st === 'aim' && e.t > 0.55 * game.diff.tele - 0.28) gl = [x - e.face * 4, e.y - (e.high ? 52 : 20)];
  if (e.kind === 'monk' && e.st === 'bash' && e.t < e.wind && e.t > e.wind - 0.28) gl = [x + e.face * 12, e.y - 30];
  if (e.kind === 'ninja' && e.st === 'ready' && e.t > 0.2) gl = [x + e.face * 14, e.y - 30];
  if (gl) drawGlint(g, gl[0], gl[1]);
  if (e.kind === 'monk' && e.st === 'hurt' && e.stun > 1) drawDizzy(g, x, e.y - 52);
}

/** The white star that warns an attack is coming. */
function drawGlint(g, x, y) {
  const s = 4.5 + Math.sin(game.t * 30) * 1.2;
  drawGlow(g, x, y, 10, '#ffffff', 0.8);
  g.fillStyle = '#ffffff';
  g.beginPath();
  g.moveTo(x, y - s * 1.5); g.lineTo(x + s * 0.28, y - s * 0.28); g.lineTo(x + s * 1.5, y); g.lineTo(x + s * 0.28, y + s * 0.28);
  g.lineTo(x, y + s * 1.5); g.lineTo(x - s * 0.28, y + s * 0.28); g.lineTo(x - s * 1.5, y); g.lineTo(x - s * 0.28, y - s * 0.28);
  g.closePath(); g.fill();
}
function drawDizzy(g, x, y) {
  for (let i = 0; i < 3; i++) {
    const a = game.t * 6 + i * TAU / 3, px = x + Math.cos(a) * 9, py = y + Math.sin(a) * 3;
    drawGlow(g, px, py, 4, '#ffd27a', 0.6);
    g.fillStyle = '#ffe08a'; g.beginPath();
    for (let k = 0; k < 10; k++) { const r = k % 2 ? 0.9 : 2.2, t = (k / 10) * TAU - Math.PI / 2; g.lineTo(px + Math.cos(t) * r, py + Math.sin(t) * r); }
    g.closePath(); g.fill();
  }
}

function flameTongue(g, x, base, w, h, ph, a) {
  g.save(); g.globalCompositeOperation = 'lighter';
  g.fillStyle = lgrad(g, 0, base - h, 0, base, [[0, 'rgba(255,90,30,0)'], [0.35, 'rgba(255,120,40,' + 0.75 * a + ')'], [0.8, 'rgba(255,220,120,' + 0.9 * a + ')'], [1, 'rgba(255,255,220,' + a + ')']]);
  g.beginPath();
  g.moveTo(x - w / 2, base);
  g.quadraticCurveTo(x - w * 0.6, base - h * 0.5, x + Math.sin(ph) * w * 0.3, base - h);
  g.quadraticCurveTo(x + w * 0.6, base - h * 0.5, x + w / 2, base);
  g.closePath(); g.fill();
  g.restore();
}

function drawShot(g, s, cx) {
  const x = s.x - cx, y = s.y;
  switch (s.k) {
    case 'knife': drawKnifeShot(g, x, y, sgn(s.vx) || 1, s.deflected); break;
    case 'fan': drawFanShot(g, x, y, s.t); break;
    case 'tal': drawTalismanShot(g, x, y, s.t); break;
    case 'orb': {
      const foe = s.foe, c1 = foe ? '#c04aff' : '#4affd0';
      drawGlow(g, x, y, 18, c1, 0.9);
      g.fillStyle = rgrad(g, x - 1.5, y - 1.5, 0.3, 6.5, [[0, '#ffffff'], [0.35, foe ? '#e8b0ff' : '#b0ffe8'], [1, foe ? '#6a1ab0' : '#14a080']]);
      g.beginPath(); g.arc(x, y, 6, 0, TAU); g.fill();
      for (let i = 0; i < 3; i++) { const a = s.t * 14 + i * 2.1; disc(g, x + Math.cos(a) * 7, y + Math.sin(a) * 7, 0.9, foe ? '#f0d0ff' : '#d0fff0'); }
      break;
    }
    case 'shock': {
      const dir = sgn(s.vx) || 1;
      g.fillStyle = lgrad(g, 0, GROUND_Y - 14, 0, GROUND_Y, [[0, 'rgba(240,226,200,0)'], [1, 'rgba(240,226,200,0.85)']]);
      g.beginPath(); g.moveTo(x - 9 * dir, GROUND_Y); g.quadraticCurveTo(x - 2 * dir, GROUND_Y - 14 - Math.sin(s.t * 30) * 2, x + 6 * dir, GROUND_Y); g.closePath(); g.fill();
      for (let i = 0; i < 4; i++) disc(g, x - dir * (3 + i * 3), GROUND_Y - 2 - (i % 2) * 2, 1.6 - i * 0.25, 'rgba(216,200,176,0.7)');
      break;
    }
    case 'fire': {
      drawGlow(g, x, GROUND_Y - 10, 26, '#ff6a1a', 0.9);
      for (let i = 0; i < 5; i++) flameTongue(g, x - 8 + i * 4, GROUND_Y, 6, 12 + ((i * 7 + Math.floor(s.t * 30)) % 9), s.t * 20 + i, 1);
      break;
    }
    case 'wave': drawWave(g, s, cx); break;
    default: break;
  }
}

function drawWave(g, s, cx) {
  const dir = sgn(s.vx) || 1, tr = s.trail;
  for (let i = tr.length - 1; i >= 0; i -= 2) drawGlow(g, tr[i].x - cx, tr[i].y, 20 - i * 0.6, i % 4 ? '#2ab89a' : '#ffd84a', 0.55);
  for (let i = tr.length - 1; i >= 1; i--) {
    const p = tr[i], r = Math.max(2, 8.2 - i * 0.4), px = p.x - cx;
    disc(g, px, p.y, r + 0.7, '#5a3a08');
    g.fillStyle = rgrad(g, px - r * 0.3, p.y - r * 0.4, 0.2, r * 1.1, i % 3 === 0 ? [[0, '#c0fff0'], [1, '#1ea888']] : [[0, '#fff6c0'], [0.6, '#ffd84a'], [1, '#c08a10']]);
    g.beginPath(); g.arc(px, p.y, r, 0, TAU); g.fill();
    if (i % 2 === 0) poly(g, [px - 1.5, p.y - r, px + dir * 0.5, p.y - r - 3.5, px + 1.5 * dir, p.y - r], '#5ef0c0');
  }
  const hy = tr.length ? tr[0].y : GROUND_Y - 26;
  drawDragonHead(g, s.x - cx + dir * 6, hy, dir, 1.05);
}

function drawHaz(g, z, cx) {
  const x = z.x - cx;
  if (z.k === 'vase') {
    const wob = z.st === 'wobble' ? Math.sin(z.t * 40) * 0.8 : 0;
    const p = clamp((z.y - HUD_H) / (GROUND_Y - HUD_H), 0, 1);
    g.globalAlpha = 0.3 + p * 0.6; g.drawImage(shadowSprite(), x - 4 - p * 6, GROUND_Y - 2, 8 + p * 12, 4); g.globalAlpha = 1;
    g.save(); g.translate(x + wob, z.y); g.rotate(wob * 0.08); drawVase(g, 0, 0, z.kind, 0.95); g.restore();
  } else if (z.k === 'vent') {
    if (z.st === 'warn') {
      const a = 0.5 + 0.4 * Math.sin(game.t * 20);
      drawGlow(g, x, GROUND_Y - 2, 22, '#ff5a1a', a);
      rrect(g, x - 13, GROUND_Y - 2.2, 26, 3, 1, 'rgba(255,140,60,' + a * 0.8 + ')');
    } else if (z.st === 'burst') {
      drawGlow(g, x, GROUND_Y - 26, 56, '#ff6a1a', 0.95);
      for (let i = 0; i < 6; i++) flameTongue(g, x - 9 + i * 3.6, GROUND_Y, 8, 36 + ((i * 13 + Math.floor(game.t * 40)) % 18), game.t * 25 + i, 1);
      flameTongue(g, x, GROUND_Y, 7, 30, game.t * 30, 1);
    }
  } else if (z.k === 'wisp') {
    const y = z.y;
    drawGlow(g, x, y, 16, '#5ab0ff', 0.9);
    g.fillStyle = rgrad(g, x - 1, y - 1, 0.3, 6, [[0, '#ffffff'], [0.4, '#b8ecff'], [1, 'rgba(90,170,255,0.2)']]);
    g.beginPath(); g.moveTo(x - 4.5, y + 1.5);
    g.quadraticCurveTo(x - 4, y - 6, x + Math.sin(z.t * 10) * 1.5, y - 10);
    g.quadraticCurveTo(x + 4, y - 6, x + 4.5, y + 1.5);
    g.quadraticCurveTo(x, y + 6, x - 4.5, y + 1.5); g.fill();
    ellipse(g, x - 1.5, y - 0.5, 0.6, 1.1, 0, '#1a2a5a'); ellipse(g, x + 1.5, y - 0.5, 0.6, 1.1, 0, '#1a2a5a');
  } else if (z.k === 'bolt') {
    if (z.st === 'warn') {
      const p = (z.t * 2) % 1;
      g.strokeStyle = 'rgba(159,232,255,' + (0.9 - p * 0.7) + ')'; g.lineWidth = 1.2;
      g.beginPath(); g.ellipse(x, GROUND_Y, 6 + p * 10, 2 + p * 2.5, 0, 0, TAU); g.stroke();
      drawGlow(g, x, GROUND_Y - 2, 12, '#9fe8ff', 0.5 + 0.3 * Math.sin(z.t * 25));
      if (Math.random() < 0.5) stampLine(g, x + rand(-6, 6), GROUND_Y - rand(3, 14), x + rand(-6, 6), GROUND_Y, 0.5, '#d8f6ff');
    } else if (z.t < 0.22) {
      let px0 = x, py = HUD_H;
      const pts = [[px0, py]];
      while (py < GROUND_Y) { px0 = x + rand(-7, 7); py = Math.min(GROUND_Y, py + rand(8, 16)); pts.push([px0, py]); }
      g.save(); g.globalCompositeOperation = 'lighter'; g.lineJoin = 'round'; g.lineCap = 'round';
      for (const [w, c] of [[6, 'rgba(120,190,255,0.35)'], [2.6, 'rgba(180,230,255,0.9)'], [1, '#ffffff']]) {
        g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const q of pts) g.lineTo(q[0], q[1]); g.stroke();
      }
      g.restore();
      drawGlow(g, x, GROUND_Y - 10, 40, '#9fe8ff', 1);
    } else { g.globalAlpha = 0.5; ellipse(g, x, GROUND_Y, 7, 1.6, 0, '#100c10'); g.globalAlpha = 1; }
  }
}

function drawItem(g, it, cx) {
  const x = it.x - cx, y = it.y;
  if (it.t > 7 && Math.floor(it.t * 10) % 2) return;
  const bob = it.ground ? Math.sin(it.t * 4) * 1.2 : 0;
  drawGlow(g, x, y - 7 + bob, 14, PICKUPS[it.type].color, 0.75);
  drawPickup(g, it.type, x, y - 7 + bob, 1.0);
  if (it.ground) { const a = it.t * 3; disc(g, x + Math.cos(a) * 7, y - 7 + Math.sin(a) * 3, 0.6, '#ffffff'); }
}

function drawFx(g, cx) {
  for (const f of game.fx) {
    const p = f.t / f.life;
    const x = (f.cx !== undefined ? f.cx : f.x) - cx, y = f.cy !== undefined ? f.cy : f.y;
    switch (f.k) {
      case 'spark': {
        const sp = Math.hypot(f.vx, f.vy) || 1, len = 2 + sp * 0.025;
        g.save(); g.globalCompositeOperation = 'lighter';
        stampLine(g, x, y, x - (f.vx / sp) * len, y - (f.vy / sp) * len, 1.1 * (1 - p) + 0.3, f.col || '#ffffff');
        g.restore();
        break;
      }
      case 'star': {
        const r = (f.big ? 11 : 7) * (0.6 + p * 0.6), a = 1 - p;
        drawGlow(g, x, y, r * 1.8, f.big ? '#ffd27a' : '#ffffff', a);
        g.globalAlpha = a; g.fillStyle = '#ffffff';
        g.beginPath();
        for (let k = 0; k < 8; k++) { const rr = k % 2 ? r * 0.22 : r, t = (k / 8) * TAU + 0.4; g.lineTo(x + Math.cos(t) * rr, y + Math.sin(t) * rr); }
        g.closePath(); g.fill(); g.globalAlpha = 1;
        break;
      }
      case 'dust': g.globalAlpha = 0.45 * (1 - p); disc(g, x, y, 2 + p * 4, '#d8c8b0'); g.globalAlpha = 1; break;
      case 'smoke': g.globalAlpha = 0.7 * (1 - p); disc(g, x, y, f.r * (0.6 + p * 0.9), p < 0.4 ? '#cac6dc' : '#8a86a0'); g.globalAlpha = 1; break;
      case 'shard': {
        g.save(); g.translate(x, y); g.rotate(f.t * 14 + f.vx);
        poly(g, [-1.4, -0.8, 1.6, -0.2, -0.4, 1.2], f.col); g.restore();
        break;
      }
      case 'ring': { g.globalAlpha = 1 - p; ring(g, x, y, lerp(f.r0, f.r1, p), 1.2, f.col); g.globalAlpha = 1; break; }
      case 'chiP': drawGlow(g, x, y, 4, Math.floor(f.t * 30) % 2 ? '#ffd84a' : '#5ef0c0', 0.9); disc(g, x, y, 0.8, '#ffffff'); break;
      case 'flame': {
        const c = p < 0.3 ? '#fff2b0' : p < 0.6 ? '#ffb02a' : '#ff5a1a';
        drawGlow(g, x, y, 4, '#ff7a2a', 1 - p);
        disc(g, x, y, 1.6 * (1 - p) + 0.4, c);
        break;
      }
      case 'steam': g.globalAlpha = 0.45 * (1 - p); disc(g, x, y, 2 + p * 5, '#ece4e4'); g.globalAlpha = 1; break;
      default: break;
    }
  }
}

function drawPops(g, cx) {
  for (const p of game.pops) {
    const y = p.y - p.t * 22, x = p.x - cx;
    if (p.t > 0.8 && Math.floor(p.t * 20) % 2) continue;
    const w = textWidth(p.s);
    const sc = p.t < 0.08 ? 1 + (0.08 - p.t) * 5 : 1;
    g.save(); g.translate(clamp(x, w / 2 + 3, W - w / 2 - 3), Math.max(HUD_H + 3, y)); g.scale(sc, sc);
    T(g, p.s, 0, 0, p.col, { align: 'center', stroke: '#140a10', strokeW: 2, weight: 700 });
    g.restore();
  }
}

/* ==========================================================================
   Floor guardians: five bosses with telegraphed, two-phase patterns
   ========================================================================== */

const BOSS_DEFS = {
  fan: { name: 'CRIMSON FAN', title: 'MISTRESS OF THE LANTERN HALL', hp: 22, pts: 10000, w: 7, h: 44 },
  spear: { name: 'JADE SPEAR', title: 'GENERAL OF THE DRUM GALLERY', hp: 24, pts: 15000, w: 8, h: 48 },
  ox: { name: 'IRON OX', title: 'MASTER OF THE FORGE', hp: 32, pts: 20000, w: 14, h: 66 },
  mirror: { name: 'MIRROR MONK', title: 'KEEPER OF THE SHRINE', hp: 24, pts: 25000, w: 8, h: 46 },
  abbot: { name: 'SHADOW ABBOT', title: 'LORD OF THE DRAGON PAGODA', hp: 38, pts: 50000, w: 8, h: 50 }
};

/** How often each guardian blocks a frontal strike while not attacking. */
const BOSS_GUARD = { fan: 0.3, spear: 0.42, ox: 0, mirror: 0, abbot: 0.34 };

function bossSt(b, st) { b.st = st; b.t = 0; b.did = {}; }
function bossOnce(b, key) { if (b.did[key]) return false; b.did[key] = true; return true; }
function bossFace(b) { const d = sgn(game.hero.x - b.x); if (d) b.face = d; }
function bossClamp(b) { b.x = clamp(b.x, game.arena.x0, game.arena.x1); }
function teleT(b, base) { return base * game.diff.tele * (b.phase2 ? 0.82 : 1); }

function makeBoss(kind) {
  const D = BOSS_DEFS[kind], F = game.F;
  const sx = stairX(F);
  const b = {
    kind, D, name: D.name, title: D.title, x: sx + F.dir * 4, y: GROUND_Y - 96, vx: 0, vy: 0, face: -F.dir,
    hp: Math.round(D.hp * game.diff.bossHp), max: Math.round(D.hp * game.diff.bossHp), st: 'enter', t: 0, did: {},
    dead: false, deathT: 0, flash: 0, cd: 1.0, streak: 0, streakT: 0, phase2: false, walkT: 0, fanOut: false, clones: [], aura: 0
  };
  b.max = b.hp;
  b.hittable = () => !b.dead && !['enter', 'vanish', 'gone', 'flip', 'vault', 'vaultWind'].includes(b.st) && !(b.st === 'blink' && b.t < 0.35);
  b.hurtBox = () => {
    if (kind === 'ox' && b.st === 'charge') return box(b.x - 16, b.y - 40, b.x + 16, b.y);
    if (kind === 'fan' && b.st === 'dash') return box(b.x - 8, b.y - 30, b.x + 8, b.y);
    return box(b.x - D.w, b.y - D.h, b.x + D.w, b.y);
  };
  b.strike = (ab, A, h) => bossStrike(b, ab, A, h);
  b.waveHit = (dir) => bossDamage(b, 7, dir, true);
  b.shotHit = (s) => {
    if (!boxHit(shotBox(s), b.hurtBox())) return false;
    hitSpark(b.x, s.y, true);
    bossDamage(b, s.k === 'orb' ? 3 : 2, sgn(s.vx), true);
    pop(b.x, b.y - D.h - 16, 'RETURNED!', '#9fe8ff');
    return true;
  };
  b.touches = (hb) => bossTouches(b, hb);
  b.update = (dt) => bossUpdate(b, dt);
  b.draw = (g, cx, refl) => bossDraw(b, g, cx, refl);
  b.catchFan = () => { b.fanOut = false; };
  if (kind === 'abbot') { b.y = GROUND_Y - 120; }
  return b;
}

/* ---- taking hits -------------------------------------------------------------------- */
function bossStrike(b, ab, A, h) {
  if (b.kind === 'mirror' && b.clones.length) {
    for (const c of b.clones) {
      if (!c.alive) continue;
      if (boxHit(ab, box(c.x - 8, b.y - 46, c.x + 8, b.y))) {
        c.alive = false; chip.sfx('shatter'); sparks(c.x, b.y - 26, 10, '#c4a7ff');
        for (let i = 0; i < 8; i++) fxAdd({ k: 'shard', x: c.x, y: b.y - 26, vx: rand(-80, 80), vy: rand(-160, -40), t: 0, life: 0.8, col: i % 2 ? '#c4a7ff' : '#eef6ff' });
        addScore(100, c.x, b.y - 56, false);
        return 'block';
      }
    }
  }
  if (!boxHit(ab, b.hurtBox())) return null;
  const guard = BOSS_GUARD[b.kind] * (b.phase2 ? 1.25 : 1);
  if (guard && ['idle', 'land', 'taunt', 'guard'].includes(b.st) && sgn(h.x - b.x) === b.face && b.y >= GROUND_Y && chance(guard)) {
    bossSt(b, 'guard'); b.cd = 0;
    chip.sfx('clang');
    sparks(b.x + b.face * 8, clamp((ab.y0 + ab.y1) / 2, b.y - b.D.h, b.y - 6), 6, '#ffe27a');
    h.x -= h.face * 8;
    if (!game.tutGuard) { game.tutGuard = true; pop(b.x, b.y - b.D.h - 14, 'BLOCKED: STRIKE AFTER THEIR ATTACKS', '#ffd27a'); }
    return 'block';
  }
  if (b.kind === 'abbot' && b.st === 'counter') {
    // walked into the counter stance
    bossSt(b, 'riposte'); bossFace(b);
    chip.sfx('counter');
    pop(b.x, b.y - 66, 'COUNTERED!', '#ffd27a');
    game.hitStop = 0.12;
    return 'block';
  }
  let dmg = A.dmg === 'punch' ? h.S.punch : A.dmg === 'kick' ? h.S.kick : 3;
  const hy = clamp((ab.y0 + ab.y1) / 2, b.y - b.D.h + 4, b.y - 4);
  if (b.kind === 'ox') {
    // iron skin: blows glance off unless he is dazed from hitting the wall
    if (b.st === 'stun') dmg *= 1.5;
    else { dmg *= 0.5; sparks(b.x - h.face * 6, hy, 4, '#c9d6e6'); chip.sfx('tink'); if (!game.tutOx) { game.tutOx = true; pop(b.x, b.y - b.D.h - 14, 'IRON SKIN: MAKE HIM CHARGE THE WALL', '#ffd27a'); } }
  }
  hitSpark(b.x - h.face * 5, hy, A.fin);
  chip.sfx(A.fin ? 'smash' : A.dmg === 'punch' ? 'punch' : 'kick');
  bossDamage(b, dmg, h.face, A.fin);
  grantChi(h, 6);
  return 'hit';
}

function bossDamage(b, dmg, dir, heavy) {
  if (b.dead) return;
  b.hp -= dmg; b.flash = 0.07;
  addScore(Math.round(100 * dmg), b.x, b.y - b.D.h - 6, false, true);
  b.streak = b.streakT > 0 ? b.streak + 1 : 1; b.streakT = 1.4;
  if (b.hp <= 0) { bossDie(b, dir); return; }
  if (!b.phase2 && b.hp <= b.max / 2) {
    b.phase2 = true; b.aura = 1.2; chip.sfx('roar'); addShake(5);
    pop(b.x, b.y - b.D.h - 20, 'ENRAGED!', '#ff5a4a');
    if (b.kind === 'mirror' && !b.clones.length) { bossSt(b, 'blink'); return; }
  }
  const armored = b.kind === 'ox' ? b.st !== 'stun' : ['charge', 'dash', 'riposte', 'slam', 'vault', 'leap'].includes(b.st);
  if (!armored && (heavy || ['idle', 'walk', 'cast', 'hurt'].includes(b.st))) {
    bossSt(b, 'hurt'); b.vx = dir * (heavy ? 120 : 60); b.cd = Math.max(b.cd, 0.35);
  }
  if (b.streak >= 3 && b.st !== 'stun' && b.kind !== 'ox') { b.streak = 0; bossEscape(b); }
}

function bossEscape(b) {
  const h = game.hero;
  switch (b.kind) {
    case 'fan': bossSt(b, 'flip'); b.face = sgn(h.x - b.x) || b.face; b.vx = -b.face * 140; b.vy = -260; break;
    case 'spear': bossSt(b, 'vaultWind'); break;
    case 'mirror': bossSt(b, 'blink'); break;
    case 'abbot': bossSt(b, 'counter'); break;
    default: break;
  }
}

function bossDie(b, dir) {
  b.dead = true; b.hp = 0; b.deathT = 0;
  bossSt(b, 'dead');
  b.vx = dir * 70; b.vy = -180; b.y = Math.min(b.y, GROUND_Y);
  b.clones = []; b.fanOut = false;
  for (const s of game.shots) if (s.foe) s.gone = true;
  onBossDown(b);
}

/* ---- dealing hits ------------------------------------------------------------------------ */
function bossTouches(b, hb) {
  const k = b.kind, st = b.st, t = b.t;
  const F = (n, f, lo, hi) => front(b, n, f, lo, hi);
  let hit = null;
  if (k === 'fan') {
    if (st === 'dash') hit = { b: box(b.x - 9, b.y - 30, b.x + 9, b.y), dmg: 5, knock: true };
    if (st === 'slash' && t > b.wind && t < b.wind + 0.12) hit = { b: F(2, 30, 8, 42), dmg: 5 };
  } else if (k === 'spear') {
    if ((st === 'thrustH' || st === 'thrustL') && t > b.wind && t < b.wind + 0.13) hit = { b: F(8, 56, st === 'thrustH' ? 25 : 0, st === 'thrustH' ? 41 : 12), dmg: 5 };
    if (st === 'spin' && t > b.wind && t < b.wind + 0.16) hit = { b: box(b.x - 44, b.y - 12, b.x + 44, b.y), dmg: 5, knock: true };
    if (st === 'vault' && b.vy > 0) hit = { b: box(b.x - 9, b.y - 30, b.x + 9, b.y), dmg: 4 };
  } else if (k === 'ox') {
    if (st === 'charge') hit = { b: box(b.x - 15, b.y - 36, b.x + 15, b.y), dmg: 6, knock: true };
    if (st === 'grab' && t > b.wind && t < b.wind + 0.14) hit = { b: F(2, 28, 10, 52), dmg: 6, knock: true };
    if (st === 'slam' && t < 0.1) hit = { b: F(0, 30, 0, 26), dmg: 5, knock: true };
  } else if (k === 'mirror') {
    if (st === 'palm' && t > b.wind && t < b.wind + 0.12) hit = { b: F(2, 28, 10, 42), dmg: 5, knock: true };
  } else if (k === 'abbot') {
    if (st === 'riposte' && t > 0.08 && t < 0.24) hit = { b: F(0, 34, 6, 46), dmg: 7, knock: true };
    if (st === 'palm' && t > b.wind && Math.floor((t - b.wind) / 0.2) < 3 && (t - b.wind) % 0.2 < 0.08) hit = { b: F(2, 28, 12, 42), dmg: 4 };
    if (st === 'leap' && b.vy > -40) hit = { b: F(-4, 26, 8, 40), dmg: 6, knock: true };
  }
  if (hit && boxHit(hit.b, hb)) return { dmg: hit.dmg, knock: hit.knock, dir: sgn(game.hero.x - b.x) || b.face };
  return null;
}

/* ---- per-frame brains --------------------------------------------------------------------- */
function bossPhys(b, dt, grav) {
  b.x += b.vx * dt;
  if (b.y < GROUND_Y || b.vy < 0) {
    b.vy += (grav || GRAV) * dt; b.y += b.vy * dt;
    if (b.y >= GROUND_Y) { b.y = GROUND_Y; b.vy = 0; return true; }
  }
  return false;
}

function bossUpdate(b, dt) {
  b.t += dt;
  b.flash = Math.max(0, b.flash - dt);
  b.streakT -= dt;
  b.aura = Math.max(0, b.aura - dt);
  b.cd -= dt;
  const h = game.hero;
  if (b.st === 'dead') {
    b.deathT += dt;
    if (bossPhys(b, dt)) { b.vx = 0; dust(b.x, b.y, 6); chip.sfx('thud'); addShake(4); }
    if (b.y >= GROUND_Y) b.vx = approach(b.vx, 0, 300 * dt);
    return;
  }
  if (b.st === 'enter') { bossEnter(b, dt); return; }
  if (b.st === 'hurt') {
    b.x += b.vx * dt; b.vx = approach(b.vx, 0, 500 * dt); bossClamp(b);
    if (b.y < GROUND_Y) bossPhys(b, dt);
    if (b.t > 0.22) bossSt(b, 'idle');
    return;
  }
  if (b.st === 'guard') { b.vx = 0; bossFace(b); if (b.t > 0.3) { bossSt(b, 'idle'); b.cd = 0; } return; }
  if (h.dead) { if (b.y < GROUND_Y) bossPhys(b, dt); b.vx = 0; if (!['idle', 'taunt'].includes(b.st)) bossSt(b, 'taunt'); return; }
  switch (b.kind) {
    case 'fan': fanAI(b, dt, h); break;
    case 'spear': spearAI(b, dt, h); break;
    case 'ox': oxAI(b, dt, h); break;
    case 'mirror': mirrorAI(b, dt, h); break;
    case 'abbot': abbotAI(b, dt, h); break;
    default: break;
  }
  bossClamp(b);
}

function bossEnter(b, dt) {
  const F = game.F, sx = stairX(F);
  if (b.kind === 'abbot') {
    // leaps down from the pavilion roof
    if (b.t < 0.6) return;
    if (bossOnce(b, 'jump')) { b.vx = -F.dir * 120; b.vy = -160; chip.sfx('whoosh'); }
    if (bossPhys(b, dt)) { b.vx = 0; dust(b.x, b.y, 8); chip.sfx('thud'); addShake(5); bossSt(b, 'taunt'); b.cd = 0.8; }
    return;
  }
  // walk down the stairs out of the doorway
  const p = clamp(b.t / 1.5, 0, 1);
  b.x = sx + F.dir * 4 - F.dir * 66 * p;
  b.y = GROUND_Y - 96 * (1 - p);
  b.walkT += dt * 60;
  if (b.kind === 'ox' && Math.floor(b.t * 3) !== Math.floor((b.t - dt) * 3)) { chip.sfx('stomp'); addShake(3); }
  if (p >= 1) { bossSt(b, 'taunt'); b.cd = 0.8; dust(b.x, b.y, 4); }
}

function bossWalk(b, dt, dir, speed) {
  b.vx = dir * speed;
  b.x += b.vx * dt;
  if (dir) b.walkT += dt * speed;
}

/* CRIMSON FAN: boomerang fans, a whirling dash, quick slashes */
function fanAI(b, dt, h) {
  const adx = Math.abs(h.x - b.x);
  b.wind = teleT(b, b.st === 'slash' ? 0.3 : 0.5);
  switch (b.st) {
    case 'taunt': if (b.t > 0.6) bossSt(b, 'idle'); break;
    case 'idle': {
      bossFace(b);
      let want = 0;
      if (adx > 120) want = b.face; else if (adx < 60 && b.fanOut) want = -b.face;
      bossWalk(b, dt, want, 58);
      if (b.cd > 0) break;
      if (adx < 38) { bossSt(b, chance(0.6) ? 'slash' : 'flip'); if (b.st === 'flip') { b.vx = -b.face * 140; b.vy = -260; } }
      else if (!b.fanOut && chance(b.phase2 ? 0.5 : 0.62)) { bossSt(b, chance(0.5) ? 'throwH' : 'throwL'); }
      else if (!b.fanOut || chance(0.5)) { bossSt(b, 'spinWind'); chip.sfx('whirl'); }
      else b.cd = 0.4;
      break;
    }
    case 'throwH': case 'throwL': {
      b.vx = 0;
      if (b.t >= b.wind && bossOnce(b, 'throw')) {
        const high = b.st === 'throwH';
        game.shots.push({ k: 'fan', x: b.x + b.face * 12, y: GROUND_Y - (high ? 32 : 9), vx: b.face * (b.phase2 ? 220 : 190), vy: 0, boomer: true, turnT: 0.8, foe: true, dmg: 4, deflect: true, brittle: true, t: 0, life: 4.5 });
        b.fanOut = true; chip.sfx('fanthrow');
        if (b.phase2 && !b.second) { b.second = true; b.cd = 0; }
      }
      if (b.t > b.wind + 0.4) {
        if (b.phase2 && b.second && !b.secondDone) { b.secondDone = true; bossSt(b, b.st === 'throwH' ? 'throwL' : 'throwH'); b.fanOut = false; break; }
        b.second = false; b.secondDone = false;
        bossSt(b, 'idle'); b.cd = rand(0.6, 1.1);
      }
      break;
    }
    case 'spinWind':
      b.vx = 0; bossFace(b);
      if (b.t > teleT(b, 0.55)) { bossSt(b, 'dash'); b.dashFrom = b.x; chip.sfx('dash'); }
      break;
    case 'dash': {
      bossWalk(b, dt, b.face, b.phase2 ? 300 : 250);
      if (Math.floor(b.t * 30) % 3 === 0) fxAdd({ k: 'dust', x: b.x - b.face * 6, y: b.y - 1, vx: -b.face * 20, vy: -6, t: 0, life: 0.3 });
      const atWall = b.x <= game.arena.x0 + 1 || b.x >= game.arena.x1 - 1;
      if (atWall || Math.abs(b.x - b.dashFrom) > 230) { bossSt(b, 'idle'); b.vx = 0; b.cd = rand(0.5, 0.9); bossFace(b); }
      break;
    }
    case 'slash':
      b.vx = 0;
      if (b.t >= b.wind && bossOnce(b, 'sfx')) chip.sfx('slash');
      if (b.t > b.wind + 0.35) { bossSt(b, 'idle'); b.cd = rand(0.4, 0.8); }
      break;
    case 'flip':
      if (bossPhys(b, dt)) { b.vx = 0; bossSt(b, 'idle'); b.cd = 0.3; bossFace(b); }
      break;
    default: bossSt(b, 'idle'); break;
  }
}

/* JADE SPEAR: high and low thrusts, a pole vault over you, a spinning low sweep */
function spearAI(b, dt, h) {
  const adx = Math.abs(h.x - b.x);
  b.wind = teleT(b, b.st === 'spin' ? 0.5 : 0.48);
  switch (b.st) {
    case 'taunt': if (b.t > 0.6) bossSt(b, 'idle'); break;
    case 'idle': {
      bossFace(b);
      const want = adx > 58 ? b.face : adx < 36 ? -b.face : 0;
      bossWalk(b, dt, want, 50);
      if (b.cd > 0) break;
      if (adx < 32) bossSt(b, chance(0.55) ? 'spin' : 'vaultWind');
      else if (adx < 66) { bossSt(b, chance(0.5) ? 'thrustH' : 'thrustL'); b.chain = b.phase2 ? 2 : 0; }
      else if (chance(0.3)) bossSt(b, 'vaultWind');
      break;
    }
    case 'thrustH': case 'thrustL':
      b.vx = 0;
      if (b.t >= b.wind && bossOnce(b, 'go')) { chip.sfx('thrust'); b.x += b.face * 6; }
      if (b.t > b.wind + (b.chain ? 0.22 : 0.45)) {
        if (b.chain > 0) { b.chain--; const next = b.st === 'thrustH' ? 'thrustL' : 'thrustH'; bossSt(b, next); b.t = b.wind * 0.35; }
        else { bossSt(b, 'idle'); b.cd = rand(0.5, 1.0); }
      }
      break;
    case 'spin':
      b.vx = 0;
      if (b.t < b.wind && Math.floor(b.t * 8) !== Math.floor((b.t - dt) * 8)) chip.sfx('whirl');
      if (b.t >= b.wind && bossOnce(b, 'go')) { chip.sfx('sweepbig'); dust(b.x - 30, b.y, 3); dust(b.x + 30, b.y, 3); }
      if (b.t > b.wind + 0.4) { bossSt(b, 'idle'); b.cd = rand(0.5, 0.9); }
      break;
    case 'vaultWind':
      b.vx = 0; bossFace(b);
      if (b.t > teleT(b, 0.32)) {
        bossSt(b, 'vault');
        const tx = clamp(h.x + b.face * 54, game.arena.x0 + 10, game.arena.x1 - 10);
        b.vy = -340; b.vx = (tx - b.x) / 0.76;
        chip.sfx('whoosh');
      }
      break;
    case 'vault':
      if (bossPhys(b, dt)) {
        b.vx = 0; bossFace(b); dust(b.x, b.y, 6); chip.sfx('thud'); addShake(3);
        game.shots.push({ k: 'shock', x: b.x - 12, y: GROUND_Y, vx: -150, vy: 0, foe: true, dmg: 3, t: 0, life: 0.8, pierce: true });
        game.shots.push({ k: 'shock', x: b.x + 12, y: GROUND_Y, vx: 150, vy: 0, foe: true, dmg: 3, t: 0, life: 0.8, pierce: true });
        bossSt(b, 'land');
      }
      break;
    case 'land': if (b.t > 0.4) { bossSt(b, 'idle'); b.cd = rand(0.3, 0.7); } break;
    default: bossSt(b, 'idle'); break;
  }
}

/* IRON OX: a charge you must jump, ground slams that send shockwaves, a crushing grab */
function oxAI(b, dt, h) {
  const adx = Math.abs(h.x - b.x);
  b.wind = teleT(b, b.st === 'grab' ? 0.42 : 0.6);
  switch (b.st) {
    case 'taunt': if (b.t > 0.7) bossSt(b, 'idle'); if (bossOnce(b, 'roar')) chip.sfx('roar'); break;
    case 'idle': {
      bossFace(b);
      bossWalk(b, dt, adx > 34 ? b.face : 0, 32);
      if (b.walkT && Math.floor(b.walkT / 30) !== b.lastStep) { b.lastStep = Math.floor(b.walkT / 30); chip.sfx('stomp'); }
      if (b.cd > 0) break;
      if (adx < 30) bossSt(b, 'grab');
      else if (adx > 90 || chance(0.45)) { bossSt(b, 'paw'); chip.sfx('snort'); }
      else bossSt(b, 'raise');
      break;
    }
    case 'paw':
      b.vx = 0; bossFace(b);
      if (Math.random() < 0.25) fxAdd({ k: 'steam', x: b.x + b.face * 22, y: b.y - 40, vx: b.face * 20, vy: -10, t: 0, life: 0.5 });
      if (Math.floor(b.t * 4) !== Math.floor((b.t - dt) * 4)) { dust(b.x - b.face * 8, b.y, 2); chip.sfx('scrape'); }
      if (b.t > teleT(b, 0.75)) { bossSt(b, 'charge'); chip.sfx('charge2'); }
      break;
    case 'charge': {
      bossWalk(b, dt, b.face, b.phase2 ? 270 : 230);
      if (Math.floor(b.t * 20) % 2 === 0) dust(b.x - b.face * 10, b.y, 1);
      const wall = b.face > 0 ? b.x >= game.arena.x1 - 1 : b.x <= game.arena.x0 + 1;
      if (wall) { bossSt(b, 'stun'); b.vx = 0; chip.sfx('crash'); addShake(8); sparks(b.x + b.face * 14, b.y - 30, 10, '#ffd27a'); }
      break;
    }
    case 'stun': if (b.t > 1.7) { bossSt(b, 'idle'); b.cd = 0.4; } break;
    case 'raise':
      b.vx = 0; bossFace(b);
      if (b.t > b.wind) { bossSt(b, 'slam'); }
      break;
    case 'slam':
      if (bossOnce(b, 'hit')) {
        chip.sfx('slam'); addShake(7); dust(b.x + b.face * 20, b.y, 8);
        game.shots.push({ k: 'shock', x: b.x + 20, y: GROUND_Y, vx: 175, vy: 0, foe: true, dmg: 5, t: 0, life: 2, pierce: true });
        game.shots.push({ k: 'shock', x: b.x - 20, y: GROUND_Y, vx: -175, vy: 0, foe: true, dmg: 5, t: 0, life: 2, pierce: true });
      }
      if (b.t > 0.7) {
        if (b.phase2 && !b.double) { b.double = true; bossSt(b, 'raise'); b.t = b.wind * 0.5; }
        else { b.double = false; bossSt(b, 'idle'); b.cd = rand(0.6, 1.1); }
      }
      break;
    case 'grab':
      b.vx = 0;
      if (b.t >= b.wind && bossOnce(b, 'go')) chip.sfx('bash');
      if (b.t > b.wind + 0.5) { bossSt(b, 'idle'); b.cd = rand(0.5, 1.0); }
      break;
    default: bossSt(b, 'idle'); break;
  }
}

/* MIRROR MONK: talisman volleys, mirror images (only the real one casts a reflection), a blink palm */
function mirrorAI(b, dt, h) {
  const adx = Math.abs(h.x - b.x);
  b.wind = teleT(b, b.st === 'palm' ? 0.4 : 0.45);
  for (const c of b.clones) { c.face = sgn(h.x - c.x) || c.face; }
  if (b.clones.length) {
    b.splitT -= dt;
    if (b.splitT <= 0 || !b.clones.some((c) => c.alive)) { mergeClones(b); }
  }
  switch (b.st) {
    case 'taunt': if (b.t > 0.6) bossSt(b, 'idle'); break;
    case 'idle': {
      bossFace(b);
      const want = adx > 110 ? b.face : adx < 66 ? -b.face : 0;
      bossWalk(b, dt, want, 46);
      if (b.cd > 0) break;
      if (!b.clones.length && (chance(b.phase2 ? 0.45 : 0.3))) splitMonk(b);
      else if (adx < 40 || chance(0.25)) bossSt(b, 'blink');
      else bossSt(b, 'cast');
      break;
    }
    case 'cast': {
      b.vx = 0; bossFace(b);
      const n = b.phase2 ? 3 : 2;
      for (let i = 0; i < n; i++) {
        if (b.t >= b.wind + i * 0.24 && bossOnce(b, 'c' + i)) {
          game.shots.push({ k: 'tal', x: b.x + b.face * 12, y: b.y - 36, vx: b.face * 95, vy: 0, foe: true, dmg: 3, deflect: true, t: 0, life: 4, ph: i });
          chip.sfx('paper');
        }
      }
      if (b.t > b.wind + n * 0.24 + 0.3) { bossSt(b, 'idle'); b.cd = rand(0.7, 1.2); }
      break;
    }
    case 'blink':
      if (b.t < 0.3) { if (bossOnce(b, 'out')) { smoke(b.x, b.y - 24, 8); chip.sfx('poof'); } }
      else if (bossOnce(b, 'in')) {
        const side = -(h.face || 1);
        b.x = clamp(h.x + side * 34, game.arena.x0 + 6, game.arena.x1 - 6);
        bossFace(b); smoke(b.x, b.y - 24, 8); chip.sfx('poof');
      }
      if (b.t > 0.35) bossSt(b, 'palm');
      break;
    case 'palm':
      b.vx = 0;
      if (b.t >= b.wind && bossOnce(b, 'go')) chip.sfx('palm');
      if (b.t > b.wind + 0.4) { bossSt(b, 'idle'); b.cd = rand(0.5, 1.0); }
      break;
    default: bossSt(b, 'idle'); break;
  }
}

function splitMonk(b) {
  const n = b.phase2 ? 4 : 2;
  const slots = [];
  const x0 = game.arena.x0 + 20, x1 = game.arena.x1 - 20;
  for (let i = 0; i <= n; i++) slots.push(lerp(x0, x1, i / n));
  const order = slots.sort(() => Math.random() - 0.5);
  b.x = order[0];
  b.clones = order.slice(1).map((x) => ({ x, face: b.face, alive: true }));
  b.splitT = 7;
  game.flashT = 0.12;
  chip.sfx('mirror');
  for (const x of order) smoke(x, b.y - 24, 5);
  bossSt(b, 'cast');
  pop(game.hero.x, game.hero.y - 60, 'FIND THE REAL ONE!', '#c4a7ff');
}
function mergeClones(b) {
  for (const c of b.clones) if (c.alive) smoke(c.x, b.y - 24, 4);
  b.clones = [];
}

/* SHADOW ABBOT: a counter stance, chi orbs you can send back, a leaping kick, dragon fire */
function abbotAI(b, dt, h) {
  const adx = Math.abs(h.x - b.x);
  b.wind = teleT(b, b.st === 'palm' ? 0.36 : b.st === 'breath' ? 0.6 : 0.45);
  switch (b.st) {
    case 'taunt': if (b.t > 0.8) bossSt(b, 'idle'); if (bossOnce(b, 'laugh')) chip.sfx('roar'); break;
    case 'idle': {
      bossFace(b);
      const want = adx > 100 ? b.face : adx < 50 ? -b.face : 0;
      bossWalk(b, dt, want, 54);
      if (b.cd > 0) break;
      const r = Math.random();
      if (adx < 36) { if (r < 0.45) bossSt(b, 'palm'); else if (r < 0.75) bossSt(b, 'counter'); else { bossSt(b, 'leap'); b.vy = -300; b.vx = -b.face * 110; } }
      else if (b.phase2 && r < 0.28) { bossSt(b, 'breath'); chip.sfx('inhale'); }
      else if (r < 0.62) { bossSt(b, 'orb'); b.high = chance(0.5); }
      else if (r < 0.86) { bossSt(b, 'leap'); b.vy = -330; b.vx = clamp((h.x - b.x) / 0.72, -180, 180); chip.sfx('whoosh'); }
      else bossSt(b, 'counter');
      break;
    }
    case 'counter':
      b.vx = 0; bossFace(b);
      if (bossOnce(b, 'chime')) chip.sfx('chime');
      if (b.t > 1.25) { bossSt(b, 'idle'); b.cd = 0.3; }
      break;
    case 'riposte':
      if (b.t < 0.1) b.x += b.face * 90 * dt;
      if (b.t > 0.55) { bossSt(b, 'idle'); b.cd = 0.4; }
      break;
    case 'orb': {
      b.vx = 0;
      const shots = b.phase2 ? 2 : 1;
      for (let i = 0; i < shots; i++) {
        if (b.t >= b.wind + i * 0.42 && bossOnce(b, 'o' + i)) {
          const high = i === 0 ? b.high : !b.high;
          game.shots.push({ k: 'orb', x: b.x + b.face * 14, y: GROUND_Y - (high ? 30 : 9), vx: b.face * 175, vy: 0, foe: true, dmg: 5, deflect: true, t: 0, life: 3 });
          chip.sfx('orb');
        }
      }
      if (b.t > b.wind + shots * 0.42 + 0.25) { bossSt(b, 'idle'); b.cd = rand(0.5, 0.9); }
      break;
    }
    case 'leap':
      if (bossPhys(b, dt)) { b.vx = 0; dust(b.x, b.y, 5); chip.sfx('thud'); bossSt(b, 'land'); }
      break;
    case 'land': bossFace(b); if (b.t > 0.35) { bossSt(b, 'idle'); b.cd = rand(0.3, 0.6); } break;
    case 'palm':
      b.vx = 0;
      for (let i = 0; i < 3; i++) if (b.t >= b.wind + i * 0.2 && bossOnce(b, 'p' + i)) { chip.sfx('palm'); b.x += b.face * 4; }
      if (b.t > b.wind + 0.75) { bossSt(b, 'idle'); b.cd = rand(0.4, 0.8); }
      break;
    case 'breath':
      b.vx = 0;
      if (b.t < b.wind && Math.random() < 0.4) fxAdd({ k: 'smoke', x: b.x + b.face * 8, y: b.y - 44, vx: 0, vy: -30, t: 0, life: 0.4, r: 3 });
      if (b.t >= b.wind && bossOnce(b, 'fire')) {
        chip.sfx('fire');
        game.shots.push({ k: 'fire', x: b.x + b.face * 18, y: GROUND_Y, vx: b.face * 150, vy: 0, foe: true, dmg: 6, knock: true, pierce: true, t: 0, life: 2.6 });
      }
      if (b.t > b.wind + 0.6) { bossSt(b, 'idle'); b.cd = rand(0.6, 1.0); }
      break;
    default: bossSt(b, 'idle'); break;
  }
}

/* ---- drawing ------------------------------------------------------------------------------------- */
function bossPose(b) {
  const st = b.st, t = b.t, w = b.wind || 0.4;
  const walkF = (b.walkT / 6) % 8;
  const idleF = (game.t * 1.1) % 2;
  const moving = Math.abs(b.vx) > 1;
  const strike = (t0) => (t < t0 ? Math.min(0.95, (t / t0) * 0.35) : Math.min(1, 0.35 + (t - t0) / 0.06));
  if (st === 'dead') return ['dead', b.y < GROUND_Y ? 1 : Math.min(2, 1 + b.deathT * 3)];
  if (st === 'hurt') return ['hurt', 0];
  if (st === 'enter') return b.kind === 'abbot' ? ['leap', 0] : ['walk', walkF];
  if (st === 'guard') return b.kind === 'fan' ? ['slash', 0] : b.kind === 'spear' ? ['spin', 1] : ['counter', 0];
  switch (b.kind) {
    case 'fan':
      if (st === 'throwH') return ['throw', strike(w)];
      if (st === 'throwL') return ['throwLow', strike(w)];
      if (st === 'spinWind' || st === 'dash') return ['spin', game.t * 16];
      if (st === 'slash') return ['slash', strike(w)];
      if (st === 'flip') return ['spin', game.t * 12];
      return [moving ? 'walk' : 'idle', moving ? walkF : idleF];
    case 'spear':
      if (st === 'thrustH') return ['thrustHigh', strike(w)];
      if (st === 'thrustL') return ['thrustLow', strike(w)];
      if (st === 'spin') return ['spin', t * (t < w ? 12 : 20)];
      if (st === 'vaultWind' || st === 'vault') return ['vault', 0];
      if (st === 'land') return ['thrustLow', 0];
      return [moving ? 'walk' : 'idle', moving ? walkF : idleF];
    case 'ox':
      if (st === 'paw') return ['paw', t * 6];
      if (st === 'charge') return ['charge', t * 10];
      if (st === 'stun') return ['stun', t * 4];
      if (st === 'raise') return ['raise', 0];
      if (st === 'slam') return ['slam', Math.min(1, t / 0.12)];
      if (st === 'grab') return t < w ? ['grab', 0] : ['slam', 0];
      return [moving ? 'walk' : 'idle', moving ? walkF : idleF];
    case 'mirror':
      if (st === 'cast') return ['cast', strike(w)];
      if (st === 'palm') return ['cast', strike(w)];
      return [moving ? 'walk' : 'idle', moving ? 0 : idleF];
    case 'abbot':
      if (st === 'counter') return ['counter', 0];
      if (st === 'riposte') return ['palm', Math.min(1, t / 0.08)];
      if (st === 'orb') { const kk = Math.floor(Math.max(0, t - w) / 0.42); return ['palm', t < w + kk * 0.42 ? 0 : kk % 2 ? 2 : 1]; }
      if (st === 'leap') return b.vy < 40 ? ['leap', 0] : ['kick', 1];
      if (st === 'land') return ['kneel', 0];
      if (st === 'palm') { const kk = Math.floor(Math.max(0, t - w) / 0.2); return ['palm', t < w ? 0 : (kk % 2) + 1]; }
      if (st === 'breath') return t < w ? ['counter', 0] : ['breath', 0];
      return [moving ? 'walk' : 'idle', moving ? walkF : idleF];
    default: return ['idle', 0];
  }
}

function bossDraw(b, g, cx, refl) {
  const [anim, fr] = bossPose(b);
  const x = b.x - cx;
  const kind = b.kind;
  if (refl) { drawSprite(g, kind, anim, fr, b.face, x, b.y); return; }
  if (b.st === 'blink' && b.t < 0.3) return;
  if (b.aura > 0 || (kind === 'abbot' && (b.st === 'counter' || b.phase2))) {
    const counter = b.st === 'counter';
    const col = counter ? '#ffd84a' : kind === 'abbot' ? '#a020ff' : '#ff3a2a';
    const a = counter ? 0.8 + 0.2 * Math.sin(game.t * 20) : b.aura > 0 ? Math.min(1, b.aura) : 0.45;
    drawGlow(g, x, b.y - b.D.h / 2, 42, col, a);
    if (counter) { g.globalAlpha = 0.5 + 0.3 * Math.sin(game.t * 16); ring(g, x, b.y - b.D.h / 2, 26 + Math.sin(game.t * 8) * 2, 1, '#ffe8a0'); g.globalAlpha = 1; }
  }
  for (const c of b.clones) {
    if (!c.alive) continue;
    drawSprite(g, kind, anim, fr, c.face, c.x - cx, b.y, false, 0.9);
  }
  const fade = b.dead && b.deathT > 2 ? Math.max(0, 1 - (b.deathT - 2) / 1.2) : 1;
  drawSprite(g, kind, anim, fr, b.face, x, b.y, b.flash > 0 ? true : false, fade);
  const w = b.wind || 0.4, t = b.t;
  const glint = (gx, gy) => drawGlint(g, gx, gy);
  if (kind === 'fan' && (b.st === 'throwH' || b.st === 'throwL') && t < w && t > w - 0.3) glint(x - b.face * 6, b.y - (b.st === 'throwH' ? 40 : 14));
  if (kind === 'fan' && b.st === 'slash' && t < w) glint(x + b.face * 4, b.y - 46);
  if (kind === 'spear' && (b.st === 'thrustH' || b.st === 'thrustL') && t < w && t > w - 0.3) glint(x + b.face * 38, b.y - (b.st === 'thrustH' ? 33 : 9));
  if (kind === 'ox' && b.st === 'raise') glint(x, b.y - 68);
  if (kind === 'mirror' && b.st === 'palm' && t < w) glint(x + b.face * 18, b.y - 32);
  if (kind === 'abbot' && b.st === 'orb' && t < w) glint(x + b.face * 18, b.y - (b.high ? 34 : 12));
  if (kind === 'ox' && b.st === 'stun') drawDizzy(g, x, b.y - 72);
  if (kind === 'ox' && b.st === 'paw') for (let i = 0; i < 2; i++) { g.globalAlpha = 0.5; disc(g, x + b.face * (24 + i * 4 + (t * 20) % 6), b.y - 40 - i * 2, 1.6 + i, '#e8e0e0'); g.globalAlpha = 1; }
  if (kind === 'spear' && b.st === 'spin' && t < w) { g.globalAlpha = 0.35; g.strokeStyle = '#ffffff'; g.lineWidth = 1; g.beginPath(); g.ellipse(x, b.y - 4, 42, 6, 0, 0, TAU); g.stroke(); g.globalAlpha = 1; }
}

/* ==========================================================================
   Game state: flow, floor runtime, spawning, boss arena, scoring
   ========================================================================== */

const DIFFS = {
  disciple: { id: 'disciple', name: 'DISCIPLE', dmg: 0.7, foeSpeed: 0.92, spawn: 0.85, tele: 1.25, drain: 0.65, bossHp: 0.85, time: 30 },
  master: { id: 'master', name: 'MASTER', dmg: 1, foeSpeed: 1.04, spawn: 1.08, tele: 1, drain: 1, bossHp: 1.15, time: 0 }
};

const game = {
  state: 'boot', t: 0, stateT: 0,
  F: FLOORS[0], L: null, floorIdx: 0, camX: 0, arena: null, doorOpen: 0,
  hero: null, foes: [], shots: [], fx: [], items: [], haz: [], pops: [], wx: [], sched: [],
  boss: null, bossSeq: null, time: 0, timeLeft: 150, evIdx: 0, spawnT: 0, hazT: 0,
  score: 0, hi: 0, lives: 2, nextExtend: 50000, continues: 0,
  chainN: 0, chainT: -9, shake: 0, flashT: 0, slowT: 0, hitStop: 0,
  diff: DIFFS.disciple, fighter: 'tao', stats: null, stageStats: null,
  demo: false, menu: 0, hits: [], scores: loadScores(), entry: null, idleT: 0
};
game.hi = game.scores[0].s;

const ART_CACHE = {};
function floorArt(F) {
  if (!ART_CACHE[F.id]) {
    for (const k in ART_CACHE) if (k !== F.id) delete ART_CACHE[k];
    ART_CACHE[F.id] = buildFloorArt(F);
  }
  return ART_CACHE[F.id];
}

function freshStats() { return { kills: 0, deaths: 0, hits: 0, items: 0, time: 0, deflects: 0, waves: 0 }; }

function setState(s) {
  if (s !== game.state && s !== 'pause' && game.state !== 'pause') game.fadeT = 0.22;
  game.state = s; game.stateT = 0; game.menu = 0; game.hits = [];
}

/* ---- starting a run ---------------------------------------------------------- */
function newGame(demo) {
  game.demo = !!demo;
  chip.mute = game.demo;
  game.fighter = demo ? pick(['tao', 'lian']) : settings.fighter;
  game.diff = DIFFS[demo ? 'master' : settings.level] || DIFFS.disciple;
  game.score = 0; game.lives = 2; game.nextExtend = 50000; game.continues = 0; game.cleared = false;
  game.stats = freshStats();
  game.carry = null;
  startFloor(0);
}

function startFloor(i) {
  game.floorIdx = i;
  const F = game.F = FLOORS[i];
  game.L = floorArt(F);
  const h = game.hero = makeHero(floorX(F, 44), game.fighter);
  h.face = F.dir;
  if (game.carry) { h.hp = Math.max(game.carry.hp, MAX_HP * 0.5); h.chi = game.carry.chi; }
  game.camX = clamp(h.x - W / 2 + F.dir * 60, 0, F.len - W);
  game.foes = []; game.shots = []; game.fx = []; game.items = []; game.haz = []; game.pops = []; game.sched = [];
  game.boss = null; game.bossSeq = null; game.arena = null; game.doorOpen = 0; game.autoWalk = false; game.hideHero = false; game.freed = 0;
  game.time = 0; game.evIdx = 0; game.spawnT = 2.4; game.hazT = 3;
  game.timeLeft = F.time + game.diff.time;
  game.chainN = 0; game.chainT = -9; game.shake = 0; game.flashT = 0; game.slowT = 0; game.hitStop = 0;
  game.stageStats = freshStats();
  game.wx = [];
  game.downT = 0; game.timeWarn = 0;
  if (F.vents) F.vents.forEach((p, k) => game.haz.push({ k: 'vent', x: floorX(F, p), st: 'idle', t: 0, off: k * 1.37, dmg: 5, knock: true }));
  setState(game.demo ? 'play' : 'intro');
  if (!game.demo) chip.play('start');
  else chip.play(F.song);
}

function beginPlay() {
  setState('play');
  chip.play(game.F.song);
  game.readyT = 1.2;
}

/* ---- per frame update by state --------------------------------------------- */
function updateGame(dt, I, P) {
  game.t += dt;
  game.stateT += dt;
  game.shake = Math.max(0, game.shake - dt * 18);
  game.flashT = Math.max(0, game.flashT - dt);
  game.fadeT = Math.max(0, (game.fadeT || 0) - dt);
  game.readyT = Math.max(0, (game.readyT || 0) - dt);
  switch (game.state) {
    case 'intro':
      tickWorld(dt);
      if (game.stateT > 3.6 || (game.stateT > 0.8 && (P.punch || P.kick || P.jump || P.start))) beginPlay();
      break;
    case 'play': {
      if (game.demo && P.any) { exitDemo(); return; }
      if (game.hitStop > 0) {
        game.hitStop -= dt;
        const h = game.hero;
        if (P.punch) { h.bufK = 'p'; h.bufT = 0.16; }
        if (P.kick) { h.bufK = 'k'; h.bufT = 0.16; }
        if (P.pause && !game.demo) openPause();
        break;
      }
      let sdt = dt;
      if (game.slowT > 0) { game.slowT -= dt; sdt = dt * 0.35; }
      if (game.demo) { const BI = botInput(sdt); updatePlay(sdt, BI, botPressed()); }
      else updatePlay(sdt, I, P);
      if (game.demo && (game.stateT > 40 || (game.hero.dead && game.downT > 1.5))) exitDemo();
      break;
    }
    case 'clear': updateClear(dt, I, P); break;
    case 'continue': updateContinue(dt, I, P); break;
    case 'gameover':
      tickWorld(dt);
      if (game.stateT > 4 || (game.stateT > 1.2 && (P.punch || P.kick || P.start))) finishRun();
      break;
    case 'ending': updateEnding(dt, I, P); break;
    default: updateMenus(dt, I, P); break;
  }
}

/** Keep effects and weather alive on screens drawn over the world. */
function tickWorld(dt) { if (dt > 0) { updateFx(dt); updateWeather(dt); } }

function updatePlay(dt, I, P) {
  game.time += dt;
  game.stageStats.time += dt;
  const h = game.hero, F = game.F;
  if (P.pause && !game.demo && !h.dead) { openPause(); return; }
  const S = game.bossSeq;
  const cut = S && (S.st === 'down' || S.st === 'exit' || S.st === 'climb' || S.st === 'free');
  if (cut) updateCutscene(dt);
  else updateHero(h, dt, I, P);
  updateCamera(dt);
  // the hero stays on screen, out of the stairwell until the guardian falls, and inside the arena
  if (!cut) {
    h.x = clamp(h.x, game.camX + 8, game.camX + W - 8);
    h.x = clamp(h.x, 10, F.len - 10);
    const sx = stairX(F);
    if (F.dir > 0) h.x = Math.min(h.x, sx - 36); else h.x = Math.max(h.x, sx + 36);
    if (game.arena) h.x = clamp(h.x, game.arena.x0, game.arena.x1);
  }
  if (!game.bossSeq) { runEvents(); ambientSpawn(dt); checkArena(); }
  else runSched();
  for (const e of game.foes) updateFoe(e, dt);
  updateBossSeq(dt);
  updateShots(dt);
  updateHazards(dt);
  resolveHeroAttacks();
  resolveFoeAttacks();
  updateItems(dt);
  updateFx(dt);
  updateWeather(dt);
  game.foes = game.foes.filter((e) => !e.gone);
  // the floor timer
  if (!h.dead && !cut && !game.demo) {
    const before = Math.ceil(game.timeLeft);
    game.timeLeft = Math.max(0, game.timeLeft - dt);
    if (game.timeLeft < 20 && Math.ceil(game.timeLeft) !== before) chip.sfx('tick');
    if (game.timeLeft <= 0) { pop(h.x, h.y - 60, 'TIME UP!', '#ff5a4a'); releaseGrabbers(h, false); killHero(h, -h.face); }
  }
  if (h.dead) {
    game.downT += dt;
    if (game.downT > 2.6 && !game.demo) heroLost();
  }
}

function heroProgress(h) { const F = game.F; return F.dir > 0 ? h.x : F.len - h.x; }

function updateCamera(dt) {
  const h = game.hero, F = game.F, maxCam = F.len - W;
  let target;
  if (game.arena) target = arenaX0(F);
  else target = clamp(h.x - W / 2 + F.dir * 40, 0, maxCam);
  const d = target - game.camX;
  game.camX += clamp(d * Math.min(1, dt * 5), -260 * dt, 260 * dt);
  if (Math.abs(d) < 0.5) game.camX = target;
  game.camX = clamp(game.camX, 0, maxCam);
}

/* ---- the guardian's arena ---------------------------------------------------------------- */
function checkArena() {
  const h = game.hero, F = game.F;
  if (game.arena || h.dead || heroProgress(h) < F.len - W + 70) return;
  const x0 = arenaX0(F), sx = stairX(F);
  game.arena = F.dir > 0 ? { x0: x0 + 10, x1: sx - 36 } : { x0: sx + 36, x1: x0 + W - 10 };
  game.bossSeq = { st: 'gong', t: 0 };
  game.sched = [];
  chip.stopMusic();
  chip.sfx('gong');
  // the hall's fighters scatter when the guardian arrives
  for (const e of game.foes) if (foeAlive(e) && e.st !== 'grab') { killFoe(e, sgn(e.x - h.x) || 1, 60, true); }
  for (const z of game.haz) if (z.k === 'wisp' || z.k === 'vase' || z.k === 'bolt') z.gone = true;
}

function updateBossSeq(dt) {
  const S = game.bossSeq;
  if (!S) return;
  S.t += dt;
  if (S.st === 'gong') {
    if (S.t > 0.9 && !game.boss) { game.boss = makeBoss(game.F.boss); }
    if (game.boss) game.boss.update(dt);
    if (S.t > 2.6) { S.st = 'fight'; S.t = 0; if (!game.hero.dead) chip.play(game.F.boss === 'abbot' ? 'final' : 'boss'); }
  } else if (S.st === 'fight') {
    const b = game.boss;
