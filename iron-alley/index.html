<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Iron Alley</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#05060a">
<meta name="description" content="Iron Alley: an original two-player street brawler. Punch, kick, grab and throw your way through four districts to take the city back from the Viper gang.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Bungee&display=swap">
<style>
/* One deliberate world: a dark arcade cabinet. The canvas is full-bleed; the touch pad
   sits inside safe-area gutters (portrait: handheld layout under the screen, landscape: overlay). */
:root {
  color-scheme: dark;
  --bg: #05060a;
  --body: #0d1018;
  --line: #232a3c;
  --ink: #e8edf5;
  --ink-dim: #6d7890;
  --knife: #e8392a;
  --knife-deep: #8f1d14;
  --jump: #e3b02a;
  --jump-deep: #8a6410;
  --spec: #2fa8c8;
  --spec-deep: #156078;
  --dash: #8a6aff;
  --dash-deep: #3e2a9a;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(10px, env(safe-area-inset-top, 0px));
  --gb: max(14px, env(safe-area-inset-bottom, 0px));
  --pix: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --game-bottom: 50vh;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--pix); font-size: 10px; line-height: 1.15;
  overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#safeProbe {
  position: absolute; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
noscript { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }

/* ---------- touch pad ---------- */
#touch {
  position: absolute; inset: 0; display: none; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: var(--gt) var(--gb);
  --dp: min(40vw, 30vh, 176px);
  --bk: min(19vw, 13.5vh, 80px);
  --bj: min(16vw, 11.5vh, 68px);
  --bs: min(14vw, 10vh, 58px);
}
body.touch-on #touch { display: block; }
body.touch-on.portrait #touch {
  background:
    linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) var(--game-bottom), var(--body) calc(var(--game-bottom) + 1px), #0a0c13 100%);
}
.brand {
  display: none; position: absolute; left: var(--gl); right: var(--gr); top: calc(var(--game-bottom) + 18px);
  text-align: center; font-family: "Bungee", "Barlow Condensed", Impact, sans-serif; font-size: 20px; letter-spacing: 4px; line-height: 1.15; color: #8a96b4;
}
body.portrait .brand { display: none; }
.brand b { color: #e8392a; font-weight: 400; }
.brand span { display: block; margin-top: 10px; font-family: var(--pix); font-size: 11px; font-weight: 500; letter-spacing: 1px; line-height: 1.15; color: #56607c; }
.grille {
  display: none; position: absolute; left: 50%; width: 180px; margin-left: -90px; height: 12px;
  top: calc(var(--game-bottom) + 74px);
  background: linear-gradient(90deg, transparent, rgba(232,57,42,0.6) 28%, rgba(232,57,42,0.6) 72%, transparent) center / 100% 1px no-repeat;
}
.grille::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -5px 0 0 -5px;
  transform: rotate(45deg); border: 1px solid rgba(255,120,100,0.85); background: #2a1014;
}
body.portrait .grille { display: none; }
@media (max-height: 700px) { .grille { display: none !important; } .brand span { display: none; } }

#dpad {
  position: absolute; left: var(--gl); bottom: calc(var(--gb) + 6px);
  width: var(--dp); height: var(--dp); border-radius: 50%; pointer-events: auto; touch-action: none;
  background: radial-gradient(circle at 50% 45%, rgba(40,48,70,0.55), rgba(14,17,26,0.7) 70%);
  border: 2px solid rgba(80,92,124,0.45);
}
body.portrait #dpad { bottom: calc(var(--gb) + 40px); }
#dpad .arm { position: absolute; background: #1b2030; border: 2px solid #313a52; border-radius: 6px; }
#dpad .arm.h { left: 12%; right: 12%; top: 38%; bottom: 38%; }
#dpad .arm.v { top: 12%; bottom: 12%; left: 38%; right: 38%; }
#dpad .ar { position: absolute; width: 0; height: 0; border: 7px solid transparent; opacity: 0.65; }
#dpad .ar.l { left: 16%; top: calc(50% - 7px); border-right-color: #9aa6c0; border-left-width: 0; }
#dpad .ar.r { right: 16%; top: calc(50% - 7px); border-left-color: #9aa6c0; border-right-width: 0; }
#dpad .ar.u { top: 16%; left: calc(50% - 7px); border-bottom-color: #9aa6c0; border-top-width: 0; }
#dpad .ar.d { bottom: 16%; left: calc(50% - 7px); border-top-color: #9aa6c0; border-bottom-width: 0; }
#dpad.left .ar.l, #dpad.right .ar.r, #dpad.up .ar.u, #dpad.down .ar.d { opacity: 1; filter: drop-shadow(0 0 4px #ffd27a); }
#dpadKnob {
  position: absolute; left: calc(50% - 15%); top: calc(50% - 15%); width: 30%; height: 30%; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #5a6684, #262d42); border: 2px solid #11141d; pointer-events: none;
  transition: transform 40ms linear;
}

/* arcade layout: KNIFE and JUMP on the bottom row, SPECIAL and DASH staggered above them */
#btns { position: absolute; right: var(--gr); bottom: calc(var(--gb) + 6px); width: calc(var(--bk) * 2 + 12px); height: calc(var(--bk) * 1.3 + var(--bj) + 12px); pointer-events: none; }
body.portrait #btns { bottom: calc(var(--gb) + 40px); }
.tbtn {
  position: absolute; border-radius: 50%; border: 0; padding: 0; margin: 0; pointer-events: auto; touch-action: none;
  display: grid; place-content: center; gap: 4px; text-align: center; color: #fff; font-family: var(--pix);
  box-shadow: inset 0 -5px 0 rgba(0,0,0,0.35), 0 4px 0 rgba(0,0,0,0.55);
  transition: transform 50ms linear, filter 50ms linear;
}
.tbtn b { font-size: 20px; font-weight: 700; text-shadow: 0 2px 0 rgba(0,0,0,0.45); }
.tbtn small { font-size: 10px; letter-spacing: 1px; font-weight: 600; opacity: 0.92; }
.tbtn.on { transform: translateY(3px) scale(0.96); filter: brightness(1.25); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.35), 0 1px 0 rgba(0,0,0,0.55); }
#bKnife { width: var(--bk); height: var(--bk); left: 0; bottom: 0; background: radial-gradient(circle at 40% 32%, #ff6a58, var(--knife) 55%, var(--knife-deep)); }
#bJump { width: var(--bk); height: var(--bk); right: 0; bottom: calc(var(--bk) * 0.3); background: radial-gradient(circle at 40% 32%, #ffd86a, var(--jump) 55%, var(--jump-deep)); color: #2a1c00; }
#bJump b { text-shadow: none; }
#bDash { width: var(--bj); height: var(--bj); right: calc((var(--bk) - var(--bj)) / 2); bottom: calc(var(--bk) * 1.3 + 10px); background: radial-gradient(circle at 40% 32%, #b8a4ff, var(--dash) 55%, var(--dash-deep)); }
#bSpecial { width: var(--bs); height: var(--bs); left: calc((var(--bk) - var(--bs)) / 2); bottom: calc(var(--bk) + 12px); background: radial-gradient(circle at 40% 32%, #6ad8f0, var(--spec) 55%, var(--spec-deep)); }

#tPause {
  position: absolute; pointer-events: auto; touch-action: none;
  width: 44px; height: 30px; border-radius: 15px; border: 2px solid #313a52; background: rgba(20,24,36,0.78);
  color: #c9d2e4; font-family: var(--pix); font-size: 13px; font-weight: 700; letter-spacing: 1px;
  right: var(--gr); top: var(--gt);
}
body.portrait #tPause { top: auto; right: auto; left: calc(50% - 22px); bottom: calc(var(--gb) + 6px); width: 58px; }

/* landscape: a handheld layout with the pad in side panels; slightly translucent in case it overlaps the screen edge */
body.touch-on:not(.portrait) #dpad, body.touch-on:not(.portrait) .tbtn { opacity: 0.82; }
body.touch-on:not(.portrait) .tbtn.on { opacity: 1; }
body.touch-on:not(.portrait) #tPause { opacity: 0.85; }
@media (max-height: 420px) {
  .tbtn small { display: none; }
}
.tbtn:focus-visible, #tPause:focus-visible { outline: 2px solid #ffd27a; outline-offset: 3px; }
#screen:focus-visible { outline: none; }
@media (prefers-reduced-motion: reduce) {
  .tbtn, #dpadKnob { transition: none; }
}
</style>

</head>
<body>
<div id="app">
  <canvas id="screen" tabindex="0" aria-label="Iron Alley game screen. Player one: arrow keys move, Z punch, X kick, C jump, V special. Player two: W A S D move, F punch, G kick, H jump, T special. P pauses."></canvas>
  <div id="safeProbe" aria-hidden="true"></div>
  <div id="touch" aria-hidden="true">
    <div class="brand"><b>IRON</b> ALLEY<span>TIP: TURN YOUR PHONE SIDEWAYS FOR A WIDER VIEW</span></div>
    <div class="grille" aria-hidden="true"></div>
    <div id="dpad" class="tctl">
      <i class="arm h"></i><i class="arm v"></i>
      <i class="ar l"></i><i class="ar r"></i><i class="ar u"></i><i class="ar d"></i>
      <span id="dpadKnob"></span>
    </div>
    <div id="btns">
      <button class="tbtn tctl" type="button" data-k="special" id="bSpecial"><b>S</b><small>SPIN</small></button>
      <button class="tbtn tctl" type="button" data-k="jump" id="bDash"><b>J</b><small>JUMP</small></button>
      <button class="tbtn tctl" type="button" data-k="punch" id="bKnife"><b>P</b><small>PUNCH</small></button>
      <button class="tbtn tctl" type="button" data-k="kick" id="bJump"><b>K</b><small>KICK</small></button>
    </div>
    <button id="tPause" type="button" aria-label="Pause">II</button>
  </div>
  <noscript>Iron Alley needs JavaScript to run.</noscript>
</div>

<script>
(function () {
/* ==========================================================================
   IRON ALLEY
   Core: screen constants, helpers, seeded random, settings, storage
   ========================================================================== */
'use strict';

const W = 384, H = 216;           // internal resolution (16:9); everything is drawn in these units
const STEP = 1 / 60;
const TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (p) => Math.random() < p;
const sgn = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const $ = (id) => document.getElementById(id);

function seeded(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
const coarse = window.matchMedia ? matchMedia('(pointer: coarse)').matches : isTouch;
const reducedMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)').matches : false;

const store = {
  get(k, d) {
    try { const v = localStorage.getItem('ironAlley.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; }
  },
  set(k, v) { try { localStorage.setItem('ironAlley.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } }
};

const settings = Object.assign(
  { music: 0.7, sfx: 0.85, fx: true, shake: !reducedMotion, level: 'normal', p1: 'kade', p2: 'suki', touch: 'auto', muted: false, friendly: false },
  store.get('settings', {})
);
function saveSettings() { store.set('settings', settings); }

const DEFAULT_SCORES = [
  { n: 'IRN', s: 250000, st: 4 }, { n: 'KDE', s: 180000, st: 3 }, { n: 'SUK', s: 120000, st: 3 },
  { n: 'ALY', s: 70000, st: 2 }, { n: 'VPR', s: 30000, st: 1 }
];
function loadScores() {
  const s = store.get('scores', null);
  if (!Array.isArray(s) || s.length !== 5) return DEFAULT_SCORES.map((e) => Object.assign({}, e));
  return s;
}

const DBG = {};               // profiling switches used by the tests
const QUALITY = { level: 0, res: [1, 0.8, 0.64] };

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

function hexRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixHex(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  const c = A.map((v, i) => Math.round(lerp(v, B[i], t)));
  return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
}

/* ==========================================================================
   Vector drawing helpers. Everything is drawn in world units (384 x 216);
   the screen transform scales it to the device, so shapes stay crisp at any size.
   ========================================================================== */

function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function disc(g, cx, cy, r, c) { if (r <= 0) return; g.fillStyle = c; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill(); }
function ring(g, cx, cy, r, t, c) { g.strokeStyle = c; g.lineWidth = t; g.beginPath(); g.arc(cx, cy, Math.max(0.05, r - t / 2), 0, TAU); g.stroke(); }
function tri(g, cx, top, w, h, c) { g.fillStyle = c; g.beginPath(); g.moveTo(cx, top); g.lineTo(cx + w / 2, top + h); g.lineTo(cx - w / 2, top + h); g.closePath(); g.fill(); }
function stampLine(g, x0, y0, x1, y1, w, col) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function ellipse(g, cx, cy, rx, ry, rot, c) { g.fillStyle = c; g.beginPath(); g.ellipse(cx, cy, Math.max(0.01, rx), Math.max(0.01, ry), rot || 0, 0, TAU); g.fill(); }
function polyPath(g, pts) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); }
function poly(g, pts, c) { g.fillStyle = c; polyPath(g, pts); g.fill(); }
function roundRectPath(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function rrect(g, x, y, w, h, r, c) { g.fillStyle = c; roundRectPath(g, x, y, w, h, r); g.fill(); }
function lgrad(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); for (const [t, c] of stops) gr.addColorStop(t, c); return gr; }
function rgrad(g, x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); for (const [t, c] of stops) gr.addColorStop(t, c); return gr; }
function rgba(hex, a) { const [r, gg, b] = hexRgb(hex); return 'rgba(' + r + ',' + gg + ',' + b + ',' + a + ')'; }
function shade(hex, t) { return t < 0 ? mixHex(hex, '#000000', -t) : mixHex(hex, '#ffffff', t); }

/** A tapered capsule from A to B (radii ra at A, rb at B). */
function capsulePath(g, ax, ay, bx, by, ra, rb) {
  const ang = Math.atan2(by - ay, bx - ax);
  g.beginPath();
  g.arc(ax, ay, Math.max(0.01, ra), ang + Math.PI / 2, ang + Math.PI * 1.5);
  g.arc(bx, by, Math.max(0.01, rb), ang - Math.PI / 2, ang + Math.PI / 2);
  g.closePath();
}

/** A waving, tapered ribbon (sashes, hair, plumes, banners). Returns the tip. */
function ribbonPath(g, x0, y0, ang, len, w0, w1, wave, phase, segs) {
  const n = segs || 8, L = [], R = [];
  let x = x0, y = y0, a = ang;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const w = lerp(w0, w1, t) / 2;
    const nx = -Math.sin(a), ny = Math.cos(a);
    L.push(x + nx * w, y + ny * w); R.push(x - nx * w, y - ny * w);
    a = ang + Math.sin(phase + t * 3.2) * wave * (0.25 + t);
    x += Math.cos(a) * len / n; y += Math.sin(a) * len / n;
  }
  g.beginPath();
  g.moveTo(L[0], L[1]);
  for (let i = 2; i < L.length; i += 2) g.lineTo(L[i], L[i + 1]);
  for (let i = R.length - 2; i >= 0; i -= 2) g.lineTo(R[i], R[i + 1]);
  g.closePath();
  return [x, y];
}

/* ---- cached soft sprites: glows and ground shadows ------------------------------ */
const GLOW_CACHE = {};
function glowSprite(col) {
  let c = GLOW_CACHE[col];
  if (c) return c;
  c = makeCanvas(128, 128);
  const g = c.getContext('2d');
  g.fillStyle = rgrad(g, 64, 64, 0, 64, [[0, rgba(col, 0.6)], [0.35, rgba(col, 0.22)], [0.7, rgba(col, 0.06)], [1, rgba(col, 0)]]);
  g.fillRect(0, 0, 128, 128);
  GLOW_CACHE[col] = c;
  return c;
}
/** Additive soft light centred on x, y with radius r. */
function drawGlow(g, x, y, r, col, a) {
  if (!settings.fx && r > 12) a = (a === undefined ? 1 : a) * 0.6;
  const op = g.globalCompositeOperation, ga = g.globalAlpha;
  g.globalCompositeOperation = 'lighter';
  if (a !== undefined) g.globalAlpha = ga * a;
  g.drawImage(glowSprite(col), x - r, y - r, r * 2, r * 2);
  g.globalCompositeOperation = op; g.globalAlpha = ga;
}
let SOFT_DOT = null;
function softDot() {
  if (SOFT_DOT) return SOFT_DOT;
  const c = makeCanvas(64, 64), g = c.getContext('2d');
  g.fillStyle = rgrad(g, 32, 32, 0, 32, [[0, 'rgba(255,255,255,1)'], [0.5, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
  g.fillRect(0, 0, 64, 64);
  SOFT_DOT = c;
  return c;
}
let SHADOW_SPR = null;
function shadowSprite() {
  if (SHADOW_SPR) return SHADOW_SPR;
  const c = makeCanvas(96, 32), g = c.getContext('2d');
  g.save(); g.scale(1, 1 / 3);
  g.fillStyle = rgrad(g, 48, 48, 0, 48, [[0, 'rgba(0,0,0,0.55)'], [0.55, 'rgba(0,0,0,0.3)'], [1, 'rgba(0,0,0,0)']]);
  g.fillRect(0, 0, 96, 96);
  g.restore();
  SHADOW_SPR = c;
  return c;
}

/** Offscreen canvas for pre-rendered art at the current render scale (world units in, crisp pixels out). */
let RS = 2;
function artCanvas(w, h) {
  const c = makeCanvas(Math.ceil(w * RS), Math.ceil(h * RS));
  const g = c.getContext('2d');
  g.scale(RS, RS);
  c.rs = RS; c.uw = w; c.uh = h;
  return [c, g];
}
/** Draw part of a pre-rendered art canvas; source and destination in world units. */
function blitArt(g, c, sx, sy, sw, sh, dx, dy, dw, dh) {
  const r = c.rs;
  g.drawImage(c, sx * r, sy * r, sw * r, sh * r, dx, dy, dw === undefined ? sw : dw, dh === undefined ? sh : dh);
}

/* ==========================================================================
   Type: Barlow Condensed for the interface and Bungee, a heavy street-sign face,
   for titles. Sizes are in world units, so text stays sharp at any resolution.
   ========================================================================== */

const FONT_UI = '"Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif';
const FONT_DISPLAY = '"Bungee", "Barlow Condensed", Impact, "Arial Narrow", sans-serif';
const MEASURE = makeCanvas(4, 4).getContext('2d');

function fontSpec(scale, opts) {
  const s = 8.4 * (scale || 1);
  if (opts && opts.display) return '400 ' + s + 'px ' + FONT_DISPLAY;
  return (opts && opts.weight || 600) + ' ' + s + 'px ' + FONT_UI;
}

function textWidth(str, scale, opts) {
  MEASURE.font = fontSpec(scale, opts);
  return MEASURE.measureText(opts && opts.raw ? String(str) : String(str).toUpperCase()).width;
}

/** Draw text with its top at y. opts: { scale, align, shadow, display, weight, raw, stroke, strokeW } */
function drawText(g, str, x, y, color, opts) {
  str = String(str);
  if (!(opts && opts.raw)) str = str.toUpperCase();
  const s = (opts && opts.scale) || 1;
  g.font = fontSpec(s, opts);
  g.textBaseline = 'top';
  g.textAlign = (opts && opts.align) || 'left';
  if (opts && opts.stroke) { g.lineJoin = 'round'; g.lineWidth = opts.strokeW || 1.6 * s; g.strokeStyle = opts.stroke; g.strokeText(str, x, y); }
  const shadow = opts && opts.shadow;
  if (shadow) { g.fillStyle = shadow; g.fillText(str, x + 0.5 * s, y + 0.6 * s); }
  g.fillStyle = color;

}

/** Ask the browser for the web fonts early; text uses fallbacks until they arrive. */
function loadFonts() {

/* ==========================================================================

const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  market: { bpm: 112, root: 40, mode: 'dor', prog: [0, 0, 3, 3, 0, 0, 4, 6], drums: 'funk', bass: 'slap', arp: 'stab', lead: 29, cut: 2000, loop: true },
  yard: { bpm: 120, root: 38, mode: 'min', prog: [0, 6, 5, 4, 0, 6, 3, 4], drums: 'rock', bass: 'drive', arp: 'stab', lead: 41, cut: 1800, loop: true },
  foundry: { bpm: 128, root: 41, mode: 'min', prog: [0, 0, 5, 6, 0, 3, 5, 4], drums: 'rock', bass: 'drive', arp: 'up', lead: 59, cut: 1500, loop: true },
  tower: { bpm: 132, root: 43, mode: 'dor', prog: [0, 5, 3, 4, 0, 5, 6, 4], drums: 'funk', bass: 'slap', arp: 'updown', lead: 71, cut: 2300, loop: true },
  boss: { bpm: 140, root: 39, mode: 'min', prog: [0, 1, 0, 6, 0, 1, 5, 4], drums: 'break', bass: 'drive', arp: 'up', lead: 89, cut: 1900, loop: true },

  over: { bpm: 82, root: 45, mode: 'min', prog: [0, 5, 3, 0], drums: 'none', bass: 'slap', arp: 'none', lead: 11, cut: 1200, loop: false, bars: 4 },
  ending: { bpm: 104, root: 48, mode: 'mix', prog: [0, 6, 3, 4, 0, 6, 3, 4], drums: 'funk', bass: 'slap', arp: 'updown', lead: 101, cut: 2400, loop: true }

const DRUMS = {
  funk: { k: 'x..x..x...x..x..', s: '....x..x....x...', h: 'xxxxxxxxxxxxxxxx', o: '......x.......x.' },
  rock: { k: 'x...x.x...x.x...', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.', o: '..............x.' },
  half: { k: 'x.........x.....', s: '........x.......', h: 'x.x.x.x.x.x.x.x.', o: '................' },
  break: { k: 'x.....x...x.....', s: '....x.......x..x', h: 'x.xxx.xxx.xxx.xx', o: '................' },
  none: { k: '................', s: '................', h: '................', o: '................' }

class Chip {

  applyVolumes() {

  }

  /* ---- effects --------------------------------------------------------------------- */
  /**
   * Effects. Hits are built as a body would sound: a low, short thump plus a
   * narrow slap of cloth and skin. Nothing bright or cracking, so a punch never

      case 'select': T(t, 660, 0.07, 'triangle', 0.2); T(t + 0.06, 990, 0.12, 'triangle', 0.2, null, { echo: true }); break;
      case 'back': T(t, 520, 0.09, 'triangle', 0.16, null, { slide: 330 }); break;
      case 'swing': N(t, 0.13, 0.42 * v, 'bandpass', 700 * pk, 1.0, null, { sweep: 2200 * pk, a: 0.03 }); break;

      case 'kick': thump(130, 48, 0.12, 0.56); slap(330, 0.06, 0.32); break;
      case 'heavy': thump(110, 38, 0.2, 0.64); slap(260, 0.09, 0.36); N(t, 0.25, 0.1 * v, 'lowpass', 500, 0.7); break;
      case 'block': T(t, 260, 0.06, 'triangle', 0.2 * v, null, { slide: 180 }); slap(700, 0.04, 0.2); break;
      case 'metal': thump(150, 70, 0.08, 0.4); T(t, 1240 * pk, 0.45, 'triangle', 0.12 * v, null, { decay: 0.1, sus: 0.2 }); T(t, 1860 * pk, 0.32, 'sine', 0.07 * v, null, { decay: 0.08 }); break;
      case 'wood': thump(220, 120, 0.07, 0.4); slap(900, 0.05, 0.3); break;
      case 'slash': N(t, 0.16, 0.22 * v, 'highpass', 2600, 0.8, null, { sweep: 6000 }); thump(200, 90, 0.05, 0.25); break;
      case 'grab': slap(600, 0.08, 0.3); T(t, 160, 0.08, 'sine', 0.25 * v, null, { slide: 120 }); break;
      case 'throw': N(t, 0.32, 0.55 * v, 'bandpass', 360, 1, null, { sweep: 1300, a: 0.06 }); T(t, 180, 0.2, 'sine', 0.2 * v, null, { slide: 90 }); break;
      case 'fall': thump(95, 34, 0.26, 0.7); N(t, 0.3, 0.2 * v, 'lowpass', 420, 0.8); slap(220, 0.12, 0.2, 0.02); break;
      case 'land': thump(120, 50, 0.08, 0.3); break;
      case 'step': thump(160, 90, 0.03, 0.08); break;
      case 'crate': thump(140, 60, 0.12, 0.5); for (let i = 0; i < 4; i++) N(t + i * 0.03 + Math.random() * 0.02, 0.06, 0.2 * v, 'bandpass', 1000 + Math.random() * 900, 2); break;
      case 'glass': for (let i = 0; i < 6; i++) T(t + i * 0.025 + Math.random() * 0.02, 2400 + Math.random() * 2400, 0.12, 'sine', 0.06 * v, null, { decay: 0.03 }); N(t, 0.2, 0.12 * v, 'highpass', 5000, 0.7); break;
      case 'knife': N(t, 0.25, 0.45 * v, 'bandpass', 1500, 2, null, { sweep: 800 }); break;
      case 'food': [0, 4, 7].forEach((n, i) => T(t + i * 0.06, hz(76 + n), 0.14, 'triangle', 0.18, null, { echo: true })); break;
      case 'pickup': T(t, 520, 0.06, 'square', 0.12, null, { cut: 2400 }); T(t + 0.05, 780, 0.1, 'square', 0.12, null, { cut: 2400 }); break;
      case 'oneup': [0, 4, 7, 12, 16].forEach((n, i) => T(t + i * 0.07, hz(72 + n), 0.22, 'triangle', 0.2, null, { echo: true, decay: 0.08 })); break;

  /* ---- music ----------------------------------------------------------------------- */
  play(name) {

    this.stopMusic();

        deg = clamp(deg + [-2, -1, -1, 1, 1, 2, 3][Math.floor(rnd() * 7)], 4, 13);

  stopMusic() {

    if (!this.song || !this.ctx) { this.song = null; this.songName = ''; return; }
    const t = this.ctx.currentTime;
    // let what is already scheduled fade under a quick dip rather than cutting dead
    this.duck.gain.cancelScheduledValues(t); this.duck.gain.setTargetAtTime(0, t, 0.05); this.duck.gain.setTargetAtTime(1, t + 0.45, 0.02);
    this.drumBus.gain.setTargetAtTime(0, t, 0.05); this.drumBus.gain.setTargetAtTime(1, t + 0.45, 0.02);

  /** Keeps a quarter second of music scheduled ahead of the clock. */

    if (D.o[i] === 'x' && full) this.noise(t, 0.16, 0.12, 'highpass', 7000, 0.8, db);

    // bass
    const bp = BASS[def.bass][i];

    }
    // arpeggio
    if (def.arp !== 'none' && (section > 0 || bar % 8 >= 4)) {

  }
  stepLead(s, def, chord, bar, i, t, section, mb, loop) {

      }
    }
  }
}

const chip = new Chip();

/* ==========================================================================
   Character data: palettes, inverse kinematics and the pose library.
   Local frame: origin at the feet, +x is forward (facing right), y down.
   Rendering lives in 31_soldiers.js.
   ========================================================================== */

/* ---- inverse kinematics --------------------------------------------- */
function ik2(ax, ay, bx, by, l1, l2, prefer) {
  let dx = bx - ax, dy = by - ay;
  let d = Math.hypot(dx, dy);
  const maxD = l1 + l2 - 0.02;
  if (d > maxD) { bx = ax + (dx / d) * maxD; by = ay + (dy / d) * maxD; dx = bx - ax; dy = by - ay; d = maxD; }
  if (d < 0.01) d = 0.01;
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mx = ax + (dx * a) / d, my = ay + (dy * a) / d;
  const pxv = -dy / d, pyv = dx / d;
  const j1 = [mx + pxv * h, my + pyv * h], j2 = [mx - pxv * h, my - pyv * h];
  let j;
  if (prefer === 'fwd') j = j1[0] >= j2[0] ? j1 : j2;
  else if (prefer === 'back') j = j1[0] <= j2[0] ? j1 : j2;
  else if (prefer === 'down') j = j1[1] >= j2[1] ? j1 : j2;
  else j = j1[1] <= j2[1] ? j1 : j2;
  return { j, e: [bx, by] };
}

/* ---- puppet ------------------------------------------------------------ */
function rotPt(p, r) {
  if (!r) return p;
  const c = Math.cos(r), s = Math.sin(r);
  return [p[0] * c + p[1] * s, -p[0] * s + p[1] * c];
}

function solvePose(pose, k) {
  const hipY = -(pose.hip == null ? 14 : pose.hip) * k;
  const tl = (pose.tl || 10) * k;
  const lean = (pose.lean || 0) * k;
  const hip = [0, hipY];
  const neck = [lean, hipY - Math.sqrt(Math.max(1, tl * tl - lean * lean))];
  const hd = pose.hd || [0, 0];
  const head = [neck[0] + 0.5 * k + hd[0] * k, neck[1] - 3.5 * k + hd[1] * k];
  const shF = [neck[0] + 0.5 * k, neck[1] + 1.5 * k];
  const shB = [neck[0] - 0.5 * k, neck[1] + 1.5 * k];
  const S = (p) => [p[0] * k, p[1] * k];
  const legF = ik2(hip[0] + 1 * k, hip[1], ...S(pose.ff || [3, 0]), 7 * k, 7 * k, pose.kneeF || 'fwd');
  const legB = ik2(hip[0] - 1 * k, hip[1], ...S(pose.bf || [-3, 0]), 7 * k, 7 * k, pose.kneeB || 'fwd');
  const armF = ik2(shF[0], shF[1], ...S(pose.fh || [5, -13]), 5 * k, 5 * k, pose.elbowF || 'back');
  const armB = ik2(shB[0], shB[1], ...S(pose.bh || [-2, -12]), 5 * k, 5 * k, pose.elbowB || 'back');
  const r = ((pose.rot || 0) * Math.PI) / 180;
  const R = (p) => rotPt(p, r);
  return {
    hip: R(hip), neck: R(neck), head: R(head), shF: R(shF), shB: R(shB),
    kneeF: R(legF.j), footF: R(legF.e), kneeB: R(legB.j), footB: R(legB.e),
    elbF: R(armF.j), handF: R(armF.e), elbB: R(armB.j), handB: R(armB.e),
    rot: r
  };
}

/* ---- the whole soldier -------------------------------------------------------------------- */
function renderFighter(g, kind, pose, x, y, face, anim, frame, tint) {
  const def = CHARS[kind], k = def.k;
  let d = dpal(def.pal);
  if (tint) d = tintPal(d, tint);
  const P = solvePose(pose, k);
  P.coatSwing = pose.coatSwing || 0;
  LX = -0.24 * face; LY = -0.26;
  const expr = PAIN_ANIMS.has(anim) ? 'hurt' : (KIAI_ANIMS.has(anim) && frame >= 0.55 && frame < 2.2 ? 'kiai' : 'calm');
  const seed = (x * 0.731) % 7;
  const ph = game.t * 6.5 + seed;
  g.save();
  g.translate(x, y + (pose.dy || 0) * k);
  if (face < 0) g.scale(-1, 1);
  if (!pose.noBackArm) drawArmV(g, d, P.shB, P.elbB, P.handB, k, true, pose.fistB);
  if (pose.itemB) drawHeldV(g, d, P.handB, pose.itemB, pose.iaB, k, P.rot);
  drawLegV(g, d, P, P.kneeB, P.footB, k, true);
  drawTorsoV(g, d, P, k);
  drawLegV(g, d, P, P.kneeF, P.footF, k, false);
  drawBeltV(g, d, P, k);
  const T = torsoFrame(P);
  drawHeadV(g, d, P.head[0], P.head[1], P.neck[0], P.neck[1], Math.atan2(T.ax, -T.ay) * 0.55, k, expr, ph, seed);
  if (!pose.noFrontArm) {
    drawArmV(g, d, P.shF, P.elbF, P.handF, k, false, pose.fistF);
    if (pose.item) drawHeldV(g, d, P.handF, pose.item, pose.ia, k, P.rot);
  }
  if (pose.tied && !d.tint) for (let i = 0; i < 2; i++) line(g, P.handB[0] - 1.6 * k, P.handB[1] - 0.6 * k + i * k, P.handB[0] + 1.6 * k, P.handB[1] - 0.2 * k + i * k, 0.5 * k, '#c9a463');
  g.restore();
}

/* Translucent or flashing fighters are painted once into a scratch layer and composited in
   a single pass, so overlapping limbs never stack up into a washed out, see-through figure. */
let SPRITE_DIRECT = false;
let SPRITE_HOLD = null;      // a weapon to keep in the hand through poses that have none (kicks)   // reflections set this: they are faint enough to draw straight through
let SPRITE_LAYER = null;
function spriteLayer(cv) {
  if (!SPRITE_LAYER || SPRITE_LAYER.width !== cv.width || SPRITE_LAYER.height !== cv.height) SPRITE_LAYER = makeCanvas(cv.width, cv.height);
  return SPRITE_LAYER;
}
function spriteRect(m, cv, x, y, k) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const px of [x - 36 * k, x + 36 * k]) for (const py of [y - 46 * k, y + 8 * k]) {
    const X = m.a * px + m.c * py + m.e, Y = m.b * px + m.d * py + m.f;
    if (X < x0) x0 = X; if (X > x1) x1 = X; if (Y < y0) y0 = Y; if (Y > y1) y1 = Y;
  }
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  x1 = Math.min(cv.width, Math.ceil(x1)); y1 = Math.min(cv.height, Math.ceil(y1));
  return x1 > x0 && y1 > y0 ? [x0, y0, x1 - x0, y1 - y0] : null;
}

/** Same call shape as the old sprite blitter; frame may be fractional for smooth motion. */
function drawSprite(g, kind, anim, frame, facing, x, y, flash, alpha) {
  const a = alpha === undefined ? 1 : clamp(alpha, 0, 1);
  if (a <= 0.01) return;
  let pose = poseAt(kind, anim, frame);
  if (SPRITE_SWAP && pose.item && SPRITE_SWAP[pose.item]) pose = Object.assign({}, pose, { item: SPRITE_SWAP[pose.item] });
  else if (SPRITE_HOLD && !pose.item && !pose.noFrontArm) pose = Object.assign({}, pose, { item: SPRITE_HOLD, ia: -70 });
  const ga = g.globalAlpha, net = ga * a;
  const cv = g.canvas;
  const layered = (flash || net < 0.97) && !SPRITE_DIRECT && QUALITY.level < 2 && cv && cv.id === 'screen' && g.getTransform;
  if (!layered) {
    g.globalAlpha = net;
    renderFighter(g, kind, pose, x, y, facing, anim, frame, null);
    if (flash) { g.globalAlpha = net * 0.22; renderFighter(g, kind, pose, x, y, facing, anim, frame, flash === true ? '#ffffff' : flash); }
    g.globalAlpha = ga;
    return;
  }
  const m = g.getTransform();
  const r = spriteRect(m, cv, x, y, CHARS[kind].k);
  if (!r) return;
  const L = spriteLayer(cv), q = L.getContext('2d');
  q.setTransform(1, 0, 0, 1, 0, 0); q.globalAlpha = 1; q.globalCompositeOperation = 'source-over';
  q.clearRect(r[0], r[1], r[2], r[3]);
  q.setTransform(m.a, m.b, m.c, m.d, m.e, m.f);
  renderFighter(q, kind, pose, x, y, facing, anim, frame, null);
  if (flash) {
    // lighten only the painted figure, keeping its line art readable under the flash
    q.setTransform(1, 0, 0, 1, 0, 0);
    q.globalCompositeOperation = 'source-atop';
    q.globalAlpha = flash === true ? 0.3 : 0.4;
    q.fillStyle = flash === true ? '#fff8ee' : flash;
    q.fillRect(r[0], r[1], r[2], r[3]);
    q.globalCompositeOperation = 'source-over'; q.globalAlpha = 1;
  }
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = net;
  g.drawImage(L, r[0], r[1], r[2], r[3], r[0], r[1], r[2], r[3]);
  g.restore();
}

/** Joint positions in world space, used for motion trails. */
function fighterJoints(kind, anim, frame, facing, x, y) {
  const def = CHARS[kind], pose = poseAt(kind, anim, frame);
  const P = solvePose(pose, def.k);
  const oy = y + (pose.dy || 0) * def.k;
  const w = (p) => [x + p[0] * facing, oy + p[1]];
  return { handF: w(P.handF), handB: w(P.handB), footF: w(P.footF), footB: w(P.footB), head: w(P.head) };
}

/** A fighter's head alone, for portraits and life icons. */
function drawPortrait(g, kind, x, y, size, face) {
  const def = CHARS[kind], d = dpal(def.pal), k = def.k;
  const s = size / (8 * k);
  g.save(); g.translate(x, y); g.scale(s * (face || 1), s);
  LX = -0.24; LY = -0.26;
  drawHeadV(g, d, 0, 0, 0, 3.6 * k, 0, k, 'calm', game.t * 5, 1);
  g.restore();
}

/** Bring a wave on from the edges of the screen. side: L, R, or a number for an exact x. */
function spawnWave(list) {
  let k = 0;
  for (const [type, side] of list) {
    const fromL = side === 'L', x = typeof side === 'number' ? side : fromL ? game.camX - 30 - k * 22 : game.camX + W + 30 + k * 22;
    const z = Z0 + 10 + ((k * 23 + game.waveIdx * 11) % (Z1 - Z0 - 16));
    const p = pitAhead(x, z);
    const f = newFoe(type, x, p ? p[2] - 8 : z, { spawnT: 0.45 + k * 0.12 });
    f.face = fromL ? 1 : -1;
    game.foes.push(f);
    k++;
  }
}

/* ==========================================================================
   Stage art. Each district is painted in code: a far layer that drifts
   slowly, and the street itself (walls, shop fronts, floor). Both are cut
   into tiles that are painted once at the screen's resolution and reused.
   Signs and shop names are invented.
   ========================================================================== */

const TILE = 192;
const TILES = new Map();
function stageTile(si, layer, i, px) {
  const key = si + '|' + layer + '|' + i + '|' + px;
  let c = TILES.get(key);
  if (c) return c;
  if (TILES.size > 90) TILES.clear();
  c = makeCanvas(Math.ceil(TILE * px), Math.ceil(H * px));
  const g = c.getContext('2d');
  g.scale(px, px); g.translate(-i * TILE, 0);
  g.beginPath(); g.rect(i * TILE, 0, TILE, H); g.clip();
  (layer === 0 ? FAR_ART : NEAR_ART)[STAGES[si].id](g, i * TILE, (i + 1) * TILE);
  TILES.set(key, c);
  return c;
}

/** The street floor shared by every stage: bands that recede, seams that lean with depth. */
function streetFloor(g, x0, x1, top, cols, seam, lines) {
  for (let i = 0; i < 6; i++) {
    const y = top + i * (H - top) / 6;
    g.fillStyle = cols[i % cols.length]; g.fillRect(x0, y, x1 - x0, (H - top) / 6 + 0.5);
  }
  g.strokeStyle = seam; g.lineWidth = 0.6;
  for (let x = Math.floor(x0 / 40) * 40 - 40; x < x1 + 40; x += 40) { g.beginPath(); g.moveTo(x, top); g.lineTo(x - 30, H); g.stroke(); }
  if (lines) for (const y of lines) { g.fillStyle = y[1]; g.fillRect(x0, y[0], x1 - x0, y[2] || 1); }
}

function drawStageLive(g, si, camX, back) {
  const id = STAGES[si].id, t = game.t;

      const tr = game.train, x = tr.x - camX;
      for (let k = 0; k < 9; k++) { const cx = x + k * 74; if (cx < -80 || cx > W + 10) continue; rect(g, cx, 98, 70, 30, k === 0 ? '#c8a020' : ['#5a3a2a', '#2a4a5a', '#4a4a52'][k % 3]); rect(g, cx, 98, 70, 2, 'rgba(255,255,255,0.2)'); for (const wx of [10, 58]) disc(g, cx + wx, 129, 4, '#141418'); if (k === 0) { rect(g, cx + 46, 104, 16, 10, '#9ad8ff'); drawGlow(g, cx + 70, 118, 30, '#fff2c0', 0.8); } }
    }
    if (id === 'foundry') {
      // flicker the furnace glow
      const k = 0.5 + 0.5 * Math.sin(t * 9) * Math.sin(t * 5.3);
      for (let b = Math.floor((camX - 60) / 160); b * 160 < camX + W + 60; b++) drawGlow(g, b * 160 + 72 - camX, 100, 70, '#ff6a10', 0.25 + 0.25 * k);
    }

  }
  if (id === 'tower') {
    // rain and the odd flash of lightning
    g.strokeStyle = 'rgba(180,200,240,0.35)'; g.lineWidth = 0.5; g.beginPath();
    for (let i = 0; i < 80; i++) { const x = (i * 53.3 + t * 40) % (W + 20) - 10, y = (i * 37.1 + t * 420) % (viewH() + 20) - 10; g.moveTo(x, y); g.lineTo(x - 3, y + 9); }

    if (fl && settings.fx) rect(g, 0, 0, W, viewH(), 'rgba(200,220,255,0.22)');
  }
  if (id === 'market') {
    // steam from a grate
    for (let i = 0; i < 6; i++) { const ph = (t * 0.4 + i / 6) % 1, x = 760 - camX + Math.sin(t + i) * 6; if (x < -40 || x > W + 40) continue; g.globalAlpha = 0.18 * (1 - ph); disc(g, x, 200 - ph * 80, 8 + ph * 20, '#d8d0e0'); }
    g.globalAlpha = 1;

    for (let i = 0; i < 24; i++) { const ph = (t * (0.2 + (i % 5) * 0.05) + i * 0.13) % 1, x = ((i * 97) % W) + Math.sin(t * 2 + i) * 8; g.globalAlpha = 1 - ph; rect(g, x, 216 - ph * 200, 1.2, 1.2, '#ffb040'); }
    g.globalAlpha = 1;
  }
}

let FID = 0;
function makeFighter(o) {
  return Object.assign({
    id: ++FID, x: 0, z: 170, h: 0, vx: 0, vz: 0, vh: 0, face: 1, state: 'idle', st: 0, anim: 'idle', frame: 0,

    hold: null, heldBy: null, holdT: 0, knees: 0, dead: false, alpha: 1, kdCount: 0, lastHitBy: null, spawnT: 0
  }, o);
}

function newHero(slot, id) {
  const H = HEROES[id] || HEROES.kade;
  return makeFighter({ hero: true, slot, def: H, kind: H.kind, name: H.name, hp: H.hp, maxHp: H.hp, x: game.camX + 60 + slot * 26, z: 170 + slot * 16, face: 1,
    lives: 3, score: 0, meter: 0, spinCool: 0, punches: 0, kicks: 0, chainT: 0, power: H.power, speed: H.speed, inv: 2, active: true });
}
function newFoe(type, x, z, extra) {
  const D = FOES[type];
  const hp = Math.round(D.hp * game.diff.hp * (D.boss && game.heroes.filter((h) => h.active).length > 1 ? 1.35 : 1));
  return makeFighter(Object.assign({ foe: true, type, def: D, kind: D.kind, name: D.name, hp, maxHp: hp, x, z, face: x < game.camX + W / 2 ? 1 : -1,

}

/* ---- shared helpers ------------------------------------------------------------------------- */
function setSt(f, s, anim) { f.state = s; f.st = 0; f.anim = anim || s; f.frame = 0; }
function grounded(f) { return f.h <= 0.01 && f.vh <= 0; }
function canAct(f) { return ['idle', 'walk'].includes(f.state); }
function fighters() { return game.heroes.filter((h) => h.active && !h.dead).concat(game.foes); }
function liveHeroes() { return game.heroes.filter((h) => h.active && !h.dead && h.state !== 'dead'); }

/** Begin an attack. */
function startAttack(f, key) {
  const A = ATK[key];
  f.atk = key; f.atkHit = new Set(); setSt(f, 'attack', A.anim);
  if (A.air) f.state = 'jattack';
  if (A.weapon && f.weapon === 'knife') f.anim = 'stab';
  chip.sfx(A.t[0] > 0.3 ? 'swingH' : 'swing', { v: 0.8 });
}
function atkPhase(f) {
  const A = ATK[f.atk], t = f.st;
  return t < A.t[0] ? 0 : t < A.t[0] + A.t[1] ? 1 : t < A.t[0] + A.t[1] + A.t[2] ? 2 : 3;
}

/** Does attacker a reach target b with attack A right now? */
function inReach(a, b, A) {
  if (Math.abs(a.z - b.z) > DZ_HIT * (A.wave ? 1.8 : 1)) return false;
  const dx = (b.x - a.x) * a.face, k = (a.def.boss ? 1.2 : a.heavy ? 1.15 : 1) * BODY;
  if (dx < A.r[0] * k - 10 || dx > A.r[1] * k + 6) return false;
  if (Math.abs(a.h - b.h) > 42) return false;
  return true;
}

/** Apply a hit from attacker a to target b. */
function landHit(a, b, A, key) {
  if (b.inv > 0 || b.state === 'down' || b.state === 'dead' || b.state === 'getup' || b.state === 'tossed' || b.dead) return false;
  if (b.foe && a.foe) return false;
  if (b.hero && a.hero && !settings.friendly) return false;
  const dir = b.state === 'held' ? a.face : Math.sign(b.x - a.x) || a.face;
  let dmg = A.dmg * (a.hero ? a.power * (a.weapon && A.weapon ? 1 : 1) : game.diff.dmg);
  if (a.hero && b.hold) b.hold = null;
  if (b.heldBy && !(A.grab && b.heldBy === a)) { const h = b.heldBy; h.hold = null; b.heldBy = null; if (h.state === 'grab') setSt(h, 'idle'); }
  b.hp -= dmg; b.flash = 0.12; b.lastHitBy = a;
  if (b.foe) { game.focus = b; game.focusT = 3; }
  if (a.hero) { a.score += Math.round(dmg * 10); a.combo++; a.comboT = 0.9; game.hitCount++; if (a.combo > game.stats.bestCombo) game.stats.bestCombo = a.combo; }
  if (b.pinnedBy && b.pinnedBy !== a) { /* a pinned hero takes the hit; the holder keeps hold */ }
  if (b.pinning) freePin(b.pinning, false);
  game.hitstop = Math.max(game.hitstop, A.stop || 0.05);
  game.shake = Math.max(game.shake, A.shake || (A.kd ? 4 : 2));

function knockDown(b, dir, launch, push, ko) {

/* ---- per-step update for every fighter -------------------------------------------------------- */
function updateFighter(f, dt) {
  f.st += dt;

  const k = CHARS[f.kind].k / 1.9;
  // vertical motion
  if (f.h > 0 || f.vh > 0) {
    f.vh -= GRAV * dt; f.h += f.vh * dt;

      if (f.state === 'fall' || f.state === 'flung') {
        if (f.bounce !== true && !f.ko) { f.bounce = true; f.vh = 90; chip.sfx('fall', { v: 0.8, p: 1 / k }); game.shake = Math.max(game.shake, 3); dust(f.x, f.z, 1); }
        else { f.bounce = false; setSt(f, 'down', 'down'); f.vx = 0; chip.sfx('land', { v: 0.6 }); dust(f.x, f.z, 0.7); if (f.thrownBy) f.thrownBy = null; }
      } else if (f.state === 'air' || f.state === 'jattack') { setSt(f, 'idle'); chip.sfx('land', { v: 0.5 }); dust(f.x, f.z, 0.4); f.atk = null; }
    }

function updateAttack(f, dt) {

      const B = A.r[0] < 0 && A.r[1] > 0 ? Object.assign({}, A, { r: [0, A.r[1]] }) : A;

/** Fighters standing on top of each other drift apart, so the gang walks round you, not through you. */
function separate(dt) {
  const L = fighters().filter((f) => grounded(f) && !['down', 'fall', 'held', 'flung', 'dead', 'tossed', 'pinned', 'pinning'].includes(f.state) && !f.heldBy && !f.hold);

/* ---- pits ----------------------------------------------------------------------------------------
   A pit is a hole in the front part of the floor: x0..x1 along the street, from depth zTop to the front.
   The back strip stays solid so there is always a way round. */
function inPit(x, z) {

  return false;
}

  const S = game.stageDef;

/* ---- the players ---------------------------------------------------------------------------------
   Punch and kick are separate buttons. Pressing attack toward your back throws the elbow.
   Two quick hits double an enemy over; walk into them to grab. In a grab, punch knees,
   kick throws them over your shoulder. Jump, then kick in the air for a flying kick.
   The special is a jumping spin kick that clears both sides. */
function updateHero(h, I, P, dt) {
  if (!h.active) return;

  for (const k of BUF) if (P[k]) h.buf = { k, t: 0.34 };
  if (h.buf) { h.buf.t -= dt; if (h.buf.t <= 0) h.buf = null; }
  const free = ['idle', 'walk', 'grab'].includes(h.state) || (h.state === 'air' && h.buf && h.buf.k !== 'jump');
  if (free && h.buf && !BUF.some((k) => P[k])) P = Object.assign({}, P, { [h.buf.k]: true });
  if (free && h.buf && BUF.some((k) => P[k])) h.buf = null;

        if (h.weapon === 'drum') { throwWeapon(h); break; }
        if (h.weapon && h.weapon !== 'knife' && P.punch && !back) { startAttack(h, 'swing'); break; }
        if (h.weapon === 'knife' && P.punch && !back) { startAttack(h, 'stab'); break; }

/** The special: a jumping spin kick. On a short cool-down, no other cost. */
function doSpecial(h, dirX) {

function grab(h, t) {

}

  h.hold = null; setSt(h, 'idle');

    game.shake = Math.max(game.shake, 6); game.hitstop = Math.max(game.hitstop, 0.08);
    chip.sfx('heavy', { p: 0.8 }); chip.sfx('fall'); dust(t.x, t.z, 1.2);

/* ---- arm pins: one of the gang grabs you from behind and holds you for a partner ------------------ */
function pinHero(f, h) {

  setSt(f, 'pinning', 'pinning'); f.face = h.face; f.x = h.x - h.face * 15 * (CHARS[f.kind].k / 1.9); f.z = h.z;
  chip.sfx('grab'); popAt(h.x, h.z, 'BREAK FREE!', '#ff8a8a');
  // the partners rush in

}
function freePin(h, struggled) {
  const f = h.pinnedBy;

/* ---- the gang's brains --------------------------------------------------------------------------- */
function updateFoe(f, dt) {

  if (f.state === 'pinning') { f.vx = 0; f.vz = 0; return; }
  if (!canAct(f)) return;
  const D = f.def, heroes = liveHeroes();
  if (!heroes.length) { setSt(f, 'idle', 'taunt'); f.vx = 0; f.vz = 0; return; }
  if (!f.target || f.target.dead || f.target.state === 'dead' || !f.target.active || Math.random() < dt * 0.15) f.target = heroes.reduce((a, b) => (Math.abs(b.x - f.x) + Math.abs(b.z - f.z) < Math.abs(a.x - f.x) + Math.abs(a.z - f.z) ? b : a));

function addItem(type, x, z, extra) {

/* ---- update items, projectiles and effects ---------------------------------------------------- */
function updateItems(dt) {

const MEDALS = [

const game = {
  state: 'boot', t: 0, stateT: 0, menu: 0, hits: [], toast: null, medalQ: [], medalT: 0, pops: [], fx: [], items: [], shots: [],
  scores: loadScores(), hi: 0, demo: false, auto: false, heroes: [], foes: [], stage: 0, stageDef: null, camX: 0, lockX: 0, waveIdx: 0,
  waveLive: false, goT: 0, shake: 0, hitstop: 0, slowmo: 0, flash: 0, focus: null, focusT: 0, diff: DIFFS.normal, players: 1,
  stats: {}, page: 0, optFrom: 'title', pick: 0, entryQ: [], train: null, hitCount: 0, idleT: 0, banner: null, later: [], boss: null

game.hi = game.scores[0].s;

function setState(s) { game.state = s; game.stateT = 0; }

}

/* ---- one step of play -------------------------------------------------------------------------- */
function updatePlay(dt) {

    if (h.state === 'dead') { h.contT -= dt; if (pi.pressed.start || pi.pressed.punch) { continueHero(h); chip.sfx('join'); } else if (h.contT <= 0) { h.active = false; h.gone = true; } return; }

  updateItems(dt);

  for (const h of g.heroes) if (h.weapon) g.stats.used[h.weapon] = 1;
  // waves and the camera
  if (g.waveLive && g.foes.length === 0 && g.foes.every((f) => f.dead)) {

function joinIn(h) {

}

}
function submitEntry() {

  g.scores.push(row); g.scores.sort((a, b) => b.s - a.s); g.scores.length = 5;

function openPause() { if (game.state === 'play' && !game.demo) { setState('pause'); game.menu = 0; if (chip.ctx) chip.musicBus.gain.setTargetAtTime(0.0001, chip.ctx.currentTime, 0.05); } }

function updateGame(dt, I, P) {

  chip.tick();

/* ---- the bot: plays the attract mode and the automated tests ----------------------------------- */
const BOT = new Map();

  const foes = game.foes.filter((f) => !f.dead && f.spawnT <= 0 && f.state !== 'down');
  const it = nearItem(h);
  if (!foes.length) {
    // walk on toward the next stop
    const tx = game.camX + W * 0.7;
    if (h.x < tx) I.right = true;
    if (it && !h.weapon && Math.random() < 0.1) P.punch = true;
  } else {
    const t = foes.reduce((a, f) => (Math.abs(f.x - h.x) + Math.abs(f.z - h.z) < Math.abs(a.x - h.x) + Math.abs(a.z - h.z) ? f : a));

    if (Math.abs(dx) > want + 4) { if (dx > 0) I.right = true; else I.left = true; }
    else if (Math.abs(dx) < want - 10) { if (dx > 0) I.left = true; else I.right = true; }
    if (Math.abs(dz) < 7 && Math.abs(dx) < want + 14 && canAct(h)) {

      else {

        else if (t.state === 'dizzy') { if (dx > 0) I.right = true; else I.left = true; }
        else if (r < 0.6) P.punch = true; else P.kick = true;

    if (h.state === 'pinned') { P.punch = Math.random() < 0.5; P.kick = !P.punch; }

    const back = foes.find((f) => (f.x - h.x) * h.face < 0 && Math.abs(f.x - h.x) < 40 && Math.abs(f.z - h.z) < 8);
    if (back && canAct(h) && Math.random() < 0.3) { P.punch = true; P.kick = false; I.left = h.face > 0; I.right = h.face < 0; }

/* ==========================================================================

const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789. ';
const HERO_ORDER = ['kade', 'suki'];

function menuMove(n, P) {
  let m = game.menu;
  if (P.up) m = (m + n - 1) % n;
  if (P.down) m = (m + 1) % n;

}

function updateMenus(dt, I, P) {
  const g = game;

  const back = P.kick || P.back;
  const hit = tapHit();
  const d = P.left ? -1 : P.right ? 1 : 0;

    case 'boot':

      break;
    case 'title': {
      g.idleT += dt;
      if (P.any || input.tap) g.idleT = 0;
      menuMove(TITLE_ITEMS.length, P);
      let act = confirm ? g.menu : -1;
      if (hit) { g.menu = hit.i; act = hit.i; }
      if (act === 0 || act === 1) { chip.sfx('select'); g.players = act + 1; setState('select'); g.menu = 0; g.ready = [false, false]; }
      else if (act === 2) { chip.sfx('select'); setState('howto'); g.page = 0; }
      else if (act === 3) { chip.sfx('select'); setState('scores'); g.attract = false; }
      else if (act === 4) { chip.sfx('select'); setState('medals'); }
      else if (act === 5) { chip.sfx('select'); g.optFrom = 'title'; setState('options'); g.menu = 0; }

      const flip = (key) => { settings[key] = HERO_ORDER[(HERO_ORDER.indexOf(settings[key]) + 1) % 2]; chip.sfx('select'); saveSettings(); };
      if (g.menu === 0 && (P1.left || P1.right)) flip('p1');
      if (two && (P2.left || P2.right)) flip('p2');
      if (P1.up || P1.down) { g.menu = g.menu ? 0 : 1; chip.sfx('move'); }
      if (g.menu === 1 && (P1.left || P1.right)) { const n = LEVELS.length; settings.level = LEVELS[(LEVELS.indexOf(settings.level) + (P1.right ? 1 : -1) + n) % n]; chip.sfx('move'); saveSettings(); }

      if (hit) {
        if (hit.p !== undefined) { settings[hit.p] = hit.hero; chip.sfx('select'); saveSettings(); }
        else if (hit.level) { settings.level = hit.level; chip.sfx('move'); saveSettings(); }
        else if (hit.go) go = true;
        else if (hit.back) { chip.sfx('back'); setState('title'); g.menu = 0; break; }
      }

      else if (P1.kick || P1.back) { chip.sfx('back'); setState('title'); g.menu = 0; }
      break;
    }
    case 'medals':

      break;
    case 'scores':
      if (g.attract) { if (P.any || input.tap || g.stateT > 9) { setState('title'); g.idleT = 0; } }
      else if (confirm || back || (input.tap && g.stateT > 0.3)) { chip.sfx('back'); if (g.demo) { setState('title'); g.menu = 3; } else toTitle(0); }
      break;
    case 'howto':

      else if (d < 0 && g.page > 0) { g.page--; chip.sfx('move'); }
      else if (back || (hit && hit.back)) { setState('title'); g.menu = 2; chip.sfx('back'); }
      break;
    case 'options': {

      let dd = d, act = P.punch || P.start || P.jump;
      if (hit) { g.menu = hit.i; if (hit.dir) dd = hit.dir; else act = true; }

      if (act === 0) { chip.sfx('select'); closePause(); }
      else if (act === 1) { chip.sfx('select'); g.optFrom = 'pause'; setState('options'); g.menu = 0; }
      else if (act === 2) { chip.sfx('back'); chip.applyVolumes(); chip.stopMusic(); toTitle(0); }

      if (hit) { if (hit.slot !== undefined) { e.i = hit.slot; dl = hit.dl; } else if (hit.ok) { ok = true; e.i = 2; } }
      if (dl) { const k = (LETTERS.indexOf(e.name[e.i]) + dl + LETTERS.length) % LETTERS.length; e.name[e.i] = LETTERS[k]; chip.sfx('tick'); }
      if (mv) { e.i = clamp(e.i + mv, 0, 2); chip.sfx('move'); }

      else if (P.kick && e.i > 0) { e.i--; chip.sfx('back'); }
      break;
    }
    default: break;
  }
}

function adjustOption(i, d, activate) {
  switch (OPTION_ITEMS[i]) {
    case 'MUSIC': settings.music = clamp(Math.round(settings.music * 10 + (d || 1)) / 10, 0, 1); chip.applyVolumes(); chip.sfx('move'); break;
    case 'EFFECTS': settings.sfx = clamp(Math.round(settings.sfx * 10 + (d || 1)) / 10, 0, 1); chip.applyVolumes(); chip.sfx('punch'); break;
    case 'GLOW FX': settings.fx = !settings.fx; chip.sfx('move'); break;
    case 'SCREEN SHAKE': settings.shake = !settings.shake; chip.sfx('move'); break;
    case 'FRIENDLY FIRE': settings.friendly = !settings.friendly; chip.sfx('move'); break;
    case 'TOUCH PAD': { const o = ['auto', 'on', 'off']; settings.touch = o[(o.indexOf(settings.touch || 'auto') + (d < 0 ? 2 : 1)) % 3]; chip.sfx('move'); layoutTouch(); break; }

function leaveOptions() {

  else { setState('title'); game.menu = 5; }
}

/* ==========================================================================
   Input: keyboard, gamepad and touch pad merged into one action state
   ========================================================================== */

const ACTIONS = ['left', 'right', 'up', 'down', 'punch', 'kick', 'jump', 'special', 'start', 'pause', 'back'];
/* player one on the arrows, player two on the left hand side of the keyboard */
const KEYMAP = {
  ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
  KeyZ: 'punch', KeyJ: 'punch', KeyX: 'kick', KeyK: 'kick', KeyC: 'jump', Space: 'jump', KeyL: 'jump', KeyV: 'special', KeyI: 'special',
  Enter: 'start', NumpadEnter: 'start', KeyP: 'pause', Escape: 'back'

function newPlayerInput() {
  const o = { kb: {}, pad: {}, touch: {}, latch: {}, prev: {}, pend: {}, held: {}, pressed: {}, any: false };
  for (const a of ACTIONS) { o.held[a] = false; o.pressed[a] = false; o.prev[a] = false; }

}
const input = {
  pl: [newPlayerInput(), newPlayerInput()],
  tap: null, tapQueue: [], anyLatch: false, usingTouch: false, usingPad: false, pads: 0
};

function initInput() {
  window.addEventListener('keydown', (ev) => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    input.usingTouch = false;
    if (ev.code === 'KeyM' && !ev.repeat) {
      settings.muted = !settings.muted; saveSettings(); chip.unlock(); chip.applyVolumes();
      game.toast = { s: settings.muted ? 'SOUND OFF  (M)' : 'SOUND ON  (M)', t: 0 };
      ev.preventDefault(); return;
    }
    const a1 = KEYMAP[ev.code], a2 = KEYMAP2[ev.code], a = a1 || a2, pi = a1 ? input.pl[0] : input.pl[1];
    input.anyLatch = true;
    if (!a) return;
    ev.preventDefault();
    if (!pi.kb[a]) pi.latch[a] = true;
    pi.kb[a] = true; pi.any = true;
    if (a === 'back') pi.latch.pause = true;
    chip.unlock();

  window.addEventListener('keyup', (ev) => {
    const a1 = KEYMAP[ev.code], a2 = KEYMAP2[ev.code];
    if (a1) input.pl[0].kb[a1] = false;
    if (a2) input.pl[1].kb[a2] = false;

    try { cv.focus({ preventScroll: true }); } catch (e) { /* focus is best effort */ }
    if (ev.pointerType === 'touch') input.usingTouch = true;
    const r = cv.getBoundingClientRect();
    const v = view;
    const x = ((ev.clientX - r.left) * (cv.width / r.width) - v.ox) / v.scale;
    const y = ((ev.clientY - r.top) * (cv.height / r.height) - v.oy) / v.scale - (v.dy || 0);
    input.tapQueue.push({ x, y });
    input.anyLatch = true;
  });
}

/* ---- touch pad ----------------------------------------------------------------- */
const touchPointers = new Map();
function initTouch() {
  const root = $('touch');
  if (!root) return;
  const onDown = (ev) => {
    ev.preventDefault();
    chip.unlock();
    input.usingTouch = true;
    try { ev.target.setPointerCapture(ev.pointerId); } catch (e) { /* not capturable */ }
    touchPointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

  };
  const onMove = (ev) => {
    if (!touchPointers.has(ev.pointerId)) return;
    ev.preventDefault();
    touchPointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    recomputeTouch(false);
  };
  const onUp = (ev) => {
    if (!touchPointers.has(ev.pointerId)) return;
    touchPointers.delete(ev.pointerId);
    recomputeTouch(false);
  };
  for (const el of root.querySelectorAll('.tctl')) {
    el.addEventListener('pointerdown', onDown, { passive: false });
    el.addEventListener('pointermove', onMove, { passive: false });
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);

  const next = { left: false, right: false, up: false, down: false, punch: false, kick: false, jump: false, special: false };

        if (s8 === 2 || s8 === 1 || s8 === 3) next.down = true;
        if (s8 === -2 || s8 === -1 || s8 === -3) next.up = true;
      }

    }
    for (const b of document.querySelectorAll('#touch .tbtn')) {
      const r = b.getBoundingClientRect();
      const m = 10;
      if (p.x >= r.left - m && p.x <= r.right + m && p.y >= r.top - m && p.y <= r.bottom + m) next[b.dataset.k] = true;

/* ---- gamepads: the first pad is player one, the second player two ----------------- */
function pollPads() {

/* ==========================================================================
   Boot, layout and the main loop
   ========================================================================== */

function touchVisible() {
  const m = settings.touch || 'auto';
  if (m === 'on') return true;
  if (m === 'off') return false;
  return (isTouch && coarse && !input.usingPad) || input.usingTouch;
}

let safe = { t: 0, b: 0, l: 0, r: 0 };
function readSafe() {
  const pr = $('safeProbe');
  if (!pr) return;
  const cs = getComputedStyle(pr);
  safe = { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0 };
}

/** Size the touch pad for landscape and report how much side room it needs. */
/** The controls float over the picture in every orientation, so they never take room from it. */
function sizePad() { return { left: 0, right: 0 }; }

function layout() {
  readSafe();
  const cv = $('screen');
  const vw = Math.max(1, window.innerWidth || document.documentElement.clientWidth), vh = Math.max(1, window.innerHeight || document.documentElement.clientHeight);
  laidOut = window.innerWidth + 'x' + window.innerHeight + '@' + (window.devicePixelRatio || 1);
  // full resolution, capped so huge screens stay smooth
  const dpr = Math.min(2.25, window.devicePixelRatio || 1, 2600 / Math.max(1, vw), 1600 / Math.max(1, vh)) * QUALITY.res[QUALITY.level];
  const tw = Math.max(1, Math.round(vw * dpr)), th = Math.max(1, Math.round(vh * dpr));
  if (cv.width !== tw || cv.height !== th) { cv.width = tw; cv.height = th; }
  const touchOn = touchVisible();
  const portrait = vh > vw * 1.05;
  const B = document.body.classList;
  B.toggle('touch-on', touchOn);
  B.toggle('portrait', portrait);
  let gx = 0, gy = 0, gw = vw, gh = vh, zoom = 1;
  if (touchOn && portrait) {
    // upright phone: the fight takes the top of the screen, the pad sits below it, clear of the action
    gy = Math.max(0, safe.t);
    const baseH = (vw * H) / W;
    const room = vh - gy - Math.min(vh * 0.36, 300);
    zoom = clamp(room / baseH, 1, 2.4);
    gh = baseH * zoom;
  } else if (touchOn) {
    // handheld landscape: the pad lives in side panels, the screen sits between them
    const pad = sizePad(vw, vh, false);
    const side = Math.max(pad.left, pad.right);
    const full = Math.min(vw, (vh * 16) / 9);
    // the picture takes the full height; the pad may overlap its outer edges rather than shrink it
    gw = Math.min(vw, Math.max(vw - 2 * side, full));
    gx = (vw - gw) / 2;
    gy = Math.max(0, safe.t);
    gh = vh - gy - Math.max(0, safe.b * 0.5);
  }
  if (!touchOn || portrait) sizePad(vw, vh, true);
  const s = Math.min(gw / W, gh / (H * zoom)) * dpr;
  view.scale = s;
  view.zoom = zoom;
  view.dy = (H * (zoom - 1)) / 2;
  view.ox = Math.round(gx * dpr + (gw * dpr - W * s) / 2);
  view.oy = Math.round(gy * dpr + (gh * dpr - H * zoom * s) / 2);
  document.documentElement.style.setProperty('--game-bottom', Math.round((view.oy + H * zoom * s) / dpr) + 'px');
}
function layoutTouch() { layout(); }

/* ---- keep the page from zooming or scrolling out from under the game --------------- */
const VIEWPORT_LOCK = 'width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
let laidOut = '';
function viewportMeta() {
  let m = document.querySelector('meta[name="viewport"]');
  if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
  return m;
}
/** If the browser zoomed in anyway (double tap, pinch, rotation), snap back to 1:1. */
function unzoom() {
  const vv = window.visualViewport;
  if (vv && Math.abs(vv.scale - 1) > 0.02) {
    const m = viewportMeta();
    m.setAttribute('content', VIEWPORT_LOCK + ',_r=' + Date.now() % 97);
    setTimeout(() => m.setAttribute('content', VIEWPORT_LOCK), 60);
  }
  if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
}
function guardViewport() {
  viewportMeta().setAttribute('content', VIEWPORT_LOCK);
  const stop = (e) => { if (e.cancelable) e.preventDefault(); };
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, stop, { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) stop(e); }, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
  document.addEventListener('wheel', (e) => { if (e.ctrlKey) stop(e); }, { passive: false });
  // a fast second tap anywhere on the game is play, never a zoom request
  let lastEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = performance.now();
    const t = e.target, form = t && t.closest && t.closest('input,textarea,select,a');
    if (now - lastEnd < 350 && !form) stop(e);
    lastEnd = now;
  }, { passive: false });
  const relayout = () => { unzoom(); layout(); };
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', relayout); window.visualViewport.addEventListener('scroll', unzoom); }
  window.addEventListener('pageshow', relayout);
  window.addEventListener('orientationchange', () => { for (const d of [60, 300, 700, 1200]) setTimeout(relayout, d); });
  if (window.screen && screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', () => { for (const d of [60, 400, 900]) setTimeout(relayout, d); });
  // belt and braces: some browsers report the new size late and send no event for it
  setInterval(() => {
    const key = window.innerWidth + 'x' + window.innerHeight + '@' + (window.devicePixelRatio || 1);
    if (key !== laidOut) relayout(); else unzoom();
  }, 500);
}

let lastT = 0, acc = 0, manual = false, lastTouchState = null;
function frame(now) {
  requestAnimationFrame(frame);
  if (manual) return;
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.25) dt = 0.25;
  watchSpeed(dt);
  acc += dt;
  pollInput();
  const tv = touchVisible();
  if (tv !== lastTouchState) { lastTouchState = tv; layout(); }
  document.body.classList.toggle('driving', (game.state === 'play' || game.state === 'intro') && !game.demo);
  let steps = 0;
  while (acc >= STEP && steps < 8) {
    if (steps === 0) updateGame(STEP, input.held, takeInput());
    else { clearStepInput(); updateGame(STEP, input.held, NO_PRESS); }
    acc -= STEP; steps++;
  }
  if (steps >= 8) acc = 0;
  renderFrame();
}

/** If the device can't hold a smooth frame rate, render at a lower resolution. */
const speed = { t: 0, n: 0, slow: 0 };
function watchSpeed(dt) {
  if (document.hidden || dt <= 0 || dt > 0.2) return;
  speed.t += dt; speed.n++;
  if (dt > 1 / 42) speed.slow++;
  if (speed.t < 2.5) return;
  const slowShare = speed.slow / speed.n;
  speed.t = 0; speed.n = 0; speed.slow = 0;
  if (slowShare > 0.45 && QUALITY.level < QUALITY.res.length - 1 && (game.state === 'play' || game.state === 'title')) {
    QUALITY.level++;
    layout();
  }
}

function boot() {
  initInput();
  layout();
  window.addEventListener('resize', layout);
  guardViewport();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (game.state === 'play' && !game.demo) openPause();
      if (chip.ctx) chip.ctx.suspend().catch(() => {});
    } else {
      lastT = 0;
      if (chip.ctx) chip.ctx.resume().catch(() => {});
    }
  });
  window.addEventListener('blur', () => { if (game.state === 'play' && !game.demo) openPause(); });
  loadFonts();
  // art that contains lettering is redrawn once the web fonts have arrived
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { TILES.clear(); }).catch(() => {});
  try { $('screen').focus({ preventScroll: true }); } catch (e) { /* focus is best effort */ }
  setState('boot');
  requestAnimationFrame(frame);
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
    try { window.claude.hot.snapshot(hotSnapshot); } catch (e) { /* viewer without hot updates */ }
  }

  // hooks for automated testing
  const blank = () => Object.assign({}, NO_PRESS);
  window.__iron = {
    game, input, chip, settings, STAGES, DIFFS, HEROES, FOES, ATK, MEDALS, PROG, SONGS, DBG, QUALITY, view, SV, ITEM_DEF,
    setManual(v) { manual = v; },
    step(n, held, pressed, quiet, held2, pressed2) {
      for (let i = 0; i < n; i++) {
        const P1 = i === 0 ? Object.assign({}, NO_PRESS, pressed || {}) : NO_PRESS, P2 = i === 0 ? Object.assign({}, NO_PRESS, pressed2 || {}) : NO_PRESS;
        const pl = input.pl;
        Object.assign(pl[0].held, NO_PRESS, held || {}); Object.assign(pl[1].held, NO_PRESS, held2 || {});
        Object.assign(pl[0].pressed, P1); Object.assign(pl[1].pressed, P2);
        const both = {}; for (const a of ACTIONS) both[a] = P1[a] || P2[a]; both.any = P1.any || P2.any || Object.values(P1).some(Boolean) || Object.values(P2).some(Boolean);
        if (game.state === 'play' && (P1.start || (P2.start && game.heroes[1].active))) both.pause = true;
        if (game.state === 'play' && !game.heroes[1].active) both.start = P1.start;
        input.tap = i === 0 && pressed && pressed.tap ? pressed.tap : null;
        updateGame(STEP, pl[0].held, both);
      }
      if (!quiet) renderFrame();
    },
    render: renderFrame, newGame, startStage, setState, layout, updateGame, award, nextStage, stageCleared, toTitle, qualifies, newFoe, addItem, spawnWave, landHit, knockDown, startAttack, nextWave
  };
}

/** State worth keeping if the page is updated while someone is mid-run. */
function hotSnapshot() {
  const live = ['intro', 'play', 'pause', 'clear'].includes(game.state) && !game.demo;
  if (!live) return {};
  return { run: { stage: game.stage, players: game.players, level: game.diff.id } };
}

function resumeRun(r) {
  if (r.level && DIFFS[r.level]) settings.level = r.level;
  newGame(r.players === 2 ? 2 : 1, false);
  startStage(clamp(r.stage | 0, 0, STAGES.length - 1));
}

function start(data) {
  boot();
  if (data && data.run) { try { resumeRun(data.run); } catch (e) { setState('boot'); } }
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});

})();
